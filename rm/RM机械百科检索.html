提 5mm；植正雄判断「小弹丸还好，厚一点应该没问题」，林长耿认为对视觉影响不大，暂不改结构、只把厚度加上去。另一条视觉相关：最上面的包边才用黑色，因为黑色不透光，透明的均光 PC 能让 LED 灯珠扩散，圈出的部分必须能看到光。","s":"群聊·27炒鸡大符 2026-11-18 / 11-21","k":"auto"},{"i":"K0798","t":"符上所有零件中心都要留定位孔（官方视频明确要求）","c":"图纸规范","b":"谭嘉豪 11-22 16:37：「幅上的所有东西中心要留一个定位孔，官方视频说过，用于定位所有东西（传感器）」。高荣信问是不是只指扇叶，答复是「你仔细看看视频」，即整机层面统一要求。→ 审图应把「中心定位孔」列成检查项：靶面九层（10mm PC、1mm 软胶、3mm 泡棉、灯板、分光板、压感传感器等）全靠这一个孔对齐。","s":"群聊·27炒鸡大符 2026-11-22","k":"auto"},{"i":"K0799","t":"大符搬到 2.9m：航空箱垫高＋钢索四角拉，替代大铝型材支架","c":"结构设计","b":"植正雄 11-15 凌晨给新方向：扇叶做快拆，整机高度与现有旧符基本一致，买几个航空箱垫高凑到官方 2.9m；比赛时航空箱装货，到备场后常驻当垫高基座。提醒旧航空箱有几个上表面已塌陷，不能拿来垫，要买质量好的。高荣信反案：与其在底下堆大铝型材，不如把大符底座做小、改装航空箱上表面与底座契合，再用钢索把符顶端与箱体四角拉住，靠拉索而不是靠型材获得刚度，不用时整机从箱上吊下来即可。植正雄：「改装航空箱这个没想过」。这条把库内「运输三条路线」与「航空箱一物两用」推进到了具体结构。","s":"群聊·27炒鸡大符 2026-11-15","k":"auto"},{"i":"K0800","t":"大符总装 V2.1 的九层靶面与底座 BOM（103 件，本地已归档）","c":"案例开源","b":"靶面按官方叠层逐件建：10mm PC 板 / 1mm 软胶 / 3mm 缓震泡棉 / LED 灯板 / PC 分光板（改）/ PC 垫片 4mm / 亚克力板 1~4 / 压感传感器 / 外壳 1~2 与外壳连接 1~4 / 2020 铝方管。底座：4040 型材 1000·1750·360·280mm + 45 度 4040 300mm + 60 度重型挤压角件 + CNC 固定角码 + 内置连接件 + 电气走线槽。驱动：M3508、MT2586 滑环、齿形惰轮 16 齿 S5M150、皮带、两个张紧器、五角环氧板顶/底、r标 1~3（PLA 与亚克力）、主动/从动轮（PLA）、轴 25×19×620、轴承法兰/轴法兰、全金属锁紧螺母 WNCU-M5/M6。装配体：总装 v2.0-Sn、大符（精致版）V1.2-S1、底座2、张紧器、驱动2、r标。","s":"图纸·大符v2.1-Sn-钟自豪高荣信-20261121.zip","k":"auto"},{"i":"K0801","t":"蝶形螺母的防松替代：改用全金属锁紧螺母 WNCU-M5/M6","c":"标准件紧固","b":"11-11 支撑张紧器曾定「手拧 304 羊角蝶形螺母」，但蝶形螺母本身没有防松结构、会退扣。11-21 的总装里张紧器已换成全金属锁紧螺母 WNCU-M5-B / WNCU-M6-B（含 STEP）。→ 需要手拧又怕松的场合，正确解法是「锁紧螺母 + 可手拧的头部」，而不是裸蝶形螺母。","s":"图纸·大符v2.1 驱动目录；群聊 2026-11-11 / 11-21","k":"auto"},{"i":"K0802","t":"大符审图暴露的四类硬伤：缺件、无孔、钣金当拉伸、交付格式不对","c":"图纸规范","b":"①钟自豪符叶装配体缺零件（其余零件被压缩后打包发出），王奇英「打开零件被压缩了，打包的时候少了？」；②连接板、铝方管都没打孔，林创武「这个铝方管没孔位咋装的，塞进去?」；③该做钣金的件直接用拉伸做，王奇英：「钣金有钣金的画法，你这个零件这样发是做不了的，硬发做出来有可能不适配，钣金加工要展平图的」；④日期笔误成 202621520229。交付格式：苏伯伟先发 .x_t，高荣信打不开，改 STEP 才行——跨软件交付优先 STEP。","s":"群聊·27炒鸡大符 2026-11-18~21","k":"auto"},{"i":"K0803","t":"大符驱动随符旋转，滑环必须预留电机线（与去年不同）","c":"结构设计","b":"高荣信 11-13 向电控交底：「跟之前设计的不同就是电机是在大符上的，需要预留电机的线」。去年电机不在符上，滑环只走灯板与信号；今年电机随符旋转，滑环必须把电机电源与 CAN 一起留出来——这是 18 路够不够的直接来源。谭嘉豪一度反问「为啥有电机线，电机不是在大幅后面吗」，确认后按新方案走。","s":"群聊·27炒鸡大符 2026-11-13","k":"auto"},{"i":"K0804","t":"大小 yaw 分工：小 yaw 先响应、大 yaw 跟随回正","c":"结构设计","b":"哨兵比步兵多雷达、相机，为提速拆成两级：大 yaw 装弹舱、雷达、相机、部分元器件和小 yaw；小 yaw 压缩成「发射机构 + 陀螺仪」。电控用大 yaw 跟随小 yaw 的模式，小 yaw 先动、大 yaw 再跟随回正，视觉响应速度大幅提高。附带一条构型淘汰史：25 赛季用中供拨盘时弹仓在底盘、大 yaw 响应也够快；但中供拨盘只能放车体正中心、会抬高整车高度，26 赛季狗洞规则下被摒弃。","s":"知识库·第三次周会-哨兵技术分享（林填）","k":"auto"},{"i":"K0805","t":"国赛哨兵用「大滑环套小滑环」解决大供电量与狗洞尺寸","c":"标准件紧固","b":"分区赛大 yaw 是同步带传动 + 中间加装电滑环；国赛云台硬件多、供电量大，狗洞环境下又找不到合适的普通滑环，于是做成大滑环套小滑环的嵌套方案。轴系是交叉滚子轴承 + 同步带轮的组合。","s":"知识库·第三次周会-哨兵技术分享","k":"auto"},{"i":"K0806","t":"大小 yaw 轴承口径：小 yaw 6005、大 yaw 7008 交叉滚子","c":"标准件紧固","b":"大小 yaw 同时受轴向力与径向力，队里统一用交叉滚子轴承。小 yaw 选 6005，大 yaw 选 7008。小 yaw 另有两条传动路线：6020 直驱（中空 18mm 可穿碳管走弹、控制精准、零背隙）或同步带（解决 z 向空间不足、有缓冲、同心度要求低于直驱、传动比可调，但队里多数取相同齿数方便电控）。","s":"知识库·第三次周会-哨兵技术分享","k":"auto"},{"i":"K0807","t":"同步带选型三步：圆弧齿、节距必须对齐、主用 5M","c":"传动机构","b":"带型用圆弧齿——受冲击不易跳齿、精度够用。节距是节线上相邻两齿中心线的距离（节线是强力层那条中性线，弯曲后长度不变）。步兵与哨兵主要用 5M。皮带节距必须与同步轮节距完全一致，否则装不上或跳齿。带轮尺寸在节距确定后由外径或齿数推出，一般用插件完成即可。","s":"知识库·第三次周会-哨兵技术分享","k":"auto"},{"i":"K0808","t":"包胶厚度不能拍脑袋：PSI 公式算下沉量，压缩率控 5%~15%","c":"材料板材","b":"δ=[0.75·F·t/(E·W·√8R)]^(2/3)：δ 下沉量、F 单轮载荷、t 包胶厚度、E 弹性模量、W 轮宽、R 轮外半径；压缩率 ε=δ/t 取 5%~15%，变形超标要加厚，变形过小（减震差）也要加厚。E 按邵氏硬度查：70A≈12MPa、80A≈20MPa、90A≈35MPa。硬度分档：40~70A 减震抓地好但滚阻大、易变形；70~85A 舵轮与麦轮最常用；85A 以上刚性强耐磨但减震差抓地弱。","s":"知识库·第三次周会-哨兵技术分享","k":"auto"},{"i":"K0809","t":"舵上避震 vs 舵下避震：导轨空间与轮距变化是两条死线","c":"结构设计","b":"舵上避震能控轮子上下高度，但避震绕在舵轮四周等于放大占地面积，导轨部分空间极限、检修困难。舵下多用连杆避震，轻，但连杆很难保证压缩过程中轮子做竖直运动，轮距会随之变化，一场比赛累积下来对电控与导航影响很大，所以现在哨兵组很少用连杆避震。林填本赛季画过一版舵下导轨避震舵轮（导轨部分检修很方便），因不契合当年底盘高度作废。","s":"知识库·第三次周会-哨兵技术分享","k":"auto"},{"i":"K0810","t":"避震弹簧 k 值与避震油 cSt：一套能照着做的选型流程","c":"基础理论","b":"弹簧 k=G·d⁴/(8·D³·n)，G 碳钢取 79000MPa、d 簧丝径、D 中径、n 有效圈数（不含两端磨平支撑圈，全用 mm 算 k 才是 N/mm）。算之前先定「极限动载荷（2~4 倍自重）下的压缩量」，并考虑承载轮数：对角线方向下台阶只有 1 轮承载，平行方向至少 2 轮。阻尼比 ζ=c/(2√(km)) 取 0.2~0.5、优先 0.3，反解 c 再定油号；阻尼力 Fd=c·v，c 正比 μ²、正比活塞面积²、反比阻尼孔总面积²。油号表：200 很稀（颠簸大要贴地）、300 偏软（室内瓷砖）、350 最常用初选、400 中、500 偏硬（防触底）、600+ 很硬（重载）。队里常用 800；上赛季过盲道哨兵特殊用 300。调试判据：落地反复弹跳、回落久=阻尼偏小，加 100cSt；落地震手、压缩量小=阻尼偏大，减 100cSt。避震油不必加满，留气泡有气辅弹性，但要做好排气否则阻尼非线性。","s":"知识库·第三次周会-哨兵技术分享","k":"auto"},{"i":"K0811","t":"避震器一律买「中轴加粗款」：赛场上断过中轴","c":"标准件紧固","b":"RM 常用避震器按上下固定孔孔距分 70/75/85/90/100/110mm；可压缩的极限长度叫行程，实车尽量不要压到极限，对避震器伤害大。下台阶或过 70mm 盲道要选大行程；只在平地走、最多过隧道的选小行程。中轴加粗款是队里的硬规矩——曾有机器人站在赛场上中轴断掉，之后一直买加粗款。","s":"知识库·第三次周会-哨兵技术分享","k":"auto"},{"i":"K0812","t":"舵轮 vs 全向轮九项对比：为什么哨兵只剩这两种轮系","c":"基础理论","b":"麦轮侧向力损耗大、小陀螺像蠕动，被淘汰；哨兵常处于小陀螺状态移动，所以只剩舵轮与全向轮。对比：结构复杂度（舵轮双电机+转向检测限位，全向轮单驱动无转向机构）、地面适应性（舵轮连续轮面好，全向轮辊子断续接触易抖）、承载（舵轮强，全向轮单点断续接触弱）、运动精度（舵轮无滑移依赖，全向轮辊子滑移有定位误差）、噪音磨损（全向轮辊子敲地、磨损快）、成本（舵轮高）、维护（舵轮要校转向减速箱与转向零点）。二舵二全在 25 赛季风靡，26 规则大改后优势归零。全向轮对角线方向型可有一个全功率移动方向，能飞坡、上 43 度坡。","s":"知识库·第三次周会-哨兵技术分享","k":"auto"},{"i":"K0813","t":"全向轮自制要点：内外轮板夹中轮板夹销轴，3mm 板配 3mm 销轴","c":"结构设计","b":"结构：内外两组轮片错开紧固，每组再分内/中/外三层轮板。轮板除给小滚子挖槽，还要给销轴挖槽；内外板夹住中轮板的同时把销轴夹死，小滚子就固定在轮板组上。外径由小滚子最外弧决定，必须能围成一个「完美的圆」；轮板外径必须略小于滚子外接圆，否则滚子没有工作空间、失去全向能力；太小还会让中轮板限位销轴处强度不足断裂。队里多版迭代统一 3mm 板：销轴也是 3mm，同厚度顺带限制销轴活动范围、提高稳定性。小滚子早期用硬聚氨酯（两端塞深沟球、超薄垫片压内圈隔开聚氨酯与轮板），现在改橡胶滚子抓地更好。","s":"知识库·第三次周会-哨兵技术分享","k":"auto"},{"i":"K0814","t":"东莞减速箱 268/17 ＋ 挂臂：舵下驱动与承力的标配组合","c":"传动机构","b":"舵下：挂臂（车叉）固定在东莞减速箱双端、支撑整车重量；东莞理工减速箱淘宝可买、减速比 268/17、配 3508，降转速放扭矩。轮毂用 6061 在铨洲做，包胶用聚氨酯发加工。转向侧是「CNC 转接件 + 一块板夹住深沟球内圈」，舵电机与上板紧固，电机转动带动整体转向。3508 舵轮（庞金福设计）初衷是减重，实测没减多少可能还更重，且电流需求大、电子件多、冲撞易故障、维修难，实战后舍弃。","s":"知识库·第三次周会-哨兵技术分享","k":"auto"},{"i":"K0815","t":"定位基准越少越准：二级基准会叠两次误差（25 五摩擦 / 26 六摩擦实例）","c":"图纸规范","b":"英雄发射器靠大量销孔过盈配合定位。核心原则：尽量减少定位基准数量——若一个定位基准本身又是另一个基准的被定位件，它就被定了两次、误差也积了两次，精度不如只定位一次的件。25 五摩擦：一级摩擦轮固定板直接吃一级基准，枪管也吃一级基准、同时又当二级基准去定限位与二级摩擦轮固定板。26 六摩擦进一步压缩基准数量。","s":"知识库·第四次周会-重装组技术分享","k":"auto"},{"i":"K0816","t":"摩擦轮聚氨酯压缩率控 5%~15%：两级实例算法","c":"材料板材","b":"推荐工作变形量 5%~15%，上限 25%，超了寿命断崖（撕裂或永久变形）。算法：压缩率 = (摩擦轮外径 − 常用压缩量)/2 ÷ 聚氨酯厚度。国赛六摩擦一级轮 PU 厚 29、常用压缩量 37 → (42.5−37)/2=2.75 → 9.4%；二级轮 PU 厚 19、同样压 37 → 14.5%。两级都在推荐区间。温度也会改弹性：打弹时摩擦轮升温、弹性增加，回弹给弹丸的冲量变大 → 测速前先打 3 组 50 发让温度稳定。","s":"知识库·第四次周会-重装组技术分享","k":"auto"},{"i":"K0817","t":"改摩擦轮压缩量只动 1.3mm，也足以改弹速","c":"经验避坑","b":"所谓压缩量指与摩擦轮相切的最小圆；调压缩量真正改的是弹丸与摩擦轮的接触距离，即加速距离与时间。每次调压缩量对加速距离的改变只有 1.3mm，但动量传递发生在几毫秒内，所以一点点加速距离对弹速影响明显。弹丸加速度曲线近似开口向下的抛物线，末段与摩擦轮共速，需要足够接触时间；实测大直径摩擦轮弹速更稳，摩擦轮质量越大、弹速波动与初速波动的关联越小。","s":"知识库·第四次周会-重装组技术分享","k":"auto"},{"i":"K0818","t":"底盘「井」字构架＋铝方管内填打印件：少螺丝、易维护、刚度够","c":"结构设计","b":"英雄与工程底盘都用传统井字形框架，内嵌带螺纹的轻量化 6061 机加件，只需拧少量螺丝就完成铝管连接，易装易维护；铝方管内填部分打印件提升刚度，再配合合理镂空，框架简洁而强度刚度都在。26 赛季英雄要去梯形高地吊射、工程要去中央高地装配，都有上台阶需求，最终都走「前上台阶构型 + 后单自由度四连杆轮腿」。","s":"知识库·第四次周会-重装组技术分享","k":"auto"},{"i":"K0819","t":"履带抬升的两个关键量：爬坡角与齿轮传动比","c":"传动机构","b":"英雄前抬升用履带，多齿轮传动与前麦轮耦合、主要靠摩擦上台阶。爬坡角（履带与水平面夹角）越小，正压力越大、摩擦越大，重心变化更平缓、不易翻车，但太斜会超尺寸；传动比过小则履带转得快却没力抬升，过大则麦轮要很高转速才能带动履带、白耗功率。副作用：平地时履带也跟着转，底盘功耗上升。工程侧抬升是前关节电机经同步带传动摆轮腿，抬升力可先算再选电机与传动比。","s":"知识库·第四次周会-重装组技术分享","k":"auto"},{"i":"K0820","t":"单电机四连杆腿：足端轨迹被几何决定，先画草图再 motion 验传动角","c":"结构设计","b":"腿有四连杆前折叠/后折叠两式，看轨迹与底盘空间定。单电机四连杆只有一个主动自由度，足端轨迹实际上由连杆几何「决定」。流程：先画上台阶草图定腿电机位置、收腿轨迹与支撑导轮位置，检查工作范围（着地姿态、最大压缩姿态、最大伸张姿态）内的传动角变化，再用 motion 仿真看效果。","s":"知识库·第四次周会-重装组技术分享","k":"auto"},{"i":"K0821","t":"七轴机械臂多的是「运动冗余」，不是多一个动作","c":"基础理论","b":"六轴已有 6 个自由度，运动学上能实现空间任意位姿，是工业机器人「黄金标准」，软硬件生态成熟。七轴的真正增量是运动冗余：同一个末端目标有多种关节组合与路径可选。六轴关心「能不能到达」，七轴关心「怎样到达更好」。对工程机器人的意义是狭小空间、动态避障、更高精度，而不是动作数量。","s":"知识库·第四次周会-重装组技术分享","k":"auto"},{"i":"K0822","t":"机械臂扭矩不足的三个症状，第三个最致命","c":"基础理论","b":"①link 过重，关节扭矩甚至闭不住定角，连静态负载都满足不了；②只能低速跑、扭矩贴在额定附近，一旦与场地干涉或被车体加速度带动，力臂过大超额定 → 电机发热触发保护；③达朗贝尔原理下末端关节角加速度产生内力传到根部，根部偏离目标角、控制器拉回，又牵连末端产生新运动，往复循环 → 按预设轨迹走时明显抖动，取矿这类高精度动作直接废掉。能避开第三条，前两条自然不出现。主要负载来源：自重、关节加速度、车体加速度、抓取发射机构的峰值扭矩、末端外力（能量单元/肘击场地）。","s":"知识库·第四次周会-重装组技术分享","k":"auto"},{"i":"K0823","t":"机械臂末端 J6/J7 用二级齿轮而不是同步带：滑齿等于零点丢失","c":"传动机构","b":"末端可等效为一端固定的悬臂梁，外部力与惯性载荷沿运动链逐级放大到基座，所以末端必须轻、体积小。华农 26 工程腕部用二级齿轮传动（3 个 m1、z40），把 J6 电机刚好塞到 J7 后方，末端呈流线型、避免电机外凸与场地道具干涉。不上同步带的原因：此处可用空间太小，同步带还要专门设计张紧；张紧不到位时末端受大冲击会滑齿，电控就得重新校 J6 零点，赛场上一旦发生很难快速恢复。","s":"知识库·第四次周会-重装组技术分享","k":"auto"},{"i":"K0824","t":"1mm 薄壁件写「4 层墙＋100% 填充」没有意义","c":"加工工艺","b":"刘俊锋用 PETG 打 1mm 厚件，默认参数 4 层墙 100% 填充，结果软得离谱。植正雄：喷嘴 0.4mm、件只有 1mm 厚，实际只能打 2~3 层，墙和填充根本排不进——参数只是「看起来很强」。王奇英补充：墙有意义是因为墙的走线与内部填充不同，但太薄就没意义了。→ 薄壁件不要靠堆墙数/填充率，先看壁厚够不够容纳。","s":"群聊·27机械组 2026-11-18","k":"auto"},{"i":"K0825","t":"打 CF 耗材会磨损普通喷嘴","c":"材料板材","b":"余凯佳提醒：普通喷嘴打碳纤维（CF）材质可能损坏喷嘴头。选 CF 前先确认喷嘴类型（硬化钢/红宝石），别用原装黄铜嘴硬上。同段讨论里植正雄的态度：别只看品牌，找有测力学性能与横向对比的测评更权威。","s":"群聊·27机械组 2026-11-15","k":"auto"},{"i":"K0826","t":"场地道具出图与加工的三道时间闸：11-22 交图、11-27 审完、11-28 开工","c":"队伍制度","b":"林创武 11-19 通知：11-22（周日）22:30 前每个场地道具必须定最终方案图纸并发审图群，一个道具只发一个图纸；11-27 前审完细节；最迟 11-28/11-29（周末）开始发加工。配套动作：每位负责人周末必须约两位新人做一次线下审图，并手把手教轴系设计这类高频基础；小会时间群里公开、地点尽量选土槽，队长或组长可能旁听。第十次机械组组会 11-22 10:30 土槽楼，分享英雄工程技术。","s":"群聊·27机械组通知群 2026-11-14 / 11-19","k":"auto"},{"i":"K0827","t":"出勤打卡：新人≥10 小时/周，大二及以上≥15 小时/周","c":"队伍制度","b":"林创武 11-22 重申。与「图纸发审图群」「周会分享」并列为机械组三项常态约束。","s":"群聊·27机械组通知群 2026-11-22","k":"auto"},{"i":"K0828","t":"场地道具选电机：可用非三大家，但必须留设计余量","c":"标准件紧固","b":"谭嘉豪发《智擎关节单页202605.pdf》（1.4MB，已存 机械百科_数据/设计资料/）并说明：场地道具有电机需求的可以参考，但要保留设计余量——「非三大家的电机会有小 bug」。电机图纸自己上网找，或直接问淘宝客服要（植正雄的做法）。","s":"群聊·场地道具开发维护大队 2026-11-13","k":"auto"},{"i":"K0829","t":"昴宿 Arbiter-01：一套总装两个输出端，适配两种减速箱","c":"传动机构","b":"17 件。输出端做了两版：兼容 26 国赛 LWS 减速箱的版本、兼容东莞理工减速箱输出端的版本——哨兵用东莞理工版，英雄（重装）用 LWS 版。沿用 67 齿内齿圈（0.01 变位、0.03 侧隙）、M3508 去阳齿、官方 3508 太阳轮、16.428:1 轮毂。轴承用自行车碗组轴承 56.8-47.8-6.5（31g）替薄壁轴承，配轴承压紧件与轴承钢圆柱销 3-16、超薄垫片 3-0.2-5。","s":"图纸·昴宿Arbiter-01 总装 植正雄 20261121.zip","k":"auto"},{"i":"K0830","t":"毕宿 Charioteer-01：13.72 减速比，内齿圈变位取负、太阳轮与行星轮取正","c":"传动机构","b":"19 件。植正雄：「减速比 13.72，只有行星轮和内齿圈和参宿（轮腿现在上面那款）不一样，其他全部一样。」变位符号：太阳轮 +0.15 变位 0 侧隙、一级行星轮 +0.15 变位 0.03 侧隙、二级行星轮 +0.15 变位 0 侧隙、内齿圈 −0.15 变位 0.03 侧隙。→ 内外啮合变位系数符号相反，与行星减速箱日志里「GTX 内齿圈变位符号反了」同一类坑。配 MR104zz 4-10-4 深沟球、碗组轴承、超薄垫片 4-0.3-6、轴承钢圆柱销 4-20、端盖 2.0。","s":"图纸·毕宿Charioteer-01 总装 植正雄 20261122.zip","k":"auto"},{"i":"K0831","t":"赑屃（狗洞车）底盘 S0：248 件、含无人机电池 EA230 全套","c":"案例开源","b":"林填 11-21 首发「狗洞车底盘」，11-22 与刘俊锋出 S0 总装（712MB、248 件，本地已归档）。内含 EA230 无人机电池全套组件（外壳、上下壳、石墨、PC 顶底、连接器、分弹层），说明这一版把飞机电池方案直接搬进车体。S0 = 未定级，仅供构型参考，不可发加工。","s":"图纸·赑屃总装S0_林填刘俊锋_20261122.zip","k":"auto"},{"i":"K0832","t":"命名体检（11-13~11-22 批次）：包名与内容版本脱节是新出现的错误","c":"图纸规范","b":"①飞机基地 V2.8-ST 包内文件夹还叫 V2.7-S7，包名换了内容没重命名；②靶车 V1.4/V1.5 用 .rar，跨机易缺解压器（与制导镖 GBK 乱码同源问题）；③大符 V2.0 日期写成 202621520229；④「大符v2.0-Sn-钟自豪高荣信」这类双人署名包，主装配体仍叫「总装v2.0-Sn」，与包名不同名；⑤昴宿/毕宿包名用空格分隔、无版本号，零件名「植正雄 20261106」用空格而非连字符。合规样板：飞镖靶 V4.5-S7-T2-冯昭荣（版本+定级+姓名+日期齐全）。","s":"群聊·27神图群 2026-11-13~22","k":"auto"},{"i":"K0833","t":"大符 V2.1 十天返工的根因：外购件没模型就先画死了轴系","c":"经验避坑","b":"这条线反复卡在「没有滑环模型」→「内径 21 不够要 25.4」→「10A 带不动要 20A」→「轴从 1m 空心中管改 620 实心钢轴」→「灯板模型 11-21 才到手」。同步带 568mm 到 11-22 01:12 才测出。教训：外购件（滑环、灯板）没拿到模型与接口尺寸之前，不要先画死轴系与走线；「灯板归硬件画、机械按它留孔位与间距」这条分工要在开工前说清，否则反复返工。另：所有件中心留定位孔是官方硬要求，审图要单独查这一项。","s":"群聊·27炒鸡大符 2026-11-13~22","k":"auto"},{"i":"K0834","t":"压感板 RM-1X10 上行协议：1ms 周期、460800 波特、18 字节定长帧","c":"赛事场地","b":"官方《RM1X10_协议.xlsx》与开源 main.c 对照后的完整口径。方向为压感主控 → 上层，周期 1ms（即 1000Hz，与文件名 RM_1x10_1000hz.hex 一致）。串口 USART0，波特率 460800，引脚 PA9=TX / PA10=RX。帧结构按 #pragma pack(1) 紧凑排列共 18 字节：uint16 sof + uint8 tran_type(0x01 上行) + uint16 len(=sizeof-2=16) + uint8 type(0x01 压感数据) + uint8 adc_value[10] + uint16 checksum。校验和是「除最后 2 字节外全帧按 uint8 逐字节累加」，不是 CRC，uint16 保存会回绕。带宽核算：18B×1000Hz=18kB/s，460800bps 约合 46kB/s，占约 39%，余量足够。注意代码里 sof 字面量写 0x5aa5，而协议表写 0xA55A——小端存储后线上字节序为 A5 5A，两者指的是同一帧头，写解析器时按字节比较不要按字面量比较。","s":"官方资料包·RM1X10_协议.xlsx + RM_1X10_open_version/Project/main.c","k":"auto"},{"i":"K0835","t":"压感板第 5~9 路通道在发送时被倒序，按索引直接映射几何位置会左右错位","c":"经验避坑","b":"这是官方开源代码里真实存在的一处反序，不是笔误。main.c 组包时 adc_value[0..4] 直接取 raw[0..4]，但 adc_value[5]=raw[9]、[6]=raw[8]、[7]=raw[7]、[8]=raw[6]、[9]=raw[5]，即第 5~9 路整体倒过来发送。原因应是对应靶板上这几颗传感器在 PCB 上的物理排布与 0~4 相反。后果：上位机若把 adc_value 下标当作物料位置直接用，5~9 号传感器的打击点会左右镜像，打左边判成右边。正确做法是按 raw 下标建映射表，或解包后先做一次 reverse(5..9) 还原再送算法。调试单点时用「只敲一颗传感器、看哪一路跳」的办法核对映射，别信下标。","s":"官方资料包·RM_1X10_open_version/Project/main.c","k":"auto"},{"i":"K0836","t":"压感值是 12 位 ADC 压成 8 位且 255 饱和，判定阈值不能按原始 ADC 量程设","c":"经验避坑","b":"sampling.c 里转换式为 value[i] = 255 * GetAdcValue(i) / 4095，随后 if(value>=255) value=255。含义有三层：一是传感器原始输出是 12 位（0~4095），但协议只传 8 位（0~255），分辨率被压掉 16 倍，相邻一级代表约 16 个原始码值；二是上限被硬钳在 255，打出重击时波形会平顶饱和，此时无法区分「刚过阈值」和「打得很狠」，做力度分级（比如区分有效击打与超强击打）在 8 位域里做不到，必须回读原始 ADC；三是轻击时量化噪声占比大，阈值附近的抖动主要来自 8 位量化而非传感器本身。所以定阈值要用实测分布的中位数加裕量，而不是拍一个「看起来像」的数。","s":"官方资料包·RM_1X10_open_version/Bsp/sampling.c","k":"auto"},{"i":"K0837","t":"RM-1X10 压感板硬件构成：GD32E103CBT6 + AMS1117 + 74HC4051 扩到 10 路","c":"案例开源","b":"从官方原理图 RM_1x10.pdf（3 页：mcu.SchDoc / Power&Peripheral.SchDoc / 第三页为图形页无文字层）读出的事实：主控 GD32E103CBT6（Cortex-M4，LQFP48），电源用 AMS1117 线性稳压，模拟通道靠 74HC4051 多路复用开关扩展（源码 sampling.h 的宏名 __74HC4051B_h 与 Hc4051Delay 延时函数可证），最终对上提供 10 路通道（adc.h 中 ADC_NUM=10）。AD 采集走 ADC0 规则通道加 DMA 搬运。原理图源工程路径显示为 D:\\墨现-工作资料\\RM_1X10，与 K0411 记录的墨现科技供应线索吻合，可确认这家既是传感器膜片供应商也是这块 PCBA 的设计方。本地已归档：原理图 PDF、Altium 源文件 RM_1x10_V2.PcbDoc、两张 PCB 显微实物照。","s":"官方资料包·PCBA原理图/RM_1x10.pdf","k":"auto"},{"i":"K0838","t":"官方压感板开源包里 adc/led/uart 是 .lib 预编译库，没有源码，二次开发只能改 main.c","c":"案例开源","b":"RM_1X10_open_version.zip 共 277 个文件，但其中 260 余个是 GD32E10x 标准外设库与 CMSIS 的原始文件，真正属于本项目的只有 14 个。关键限制：Bsp 目录下的 adc、led、uart 三项以 .lib 二进制形式提供（只有 .h 头文件加 .lib 实体），只有 sampling.c/h 给了完整源码。这意味着采样时序、ADC 通道扫描顺序、串口初始化细节都无法修改，能动的只有 main.c 里的调用与组包逻辑、sampling.c 的换算公式，以及 Bsp 的 .h 里暴露的参数。想改波特率或加自定义帧，只能在 main.c 层重写，或放弃 .lib 自己重写 Bsp。工程为 Keil（Project/Keil_project），芯片 GD32E103，编译链需装 GigaDevice 器件支持包。结论：这包适合照抄协议加改上层，不适合当完整参考设计来学底层。","s":"官方资料包·RM_1X10_open_version.zip","k":"auto"},{"i":"K0839","t":"复旦星云EGA-过洞步兵与过洞哨兵同构方案（含底盘总装 SLDASM）","c":"案例开源","b":"复旦星云EGA 开源 RM2026 过洞步兵与过洞哨兵的三维模型、说明文档与效果视频，总装文件为“底盘总装V2-哨ver-0517.SLDASM”。因首年参赛、轮腿人力不足，放弃第二辆轮腿，改为两车同构、头部前伸的大 pitch 压缩构型。作者自评这是 250mm 隧道规则下的妥协产物，文档逐条列出可改与改不动的缺点。可借鉴：同构双兵种的取舍逻辑与过洞车常见的避坑点；注意其自述为非机械专业、结构分析不深，宜作构型参考而非设计范本。","s":"来源·BBS 1939326","k":"auto"},{"i":"K0840","t":"西浦太仓OmniX-哨兵：4310 直驱供弹与“非同轴大小yaw别做中心供弹”的结论","c":"结构设计","b":"西浦太仓 OmniX 开源 RM2026 哨兵（含 25 赛季隧道版与 26 服役版两版图）。全兵种由一人设计，结构件与步兵共用思路，维护简单。核心判断是：非同轴的大小 yaw 不适合做中心供弹，设计麻烦且容易卡，故供弹改用 4310 直驱，并与 3508 改减速箱方案互为备份；雷达放底盘上更利导航。可借鉴：大小 yaw 与中心供弹的兼容性边界、供弹电机双方案冗余。该帖不写技术文档，仅给模型。","s":"来源·BBS 1883320","k":"auto"},{"i":"K0841","t":"北科大Reborn-三级摩擦轮飞镖发射架：棘轮90°换弹+丝杠调姿","c":"传动机构","b":"北科大 Reborn RM2021 飞镖发射架全资料（网盘）。动力为三级摩擦轮配微轴承滑轨，直接摩擦镖体；换弹为旋转换弹+舵机曲柄滑块，用棘轮棘爪保证每次精确 90° 且不震荡；pitch 用滚珠丝杠+步进，yaw 用丝杠+齿条+餐桌轴承驱动齿轮。关键经验：仰角 36° 为基准，超 37° 易打舱门上方；皮筋动力方案受温度与减震拖累已被推翻。可借鉴：飞镖换弹的定位防震与双轴调姿传动链。","s":"来源·BBS 8439","k":"auto"},{"i":"K0842","t":"弹道散布的两个根因：打滑、二级加速与主动预制的取舍","c":"基础理论","b":"把弹道散布归为两因：入轮位置偏差与出射速度误差。理想速度 v=ωL，但低速弹丸入轮必定打滑（打久了弹丸表面变毛），故单级摩擦轮难以稳定加速大弹丸；加二级加速可减小速度误差，却会放大马格努斯效应。解法是加大预制对弹丸水平方向的阻力以抑制自旋，并推荐主动预制（二级拨蛋/拨叉）配小行程微动开关提高定位精度。可借鉴：把“打滑—自旋—马格努斯”串成因果链来选择发射构型。","s":"来源·BBS 9596","k":"auto"},{"i":"K0843","t":"合工大苍穹-Φ535 圆形底盘全向轮步兵：圆盘小陀螺与自适应四轮接地","c":"案例开源","b":"合工大苍穹 RMUC2025 全向轮步兵开源（网盘）。圆盘底盘 Φ535、高 420mm，为的是能在隧道内小陀螺且容忍进洞偏差；自适应底盘保证坡道与起伏路段四轮接地；全车玻纤板含裁判系统 19kg，弹舱 400 发、常用 22Hz。实测数据：45HA 直摩擦轮发 400 发后磨损严重；PA12 尼龙烧结发射件，17m 手扶云台 8Hz 时散步不超小装甲。可借鉴：圆形底盘“用空间换容错”的取舍与摩擦轮寿命的定量参考。","s":"来源·BBS 815930","k":"auto"},{"i":"K0844","t":"中石大(华东)RPS-同步带与链条张紧的三种机构、yaw 轴弯矩卸载","c":"传动机构","b":"中石大(华东) RPS 完整形态考核技术方案。给三类可复用的张紧机构：螺栓顶机架改中心距、仿自行车隐藏式座管夹的三楔块张紧、链条用楔形打印件张紧（打印件分担压力，长期不松）。并核算 yaw 轴 6020 与主动带轮 95mm 力臂在 600N 张紧力下产生 57N·m 弯矩，远超电机极限，故把带轮改为轴承内回转、电机只传扭不承载，倾覆力矩降到约 1/5。可借鉴：张紧机构库＋弯矩卸载的定量算法。","s":"来源·BBS 804663","k":"auto"},{"i":"K0845","t":"中石大(华东)RPS RM2026 技术报告-近战优先英雄：6008 交叉滚子与 30mm 转弯半径拨盘","c":"结构设计","b":"该队 2026 技术报告 2.1.1 节。Yaw 用 6008 薄壁交叉滚子（额定 8.68kN）；4310 无内置交叉滚子，加 6707 承受同步带 600N×25mm 的 15N·m 附加弯矩；云台座 10mm 碳板、云台架 6mm 碳板大面积镂空。拨盘由 4310 改 3508 P19 并缩径，供弹转弯半径压到 30mm，拨爪加支撑轴承，补金属接近开关解决 3508 无绝对位置；发弹延迟稳定＜100ms，六摩擦轮弹速 ±0.05m/s。可借鉴：轴系选型与拨盘小型化的完整链路。","s":"来源·BBS 1942864","k":"auto"},{"i":"K0846","t":"西浦太仓OmniX-3D打印+铁砂自制能量单元（实验室测试道具）","c":"赛事场地","b":"官方只给能量单元 STEP，实体道具贵且难买，该队用 3D 打印壳体＋铁砂（或沙子）＋铁片配重，做出可自制的训练用能量单元，开源总装模型 3.82MB。作者声明一切以官方道具为准，此件仅用于实验室复现抓取与装配手感。可借鉴：以极低成本做出外形与重量接近官方的能量单元，用于重装机器人装配训练、夹持力与重心验证；注意配重分布会直接改变抓取重心，需按官方参数校准。","s":"来源·BBS 1316665","k":"auto"},{"i":"K0847","t":"吉大TARS Go-四轮足＋双七轴机械臂工程机器人（未上场半成品）","c":"结构设计","b":"吉大 2026 工程车总装开源（505MB）。思路是先算最大伸展球，把机械臂抬升到球心，故底盘选四轮足并引入舵轮应对快速转向（但 26 赛季功率限制下 《附表1 科技核心位姿点位表》至今仍标“后续更新”，但位姿口径已写在规则手册 5.4.3：以底座正面与地面交线中点为原点 O、法线反向为 X 负、竖直向上为 Z 正建立装配坐标系，位姿=(x,y,z,θ,φ,α)，初始为 -200,200,800,0,90,0。表5-10 给四级难度：x∈[-100,0]、y∈[100,300]、z∈[500,700]；二至四级 θ∈[-90,90]、φ∈[0,90]、α∈[-45,45]；二级起放入后平移 100mm，三级再绕 Q 轴以 5° 精度旋至指定角，四级对方核心临时移近(y-y'≤400)且限 45 秒完成。可借鉴：自制考核用科技核心按此做可调位姿台，不必等附表1。","s":"来源·官网 规则手册V1.0.0 §5.4.3（BBS 1971755）","k":"auto"}]};
const ITEMS = DB.items;
const $ = s => document.querySelector(s);
const listEl=$("#list"), catsEl=$("#cats"), cntEl=$("#cnt"), qEl=$("#q");

let state={cat:"all",q:"",src:"",sel:0,list:[]};

/* 统计 */
$("#gen").textContent = DB.generated;
const srcSet=[...new Set(ITEMS.map(i=>i.s.split("·")[0]))];
$("#src").innerHTML = '<option value="">全部来源</option>'+srcSet.map(s=>`<option value="${s}">${s}</option>`).join("");
$("#meta").innerHTML = `<span>共 <b>${DB.total}</b> 条</span><span>·</span><span><b>${new Set(ITEMS.map(i=>i.c)).size}</b> 个分类</span><span>·</span><span>来源：飞书知识库 / 云文档附件 / 群聊 / 官方手册</span>`;

const cats=[...new Set(ITEMS.map(i=>i.c))];
const order=["结构设计","材料板材","标准件紧固","传动机构","加工工艺","装配维护","图纸规范","基础理论","案例开源","赛事场地","队伍制度","经验避坑","其他"];
cats.sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)});

function count(cat){return cat==="all"?ITEMS.length:ITEMS.filter(i=>i.c===cat).length}
catsEl.innerHTML = `<li><button data-c="all" class="on"><span>全部</span><span class="n">${ITEMS.length}</span></button></li>`+
  cats.map(c=>`<li><button data-c="${c}"><span>${c}</span><span class="n">${count(c)}</span></button></li>`).join("");

const strip = t => t.replace(/\s+/g," ").trim();
function esc(s){return s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}

function score(it,q){
  const t=it.t.toLowerCase(), b=it.b.toLowerCase();
  let s=0;
  if(t.includes(q)) s+=120+(t.startsWith(q)?40:0);
  if(b.includes(q)) s+=20;
  const chars=[...q];
  if(chars.length>2 && chars.every(c=>t.includes(c)||b.includes(c))) s+=6;
  return s;
}
function hi(x,q){
  if(!q) return esc(x);
  const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return esc(x).replace(re,"<mark>$1</mark>");
}

function render(){
  const q=state.q.trim().toLowerCase();
  let arr=ITEMS.filter(i=>(state.cat==="all"||i.c===state.cat)&&(!state.src||i.s.startsWith(state.src)));
  if(q) arr=arr.map(i=>({i,s:score(i,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.i);
  state.list=arr;
  if(state.sel>=arr.length) state.sel=0;
  cntEl.innerHTML = q?`找到 <b>${arr.length}</b> 条 · 「${esc(state.q.trim())}」`:`共 <b>${arr.length}</b> 条`;
  if(!arr.length){listEl.innerHTML='<div class="empty"><b>没有匹配的条目</b>换个词试试，比如「加强筋」「M3508」「折弯」</div>';return}
  listEl.innerHTML=arr.map((i,k)=>`<article class="card ${k===state.sel?"on":""}" data-k="${k}">
    <div class="top"><h3>${hi(i.t,q)}</h3><span class="bd">${i.c}</span></div>
    <p>${hi(strip(i.b).slice(0,120),q)}…</p>
    <div class="sr">${i.i} · ${esc(i.s)}</div></article>`).join("");
}

function open(k){
  const it=state.list[k]; if(!it) return;
  $("#dc").textContent=it.c; $("#dt").textContent=it.t;
  $("#ds").textContent=it.i+" · 来源："+it.s;
  const rel=ITEMS.filter(x=>x.c===it.c&&x.i!==it.i).slice(0,5);
  $("#dbody").innerHTML = `<p>${esc(it.b)}</p>
    <div class="rel"><h4>同类条目</h4>${rel.map(r=>`<a data-id="${r.i}">${esc(r.t)}</a>`).join("")||"<p style='font-size:12px;color:#8b919a'>暂无</p>"}</div>`;
  $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); document.body.style.overflow="hidden";
  $("#dbody").scrollTop=0;
}
function close(){$("#drawer").classList.remove("on");$("#scrim").classList.remove("on");document.body.style.overflow=""}

catsEl.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  state.cat=b.dataset.c;state.sel=0;
  [...catsEl.querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x===b));render()});
listEl.addEventListener("click",e=>{const c=e.target.closest(".card");if(c)open(+c.dataset.k)});
$("#dbody").addEventListener("click",e=>{const a=e.target.closest("a[data-id]");if(!a)return;
  const it=ITEMS.find(x=>x.i===a.dataset.id); if(!it)return;
  state.cat=it.c;state.q="";qEl.value="";state.src="";$("#src").value="";
  [...catsEl.querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x.dataset.c===it.c));
  render(); const k=state.list.findIndex(x=>x.i===it.i); if(k>=0){state.sel=k;render();open(k)}});
$("#dx").onclick=close; $("#scrim").onclick=close;
qEl.addEventListener("input",()=>{state.q=qEl.value;state.sel=0;render()});
$("#src").addEventListener("change",e=>{state.src=e.target.value;state.sel=0;render()});
$("#rand").addEventListener("click",()=>{const k=Math.floor(Math.random()*ITEMS.length);state.cat="all";state.q="";qEl.value="";state.src="";$("#src").value="";
  [...catsEl.querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x.dataset.c==="all"));
  render();const idx=state.list.findIndex(x=>x.i===ITEMS[k].i);if(idx>=0){state.sel=idx;render();open(idx)}});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==qEl){e.preventDefault();qEl.focus();qEl.select();return}
  if(e.key==="Escape"){close();qEl.blur();return}
  if(document.activeElement===qEl&&e.key!=="ArrowDown"&&e.key!=="ArrowUp"&&e.key!=="Enter")return;
  if(e.key==="ArrowDown"){e.preventDefault();state.sel=Math.min(state.sel+1,state.list.length-1);render();scrollSel()}
  if(e.key==="ArrowUp"){e.preventDefault();state.sel=Math.max(state.sel-1,0);render();scrollSel()}
  if(e.key==="Enter"){e.preventDefault();open(state.sel)}
});
function scrollSel(){const el=listEl.querySelector(".card.on");if(el)el.scrollIntoView({block:"nearest",behavior:"smooth"})}
render();
</script>
</body>
</html>
