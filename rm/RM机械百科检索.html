:"「塌陷」是官方的「有效检测环数收窄」，不是机械动作","c":"赛事场地","b":"27炒鸡大符群里高荣信问「塌陷怎么实现，要做结构上的向下塌吗」，答案是**不用做任何机构**。\n\n塌陷是检测判定层的机制，官方原文（2026 赛季《能量机关改动》培训页）：「①新增：对于大能量机关，每次成功的激活都会让低环数『塌陷』。第一次激活后：1-3 环塌陷，此后命中 1-3 环不视为命中（但也不视为错误击打导致失败）；第二次激活后：4-6 环塌陷，此后命中 4-6 环不视为命中。」官方给的设计意图是「保证一定程度向下兼容的前提下，提高多次激活的技术难度，鼓励关注『高精度打击』主题」。\n\n2027 规则手册把同一机制写成表 5-24：累计激活 1 次 → 可继续检测 4~10 环；2 次 → 7~10 环。两份文本逐环对得上，所以这张「上赛季」的页面今年依然有效。\n\n机械侧真正要落地的只有一条：靶面环界线必须在官方径向 1mm 的检测精度下清晰可辨。队内 11-07 定调「不用管，视觉那边有要求电控再做」。","s":"群聊·27炒鸡大符 2026-11-07（高荣信/罗嘉毅/陈圳灏/林长耿）＋官方《能量机关改动》培训页＋规则手册表 5-24","k":"auto"},{"i":"K0577","t":"2027 大符改版需求优先级：先换靶子，再谈轻量化，垫高最后","c":"结构设计","b":"林创武 11-07 11:51 要求「列个大符的需求优先级」，并先给了自己的判断：「机械传动和底座改动要求不是很高吧，主要是更换传感器」。王奇英当天拍板四条：\n\n1. 更换新靶子（传感器）——「最重要的就是靶子，就算其他不改问题都不大」\n2. 五块扇叶做可拆卸结构，要保证可用性\n3. r 标突出、仿制官方\n4. 轻量化\n\n最后补一条：「高度问题，要一个能承受整个大符的垫高的东西」。\n\n工时含义：本赛季力气压在靶板（含传感器模组）与五片可拆卸扇叶上，传动与底座沿用往年即可；垫高件是独立子任务，主要约束是**承重**而不是精度。","s":"群聊·27炒鸡大符 2026-11-07（林创武、王奇英）","k":"auto"},{"i":"K0578","t":"大符滑环选型仍是空白：三条走电路线，没有型号","c":"经验避坑","b":"高荣信 11-07 10:53 连问「滑环这里应该如何设计」「有没有我们用的滑环的模型」，全组当天没给出型号或模型，只指向官方视频里提到过（官方课程《你也想做能量机关吗？》）。\n\n库里现有的是方案级线索，不是选型：\n- 5 臂独立灯控 → 中轴空心轴走线，或集线环；\n- 旋转体 → 固定体三选一：滑环 / 限位来回摆 / 无线；\n- 旋转体自带电池最省事，直接省掉滑环；\n- 东大 3SE 开源（RM AWARD 2024）用机械键盘键轴做击打检测 + ESP32/BLE 无线，整块绕开滑环。\n\n**按「待补」记录：定中轴结构前必须先拿到滑环的通路数、额定电流/电压、过孔内径、允许转速与寿命。**没有这五个数，中轴空心轴的内径与轴承跨距都定不下来。","s":"群聊·27炒鸡大符 2026-11-07（高荣信）＋库内 D09/R05 条目","k":"auto"},{"i":"K0579","t":"靶板那个「槽」卡住哪几层？检测模块的装配边界还没定","c":"结构设计","b":"钟自豪 11-07 18:45 在官方「检测方案·模块组成」爆炸图上圈出一处凸起的小槽，问：「这个槽会卡住下面哪几个部分，是视频里说的传感器、软胶、PC 板这三个组成的模块，还是也包括下面的分光板和灯板？」当天群里没给结论（后续回复都跑去讲塌陷机制了）。\n\n官方叠层顺序（从外到内）：盖板 → 压感传感器 → 1mm 软胶 → 10mm PC 板 → 3mm 缓震泡棉 → 分光板 → LED 灯板 → 控制板 → 外壳。\n\n从爆炸图看，红圈位置在盖板外框上沿、贴着 1mm 软胶环那一侧。**推断**（未证实）：若这个槽只是压感模块的定位/让位槽，它只约束「传感器 + 软胶 + PC 板」三段；只有贯穿到泡棉层，才会连带约束分光板与灯板。\n\n为什么要先问清：自研靶板的分层顺序一旦画反，PC 板与泡棉的让位关系就全错，返工要重开模。归档图：01_官方规则与规范/官方_能量机关检测模块_槽位标注_20261107.png","s":"群聊·27炒鸡大符 2026-11-07（钟自豪）＋官方检测方案爆炸图","k":"auto"},{"i":"K0580","t":"连式命名法正式推行：装配体带审核号，零件带尺寸参数","c":"图纸规范","b":"林创武 2026-11-07 19:52 在新建的「27神图群」向全体公告，把这套原本只写在《重生之我进入Taurus机械组》里的规矩升级为队内正式规范，冠名**连式命名法**：\n\n- 装配体：`装配体名V1.0-Sn-姓名-日期`，例 `英雄V1.0-ST-连炜生-20251112`\n- 零件：`零件名（尺寸参数）-姓名-日期`，例 `深沟球轴承（5-14-5）-连炜生-20251112`\n- 版本：大改动小数点前 +1，小改动小数点后 +1，初始 V1.0\n- `Sn` = 审核号，n 是审核次数，**n = T 表示审核通过、可发加工**\n\n配套三条流程要求：① 场地道具组周会前必须发图纸；② 各兵种图纸发到审图群（神图群），不是发大符群或机械组群；③ 注意命名规范。场地道具群同日 15:41 植正雄也再提醒了一次「大家注意图纸命名规范」。","s":"群聊·27神图群 2026-11-07（林创武）＋场地道具开发维护大队","k":"auto"},{"i":"K0581","t":"机械设计手册 第六版 全五卷已落盘（约 301MB）","c":"基础理论","b":"从飞书「海纳百川学无止境-资料汇总」补齐 5 卷 PDF，本轮全部下载成功（此前一直没下过）：\n\n| 卷 | 大小 | 本地文件 |\n|-|-|-|\n| 第1卷 | 59.4MB | 机械设计手册_第六版_第1卷.pdf |\n| 第2卷 | 80.8MB | 机械设计手册_第六版_第2卷.pdf |\n| 第3卷 | 43.8MB | 机械设计手册_第六版_第3卷.pdf |\n| 第4卷 | 49.9MB | 机械设计手册_第六版_第4卷.pdf |\n| 第5卷 | 68.8MB | 机械设计手册_第六版_第5卷.pdf |\n\n全部在 `机械百科_数据/设计资料/`。加上已有的《机械设计 第十版》《机器人学导论 第4版》《机械原理》（第九版仍未下成功），查资料的链条基本齐了。\n\n用法建议：卷次分工未逐一核对，**先翻第 1 卷的总目录定位卷次**，再进对应卷查表；不要凭印象直接翻某卷。","s":"飞书·海纳百川学无止境-资料汇总（drive preview 下载）","k":"auto"},{"i":"K0582","t":"官方课程《你也想做能量机关吗？》的三段结构","c":"赛事场地","b":"这篇正文一直抓不到的官方课（bbs.robomaster.com/wiki/697214/55020，Nuxt SPA，curl/WebFetch 只能拿到栏目目录），本轮从群里转发的截图拿到了目录：\n\n1. 能量机关整体方案\n2. 检测模块与灯效呈现方案\n3. Q&A\n\n发布方 RoboMaster 高校赛务，2024-10-15。群里是在讨论「滑环怎么走线」时被当作「官方视频里提过」的出处引出来的。\n\n价值在第 2 部分：检测模块与灯效呈现，正好对上靶板叠层结构与灯板选型。但**正文仍未抓到，只有目录**，别当已收录。归档图：03_群聊与任务记录/图_飞书群_20261107/官方课程_你也想做能量机关吗_目录截图_20261107.png","s":"群聊·27炒鸡大符 2026-11-07（植正雄转发截图）","k":"auto"},{"i":"K0583","t":"无人机机场归中结构两版方案：电动推杆 vs 丝杆步进+抽屉导轨","c":"结构设计","b":"图评会遗留的两份 `.doc` 本周终于下成功（5.0MB / 9.4MB），是工程组新人九月的机场进度，正好是两条不同技术路线：\n\n**A 版（电动推杆归中）**\n- 平台底部 4 个电动推杆做归中；算下来展开后单架飞机有 75cm 的降落误差\n- 卡点：体积够小的直线模组选型、上盖怎么防弹、更合理的变形结构\n\n**B 版（丝杆步进 + 滑块导轨）**\n- 归中推板用 2mm 螺纹柱 + 可伸缩司筒（减干涉减体积，代价是飞机桨保要跟着改）\n- 导向用光杆 + 抽屉导轨；平台全展开，地板做互补形状防飞机落下/卡住\n- 因新规飞机平台有 40mm 高挡板，底层抬到距地板约 46mm\n- 时序：全展开约 7s，归中一次约 3s\n- 自评三个隐患：归中挡杆刚性不足 / 力臂过长 / 顺滑度差，且仅两根挡杆可能卡位；底板托盘重心待调；开合时间可能不够\n\n**可复用结论两条**：① 机场归中先解决「挡杆刚性与力臂」，别先优化传动；② 40mm 挡板是新规带来的硬约束，底层净高按 46mm 起步。","s":"图评会 DRAWING REVIEW MEETING 附件 进度.doc ×2（2026-09）","k":"auto"},{"i":"K0584","t":"行星减速箱日志重开一章「减速比的确定」","c":"传动机构","b":"11-07 的更新只是加了骨架，正文还空着：文末新增五个标题「背景与需求 / 理论计算 / 减速比的确定 / 验证 / 图纸」，另把「GTX 内齿圈变位符号是反的」那句加粗。\n\n含义：这条线准备从 0 重开一轮设计（NGW 行星齿轮设计、2K-H NW 型设计两份文档已挂引用，18 项校核清单里仍有 8 项标着「完全没有/未闭合」）。下轮巡检要盯这五节有没有填内容。","s":"飞书·行星减速箱研发日志 2026-11-07","k":"auto"},{"i":"K0585","t":"大符 2027 需求优先级（王奇英定）","c":"赛事场地","b":"2026-11-07 林创武要求列需求优先级，王奇英给出排序：\n\n1. **更换新靶子（传感器）** —— 最重要，就算其他不改问题都不大\n2. **五块扇叶做可拆卸结构**，要保证可用性\n3. **R 标突出，仿制官方**\n4. **轻量化**\n5. 最后才是高度问题：要一个能承受整个大符的垫高方案\n\n林创武补充：机械传动和底座改动要求不高，主要是换传感器。\n\n王奇英另指出：目前大符重的根本原因是 5 个靶部分太重。","s":"群聊·27炒鸡大符 王奇英 2026-11-07","k":"auto"},{"i":"K0586","t":"连式命名法（2027 新推行的图纸命名规范）","c":"图纸规范","b":"2026-11-07 起推行的新命名规范，替代之前的口头约定：\n\n- **装配体**：`装配体名 V1.0-Sn-姓名-日期`\n- **零件**：`零件名（尺寸参数）-姓名-日期`\n\n示例：\n- `英雄 V1.0-ST-连炜生-20251112`\n- `深沟球轴承（5-14-5）-连炜生-20251112`\n\n同时要求：场地道具组周会前发图纸，各兵种图纸发到审图群。","s":"群聊·27神图群 林创武 2026-11-07","k":"auto"},{"i":"K0587","t":"危险工具使用须知（必须有人陪）","c":"加工工艺","b":"植正雄 2026-11-05 再次提醒：\n\n所有危险性工具——**雕刻机、手持切割机、座式切割机、手电钻、台钻**等，必须在具备操作能力的学长学姐陪同指导下，方可学习、操作，**严禁独自使用**。\n\n配合此前林创武讲的两条：旋转设备（铣床/车床/切割机）不戴手套；不要用手持角磨机切木板。","s":"群聊·27机械组通知群 植正雄 2026-11-05","k":"auto"},{"i":"K0588","t":"靶面检测方案对比：压力 / 红外 / 触摸框","c":"结构设计","b":"**压力传感器**（现方案）：官方录像里说考虑过红外，最终仍选压力，精度高。问题是不耐打——深大直接把传感器用双面胶贴在灯板上，很容易坏。\n\n**红外对管**（张墉分析）：\n- 常见直插式直径约 6mm，每环宽 15mm 大概放两个\n- 弹丸斜向击打时坐标会有偏差\n- 贴片式精度更高，但焊接歪一点光路就不交叉，300mm 靶面上误差被放大\n- 成本约 100~120 元/块靶\n- 优点：不被弹丸直接击打，不容易坏\n\n**红外触摸框**（郭卓鑫提议）：精度够，17 寸正屏尺寸差不多；张墉补充可以淘二手屏幕改造，顺带做弹道散射测试。\n\n结论：先按压力传感器方案走（摩现科技答复「就按这样做」），红外触摸框作为备选。","s":"群聊·27炒鸡大符 2026-11-04~06 张墉、郭卓鑫、谭嘉豪","k":"auto"},{"i":"K0589","t":"升降方案结论：不做高升降，改快拆 + 垫高","c":"结构设计","b":"原方案想把大符升到中心离地 2.6m，被否。\n\n林创武：有一定升降就行，买一张 1m 高的标准尺寸桌子垫高，最好轻便可折叠，方便带去比赛备场。\n\n植正雄：升降机构太复杂，不好维护；围绕最本质目的想——如果只是为了搬运方便，把支架做小、放在买的桌子上就行。\n\n伍津乐（提需求的人）：目的是外出比赛能垫高，又要方便上货拉拉；桌子不方便上货拉拉。谭嘉豪补充：用航空箱。\n\n**最终方案**：四根立柱做成快拆，五片扇叶可拆卸，到场再装；垫高交给桌子/航空箱。","s":"群聊·27炒鸡大符 2026-11-02 林创武、植正雄、伍津乐","k":"auto"},{"i":"K0590","t":"灯板孔位与灯带的画法约定","c":"图纸规范","b":"王奇英 2026-11-03 逐条确认灯板画法：\n\n- 灯板**中间的孔**才是与铝管固定的\n- 左右两边的孔是**绑扎带用的**，防止灯板魔术贴用久了脱落\n- 灯带在板子下面，**不用画实际灯带**，用填色表示位置即可\n\n另：深大的扇叶是简单用较粗螺丝固定在铝管骨架上。","s":"群聊·27炒鸡大符 王奇英 2026-11-03","k":"auto"},{"i":"K0591","t":"2027 空中机器人：从射击平台转向撞击无人机","c":"赛事场地","b":"队内周会文档《第二次周会-工程，飞镖，空中机器人介绍》对 2027 空中机器人的判断：\n\n由大型射击平台转向**小型自主无人机**，攻击方式从发射 17mm 弹丸改为**直接撞击装甲板**。核心技术转向目标识别、自主定位、航迹规划、**撞击控制**和**抗冲击结构设计**，战术定位由持续空中火力变为针对前哨站和基地的自主突击。\n\n对机械组的意义：抗冲击结构设计成为新兵种核心，与大符靶面抗打的思路同源。\n\n文档：https://vcnc8bq9w1le.feishu.cn/wiki/QbBDwkv6yipUKjkYRu7cACkan3f","s":"飞书·第二次周会-工程/飞镖/空中机器人介绍 2026-11-08","k":"auto"},{"i":"K0592","t":"队内资料汇总新增：9 本书 + 6 套开源","c":"案例开源","b":"《海纳百川学无止境-资料汇总》2026-11-07 更新，新增约 2.9 GB：\n\n**书籍 9 本**：《机械设计》（濮良贵 第10版）、《机械原理》（孙桓 第9版）、《机器人学导论》（原书第4版）、《机械设计手册 第六版》第 1~5 卷、《非暴力沟通》。\n\n**战队开源 6 套**：西北工业大学 WMJ 2026 工程（1.18 GB）、上海交大交龙 2024 工程（478 MB）、交龙 2025 串联腿（252 MB）、交龙 2023 平衡步兵（268 MB）、中国石油大学（华东）RPS 2025 串联腿（332 MB）、华南理工华南虎 2025 轮足步兵（412 MB）。\n\n**视频**：滚动轴承 Part 1/2（B 站）。\n\n文档：https://vcnc8bq9w1le.feishu.cn/wiki/PRK9wdTpWip46Gk8QOWc0oTSnfh","s":"飞书·海纳百川学无止境-资料汇总 2026-11-07","k":"auto"},{"i":"K0593","t":"华南理工华南虎 RM2026「元胤」哨兵机器人机械结构开源","c":"案例开源","b":"含三维图纸、机械结构设计报告（PDF+Word）与测试视频，网盘提取码 SCUT。报告按整车技术特点、关键机构、赛季迭代问题组织，是华南虎哨兵的第二代公开资料。可借鉴：哨兵整车布局取舍；把 2025「次骞」与本版对照，能看出两代在云台层级、传动与配重上的演进；报告结构可直接当队内技术文档模板。","s":"来源·BBS 1969791","k":"auto"},{"i":"K0594","t":"华南理工华南虎 RM2025「次骞」哨兵机械结构开源（含二维铝件图）","c":"案例开源","b":"四文件夹结构：二维图纸、三维图纸、说明文档、演示视频。二维只出关键铝件（2006 电机座、4310 传动铝件、Pitch 副铝件、小 Yaw 连接铝件），参与打样的件不出图；三维提供 STEP 与需 SW2023 的总装。可借鉴：关键件出图、打样件不出图的省工做法，以及哨兵小型化的件级设计。","s":"来源·BBS 803637","k":"auto"},{"i":"K0595","t":"中科大 RoboWalker RM2024 哨兵：舵轮底盘+大小 YAW 双级云台+下供弹","c":"案例开源","b":"舵轮底盘配大小 YAW 云台、下供弹，激光雷达加四台工业相机做全向感知，弹仓仅 580 发但实战极少打空；东部赛区场均伤害第一。开源为 SW2023 三维包。可借鉴：舵轮+双级 YAW 的层级划分；弹仓容量不必求大，命中效率与补弹节奏更关键。","s":"来源·BBS 26577","k":"auto"},{"i":"K0596","t":"深圳大学 RobotPilots RM2023 双云台+全向轮哨兵机械结构开源","c":"案例开源","b":"双云台实现优势火力与快速索敌，全向轮底盘兼顾打前哨站与全图导航。含板料加工二维图、SW2022 总装与 STEP，以及按需求—方案—参数—机构组织的开源文档。评论区讨论 POM 无轴承弹链与特氟龙的卡弹差异，可作弹链选材参考。","s":"来源·BBS 22791","k":"auto"},{"i":"K0597","t":"桂林电子科技大学 Evolution RM2021 双云台哨兵机械结构开源","c":"案例开源","b":"说明文档按整体介绍、换向机构、底盘、云台四部分展开，配 SW2020 三维与运动视频。双云台方案的关键在换向机构，这份早期资料把换向的原始构型讲得较直白，适合作为理解双云台原理的入门样本，再对照近两年强队方案看演进。","s":"来源·BBS 8541","k":"auto"},{"i":"K0598","t":"同济 SuperPower RM2026 大弹丸中心供弹机械设计指南（含模型）","c":"传动机构","b":"先论证轮腿英雄为何要中心供弹：弹舱绕中心布置可让弹药质量贴近整车重心、减小横向尺寸；再系统讲拨盘结构、弹舱布局、关键尺寸选型与卡弹故障排查。外啮合拨盘配「鹅颈弹链+拉簧限位+双弧形摩擦轮」，实测 5000 发不卡。附件为 4.45MB 指南与 68MB 模型。","s":"来源·BBS 1892264","k":"auto"},{"i":"K0599","t":"华南师大 RM2019 英雄拨叉供弹机构开源（终版）","c":"传动机构","b":"把拨叉设计的三个坑讲透：拨叉头做单侧平面，避免上下两颗弹丸分离时卡住上层；拨叉要足够长，使推力接近弯管切线方向而非压向管壁；前拨叉头必须完全避开摩擦轮发射路径。终版改用金属 CNC 拨叉、弯管加双 MR63ZZ 轴承、入弹口可转动。附 SW2017 与 STEP。","s":"来源·BBS 7832","k":"auto"},{"i":"K0600","t":"桂林电子科技大学 RM2021 摩擦轮英雄机械结构开源（含弧形摩擦轮二维图）","c":"案例开源","b":"二维图纸给出大弹丸弧度摩擦轮图，三维为全零件总装（SW2019+），技术报告覆盖整体方案、底盘、拨弹盘、弹链、云台、发射机构、Yaw 轴轮系剖视与工艺选择、标准件清单。可借鉴：弧形摩擦轮的二维表达方式，以及轮系剖视图的画法。","s":"来源·BBS 8539","k":"auto"},{"i":"K0601","t":"华南理工华南虎 RM2020 下供弹步兵：九齿双层拨轮与低重心 360° 云台","c":"传动机构","b":"为更低重心与更快响应做下供弹云台，四代 STEP 模型（1.0~4.0）加拨盘法兰、枪管等二维图与设计报告。拨盘用九齿双层拨轮，配扰动刷与轴承抑制卡弹，管路转角处装轴承保证顺畅。可借鉴：拨轮齿形与扰动结构；云台与底盘解耦的模块划分。","s":"来源·BBS 7479","k":"auto"},{"i":"K0602","t":"山东科技大学 SmartRobot RM2020 英雄拨弹结构：板拼弹仓+榫卯拨盘","c":"传动机构","b":"针对英雄卡弹与空弹，弹仓改板拼形式，损坏部分可局部更换，提高测试迭代效率；拨盘用榫卯结构替代法兰连接，使电机与拨齿连接更牢固、互换性更好。可借鉴：这两个低成本工程手法几乎不增加加工量，却明显缩短维修与换件时间。","s":"来源·BBS 11045","k":"auto"},{"i":"K0603","t":"深圳大学 RobotPilots RM2019 国赛工程机器人：全气缸驱动与上岛光电布点","c":"案例开源","b":"除底盘轮组、伸缩腿主动轮与取弹平移电机外，动力全部为气缸，0.45L 铝合金高压气瓶供气，气路复杂。上岛用 6 个光电开关分四处布置：位置 1/4 对称各 2 个用于自动纠正方向，位置 2/3 各 1 个用于检测与减速刹车。可借鉴：气缸方案的气路组织与开关布点逻辑。","s":"来源·BBS 6361","k":"auto"},{"i":"K0604","t":"深圳大学 RobotPilots RM2018 工程机器人：气动伸缩腿自动上下资源岛","c":"案例开源","b":"以气动伸缩腿实现高效自动上下资源岛，并在岛上取弹补弹，另有拖车救援机构，获当年最佳创意奖。开源含完整零件图、装配图与技术文档。可借鉴：伸缩腿的机构构型与气缸选型思路，属于资源岛时代工程车的经典构型样本。","s":"来源·BBS 4790","k":"auto"},{"i":"K0605","t":"沈阳航空航天 TUP RM2023 工程机器人：三旋转轴吸盘机械臂与双级链传动抬升","c":"案例开源","b":"上层 5 自由度：双 3508 同步控制滑轮组实现分段抬升（240mm+264.6mm），前伸 392.2mm，joint4/5 双电机差速，末端三轴吸盘气动吸取。抬升用四根 20×20 铝管连底盘、两侧 15×15 加固；锥齿轮处轴向力大，专门加装嵌轴承的齿轮座防错位。作者自评删 to"},{"i":"K0614","t":"轴承与轴承座公差配合的几点思考：从三维合页翻车说起","c":"标准件紧固","b":"作者做三维合页时只在 CAD 里堆结构，出图前把公差配合抛在脑后，零件加工回来轴承装不进，用锤子敲、勉强压入后又有的转不动、有的不固定。文中复盘了该在图纸阶段确定什么。可借鉴：新手最典型的配合错误，适合作为机械组出图前的自检提醒。","s":"来源·BBS 298","k":"auto"},{"i":"K0615","t":"工程车轮系方案之争：铝方管框架保垂直度 vs 两块厚碳板夹轮轴","c":"结构设计","b":"大车（工程、英雄）轮系两条常见路线：铝方管做框架左右支撑轮轴以保证垂直度，或两块厚碳纤板直接支撑轮轴。作者倾向前者太重、后者轻且好看，但担心雕刻机做不出轴承外圈所需公差导致不同轴，而强队多在用后者。可借鉴：一个尚无定论的真实取舍，值得对照本队加工能力。","s":"来源·BBS 5461","k":"auto"},{"i":"K0616","t":"机械设计动画与机械设计手册打包分享（两个压缩包）","c":"基础理论","b":"一次性打包机械设计动画演示与机械设计手册电子版，用于看常用机构的运动原理与查标准数据。可借鉴：新人补机构认知的入门素材，配合手册查轴承、键、螺纹等标准件的选型参数，比零散搜图更系统。","s":"来源·BBS 3802","k":"auto"},{"i":"K0617","t":"2027 赛季首次全员审图批次：13 人、7 条产品线在同一小时内提交（11-08）","c":"图纸规范","b":"第八次机械组组会（11-08 10:30 土槽楼）散会后，27神图群 11:24–12:02 集中收到 13 人提交，覆盖飞镖靶、基地靶、靶车、飞机基地、科技核心底座、前哨站、大符七条线——神图群已取代私聊成为唯一图纸入口，11-07 公告的「各兵种图纸发审图群」执行到位。\n提交形态分两类：① zip 包（6 份，可下载）；② 飞书文件夹上传（5 份，冯昭荣/钟湃予/梁泽锐/李馨琪/钟自豪）。\n通道实测结论：msg_type=folder 无法下载，im +messages-resources-download 直接报 234043 Unsupported message type；只有 msg_type=file（zip）能下。所以目录型提交只能在线看，或让提交人重打包成 zip —— 以后收图纸统一要求「打包成 zip 再发」，别用文件夹上传。","s":"群聊·27神图群 2026-11-08 11:24–12:02","k":"auto"},{"i":"K0618","t":"本轮图纸命名体检：装配体 6/9 合规，零件层只有徐奕昊与刘悦做到全覆盖","c":"图纸规范","b":"对 11-08 批次 9 份可核对提交逐层核对《重生之我进入Taurus机械组》的连式命名法：\n【装配体 名V1.0-Sn-姓名-日期】合规 6 份：张彦泽/王雨阳、梁泽锐、李馨琪、钟自豪、刘悦、冯昭荣。不合规 3 份：梁孜瀚只叫「飞机基地」、尹嘉玮只叫「靶车」「靶车 上 主体」、徐奕昊压缩包只叫「基地靶」——压缩包/顶层装配名不含版本与姓名，过后无法追溯是谁哪一版。\n【零件 名（尺寸）-姓名-日期】徐奕昊 100% 合规（底部支撑板V1.0-徐奕昊-20261105 这种），刘悦绝大多数合规且把尺寸写进括号（平垫（M4 9 1）-刘悦-20261107、推力球轴承15-10-5-刘悦-20261108）。\n最差三份：张彦泽科技核心底座（四角轴承座1/2/2.0/j、末端轴承2、铝方、轴20，十余件无姓名无日期）、尹嘉玮靶车（bc轨道、滑轨）、梁孜瀚飞机基地（装甲板1~7、连杆、连接件）。\n规律：新人第一次交图，装配体名字会照抄，零件层几乎全漏。审图第一关就该点这一条，比看结构省事且必查。","s":"群聊·27神图群 2026-11-08 提交件逐层核对","k":"auto"},{"i":"K0619","t":"Sn 没定级：全批 6 个装配体都写 V1.0-Sn，但规范里只有 ST 才可发加工","c":"图纸规范","b":"11-08 批次 6 个写了审核号的装配体，全部写成 V1.0-Sn，没有一份写 S1/S2/ST。按 11-07 神图群公告的连式命名法，n 是审核轮次：S1、S2 是审图中，只有 n=T（Trial 通过）才允许发加工。\n也就是说这 6 份名叫「Sn」的实际上都是「未定级」，谁也不能凭文件名判断能不能下厂。\n处理办法：审图通过当场把 Sn 改成对应的 ST，别留模糊态；提交人自己也不该用 Sn 占位，因为 n 必须能被检索和排序。","s":"群聊·27神图群 2026-11-08；对照 11-07 命名公告","k":"auto"},{"i":"K0620","t":"刘悦发射机构 V1：滚珠丝杆+MGN9 管储能，拉簧+滑轮组管发射，跷跷板舵机管撒放","c":"传动机构","b":"123 个零件的完整发射机构，功能切成三段互不干扰，是目前队内最完整的一套：\n① 储能/直线驱动：M3508 → 联轴器 → 滚珠丝杆 260mm + BK0 轴承座板 → MGN9 滑轨。滑轨同时建了 150/215/255 三种长度，说明行程还在试。\n② 发射动力：拉簧 3×18×300，前后拉簧板 4mm 夹持；导向用 304 U 型滑轮（外25/内6/槽5）组，靠滑轮组把弹簧行程放大 —— 这是全案最巧的一点，弹簧不必做长，靠绳路绕行换行程。\n③ 撒放：跷跷板 + 舵机 DG995 脱扣，沿用 2025 十月方案。\n④ 管：发射铝管 850mm，20×20×1 与 20×20×2 两种方管都建了模型。\n可复用件：机械组-滚珠丝杆260-王奇英-20250924、机械组-BK 0 轴承座-王奇英-20250924、机械组-滑台-许可岳-2025062 —— 丝杆+滑台模块直接继承 2025，不用重画。","s":"飞书群文件·发射V1-Sn-刘悦-20261108.zip（123 件）","k":"auto"},{"i":"K0621","t":"科技核心底座 V1.0：T10 丝杆+双光杆双导柱升降，末端 MG8010E-i36 配四点接触轴承","c":"传动机构","b":"张彦泽、王雨阳的科技核心底座，38 件，结构分升降与手腕两段：\n① 升降：42J1848 步进 → 双膜联轴器 CXGH-2-D25-d6-e10 → T10 丝杆 + T10 丝杆螺母 + 丝杆螺母配套滑块；导向用光杆 d5-L324 双导柱（另有一根短光杆）。丝杆单独承载、光杆只管防转与抗偏载，是标准解法。\n② 末端/手腕：MG8010E-i36 V3 关节 + 自建四点接触轴承（内圈/外圈分开建）+ 四角轴承座 1/2/2.0/j 四个版本 —— 四个版本说明轴承座定位尺寸反复改过，是这套图的返工热点。\n③ 标准件：60000 系列深沟球 + GB/T 6170 M4 六角螺母。\n提示：这套图零件命名最乱，四角轴承座系列全部没有姓名和日期，接手的人分不清哪个是最终版。","s":"飞书群文件·科技核心底座v1.0-Sn-张彦泽、王雨阳-20261108.zip（38 件）","k":"auto"},{"i":"K0622","t":"靶车装甲板「相对高度机械限位」是一整套六件，不是画一个限位块就完事","c":"结构设计","b":"尹嘉玮靶车上主体里，装甲板的相对高度限位拆成六个零件协同：装甲板 相对高度机械限位导轨、相对高度机械限位靠里模块、相对高度限位块、装甲板 上下限位部件1、上下限位部件2、装甲板 固定板。\n拆开的原因：装甲板要在竖直方向有两个极限位（上极限=判罚用的合法高度，下极限=缩回保护），导轨定轨迹、靠里模块定侧向基准、上下限位部件定两个死点、固定板把装甲模块整体锁在滑台上。只做一个限位块，受力全压在那一个零件上，撞一次就变形，而且无法分别调上下两个极限。\n配套的还有小型弹簧插销 + 弹簧插销垫片2 做快拆定位 —— 与 10-27 记录过的「靶车装甲板插销会脱出」是同一处，这版加垫片正是为了压住脱出。\n直接复用往年件：AM02 装甲模块、AH02 支撑架、陈秋杰 2023 版装甲模块装配、2021 版装甲板限围、橡胶垫。","s":"飞书群文件·靶车 上 主体_尹嘉玮_20261108.zip（17 件）","k":"auto"},{"i":"K0623","t":"靶车用 2.8 米长导轨 MGN12H2R2800 做直线往复，双滑块分散弯矩","c":"结构设计","b":"尹嘉玮靶车底盘件只有 6 个：bc 轨道、bc 轨道底座、滑轨、可定万向轮、靶车装配体，加一根 MGN12H2R2800（2.8 m、双滑块）和一根 MGN12C1R112（单滑块短导轨）。\n选型逻辑：靶车要沿场地直线往返，用一根 2.8 m 长导轨 + 双滑块（H2R）而不是两条短轨对接——双滑块分摊倾覆力矩，且长轨一次装夹保证直线度；短的那根 C1R112 单滑块只用在辅助导向位。\n万向轮用「可定」（可锁定）型，调车时锁死防漂移。\n注意：MGN12 系列 2.8 m 已经是超长规格，安装面平面度必须靠底座（bc 轨道底座）保证，直接贴铝型材会憋导轨。","s":"飞书群文件·靶车_尹嘉玮_20261108.zip（6 件）","k":"auto"},{"i":"K0624","t":"基地靶 V1.1：4040 型材+角码搭骨架，靶与护甲拆成两套装配分别送审","c":"结构设计","b":"徐奕昊的基地靶只有 18 件，但组织方式值得学：\n① 骨架全用 4040 铝型材 + 三种长度角码（4040、4040-45、4040-135），零自定义结构件，改尺寸只换型材长度。\n② 分成两个独立装配体：基地靶-V1.0（底部支撑板/底部铝型材/支撑铝型材/顶部铝型材/顶部玻纤板/拟飞镖靶）与 基地护甲装配体-V1.0（装甲板护甲1、护甲2、装甲板支撑板及其镜像、装甲板底板、装甲板）。靶面和护甲互不牵连，审图和改图可以并行，谁改坏了不连带另一套。\n③ 顶面用玻纤板，靶面件单独叫「拟飞镖靶」，说明靶面形态还没定死（在模拟飞镖靶而非真靶）。\n④ 全案零件 100% 遵守 名V1.0-姓名-日期，是本批唯一一份零件层零违规的提交。","s":"飞书群文件·基地靶V1.1_徐奕昊_20261106.zip（18 件）","k":"auto"},{"i":"K0625","t":"飞机基地：合页翻转式开合护甲，7 块装甲板分件建模各带固定板","c":"结构设计","b":"梁孜瀚飞机基地 55 件，核心是「开合护甲」这条链：合页 → 合页模块 → 开合护甲平台（1/2 两版）→ 开合护甲模块，再配连杆、连杆2、连杆固定、固定柱底座、开合护甲固定柱。\n机构逻辑：护甲靠合页翻转开合，连杆把多片护甲的转角联动起来（一片转、其余跟着转），固定柱底座做闭合位的机械锁点。用连杆联动而不是每片一个舵机，是为了省执行器、保证同步。\n装甲板拆成 7 块分件建模（基地装甲板 1/2/3/4/6/7，缺 5），每块各配一个固定板（固定板 2~8），便于单块损坏单独重做。\n骨架仍是 4040-2.0 型材七种长度（250/350/500/600/630/800/1000）+ 角码 4040-30/60/120。电气侧 TB48 电池（M100）+ 大疆电池座 + C620 + PM01 + AM02；底部复用刘俊锋 2025-12-13 全向轮。","s":"飞书群文件·飞机基地_梁孜瀚_20261108.zip（55 件）","k":"auto"},{"i":"K0626","t":"大符 V1.0（钟自豪）：支架 7 件 + 靶子 13 件，两层目录分开管","c":"结构设计","b":"钟自豪的大符 V1.0 用飞书文件夹上传（两层：支架 7 件、靶子 13 件），装配体名 大符V1.0-Sn-钟自豪-202621520229 —— 日期字段写成 202621520229，明显笔误（应为 20261108 之类），需本人更正后才好检索。\n值得肯定的是结构分层：支架与靶子分成两个子目录，等于把「承力骨架」和「靶面/灯板」解耦，与大符靶板本体是重量主要来源这一结论一致（五块靶板本体才是超重根因，支架不是）。\n未拿到文件实体（folder 类型不可下载），结构细节待补。","s":"群聊·27神图群 2026-11-08 12:02 钟自豪提交","k":"auto"},{"i":"K0627","t":"飞镖靶 V2.0 与基地飞镖靶：齿条+导轨做靶面平移，微动开关做命中触发","c":"案例开源","b":"两份飞镖靶方案（冯昭荣 38 件、钟湃予 28 件）都指向同一套机电方案：\n① 平移：2 模 6mm 齿条（900mm 长）+ MGN12 导轨/MGN12H 滑块，齿条做长行程直线驱动，导轨承担侧向力。\n② 电机：M2006 P36 + 2006 联轴器（冯版）／M2006 + 微动开关（钟版）。\n③ 触发：钟湃予版用「机械组 微动开关主体 + 微动开关滚轮」做靶面到位/命中的物理检测，滚轮式比直压式耐磨。\n④ 结构件：2mm 玻纤电机座及延长件、PLA 撞击件及延长件、PU 板、40×40 角码。玻纤做电机座是为了减重且抗振，PLA 撞击件是耗材位——撞坏了直接换打印件。\n两份都没走 zip，未能下载实体，方案细节以文件名与目录结构推断为主。","s":"群聊·27神图群 2026-11-08 11:24 冯昭荣、钟湃予提交","k":"auto"},{"i":"K0628","t":"操作手闭卷样卷 A：200 题库配套 30 题，每题的出处精确到规则手册 PDF 页码","c":"赛事场地","b":"谭嘉豪 11-08 21:05/21:19 在操作手群发的两份 docx，是 200 题概念版的配套闭卷样卷（30 题 / 45 分钟 / 每题 1 分）加答案解析。\n覆盖配比写死：RMUC 24 题 + RMUL 3V3 4 题 + RMUL 步兵对抗 2 题；只考机制理解与情境判断，不设数值计算。\n最有用的不是题目本身，而是解析的三段式：正确答案 → 规则解析 → 逐项说明（A/B/C/D 各自错在哪）→ 出处写到「§5.6.2；表5-21；印刷第96页 / PDF第97页」。这等于给了一份「规则手册哪一节考什么」的索引，比通读 144 页快。\n用法建议：机械组也拿它当规则自测——尤其是判断「这个机构设计会不会踩判定」，比等检录挨罚便宜。全文已存 02_队伍制度与必读/操作手闭卷样卷A与答案解析_20261108.md。","s":"群聊·我能当操作手？ 2026-11-08；docx Doibd91FTo244kxwV5EcNUOJnch / FTkDdPMQ8oYBdxxZEs9cHVZOnyh","k":"auto"},{"i":"K0629","t":"五条最容易搞错的判定：胜负先比控制度、同阵地双点激活暂停、大能量环数管强度灯臂管时长","c":"赛事场地","b":"从操作手样卷里挑出的、机械与战术都容易误判的五条（均带手册出处）：\n① 时间耗尽、双方基地都未被击毁：先比累计控制度，控制度高的直接赢，不再比基地血量、也不比攻击伤害（§5.8，P114/PDF115）。\n② 同一前哨阵地内，红方激活前哨站增益点、蓝方同时激活该阵地中央高地增益点：占领进度「暂停」，不是清零、也不是初始拥有方继续涨（§5.6.2 表5-21）。关键在「同一阵地」而非「同一个点」。\n③ 大能量（能量机关）一次成功激活：增益效果强弱由平均命中环数决定，持续时间由激活灯臂数决定 —— 两者是分开的两个变量，打环数和开灯臂是两件事。\n④ 重装存活但允许发弹量已耗尽仍打 42mm：会触发对方装甲的 42mm 伤害屏蔽，但 17mm 不被屏蔽。\n⑤ 战亡时：地形跨越增益消除，能量机关增益不因战亡消除。\n另：自适应装甲加固是双刃——加固区减伤，未加固区反而增加弹丸伤害。","s":"群聊·我能当操作手？ 2026-11-08 操作手样卷A解析","k":"auto"},{"i":"K0630","t":"GTX 内齿圈 0.01 变位的真正作用：抵消官方 M3508 太阳轮的 +0.01 变位","c":"传动机构","b":"11-06 只记到「GTX 内齿圈变位符号是反的，输负数齿顶圆反而变大」，11-08 减速箱日志把这句补完了：\n内齿圈取 GTX 版 0.01 变位系数（即按标准约定写成 -0.01），是为了抵消官方 M3508 太阳轮本身带的 0.01 变位系数。\n所以不是「符号写错了要改回来」，而是配齿时必须把官方太阳轮的变位一起算进去：官方件自带 +0.01，内齿圈就得给 -0.01 才能回到设计的中心距与侧隙。自己画内齿圈而忽略官方太阳轮变位，等于把中心距整体偏了 0.01×m。\n结论：凡是用官方 M3508 输出齿轮做太阳轮的减速箱，内齿圈变位不能按 0 设计。","s":"知识库·行星减速箱研发日志 2026-11-08 新增段落","k":"auto"},{"i":"K0631","t":"雕刻机 X 轴整轴不动：重启、换刀、换文件全无效，先查复位别急着换文件","c":"经验避坑","b":"11-08 21:03 钟坤霖在负二群报：雕刻机轴「怎么都不会动了」，21:10 补充「重启、换刀、换文件都没用」，刘俊锋建议复位。截至 21:30 未有结论。\n可提炼的排查顺序（按成本从低到高，别一上来怀疑文件）：\n① 复位/回零——若是限位触发或急停锁死，换一百个文件也没用，机器根本没进入可运动状态；\n② 看驱动器报警与使能灯，区分「控制器没发脉冲」和「驱动器不执行」；\n③ 手动模式（手轮/JOG）试单轴，能动说明是程序/坐标系问题，不能动才是硬件或使能问题；\n④ 再查 G 代码坐标系偏置、软限位；\n⑤ 最后才怀疑文件与换刀。\n「重启+换刀+换文件都无效」这一组合，本身就指向使能/限位/驱动器方向，而不是加工程序。","s":"群聊·负二群 2026-11-08 21:03–21:18","k":"auto"},{"i":"K0632","t":"操作手选拔节奏调整：两天一视频改为下周末前至少传一个","c":"队伍制度","b":"谭嘉豪 11-08 21:29 在操作手群 @all：原「两天一个视频」的要求改为「下周末前至少上传一个视频」，理由是不要耽误研发任务。\n对照 11-02 的通知（11 月上旬展开操作手选拔、全体队员可填表、11-04 20:00 截止报名），这条是选拔进入实操阶段后的松绑：频率考核让位于研发进度。\n对机械组的意义：报名操作手的队员不必再为凑视频频次挤压画图时间，但「下周末前至少一个」是硬底线。","s":"群聊·我能当操作手？ 2026-11-08 21:29","k":"auto"},{"i":"K0633","t":"哈工大I Hiter RM2024/25哨兵结构开源（365×527×425 yaw-yaw-pitch偏心）","c":"案例开源","b":"哈工大 I Hiter 开源 24/25 赛季哨兵整车三维模型与结构说明。底盘为前全向轮+后舵轮四驱，车体 365×527×425mm、轮轴距 310×365mm；云台用 yaw-yaw-pitch 偏心大小 yaw 结构，俯仰 -26°~+36°。作者逐条标注借鉴来源：11 辊全向轮改自南理工、滑轨悬挂来自深大、初版拨盘取自上交、云台与弹仓配置取自桂电 2021 上云台。对想做偏心双 yaw、又要在 425mm 限高内塞下弹仓的队伍，是一份可对照的整机参数基准。","s":"来源·BBS 56684","k":"auto"},{"i":"K0634","t":"哈工大I Hiter RM2021哨兵机械结构开源（STEP+技术文档v8.29.2）","c":"案例开源","b":"哈工大 I Hiter 2021 赛季哨兵开源，含 STEP 整车模型、《哨兵技术文档》v8.29.2（设计思路与研发总结）及测试视频，走网盘分发。真正价值是跨赛季对照组：与 2024/25 版并排看，能读出云台构型、底盘轮系与弹仓布置几年间改了什么、为什么改。附件需网盘提取码。","s":"来源·BBS 8496","k":"auto"},{"i":"K0635","t":"华南理工普渡华南虎RM2021飞镖系统开源（含导轨与摩擦轮二维图）","c":"案例开源","b":"华南虎 2021 飞镖系统整机开源：技术报告（pdf+docx）、单发/二连发/三连发演示视频、SW2019 及以上总装（另附 STEP），二维图纸里专列「导轨」「摩擦轮」两套加工图。四文件夹结构（说明文档/效果展示/三维图纸/二维图纸）是 RM 开源的规范范式，值得照抄；飞镖导轨与摩擦轮的二维加工图是本条最硬的干货，可直接对照自家镖架。","s":"来源·BBS 8447","k":"auto"},{"i":"K0636","t":"合工大苍穹RM2021飞镖发射架开源（板材型材极简构型）","c":"案例开源","b":"合工大苍穹 2021 飞镖发射架，正文按「发射机构—连发机构—云台架」三部分讲设计。定位是低预算新队的极简方案：主体用板材加型材搭建，摩擦轮发射机构做连发，二维图纸只给一个「挡块」。适合当飞镖入门的第一版构型参考——先跑通连发节拍再谈精度。作者也坦白赛场表现不佳，失败面同样是可借鉴信息，附网盘。","s":"来源·BBS 8334","k":"auto"},{"i":"K0637","t":"华南师大RM2019哨兵超快拆底盘（上下+侧向双向夹紧）","c":"案例开源","b":"华南师大 2019 哨兵快拆底盘开源，卖点是单人可操作、上下与侧向都有夹紧力、适应不同轨道；作者写明赛中两小时内完成整车装配，零件大多可直接网购。附带记录更关键：赛前因加工尺寸问题侧向支轮回弹不了、等于没有自由度，哨兵仍能正常跑轨——说明轨道夹紧机构对尺寸公差极敏感，回弹自由度是这类设计的命门，同时暴露出该处最易做错。","s":"来源·BBS thread-8632","k":"auto"},{"i":"K0638","t":"首都师范大学PIE RM2026隧道工程机器人（单六轴臂+自锁夹爪）","c":"案例开源","b":"首师大 PIE 2026 隧道工程机器人开源：单六轴机械臂加自锁夹爪，含 2.20MB 说明文档与 615MB 图纸包。文档记录了从零起六轴臂的取舍过程（参考华南理工、上交、南理工往届），并坦白稳定性未经系统验证、赛场表现平淡。对第一次做六轴臂、又抽不出人做登岛机构的队伍，这是一份「哪里会翻车」的实况记录，比成功案例更有预警价值。","s":"来源·BBS 1942548","k":"auto"},{"i":"K0639","t":"西工大WMJ RM2026工程机器人开源（两版三维图纸对照）","c":"案例开源","b":"西工大 WMJ 2026 工程机器人开源，给两版三维图纸（SW2025 及以上可开）与说明文档，讲两版结构特点与研发历程，走网盘分发。价值在于同赛季两版对照——能看出一轮结构迭代到底改了什么、为什么改，比只看最终版更容易理解设计决策。作者声明图纸与实物有出入，仅供交流参考。","s":"来源·BBS 1894403","k":"auto"},{"i":"K0640","t":"西交利物浦OmniX RM2026工程机器人（70mm起伏+三级兑换，上海站第一）","c":"案例开源","b":"西交利物浦（太仓）OmniX 2026 工程机器人全机械设计开源，含此前夹爪的 V2.0 版本。成绩硬：能过 70mm 起伏路面并完成三级兑换，工程单项赛上海站第一、全国第四；因 UC 完整形态考核未通过而选择开源。适合研究「低矮通过性＋三级兑换」的构型选择与夹爪迭代路径。图纸与报告走网盘。","s":"来源·BBS 1883317","k":"auto"},{"i":"K0641","t":"RM2026全向轮步兵开源：14kg、GM6020双轴直驱、90°大仰角","c":"案例开源","b":"一台 2026 全向轮步兵开源，全重约 14kg，底盘俯视投影为 φ500mm 圆，pitch/yaw 均由 GM6020 直驱（无同步带），保留 90° 大仰角与 800+ 弹仓容量。选型表给得全：4×M3508 底盘、2×M3508 摩擦轮、Vortex 减速箱（已停产，可换森鹏物联）、HEXROLL 辊子。整车按新队员练习车设计、冗余很大但接口清楚；注意悬挂处碳管外径需二次加工。","s":"来源·BBS 1884031","k":"auto"},{"i":"K0642","t":"华科狼牙RM2024自适应全向轮步兵：井字分割框架+滑块导轨悬挂","c":"案例开源","b":"华科狼牙 2024 自适应全向轮步兵开源。底盘用井字分割式框架：8 根 15×30×2 铝管（长 132.5mm）上下夹 4mm 玻纤板，外围 4 块 8mm 碳板兼作装甲板、护框安装件。悬挂为滑块导轨连杆，拉簧线径 2.5mm、原长 40~60mm 对应 18~20kg 车重，最大伸展约 35mm。踩坑点：M4×100 拉簧挂杆会弯、应换 M6；挂钩打印件用 TPU 吸收密集干涉点；10mm POM 护框可雕刻机切、两侧加导轮过隧道。","s":"来源·BBS 43564","k":"auto"},{"i":"K0643","t":"东北农大TCP短悬挂：轮距380mm+2元一套自制聚氨酯辊子","c":"结构设计","b":"东北农大 TCP 为压缩尺寸做的全向轮悬挂，装车后轮距仅 380mm：把两根溪地 90 避震器直接接下臂、靠上下臂外形做限位，并用 xroll 减速箱缩短电机长度腾出避震空间。更实用的是辊子账本：φ6×φ18×18 聚氨酯棒料 1~1.2 元/件，两端各塞 3×6×4 铜套、中间 φ3×25 圆柱销，一套约 2 元、四轮二百多。钢套会脱出磨碳板必须换铜套；聚氨酯圆柱面会让轮面呈多边形，抖动略大于注胶轮。","s":"来源·BBS 1935523","k":"auto"},{"i":"K0644","t":"中州烛龙RM26.5全向轮下供弹底盘：560×285、5千造价、40万发不卡","c":"结构设计","b":"中州烛龙 26.5 赛季底盘开源（STEP 56MB）：560×285mm、离地 70mm、减震行程 30mm、载弹 800、造价约 5k、重约 12kg，侧供弹盘实测 40 万发不卡。做法是省钱工程学：双铝管+双碳管组合兼顾吸冲击与减重；12 组 30mm 管夹解决铝管与碳管不同高；多处碳/玻纤板夹打印件平衡抗冲击与重量；2mm 碳板蒙锡纸、12 颗螺丝快拆整件。铝管不建议阳极氧化（位于车体中间，绝缘无意义）。","s":"来源·BBS 1937999","k":"auto"},{"i":"K0645","t":"发射机构三条配平原则与3D打印摩擦轮四件套结构","c":"结构设计","b":"一份把自家发射机构讲透的分享。三条可复用原则：弹仓几何中心穿过 pitch 轴，弹量变化不改变重心；火线与 pitch 轴相交，用机械结构吃掉后坐力矩；为此把拨弹轮斜置把弹送到枪管高度。3D 打印摩擦轮拆成衬套/胶圈/盖子/法兰螺母四件：衬套内顶做凸起卡进 2312 散热槽防打滑、外侧做齿增大摩擦、下方做突缘防胶圈下滑，碗形盖子从上方压紧防甩飞。","s":"来源·BBS 2785","k":"auto"},{"i":"K0646","t":"复旦星云EGA低成本自制装甲支撑架：3D打印+嘉立创PCB复刻官方件","c":"结构设计","b":"复旦星云 EGA 2026 用 3D 打印加嘉立创 PCB 复刻官方装甲支撑架。先做四项实测：官方接线板 PCB 非 1.6mm；刀片电池母座为特制件、市面难配；官方铝架含细长内弧面与悬空面，不满足铨洲加工要求；支架凹槽比 PCB 厚，为母座配合与螺头留出空间。方案：PLA/PETG 打印（拓竹 A1，0.4 喷嘴、0.20 强度档，可加墙厚与填充），PCB 走嘉立创 2 层 1.6mm 免费打样；母座必须买立创商城版，淘宝同封装但内部弹片间隙不同。","s":"来源·BBS 853791","k":"auto"},{"i":"K0647","t":"港科大无人机云台轻量化：特氟龙弹道塑性变形坑与预应力塑料柱","c":"结构设计","b":"港科大 ENTERPRIZE 讲 24 赛季无人机云台减重。要点：排除侧供弹（材料用量远超鹅颈），参考深大 23 赛季哨兵扎带鹅颈；弹道用特氟龙降复杂度，但特氟龙极易塑性变形、必须由 CNC 件拧入稍长螺丝压死，否则上供弹压力下卡弹；GM6020 后置配平 pitch；yaw 不需无限转就省掉滑环，用 95A TPU 配合伸出螺丝做限位；把电机本体当结构件用；两层 2mm 玻纤板之间夹略长的塑料柱形成预应力。","s":"来源·BBS 55593","k":"auto"},{"i":"K0648","t":"杨三十电池架减重：榫卯+螺栓定位与电池卡扣型号兼容性","c":"结构设计","b":"杨三十 2023 无人机电池架减重方案：靠榫卯与螺栓定位固定，主件为一个自制铝件、网购铝排连接件、8 颗 M3、两个 M3 尼龙防滑螺母、两片自制玻纤板，需与机身上下层板配合夹持。最有价值的是电池兼容性知识：仅支持 TB47D/S、TB48D/S（卡扣在短边），不支持 TB47/TB48（卡扣在长边）——外形相同但卡扣方向不同，买错直接装不上。加工余量须按自家设备实测选定，不能照搬。","s":"来源·BBS 9290","k":"auto"},{"i":"K0649","t":"RM圆桌第一期：下供弹机构的秘密（单发逻辑与三大代价）","c":"传动机构","b":"官方圆桌整理下供弹完整逻辑链：单发靠拨弹轮旋转—弹丸压限位开关—摩擦轮发射—开关复位；连发则忽略开关按射频转。限位开关前后位置直接换「响应速度 vs 误触发安全性」。下供弹代价讲得最透：云台减重但 P 轴电机占比上升，加减速时 yaw 摇头；供弹链路长、弯管阻力大，拨弹需更大推力。三个解法：90° 弯头内壁装轴承或放大转角半径、优化拨弹推力、尽量缩短管路（代价是存弹变少）。","s":"来源·BBS 5269","k":"auto"},{"i":"K0650","t":"RM圆桌第十二期：拨弹机构三大防卡设计（双层轮/离心柱/扰动刷）","c":"传动机构","b":"官方圆桌讲拨弹轮防卡，三招可直接照抄：①拨弹轮改双层，每孔预存两弹、转两圈才耗尽一孔，高射速下不再空弹；②新增离心柱，让贴壁旋转的弹丸被挡住、转速与拨弹轮同步后落入拨孔；③双层不等长柔性扰动刷（尼龙丝固定座），上层短下层长，在出口上沿卡弹高度反复扰动。另给卡弹高发位置（拨轮边线与出弹口形成的三角区）与弹仓做圆锥形降空弹率的经验。","s":"来源·BBS 5951","k":"auto"},{"i":"K0651","t":"西交笃行弹道优化：摩擦轮邵氏60/55对比与上下双限位定心","c":"传动机构","b":"西交笃行 2019 弹道优化复盘，6m 打小装甲命中率 80%+。机械侧三招：①摩擦轮按邵氏硬度 60 与 55 各做一版对比，外径 φ63×高 9、聚氨酯包胶+6061 内芯，靠 3508 轴与外圈定位以减小动不平衡；②枪管由「底部球形弹簧单限位」改为上下双限位，保证弹丸进增速区时居中且重复性好；③枪管与摩擦轮必须落在同一基准面，枪管做定位凸台靠电机外径与圆台定位——不要用螺栓定位。","s":"来源·BBS tid=7844","k":"auto"},{"i":"K0652","t":"港科大面向铨洲智造的减速箱与全CNC舵轮组（14.88减速比/齿圈线切割）","c":"传动机构","b":"港科大全 CNC 舵轮组加 3508 减速箱开源，cnc 件约 200 元。硬参数：减速比 (46×77)/(14×17)≈14.88，用淘宝 14-46 0.6 模双联齿；舵上齿圈 0.6 模 136 齿、线切割约 40 元；舵上改用 3508 转子（比 6020 更薄更轻、扭矩转速更优）；轴系 6814 深沟球，需注意游隙导致齿圈啮合不均；四条 60mm MGN7H 做垂直悬挂；光电门加 180° 弧形挡片复位。两个巧思：齿圈开口留 1.5mm 圆槽拧 M2 顶丝撑开防挤压；打印指针对齿标双联齿腰线。","s":"来源·BBS 760969","k":"auto"},{"i":"K0653","t":"哈工深南工骁鹰尼龙烧结SLS电池架：130g降到56g的取舍","c":"材料板材","b":"哈工深南工骁鹰 2025 电池架开源，把官方 130g 降到约 56g、打印价 50 元。新电池架孔位纵向距达 36mm，直接装 40mm 铝管已不可行，必须缩到 32mm 以下。做法：出线端保留、对侧减薄挖空；端子直接拆官方架（淘宝 AIR 3 端子偏小不敢用）；固定孔用锥形铜嵌螺母 IUB-M3-2，端子板在打印件上攻 M2 丝锥。两条硬禁忌：不能选不可攻丝或加纤尼龙（加纤会毁电池接口）；卡扣位缠特氟龙胶带补 3D 打印公差、增加过盈。","s":"来源·BBS 803411","k":"auto"},{"i":"K0654","t":"风信子低成本通用电池架：铨洲6.8打样件，单件可压到20元","c":"材料板材","b":"风信子低成本电池架，铨洲 6.8 元打样件加板材，单件可压到 20 元、重约 40g；实测空载 10kg 机架连飞 7 分钟不过热，过流能力可下放地面兵种。要点：铜片买成品（1688 独此一家、发货慢）或照太科杨三十方案自切；上板 2mm 以上即可，视刚度决定要不要铝柱；铜片安装件全选螺纹并做阳极氧化防短路；电池卡扣两侧板材用玻纤等不导电材料，避免卡扣磨出碳粉短路。","s":"来源·BBS 354231","k":"auto"},{"i":"K0655","t":"TB系列3D打印分体式电池架：16g与502渗胶增强层间强度","c":"材料板材","b":"TB 系列分体式电池架，总重不足 16g。分铜片侧与无铜片侧两片，每片三颗 M3 固定在机器人自身板材的预留孔位，靠魔术贴束缚带压住电池。两个工艺点值得抄：铜片与打印件之间用 502 加压粘接（虎钳加压），作者实测 502 渗入后层间强度远高于普通打印件；临时测试时可单片刻直接套在电池上，晃动不脱落。附 STEP 0.27MB，材料为拓竹 PLA basic。","s":"来源·BBS 1316675","k":"auto"},{"i":"K0656","t":"轴类零件加工：四条工艺路线与中心孔定位的取舍","c":"加工工艺","b":"轴类零件加工的系统梳理，做减速箱轴、舵轮轴、辊子轴都用得上。四条工艺路线：粗车—半精车—精车（通用）；再加粗磨—精磨（黑色金属、高精度、需淬硬）；再加精车—金刚石车（有色金属，磨削会堵塞砂粒间空隙）；再加光整加工（淬硬且要求低粗糙度）。另讲预加工必须校直（毛坯弯曲导致余量不均、装夹不可靠）、以中心孔定位符合基准重合与统一原则、较重工件改用外圆+中心孔定位提高刚性。","s":"来源·BBS thread-7616","k":"auto"},{"i":"K0657","t":"机械赛完复盘清单：通孔+0.2、螺母防松、布线进结构设计","c":"经验避坑","b":"一份赛后机械复盘清单，条目碎但都是真金。设计流程九步（画完必须重新装配查干涉、SW 工程图要补尺寸公差粗糙度材料数量）；通孔按螺丝直径 +0.2 画（M3 画 3.2）；螺母选自锁或加螺纹胶；电机/电调/主控连接处加硅橡胶防脱；3D 打印件必须算荷载再定厚度或换材料；装配要考虑先后顺序；防护与布线必须进结构设计（血淋淋的教训）；轮子别装反、注意底盘电机出线朝内；枪管里螺丝头不能进弹道。","s":"来源·BBS 5166","k":"auto"},{"i":"K0658","t":"配合选择与形位公差：公差带必须小于尺寸公差才有意义","c":"图纸规范","b":"讲清「什么时候用哪种配合」与形位公差和尺寸公差的关系。单向间歇旋转或正反运动用过渡配合，并加紧定螺钉；传较大扭矩用过盈配合，需压装甚至热套。核心原则：形位公差是尺寸公差的补充，公差带必须小于尺寸公差才有意义——宽度公差 0.2mm 时给 0.05 平行度有意义，给 0.3 就废了；反之尺寸公差松而平行度严，说明真正影响装配的是形位而非尺寸，审图时要抓这条。","s":"来源·BBS tid=2966","k":"auto"},{"i":"K0659","t":"华东理工起源压感膜能量机关靶面：单叶568颗灯珠与动态基准检测","c":"赛事场地","b":"华理起源 2026 用压感膜做能量机关靶面的整套设计。每扇叶 312+256=568 颗 WS2812，显存 568×24×2≈26.6KB，故选 STM32G474CBT6（170MHz、128K RAM，双 ADC 以「5+5」采 10 路压感）；击打检测用「ADC 原始值变化量＋动态基准」，未受击时每 1s 刷新基准以抗漂移。机械侧可借鉴靶面叠层与维护性：检测片贴在灯板上方、单叶独立成模块，坏了整片换。附原理图、PCB 与代码。","s":"来源·BBS 1938358","k":"auto"},{"i":"K0660","t":"27 能量机关审图六条：轴向定位、导轨冗余、CNC 角码成本、顶丝带轮、分体带轮、单一预紧","c":"结构设计","b":"2026-11-09 凌晨林创武把《27能量机关审图》写成文档公开，高荣信给出 6 条意见，是本赛季大符第一份成文的审图结论。\n\n**① 1m 长轴没有任何轴向定位** —— 会脱出；且「没必要做 1m 且这么大直径的轴」。轴系铁律：靠过盈/顶丝/夹紧传扭的轴，至少一端要做轴向定位（轴肩台阶+端盖、卡簧、挡圈三选一）。\n\n**② 铝型材里塞 T 形螺母固定导轨** —— 「你怎么保证螺母不掉下去，而且你怎么放这些螺母？」两个死结：垂直安装时螺母在槽内自由下落、锁不紧；中段位置的螺母只能从型材端头滑入，两端一封角码就再也塞不进去。结论：「不能这样固定导轨」，且**导轨方案对能量机关属冗余**，应参考去年前哨站的升降固定方案。\n\n**③ 巨大的 CNC 角码造价太高** —— 未考虑成本。CNC 按体积/工时计价，大块角码是成本黑洞，等效功能用型材角件+钣金折弯即可。\n\n**④ 带轮不能做顶丝设计**、**⑤ 不要分体式带轮且太宽**、**⑥ 纯靠螺丝预紧力张紧太容易松**（可参考步兵 yaw 的张紧方式，或轴承张紧）。\n\n附一句装配可达性质问：「这颗螺丝怎么装？」——设计时没留扳手空间。\n\n全文档已归档：`05_整理成果_大符专题/13_27能量机关审图意见_20261109.md`。","s":"飞书文档《27能量机关审图》(docx VKWGdCc90o3WQNxiWhXc8k7NnN2)，林创武 2026-11-09 01:24 发在 27炒鸡大符","k":"auto"},{"i":"K0661","t":"审图检查项 9 条：把一次图纸评审反推成可复用的验收清单","c":"图纸规范","b":"从 2026-11-09《27能量机关审图》暴露的问题反推出的 9 条检查项，可直接当审图第一关：\n\n1. 轴系是否双向轴向定位（本次：1m 轴无定位，有脱出风险）\n2. 紧固件能不能装进去、会不会掉（本次：型材槽内 T 型螺母）\n3. 是否用了冗余的高成本机构（本次：导轨方案冗余）\n4. CNC 件体积是否合理（本次：巨大角码）\n5. 轮/带轮与轴的连接方式（本次：顶丝、分体式带轮）\n6. 张紧是否只靠单一预紧力（本次：螺钉预紧张紧）\n7. 装配可达性——扳手空间（本次：「这颗螺丝怎么装？」）\n8. 摩擦/过盈类连接的长期可靠性（本次：橡胶套摩擦固定）\n9. 发图前是否 Pack and Go 打包（本次：打开装配体满屏报错，原因就是零件没搬进上交文件夹）\n\n第 9 条是新手最常犯的：SW 装配体发出去必须「打包」，否则对方打开全是报错，评审直接卡在第一步。","s":"飞书文档《27能量机关审图》+ 27炒鸡大符群 2026-11-09","k":"auto"},{"i":"K0662","t":"V 轮 + 铝型材替代直线导轨：立柱自己当导轨的 2400mm 升降方案","c":"结构设计","b":"2026-11-09 大符支撑结构的关键方案切换，由高荣信提出、林创武当天拍板「低成本的话可以」。\n\n**做法**：不买直线导轨（「太贵了」），**四根立柱直接充当导轨**；立柱上穿 V 型包胶轮/偏心轮，四边轮子夹住型材；角件装 3 个轮、螺栓+螺母调预紧。\n\n**三个好处**：① 省掉导轨+滑块的采购成本；② 对装配精度要求更低（偏心轮可调预紧，容差大）；③ 型材本身是结构件，不用另设导向件。\n\n**参考原型**：龙门式 FDM 打印机（CR-10/Ender 类）的 X 轴滑块就是这套 V 轮结构，电商整机参考价 2463.55 元，可直接买件测绘。\n\n**代价**：V 轮是滚动摩擦+点/线接触，刚度不如导轨，长行程（2400mm）要防中段下垂与偏摆；偏心轮需要留调节量，四边预紧要能分别调。\n\n图：`05_整理成果_大符专题/大符支撑_V轮导向方案_参考机型电商图_20261109.png`、`大符支撑_V轮导向滑块实物_20261109.png`","s":"27炒鸡大符群 2026-11-09 13:45–15:57（高荣信/植正雄/林创武）","k":"auto"},{"i":"K0663","t":"V 轮选型卡点：成品只有 4020 配套，4040 要自己画轮","c":"标准件紧固","b":"V 轮方案的落地卡点在标准件可得性上，不是结构本身：\n\n· 网上能买到的铝型材 V 型/包胶滑轮**只有 4020 规格**；\n· 大符立柱现在用的是 **4040**，没有配套成品轮；\n· 为了强度硬上 4040，「这个轮子就得自己画」——自开模/自制轮的成本与周期不划算。\n\n**结论（15:52）**：把那 4 根立柱换成 **4020** 铝型材，用成品轮；强度不足靠增加根数或壁厚解决，而不是靠加大单根截面。\n\n通用经验：**选标准件之前先查配套件有没有货**。截面尺寸一旦定死，后面所有导向/连接件都得跟着定制；「先定结构再找件」是新人最常见的成本陷阱。","s":"27炒鸡大符群 2026-11-09 15:48–15:57","k":"auto"},{"i":"K0664","t":"带轮不能用顶丝传扭：改张紧套或轴承定位（步兵 yaw 的做法）","c":"传动机构","b":"审图意见里「带轮不能这样做顶丝设计」背后的机理：\n\n顶丝（紧定螺钉）压在光轴上，靠**单点接触**传扭：\n· 接触面积近似一个点，扭矩稍大就打滑，并在轴上压出凹坑；\n· 反复拆装后孔径扩大，彻底失效；\n· 无法承受正反转冲击。\n\n**替代方案**（按优先级）：① 成品带轮自带锥套/张紧套（免键连接，摩擦面大、同心度好）；② 轴肩+轴承定位，带轮只传扭不定位；③ 键槽/花键（要加工能力）；④ DD 直驱省掉这一级。\n\n同批意见还有「不要分体式带轮（两片拼合+螺钉夹紧）」——自制分体件等于多一组配合面、多一倍同轴度误差，且「太宽」会增加悬臂弯矩。优先买成品标准带轮。\n\n图：`05_整理成果_大符专题/能量机关审图_带轮顶丝固定不可用_20261109.png`","s":"飞书文档《27能量机关审图》高荣信意见 4/5/6","k":"auto"},{"i":"K0665","t":"L 型钣金靠橡胶套摩擦固定被否：摩擦连接不能做承力主连接","c":"经验避坑","b":"原设计：「黑色橡胶套的宽度略大于 L 型钣金和盖板距离，通过橡胶变形的压力和与盖板之间较大的摩擦力固定」。\n\n2026-11-09 20:23 林创武当场否掉：「靠摩擦力吗？感觉这种连接好不可靠的样子，换一种吧。」\n\n**为什么不可靠**：\n· 没有正向止挡，载荷方向一变就靠摩擦系数硬扛；\n· 橡胶压缩量会随振动、温升、反复拆装衰减（应力松弛）；\n· 橡胶老化后摩擦系数和弹性同时下降，属于「装得上、跑不住」；\n· 失效是渐进的，赛前检查看不出来。\n\n**判据**：凡是靠摩擦/过盈承担主载荷的连接，必须至少补一个机械止挡（卡扣、螺钉、销、合页），摩擦只能做防松、减振、消隙的辅助手段。","s":"27炒鸡大符群 2026-11-09 20:23–20:28；对应《27能量机关审图》钟自豪答复 2","k":"auto"},{"i":"K0666","t":"能量机关靶子总装的零件级 BOM：合页×5、橡胶套、9.5mm 钢珠","c":"结构设计","b":"从钟自豪 2026-11-09 20:28 的 SW 特征树（`靶子V1.0-S0-钟自豪-202621520229.SLDASM`）读出的零件清单，可当靶子装配的骨架：\n\n**检测模块叠层**（与官方九层结构对应）：靶面 → 10mm PC 板 → 分光板 → LED 灯板 → 灯罩 → 1mm 软胶 → 压感传感器；\n**结构件**：合页 ×5（对应五片扇叶可拆卸）、L 型卡扣、橡胶套、钢珠 9.5mm（多颗，用于定位/减摩）；另有「快拆弹簧-钟自」自定义件。\n\n**两个可直接用的判断**：\n· 合页 ×5 正好对上「五块扇叶做可拆卸结构」这条需求，说明扇叶是用合页+卡扣实现翻转而非整片拆下；\n· 9.5mm 钢珠大概率做四点/多点浮动定位或滚动减摩，成本极低但要注意保持架——散放会掉。\n\n另：装配体文件名仍是 `202621520229`（日期笔误），命名规范关还没过。\n\n图：`05_整理成果_大符专题/能量机关靶子总装_钟自豪_零件特征树_20261109.png`","s":"27炒鸡大符群 2026-11-09 20:28 截图","k":"auto"},{"i":"K0667","t":"能量机关盖板：ABS 塑料板 + 板材原厂辊压花","c":"材料板材","b":"审图中被问「这个盖板是什么材料，什么工艺做的」，答复：**ABS 塑料板，板材原厂辊压花**。\n\n· ABS 板：易 CNC/激光切割、韧性好、成本低、可粘接，适合非承力盖板与外观件；缺点是不耐 UV（户外会黄变）、耐温低（约 80℃ 软化）、刚度差需加筋或加厚。\n· **辊压花**是板材出厂时压出的表面纹理，不是后道加工——采购时直接选带纹理的板，省一道工序和一笔表面处理费。\n\n选材逻辑：盖板只要挡屑、挡光、遮丑，不必上铝板/CNC；重量和成本都能降一个量级。","s":"飞书文档《27能量机关审图》钟自豪答复 3","k":"auto"},{"i":"K0668","t":"能量机关四条需求优先级（文档落定版，即验收顺序）","c":"赛事场地","b":"《27能量机关审图》开头把优先级写成文档，与 11-07 王奇英口述的四条一致，这是第一次成文：\n\n1. **更换新靶子（传感器）**\n2. **五块扇叶做可拆卸结构**，要保证可用性\n3. **r 标突出、仿制官方**\n4. **轻量化**\n\n用法：评审时按这个顺序问，前一条不满足就不往后看；「要保证可用性」是对第 2 条的附加约束——可拆不能拆到装不回去/装回去不准。","s":"飞书文档《27能量机关审图》开头；27炒鸡大符 2026-11-07 王奇英","k":"auto"},{"i":"K0669","t":"行星减速箱 1108 称重：成品二级行星轮 11.58g，整机 SW 只算 315g","c":"经验避坑","b":"2026-11-08 行星减速箱研发日志新增「称重各物品质量」：\n\n· 0.6 模、一级 40 齿变位 −0.33 / 二级 10 齿变位 +0.33 的**单个成品二级行星齿轮 = 11.58g**；\n· 整机「SW 里显示才 315g 左右.....」——注意这个「才」字，说明 SW 质量属性估算**低于实物**；\n· 参宿配套的包胶轮 **16.79g**（与上交版本略有区别：圆圈镂空没有和轮毂外圈铝合金墙相切）。\n\n**可复用的教训**：SolidWorks 的质量属性默认按几何体积×密度算，一旦有（a）未建模的倒角/圆角、（b）简化掉的螺纹、（c）不同牌号的实际密度差异、（d）表面处理层，误差就会累积；**减重指标必须以实物称重为准，SW 数字只能做相对比较**。文档里已补一个「成品行星齿轮购买链接」（淘宝），意味着这一级可以买成品替代自制。","s":"知识库·行星减速箱研发日志（In34wmSjBiBqLMkQvz8cvCYAnnc）1108 节","k":"auto"},{"i":"K0670","t":"参宿 vs 昴宿铝合金成本只差 25 元：主导项是输出端加工工时","c":"加工工艺","b":"2026-11-09 新增「1109 参宿和昴宿 铝合金成本对比」，结论一句话：「二者和相差无几」，只是**输出端加工复杂度不一样导致铨洲加工时间不一样，进而使得价格相差 25 元，其他部分价格相同**。\n\n报价单关键行（4 个铝件）：编号 88739477 单价 36.8 元、总价 184.00 元；88739479 单价 9.8 元、总价 9.8 元；采购申请里另有数量 48.48、单价 207.20 元的条目。\n\n**方法论**：CNC 报价 ≈ 材料费 + 工时费，而工时费由**特征数量**（台阶、清角、内腔、螺纹、表面处理）决定，不由零件外形尺寸决定。所以「改结构降成本」要改的是特征复杂度，不是体积；两个方案总价接近时，选**加工特征少、公差松、装夹次数少**的那个——它便宜在返工率上。","s":"知识库·行星减速箱研发日志 1109 节（含采购单与报价截图）","k":"auto"},{"i":"K0671","t":"参宿配套包胶轮 16.79g：镂空未与轮毂外圈墙相切","c":"结构设计","b":"行星减速箱研发日志 1108 记的细节：参宿配套包胶轮称重 16.79g，「但是和交的有略微区别，即圆圈镂空没有和轮毂外圈铝合金墙相切」。\n\n**这句话的技术含义**：轮辐上的减重镂空圆，理想做法是**外缘与轮毂外圈内壁相切**——这样镂空之间留下的「辐条」是等宽的连续材料，受力路径短、应力集中小；如果镂空没有切到外墙，就会在外圈留下一圈薄壁环，这圈环既不承力又占重量，还容易在压装包胶时变形。\n\n**判据**：减重镂空要么切到边界（把环变成辐），要么留足壁厚做承力环，中间状态最差。","s":"知识库·行星减速箱研发日志 1108 节","k":"auto"},{"i":"K0672","t":"机械组实践作业：11-11 23:59 前提交（飞书表格《机械组实践作业提交》）","c":"队伍制度","b":"2026-11-08 23:36 林创武在 27机械组 与 27机械组通知群 同步发通知：\n\n「https://vcnc8bq9w1le.feishu.cn/wiki/MFfKwrD1AinBYQkQ230cJzcGnGd」「**新人务必在下周三（11.11）23：59 前提交**」\n\n该链接解析为知识库节点《机械组实践作业提交》，obj_type=**sheet**（电子表格，space 7548321424646553619）。\n\n**未取到内容**：本机 lark-cli 缺 `sheets:spreadsheet:read` 与 `docs:document:export` 两个 scope，表格正文（作业清单/提交字段）读不到，只能确认标题与截止时间。需要人工打开表格看具体要求，或给 CLI 补授权后重抓。","s":"27机械组 + 27机械组通知群 2026-11-08 23:36 林创武","k":"auto"},{"i":"K0673","t":"操作手考核不得挤占研发进度，否则直接取消资格","c":"队伍制度","b":"2026-11-08 21:49 谭嘉豪在「我能当操作手？」群明确两条：\n\n· 「**禁止以操作手考核为由拖延研发进度，否则直接取消资格**」——操作手训练与研发冲突时，研发优先；\n· 「组排录屏需要每个人上传各自的视角」——组排（团队对抗训练）必须每人自留第一视角录屏并上传，用于复盘与考核。\n\n对机械组的直接影响：组排时间不能当作「可以不交图纸」的理由；图纸节点与训练时间冲突时按前一条处理。","s":"我能当操作手？群 2026-11-08 21:49–21:59 谭嘉豪","k":"auto"},{"i":"K0674","t":"审图群接收范围扩大：各兵种有进度都可发","c":"图纸规范","b":"2026-11-09 02:43 林创武在 27神图群：「其他兵种有相应进度也可以发了」。\n\n即「神图群」从「大符专项审图」扩为**全兵种图纸/进度收口**。配合 11-07 的命名规范公告（装配体 `V1.0-Sn-姓名-日期`、零件 `名称（尺寸）-姓名-日期`，n=T 才可发加工），提交流程现在是：\n\n1. 各兵种把装配体+零件**打包 zip**（不要用飞书「文件夹」上传，那种类型 CLI 与预览都取不到，只能在线看）；\n2. 发到 27神图群，命名带版本级 Sn 与姓名日期；\n3. 场地道具组周会前必须交一次。","s":"27神图群 2026-11-09 02:43 林创武","k":"auto"},{"i":"K0675","t":"GM6020 云台电机：官方模型与参数入口","c":"标准件紧固","b":"2026-11-09 20:34 尹嘉玮在 27机械组 问「有没有带 GM6020 电机的模型，GM6020 应该怎么用？怎么装配」，林创武给的答复是官方产品页：\n\nhttps://www.robomaster.com/zh-CN/products/components/general/gm6020\n\n**要点**（官方口径）：GM6020 是**关节电机/云台电机**，内置驱动器与编码器，转子直接输出（无减速箱），因此：\n· 装配上是「定子固定在机架、转子直接连负载」，不需要另配联轴器；\n· 模型要到官方产品页/官方资料下载区取 STEP，不要自己在 SW 里画近似体；\n· 走 CAN 总线控制，机械侧只需保证**轴向不承受电机自重**（大质量负载要另设轴承支撑，不能只靠电机轴承）。\n\n同页还有 M3508/M2006 等全系组件参数，是选型时最省事的入口。","s":"27机械组 2026-11-09 20:34–20:40","k":"auto"},{"i":"K0676","t":"工训物流小车升降滑台装配教程（导轨/铝型材/步进电机）","c":"案例开源","b":"钟自豪 2026-11-09 12:18 在大符群贴的参考视频：B 站《【2027工训物流小车】升降滑台装配①：导轨、铝型材与步进电机安装》 https://b23.tv/oSq2CX3\n\n**看它的价值**：工训赛（工程训练综合能力竞赛）的物流小车与我们的大符升降需求高度同构——都是「铝型材立柱 + 直线导向 + 电机驱动 + 有限行程」，且工训队的公开资料远比 RM 队多。重点看三处：\n1. 导轨/滑块与型材的连接件选型（角码、转接板厚度）；\n2. 步进电机与丝杆/同步带的同轴度处理；\n3. 装配顺序（先装导向再装驱动，否则会憋死）。\n\n**反面用途**：这条视频演示的正是「导轨装在型材上」的做法，而当天下午林创武的结论是这种做法在能量机关上冗余且难维护（T 型螺母问题），看的时候要带着这个前提。","s":"27炒鸡大符群 2026-11-09 12:18 钟自豪","k":"auto"},{"i":"K0677","t":"重装组新增「机械臂」章节：指向《机械臂负载测试》（线索待补抓）","c":"其他","b":"2026-11-08 知识库《2027重装组研发文档》新增一级标题「# 机械臂」，正文只有一行日期与一个内嵌文档引用：\n\n`<cite doc-id=\"VnnTwhO9KioyRrq2lIck6TvnHc\" file-type=\"wiki\" title=\"机械臂负载测试\">`\n\n**抓取失败**：`docs +fetch` 报 \"Invalid document_id or document not found\"，`wiki +node-get` 报 131013 \"token is invalid\"。两种入口都取不到，判断是该文档不在当前账号可访问的 wiki 空间内（或已迁移）。**未编造内容**，仅记录线索：\n\n· 重装组要做的机械臂已经在做**负载测试**，说明到了验证阶段，不只是在画图；\n· 负载测试通常测三样：额定/峰值负载下的挠度、关节回差（背隙）、连续运行温升——这三项是机械臂能不能上场的真正门槛。\n\n需要重装组本人分享链接或导出 PDF 才能补全。","s":"知识库·2027重装组研发文档（LAgywaWYJiHJb0kKdjZczjIWnRb）2026-11-08 新增章节","k":"auto"},{"i":"K0678","t":"诺丁汉大学联队《机械组入门教程05·轴承与轴系》：从四类载荷到套圈定位的完整设计法","c":"标准件紧固","b":"约万字图文教程，把轴系拆成四步：先分径向力、轴向力、倾覆力矩、驱动扭矩四类载荷；再讲深沟球（608/6001/6204 型号怎么读）、角接触（DB/DF/DT 配对与压力中心）、交叉滚子、平面推力、推力滚针各自的承载边界；最后落到套圈由谁定位——轴肩、端盖、锁母、隔套各挡哪个圈。可直接借用的判断法：装配发紧先看变化发生在哪一步（入座孔／锁螺母／锁工作台），比怀疑轴承质量有效；端盖一拧就紧，多半是夹紧回路跨过了相对转动界面，或轴肩圆角顶住了轴承倒角。压装力必须作用在紧配合的那个套圈上。","s":"来源·BBS 1983525","k":"auto"},{"i":"K0679","t":"南京师范大学中北学院沧隼战队：4款电机的17mm径向拨盘机械开源（MG4005为主测版）","c":"传动机构","b":"一套径向拨弹盘共 4 款：MG4010、MG4005（主测并已上机）、另两款为后续衍生改款，M2006 版未上机实测，作者也坦言很少有队伍用该电机驱拨盘。核心是卡弹解决思路，作者称旧结构卡弹是老问题，靠近一个月实测迭代、且在省赛区域赛后继续优化才收敛，并附 30Hz 连发测试视频。可借鉴的是同一套拨盘覆盖四种电机的选型面，以及改图几分钟、打印一整天、上机两分钟就暴露新问题的迭代节奏。文件走百度网盘 pwd 5uth，站内无直链。","s":"来源·BBS 1976414","k":"auto"},{"i":"K0680","t":"SolidWorks宏插件 SwToGy：零件一键导出并推送铨洲智造自动报价","c":"加工工艺","b":"一个 SW 宏（0.92MB，含安装与使用说明），批量把零件导成 STEP 并直接送到铨洲智造网页端排队报价，省掉逐个另存 STEP 的重复劳动。作者原话是导 step 导破防了才让人写的。可借鉴点是把出图到报价这一环脚本化，几十个零件一次跑完，反复比价时尤其省事；同类思路可套到其他在线加工平台。帖内另推荐了同一位 UP 主的一键导入切片插件。","s":"来源·BBS 1982836","k":"auto"},{"i":"K0681","t":"西电IRobot：jetson Orin NX 达妙载板铝合金外壳（铨洲CNC，单套104元）","c":"加工工艺","b":"起因是队里唯一一块 Orin NX 被翻车的登岛底盘砸烂，于是放弃打印件改铨洲 CNC 铝壳；给了达妙载板与合众恒跃载板两版 SW 图纸，孔位可自行改。成本口径很实：不含天线铝柱螺丝，单套 104 元，不做阳极氧化可压到 100 以内；作者强推黑色阳极氧化，一是质感，二是疑似防静电（有队伍被静电打坏板子）。可借鉴的是用在线 CNC 平台做小批量结构件的完整成本账，以及载板类零件固定孔位按实物配打即可的实用态度。","s":"来源·BBS 1987247","k":"auto"},{"i":"K0682","t":"西电IRobot：手持装甲板二代（全3D打印外壳，单个成本约25元）","c":"加工工艺","b":"手持装甲板全套外壳模型（47.3MB）。壳体全 3D 打印，灯条均光罩直接用白色料打；实测 ABS 高密度打印可直接承受击打，但打多了会烂，若击打量大建议直接 CNC 一块面板。后壳四个孔可穿绳、凸台用于粘电池，红色圈是四个热熔螺母位，孔径不合需自改。做五个除电池外约 25 元一个。可借鉴的是自制击打靶与调试靶的低成本路径，以及打印件够用就不上机加的取舍。","s":"来源·BBS 1987398","k":"auto"},{"i":"K0683","t":"西电IRobot：双6020测试小云台开源（专供视觉测试与入队考核）","c":"结构设计","b":"两个 6020 搭的极简测试云台，整机只挂一块 C 板、一个工业相机和一个红点，专用于视觉调试与入队考核，避免拿上场车当测试台。作者自评毫无技术含量，价值恰在定位：把能转、能装相机、能出图的最小云台做成标准件，新队员照着装就能练。帖内只有图片和说明，未见站内附件直链，模型需向作者索取。","s":"来源·BBS 1987406","k":"auto"},{"i":"K0684","t":"RM2027 无源重装连接器 V0.9：弹簧销+预压点自锁的发射机构快换接口","c":"结构设计","b":"上下对接孔位一致的纯机械快换接口：插入时红圈机构下压黄圈预压点，蓝色弹簧销失去阻挡后释放、穿过对侧销孔完成锁定；向外拉两侧弹簧销即可拆头。作者定位为在26赛季英雄 Yaw 轴上插入该机构即可满足27赛季重装发射需求。帖内明写该版本有问题，只参考思路不参考细节，并给了三条踩坑：弹簧触点除最大电流还有最大电压限制（24V 触点体积远大于 5V/12V）、小弹簧要确认圈数否则最小压缩态干涉、铨洲做精密配合精度不够且卡榫件应用带镀层光面钢件。","s":"来源·BBS 1976888","k":"auto"},{"i":"K0685","t":"福建师大PKA：奶龙造型定位模块外壳（孔位与官方模块一致）","c":"结构设计","b":"官方定位模块的奶龙 IP 造型替换外壳，大小孔位与官方模型一致，可 M3 直接攻丝或埋热熔螺母固定；4 层墙加 52% 网格填充后约 42.3g，接近官方模块重量。黄色料需调冲刷比例。可借鉴的是外观件照抄官方接口尺寸、只改外形的做法——既满足宣传与 IP 需求，又不影响装配和检录；也提醒打印墙数与填充率是复现重量的关键变量，别只改模型不看参数。","s":"来源·BBS 1978075","k":"auto"},{"i":"K0686","t":"东北农大TCP：四路应变桥自制装甲板（可粗定位击打点，四块串成无线靶车）","c":"赛事场地","b":"因完整形态考核早于裁判系统发放、贴复写纸又干扰自瞄，做了一块替代装甲板：RGB 灯可换色，四角各一个应变桥配 INA828 仪表放大器和 STM32F103 采 ADC，靠压力脉冲持续时间区分击打与碰撞，并借四角受力不均粗算命中位置；支持 24V、Type-C、内置电池三种供电，板载 CAN 回传击打数据。外壳打印能硬抗上百发，板面铨洲单件 11.8 元。不足也写明：HX711 仅 80Hz 抓不到脉冲、DCDC 3A 与 2A 充电同时工作发热严重、地未分割致底噪、CAN ID 烧死不能自动分配。四块串起来即无线遥控靶车。","s":"来源·BBS 1985479","k":"auto"},{"i":"K0687","t":"盐城工学院SaltWave：可白嫖嘉立创的PCB盘式滑环（12路，总厚仅2.7mm）","c":"传动机构","b":"用 PCB 代替成品盘式滑环：弹片选吉林大学开源的电池弹片 bc-21-6p-170（1.27 间距、6 路），两排拼 12 路（CAN 2、云台 2、发射 2、miniPC 2、裁判系统 4），实测过流大于 5A 且导通内阻低；弹片自由高 3.12mm、极限压缩 2.1mm，配 1.6mm 板厚后总高压到 2.7mm、压缩量 0.42mm，涂润滑脂防磨。铝件共 175 元，喷锡可白嫖。提醒：对机械安装精度要求很高，铨洲件要留公差余量，机械与硬件必须一起对尺寸。","s":"来源·BBS 1889999","k":"auto"},{"i":"K0688","t":"桂林理工群星：步兵/哨兵云台滑环集线板（GX16航空头藏焊点+环氧灌封）","c":"装配维护","b":"解决滑环线对线焊接不可靠的走线方案：把 15 路（裁判系统航空线4、串口3、Ammo-Booster 2、Gimbal 2、miniPC 2、用户CAN 2）全部收进 GX16-10 航空插头端子内并环氧灌封，焊点受拉也不脱；拆云台只拧底盘侧航空头，换滑环再拧云台侧。发现点是 GX16 恰好能穿过 GM6020 中空孔，比 M12 便宜且过流强。缺点直说：体积变大。可借鉴的是把焊点全部收进连接器这一可靠性思路，以及赛前多做几组滑环当备件。","s":"来源·BBS 811243","k":"auto"},{"i":"K0689","t":"南航长空御风：中空大滑环开源（内径可容6020，电源信号分道，实测20A/5A）","c":"传动机构","b":"为压缩哨兵厚度而做：滑环内径大到能塞进一个 6020，6020 中空再穿 17mm 弹丸，结构极简。与传统每根线一样粗不同，把电源线与信号线分道——电源道电刷面积大，实测过 20A，信号道过 5A（CAN、USART、485 可用，USB2.0 未测，USB3.0 明确不行）。可靠性用自制 15 通道断路检测模块连续跑两小时验证，震动跌落后无影响。电刷材料给了黄铜、磷铜、铍青铜的导电性、弹性、价格三角对比。可借鉴分道设计与断路计数这套验证方法。","s":"来源·BBS 11431","k":"auto"},{"i":"K0690","t":"南方科技大学Raiders：第四代下供弹拨弹机构（14发/秒，32页设计文档）","c":"案例开源","b":"一份把卡弹讲透的开源：第四代下供弹拨弹机构，五齿拨弹轮稳定 14 发每秒、实弹同速，结构含分隔弹仓（隔板防弹丸堆叠）、预排弹管、预旋转、LOM 一体导向片，以及实测筛出的不卡弹拨弹轮曲线，另有梳型拨弹轮方案。文档 32 页约 1.5 万字，从拨弹轮入门讲到逐项排除卡弹。可借鉴的是把卡弹拆成弹丸姿态、拨孔、出口边沿三段定位问题，并用长时间循环拨弹统计卡弹率来验收，而不是靠单次试打。站内可直接下 PDF 与模型包。","s":"来源·BBS 6373","k":"auto"},{"i":"K0691","t":"技术干货《浅谈步兵云台设计》：上/下/半下供弹取舍与90°弯管实测参数","c":"基础理论","b":"把云台设计拆成供弹方式、驱动方式、拨弹三块。上供弹重心高但链路短；下供弹要处理重心与弯管阻力，弯管数量尽量少、管内加轴承；半下供弹（弹仓随 yaw 不随 pitch）可降云台高度、减轻 pitch 负担。给了一个 3D 打印 90° 弯管的实测参数（内径2外径5的小轴承），并强调弯道曲率越大、轴承位置越准越不易卡弹，过高过低都会卡。还提醒传动选型越简单越好：同步带防跳齿、齿轮看间隙、连杆注意干涉角与装配误差；有角度要求必须做机械限位。","s":"来源·BBS 5195","k":"auto"},{"i":"K0692","t":"北京理工大学DreamChaser：RM2021 中心供弹英雄机械开源（横臂/纵臂悬挂两版）","c":"案例开源","b":"英雄机器人整机机械开源，含两版底盘：分区赛的横臂悬挂加标准型滑环、全国技术交流的纵臂悬挂加定制滑环，另有中心供弹结构技术文档、青年工程师大会答辩 PPT 与视频资料。作者自评这版拨盘会有点卡，并说明后续迭代转到北信科的开源里——这条自评比图纸更有用，等于提前告诉你哪些地方不要照抄。文件走百度网盘 pwd HERO，站内无直链。","s":"来源·BBS 7467","k":"auto"},{"i":"K0693","t":"香港科技大学ENTERPRIZE：RM2025 中供弹过洞舵轮英雄（Yaw轴压到33.4mm）","c":"案例开源","b":"过洞构型的完整思路：Yaw 轴用交叉滚子轴承、5M 同步轮加中空滑环套小滑环，把转轴高度压到 33.4mm，与车架铝方管齐平；MG8016 大扭矩曾使同步轮轴系产生较大偏转扭矩，改用全 CNC 轴系解决；同步带涨紧用双边 MGN12 滑轨加两根 M4 对拉电机轴系，便于检查与调整。云台为八边形榫卯结构保刚性，中心供弹加鹅颈链路直径压到约 200mm，pitch 用一根无阻尼气弹簧做重力补偿并与 UWB 连杆合并省空间。借鉴点集中在高度受限时怎么把轴系做扁。","s":"来源·BBS 761377","k":"auto"},{"i":"K0694","t":"合肥工业大学苍穹：桌面级串联轮腿调试平台 ML1.0（全车无CNC，成本约200元）","c":"结构设计","b":"为想上轮腿但电控没经验的队伍做的降风险平台：轮距 283mm、轮径 84mm、约 4kg，材料为环氧板、玻纤板、PLA 与橡胶，除电机板材外约 200 元，设计寿命约 3 个月。构型参考上交开源。细节很实用：靠同步轮中心距张紧，5M×305×6 同步带实测无需另加张紧；轮子用雕刻机换双刃铣刀铣 75HA 橡胶块，单轮压到 4 元；大量对锁螺丝做轴向定位与抗剪但无防松，须打螺丝胶；同步轮处螺丝改沉头并打沉头孔。作者明确警告连杆轴系轴向承载有限，不可作为上场轮腿轴系参考。","s":"来源·BBS 815703","k":"auto"},{"i":"K0695","t":"东华大学DIODE：17mm 单发限位（被动预置）——用压簧轴承组治射击散布","c":"传动机构","b":"针对弹丸与摩擦轮接触位置每次不同导致散布的对策：用压簧轴承组在弹丸进入摩擦轮前把它压到固定位置，只在弹簧压力最大时才与摩擦轮接触发射。结构是类三叶草型限位组——上方两个轴承加底部一个轴承三点压缩，弹簧组朝向向内保证受力稳定。给了两套模型，其中一包是可直接下单的 STEP。可借鉴的是把散布归因到接触位置一致性而非摩擦轮本身这条诊断路径；作者提醒模型参数敏感、直接打开易报错，务必按设计参数核对。","s":"来源·BBS 1634355","k":"auto"},{"i":"K0696","t":"五邑大学IMCA：RM2025 过洞舵轮工程机器人（双Yaw铣件+小Yaw嵌套滑环）","c":"案例开源","b":"备车思路：放弃上台阶、换高机动过洞舵轮，云台参考上交双 Yaw 但把铣件做得更小更轻，小 Yaw 用嵌套滑环给机械臂扩硬件；实测可稳定过隧道、下二级台阶、一键取双银矿与金矿。作者把三个问题写在明面上：UWB 联动同步带轮齿数太小且张紧不到位，机械臂快动时跳齿；慢速过洞易卡导轮，需一定速度才上得去；臂长不足。这三条正好是舵轮工程车的高频故障清单。整包 366MB，走站内附件，本轮因单次体积预算未下载。","s":"来源·BBS 1935780","k":"auto"},{"i":"K0697","t":"中国科学技术大学林鹏飞：工程机器人「框架法」设计方法（RM AWARD 2024）","c":"基础理论","b":"一套给新队员的快速设计法：先用自顶向下搭框架——定各模块尺寸、关键件布局、模块间耦合方式与走线通道，再按框架限制逐模块做自底向上细设计。理由是工程车机构变形多，直接模块化极易出现模块干涉、耦合接不上、零件没位置安放。文中对比两种建模方式：自底向上改单件不影响其他件，但复杂连接件费时且易埋隐蔽干涉；自顶向下改母件自动联动，但大量在位配合会让设计树崩溃。作者的做法是混合：车体框架件单独画再装配，无关紧要的连接板在装配体里直接设计。","s":"来源·BBS 22095","k":"auto"},{"i":"K0698","t":"中国石油大学(华东)：RM2024 工程机器人臂架轴系与同步带跳齿复盘","c":"经验避坑","b":"讲机械臂三段轴系的真实取舍：第一段用两组平行四边形连杆加 CNC 铝件保持前端竖直；第二段轴系串了 5 个轴承（交叉滚子、深沟球、两个法兰轴承、交叉滚子），主要靠交叉滚子与深沟球承受同步带张紧径向力带来的弯矩。关键教训是同步带跳齿——按软件算的长度还要再减一个齿，装得很难但装上仍跳，最后加张紧才解决；另一处把深沟球换成交叉滚子才消除长时间弯矩下的轴系松动，原因是深沟球轴向承载仅约径向的 30%。还劝退了一个方案：模仿上交的锥齿轮差速关节，实测锥齿轮磨损极严重、前端 2006 扭矩不足、装配无法复现 SW 且有空程。","s":"来源·BBS 43545","k":"auto"},{"i":"K0699","t":"大符扇叶做可拆卸后，接线要不要同步做快拆（本轮未定论）","c":"结构设计","b":"钟自豪 11-10 21:23 提出：扇叶既然要做成可拆卸结构，拆的时候接线也得拆，是不是要给接线做快拆。植正雄答“理论上要”，但补了两句“可行性怎么样”“问问硬件”（大符硬件负责人当时没点名），截至本次巡检没有结论。技术要点：五片可拆卸扇叶若沿用固定走线，每次拆装都要拔插端子并重新理线，拆装工时从“拧螺丝”变成“拧螺丝＋插拔＋理线”，而反复插拔本身是电气接触失效的高发点；若做快拆，应选可盲插的接口并把线缆做成带余量的“服务环”，避免拆装时直接扯焊点。与 K0435（大符运输三条路线，含拆五片快拆）、K0439（叶片三类孔：结构孔／扎带保险孔／电控板孔）是同一条线上的问题。","s":"群聊·27炒鸡大符 2026-11-10 21:23-21:26","k":"auto"},{"i":"K0700","t":"PETG 队内实测评级：能用但不划算，PLA 仍是主力，关键变量是受潮","c":"材料板材","b":"27机械组 11-10 16:39–17:18 一场约 40 分钟的讨论，把“PETG 便宜”这句手册速查（K0392）落到了队内实际。用量：机械组“用得少”（钟炜熙），主力仍是 PLA，理由是 PLA 方便稳定。判定分歧：钟炜熙“不好用、好难打”；岑文锋、梁雍淇认为“还行”；植正雄原本想采购 20 元/卷的半价拓竹 PETG（林创武贴出半价页），最后被“难打”劝退。症结不在材料本身而在含水：不烘干极易炒面；刚拆封的好打，一放久就不行；王奇英定调“PETG 最好每次打印前都烘干，很容易受潮影响”。其它差异：打印时间比 PLA 长；支撑明显更难拆。采购建议：买便宜 PETG 前先确认有可用烘干设备（队里那台长驻 TPU、只能勉强够用），否则省下的料钱会赔在废件和返工上。","s":"群聊·27机械组 2026-11-10 16:39-17:18","k":"auto"},{"i":"K0701","t":"PETG 受潮的失效链：小气泡→局部欠填→打歪→炒面","c":"经验避坑","b":"刘俊锋 11-10 17:10 给出的因果链比“受潮就会炒面”这句经验更可诊断：PETG 吸水后，水汽在喷嘴内闪蒸，挤出物局部形成形状不规则的小气泡（外观是表面坑坑洼洼）；气泡处挤出量不足导致该层局部欠填；欠填累积到一定程度模型在那一处“打歪”，喷嘴刮到翘起的料，才演变成炒面。判别要点：①气泡是“不规则”的，区别于拉丝（连续细丝）与欠挤出（整层偏薄）；②位置无规律、同参数同卷料时好时坏——这正是梁雍淇“刚拆封也会随机不好打”的原因；③处置顺序应“先烘干再看参数”，不要一上来改温度和回抽。防潮下限做法（刘俊锋实测）：拆封后放两包干燥剂，国赛拆封的料直接搁大纸箱里，近期打都没事——不必烘到很干，但必须与空气隔离。","s":"群聊·27机械组 2026-11-10 17:10-17:18","k":"auto"},{"i":"K0702","t":"打印支撑难拆的调参顺序：先选类型，再调密度、Z 距离与悬垂角","c":"加工工艺","b":"潘智杰 11-10 18:32 抱怨“支撑很难拆”（承接 PETG 话题，PETG 支撑比 PLA 更难剥离）。刘俊锋反问“网上那种调支撑参数行不行”，并类比“跟用完透明胶要清胶一样”——即残留是常态，不是失败。植正雄给出可执行顺序：不是笼统“调参数”，而是先选支撑类型（树状／线性／有机），再调支撑密度、接触面 Z 距离、悬垂角阈值；判断标准是“有解决办法”，不是“打不出来”。王奇英补“学一学就好了”，并提示“有一些抖音教的是对的”——外部教程可用但要筛。本条只记队内口径，未给具体数值，需按打印机实际切片验证。","s":"群聊·27机械组 2026-11-10 18:32-18:36","k":"auto"},{"i":"K0703","t":"耗材防潮设施现状：AMS 长期闲置，烘干机被 TPU 长驻","c":"加工工艺","b":"11-10 讨论里最实用的一句常识出自植正雄：“AMS 就是用来防潮的”，并指出队里“没人用 AMS，这个会导致很多问题”；钟炜熙回应“机械组人均素质不足以达成”，随即自嘲“像我这种素质高的每次进料前甚至会设好品牌颜色耗材类型”——玩笑背后是真问题：AMS 的价值不只是多色，而是把耗材封在干燥环境里并记录品牌／颜色／类型，减少“这卷是什么料、放了多久”的误判。设备现状：唯一一台烘干机“一般都长驻 TPU”，对 PETG 只能算勉强够用。落地建议：即便不做多色，也应把 AMS 或独立干燥箱当默认存放位；换料时顺手设好材料类型，比事后猜参数便宜得多。","s":"群聊·27机械组 2026-11-10 16:46-16:56","k":"auto"},{"i":"K0704","t":"机场 2.0（钟坤霖）：升降改成剪叉机构，归中仍是齿轮齿条","c":"案例开源","b":"11-10 18:35 提交的 机场2.0-S1-钟坤霖-20261110.zip（63.2MB，内层 50 个文件）显示升降方案又换了一路。升降：剪叉机构（剪叉臂、剪叉传动轴、剪叉滑轨连接、剪叉机构底板、剪叉轴承座1），导向用 MGN7 滑块滑轨 60mm／65mm 两套，端部用鱼眼接头 m2 吸收角度偏差，动力为 JGY-370 减速电机＋联轴器 D6，配 1 模齿条 100mm 推动。归中：齿轮齿条，圆柱齿轮 20×2 与 40×1 配 GB 标准齿条（2M 20PA 8FW 15PH 100L），归中栏杆 01／02 双侧，另有推杆连接 01/02/04 与垫板，说明推杆路径仍保留。结构：平台单体 4.0／平台底板／平台地板／机场底座／L 型角码／m2 铝柱系列；电池沿用 2020-10-19[3.0]-24 的四分体电池模型（2020 年老件，需核对是否与现用电池同尺寸）。与此前图评会文档里“皮带传动＋曲柄杆推平台”“步进电机＋对置双齿条”两版相比，这版把升降改成剪叉——优点是行程大、可纯机械自锁，代价是铰点多、框量累积，MGN7 与鱼眼接头正是为压框量加的。","s":"27神图群 2026-11-10 18:35 ｜ 图纸 04_往年图纸与代码/机场2.0_钟坤霖_20261110.zip","k":"auto"},{"i":"K0705","t":"制导镖 V1.5（周昱翔）：舵面气动控制＋视觉，碳板／CNC／钣金三拼工艺","c":"案例开源","b":"11-10 19:52 提交 制导镖V1.5-S1-周昱翔-20261110.zip（206MB，21 件）。构型与队内以往“摩擦轮／拉簧发射的直飞镖”完全不同，是一枚自带气动控制面的滑翔镖。控制：PTK 舵机＋ptk5.5g 舵机单边摇臂驱动“舵面 1.1”，另有“舵面保护 1.1”做舵面止挡／防撞，舵机固定独立成件。感知：5640 相机＋相机固定件，“硬件上缓冲”与“硬件固定板”用于相机／电控板隔振。结构：外壳 1.0、前端 CNC 支撑、后端支撑、直角补强件[钣金]、底座、碳板 1／碳板 2、电池、神秘垫片。总装直接引实物型号：AAA BGM-71陶陶.SLDASM（BGM-71 TOW 陶式）、GUIDED DART(27.1).SLDPRT。可迁移三点：①舵面驱动用 5.5g 级小舵机＋单边摇臂，力矩小但惯量低，适合高速气流下快速修正；②舵面单独做“保护件”而非加厚舵面，是用易换件吸收着陆／装填冲击；③碳板承力＋CNC 做接口＋钣金补强，是按“哪种工艺最便宜地满足那一处需求”分工，而非整件统一工艺。参见 K0515（南航长空御风 RM2022：拉簧弹射与制导镖气动解耦）。","s":"27神图群 2026-11-10 19:52 ｜ 图纸 04_往年图纸与代码/制导镖V1.5_周昱翔_20261110.zip","k":"auto"},{"i":"K0706","t":"发射机构 V1.1（刘悦）：加同步带与撞击缓冲，并复用 5 个往年旧件","c":"传动机构","b":"11-09 21:49 提交 发射V1.1-S1-刘悦-20261109.zip（67.6MB，123 件：4 装配体＋116 零件＋3 个 STEP）。相对 V1（K0620：滚珠丝杆＋MGN9 管储能、拉簧 3×18×300＋U 型滑轮组放大行程、跷跷板＋DG995 撒放）的可见增量：①新增同步带路径——同步轮、小带轮面、带轮、钢丝带、同步带挡板、前／后同步轮固定板 4mm（15 宽），即多了一路带传动，用于拉簧预紧或行程放大；②新增“撞击缓冲 tpu”与撒放器舵机固定，撒放端从“跷跷板耳朵”升级为“跷跷板耳朵 V2”；③结构主件：发射铝管 850、前／后板 5mm、铝方管 850（20×20×1 与 ×2）、滑轮组板 6mm、滑轮组滑轮座（CNC）、拉簧板前／后 4mm 及对应垫高件。④直接复用 5 个往年件：王奇英 BK 0 轴承座／滚珠丝杆 260／滚珠丝杆螺母座（2025-09-24）、许可岳 滑台（2025 版）、江慧 2024008-BF0 支撑座（2024 件）。判读：V1.1 是“补短板”版本——带传动补行程与预紧、TPU 缓冲补撞击、旧件复用压成本与工期；代价是这套机构对 2025 那套镖架的接口有硬依赖。","s":"27神图群 2026-11-09 21:49 ｜ 图纸 04_往年图纸与代码/发射机构V1.1_刘悦_20261109.zip","k":"auto"},{"i":"K0707","t":"本轮图纸命名体检：3 份提交只有 1 份装配体名合规，制导镖包还踩了 GBK 编码坑","c":"图纸规范","b":"11-09～11-10 神图群 3 份提交，按连式命名法（K0580／K0586）体检：①发射V1.1-S1-刘悦-20261109——顶名合规，包内主装配体同名，是唯一做到“包名＝装配体名”的一份；零件层分隔符五种并存（-刘悦-、空格刘悦空格、- 刘悦 -、刘悦空格、空格-刘悦），并有日期笔误：塞打螺丝 3 M2.5 8刘悦 20261.31（20261.31）、机械组-滑台-许可岳-2025062 （261027)（年份只有 5 位）。②机场2.0-S1-钟坤霖-20261110——顶名缺 V；装配体层写成“机场2.0”“平台单体4.0”“剪叉升降”，全不带 S 号／姓名／日期；且包内是嵌套 zip（外层文件夹套一个 zip），解包多一步、易漏件；零件名混用“机械组 钟坤霖 2026 10.03 m3 4mm 厚铝柱”这类空格＋年份两段拆开的写法。③制导镖V1.5-S1-周昱翔-20261110——顶名合规，但两个总装叫 AAA BGM-71陶陶、GUIDED DART(27.1)，与包名完全脱节，等于打开包不知道哪个是交付件；零件统一“名称 周昱翔 20261110”（空格分隔、无尺寸括号）。④编码事故：制导镖包内文件名是 GBK，按 UTF-8 解压全是乱码（╓▄Ω┼╧Φ），跨机或在线预览读不出——交付前应压成 UTF-8 或改用 7z。给组长的话术：包名对不算对，打开包第一眼能不能看出“哪个是总装、谁画的、哪天的”才是标准。","s":"27神图群 2026-11-09～11-10 ｜ 三份提交包解包实测","k":"auto"},{"i":"K0708","t":"重装组对接自由度的正确表述：底盘端是 x／y 平移加 yaw，共 3 个","c":"结构设计","b":"11-10 更新的《2027重装组研发文档》把原来“底盘一端只有两个平移自由度（x 和 y）”改成“只有两个平移自由度（x 和 y）和一个旋转自由度 yaw”。这一字之差改变的是对接策略的推导起点：底盘可以自己转，所以 yaw 是可修正量而不是约束量；真正只能靠对接瞬间固定的是 roll 与 pitch。接文档其余结论即可闭环：v2.0 三个自动上扣“可以修正约 50° 的 yaw 角度偏差和 10mm 的中心轴偏差”，正是把 yaw 当可修正量用；而“倾覆力矩交给中间过弹丸的通道承受”是把 roll／pitch 的约束转嫁给结构件。若仍按“底盘只有 2 自由度”写方案，会错误地要求对接机构自己去吃 yaw，机构白重一个自由度。参见 K0533（自动对接连接机构：把六自由度收敛到只留 z 轴）。","s":"知识库·机械/2027重装组研发文档 2026-11-10 更新","k":"auto"},{"i":"K0709","t":"规则 R50「待发射状态」：储能元件含摩擦轮，场下必须能泄力","c":"赛事场地","b":"《RMUC2027 比赛规则手册 V1.0.0》7.2.2.3 组合系统 R50：除七分钟比赛阶段，飞镖系统不得处于待发射状态；手册明确“待发射状态”指用于给飞镖提供初始动能的储能元件处于拉紧、充气、转动状态，“储能元件包括但不限于皮筋、气缸、摩擦轮”。对机械设计的三条硬约束：①凡用拉簧／皮筋储能的机构（如刘悦发射机构的拉簧 3×18×300＋滑轮组），必须设计可释放／可保险的泄力位置，且操作能在不解体情况下完成；②气缸方案要留放气阀；③摩擦轮方案要能断电停转、不靠摩擦自锁。判罚是口头警告，警告无效则红牌——属于“判罚轻但实际代价大”的条款，真正损失是检录与准备阶段的操作时间。关联 R41：飞镖系统不得向战场外发射飞镖（红牌）。","s":"01_官方规则与规范/比赛规则手册_RMUC2027_V1.0.0.pdf P132（印刷页 131）","k":"auto"},{"i":"K0710","t":"规则 R45／R46：重装机器人抓取道具时最多遮 1 块装甲，分解出的子系统不能离台","c":"赛事场地","b":"两条直接约束重装组对接机构的条款。R45（7.2.2.2 地面机器人）：任何存活机器人不得用自身结构遮挡自身任意装甲模块，也不可遮挡队友超过 1 块；重装机器人抓取或携带可移动道具时，允许被携带道具和相关自身结构遮住其中 1 块自身装甲，且每次可以是不同的一块，但不允许同时遮多块；步兵、哨兵携带道具时不允许遮挡。R46：重装机器人分解为的子系统或单体不得离开工作台。设计含义：①抓取式末端的外形不能包住两块以上装甲，摆位要按“哪一块被遮代价最小”来定，而不是按结构最省事；②“分解后不离台”说明对接与重组发生在工作台及机库附近，对接机构不必考虑野外随地重组，但必须在台面高度与台面边界内完成抓取——这会反过来约束连接机构的高度与侧向伸出行程。关联 R53：一方机器人不可主动攻击对方飞镖发射架、雷达。","s":"01_官方规则与规范/比赛规则手册_RMUC2027_V1.0.0.pdf P131-P132","k":"auto"},{"i":"K0711","t":"《信息检索及提问的艺术》：队内传的检索方法论小册","c":"其他","b":"植正雄 11-10 12:22 在 2027 大群发的 PDF（418KB，已存 机械百科_数据/教程文档/信息检索及提问的艺术_20261110.pdf）。定位不是机械资料，而是“怎么找资料、怎么问问题”的方法论，与本套检索系统（RM 机械百科／大符资料检索）配套使用：先把问题拆成可检索的关键词，再回来查库，命中率会明显高于直接搜整句。本轮仅登记入册，未做逐页提炼，后续值得把它压成一页“检索 checklist”挂到百科首页。","s":"2027大群 2026-11-10 12:22 ｜ 文件已存 机械百科_数据/教程文档/","k":"auto"},{"i":"K0712","t":"「RM圆桌」第七期 抬升机构排排坐：气动/丝杆/滑轨三类抬升的选型问答","c":"传动机构","b":"官方圆桌整理帖，主讲工程机器人抬升机构的三种路线取舍。气动侧给出电磁阀按“比设计口径大一号”选、出气口加限流阀调速、碳纤维气瓶必须配双标恒压阀；丝杆侧强调导向与动力必须分开（直线轴承导向＋丝杆推力），提速可靠同步轮做 2 倍加速或直接买 5 线丝杠；滑车侧建议内 3 外 8 轴承，并预留 M3 螺钉实际外径 2.9 的间隙。另指出月球车上岛易翻车，应把电池、灯柱等重心居中，再用软启软停弥补。","s":"来源·BBS 8035","k":"auto"},{"i":"K0713","t":"「RM圆桌」第三期 底盘稳才有未来：底盘设计流程与三个常见病","c":"结构设计","b":"底盘设计的经典拆解：先列刚性需求（整车尺寸限制、通过角、飞坡时装甲须收缩到轮内保证轮子先触地、电池可插拔、视觉不遮挡）与性能需求（低重心、小簧下质量、大悬架行程、高刚度、装配简单），再画硬件框图布布局。点名三类新手通病：靠加厚板材补刚度而不靠结构形式、用 AB 胶扎带固定传感器、不留线材固定位与更换空间；并强调装配顺序要在图纸阶段定，否则换个传感器要拆大半个车。","s":"来源·BBS 5354","k":"auto"},{"i":"K0714","t":"「RM圆桌」第二期 我们要搞测试：机器人测试该测什么、不测的后果","c":"经验避坑","b":"把“验证机器人功能是否正常、是否稳定”拆成可执行的验证项：逐模块、逐逻辑组合、单一变量对比、边界工况与连续跑机时长，并给出不做测试的典型后果（临场失效、故障无法复现）。可借鉴的是它把测试当成研发环节而非收尾动作的思路，适合直接改成队内自检表模板，尤其适合机械侧的磨损、松动、发热复检项。","s":"来源·BBS 5301","k":"auto"},{"i":"K0715","t":"「RM圆桌」第十一期 肝出你的大车壳：车壳的分件、成型与涂装工序","c":"加工工艺","b":"讲车壳（外观件）怎么做。官方视角说明车壳意义在观赏性与战队辨识度，鼓励找工业设计/美院协作。工艺路线偏手工：以基础板材加热弯、拼接成型，成本低、对曲面精度要求不高，难点在分件划分、快拆设计、不遮挡灯效与传感器。可借鉴的是分件与涂装工序，以及“外观件不要兼做结构件”的边界，不能当承力结构参考。","s":"来源·BBS 5884","k":"auto"},{"i":"K0716","t":"「RM圆桌」第十五期 进化的飞坡：按赛道几何反推车体参数","c":"结构设计","b":"系统讲飞坡：从赛场三条进攻通道的战术意义，到车体要满足的几何条件（通过角、离地间隙、装甲收缩到轮内保证落地时轮子先触地）、悬挂行程与簧下质量控制，再到起跳姿态与落地冲击吸收。可借鉴的是“按赛道几何反推车体参数”的推导方式，以及落地冲击对车架连接与电池固定的附加要求——飞坡车的紧固件与电池仓必须按冲击工况而非静载复核。","s":"来源·BBS 6180","k":"auto"},{"i":"K0717","t":"「RM圆桌」特辑 竞培营工程机器人：H-bot 取弹与岛下六箱实测","c":"案例开源","b":"竞培营工程机器人问答整理，附《工程机器人说明文档》PDF。要点：H-bot 结构相对气缸的取舍——响应不如带磁气缸，但省气量、可精确定位，适合气源紧张的方案；H-bot 复位方式与限位传感器用法；取弹与上岛分别用两个小摄像头按功能切换视角；岛下六箱取弹耗时实测前三箱约 10 秒。适合做工程车取弹机构选型与气路预算的参考。","s":"来源·BBS 5725","k":"auto"},{"i":"K0718","t":"北科大 Reborn 英雄大陀螺整车机械开源：72mm 60A 摩擦轮全套实测参数","c":"案例开源","b":"2019 英雄单项赛冠军整车机械开源（step 整车图纸＋dxf 加工图＋弹道稳定性视频）。最有价值的是摩擦轮实测：邵氏 60A 聚氨酯 U 型轮、直径 72mm、两轮间距约 38mm、电机轴心距 108mm；同弹丸下转速每变 5rpm 弹速约变 0.5m/s；冷机 13.5m/s，连打 6~8 分钟后升至 16.6m/s 才稳定，需把转速下调 5rpm 补偿（建议加射速微调键）。另建议摩擦轮中心尽量落在 pitch 轴上以缩短后坐力回正时间。","s":"来源·BBS 6371","k":"auto"},{"i":"K0719","t":"东莞理工 ACE Yaw 传动设计开源：同步带往上跑的根因与涨紧套顺序","c":"传动机构","b":"专门讲云台 yaw 同步带传动为什么晃。核心是同步轮与电机轴的同轴度、以及涨紧套的拧紧顺序——涨紧套收紧时会把同步轮往上带，导致两轮不共面、皮带往上跑。作者用机加工件端面夹住深沟球轴承的内外圈（利用内外圈凸起、防尘盖凹陷）来消除轴向跳动，并指出合格轴承内外圈本身无游隙，晃动多来自假货或配合不当。适合排查“云台一加速就偏”的机械原因。","s":"来源·BBS 7435（资料为百度网盘，提取码 socd）","k":"auto"},{"i":"K0720","t":"南航长空御风 RM2020 中空大滑环：内径穿 6020、电源与信号电刷分离","c":"传动机构","b":"为压缩哨兵厚度做的中空大滑环：内径可穿过一台 GM6020，6020 中空孔再走 17mm 弹丸。与传统滑环不同，把电源线与信号线分开——电源线加粗、电刷面积加大，实测过 20A；信号线过 5A，可跑 CAN/USART/485，USB2.0 未测、明确不能过 USB3.0。验证方法值得抄：做 15 通道断路检测模块，连续旋转 2 小时统计断线次数，跌落振动后复测。附电刷材料对比（黄铜导电好弹性差、磷铜反之、铍青铜两优但贵）。","s":"来源·BBS 7804","k":"auto"},{"i":"K0721","t":"桂林理工群星 步兵/哨兵云台滑环集线板：焊点藏进航空头并环氧灌封","c":"结构设计","b":"把滑环接线规范化的方案。先统计需过滑环的 15 根线（裁判系统航空线 4、串口 3、Ammo-Booster 2、云台 2、Mini-PC 2、用户 CAN 2），再用 GX16-10 航空头（可穿进 GM6020 中空孔）配 M8-4 走裁判系统，共 14 芯；滑环沿用外径 15.5 的 24 芯、单线 2A。关键改进是把所有焊点藏进航空插头端子并环氧灌封，避免细线焊点一弯就断，换滑环只拧两个航空头。缺点是体积偏大。","s":"来源·BBS 811697","k":"auto"},{"i":"K0722","t":"青岛理工 MOVE 12 路滑环云台中心板：用继电器省滑环路数","c":"结构设计","b":"用一块云台中心板把 12 路滑环用满：集成云台供电与发射供电（各 9A）、不断电主控 1A、小电脑 4A，四种电源带 LED 指示；两路 CAN（一路不过滑环）、一路学生串口、一个裁判系统航空线接口。思路是由裁判系统 GIMBAL/SHOOT 电源经继电器直接控制云台与发射断电，从而省下滑环路数。作者给了器件替换注意（TVS 用 1.5SMC26CAQ、输入电容可上 22~47µF/50V、继电器选 24/30V 版）。","s":"来源·BBS 1315877","k":"auto"},{"i":"K0723","t":"成信大风信子 云台模块快拆思路：机械快拆不等于真快拆","c":"装配维护","b":"点出常见误区：很多云台快拆机械上几秒拆完，但线要重新接，实战并不快。方案是把 12 线滑环（每路 5A）汇到一只 12pin 航插（WS16 系列），云台连同 yaw 电机与滑环整体拔走只需 8 颗螺丝＋一根插头。机械侧用大量铝柱/钢柱内嵌方管或打印件替代螺母，一把 M4 螺丝刀即可完成拆装。代价是航插体积大，需提前规划摆放方向与车体内部空间。","s":"来源·BBS 760420","k":"auto"},{"i":"K0724","t":"西交 RMUL 西北交流会03 步兵设计与供弹链路：限位、定位与卡弹四条结论","c":"案例开源","b":"西交机械组主讲的步兵设计与供弹链路问答，附交流资料包。四条可直接用的结论：枪口弹丸限位用“可转动悬臂＋轴承＋弹簧”，弹丸顶开轴承后由弹簧回推；摩擦轮电机水平方向靠板件定位并要求板面平整、电机座定位凸槽过盈卡入，竖直方向用层高为厚度因数的打印垫片逐次试；弹道由摩擦轮安装精度与弹丸进轮前初位置/初速度/角度共同决定；17mm 链路卡弹先测临界射速，再看磨损部位降粗糙度。","s":"来源·BBS 7849","k":"auto"},{"i":"K0725","t":"西交笃行 RM2025 六摩擦轮过洞舵轮双 yaw 英雄：27kg 的尺寸与构型分配","c":"案例开源","b":"600×530×435mm、27kg 的过洞英雄，俯仰 0~45°、小云台 0~40°、弹仓 67 发、通过角 33°，可 15~21m 稳定吊射基地顶/底装甲并雷达辅助吊射。技术报告讲三件事：75mm 鹅颈弹链、17 齿内啮合中心供弹、舵轮双 yaw 底盘。可借鉴的是“用内啮合齿圈在有限高度里换传动比”和过洞构型的尺寸分配——高度受限时先压 yaw 轴系再谈弹舱。","s":"来源·BBS 803407（三维图纸在网盘，提取码 9hfv）","k":"auto"},{"i":"K0726","t":"中科大 RM2024 工程机器人“框架法”：04C 链条、两对滑块与胀紧套保鲜膜","c":"案例开源","b":"按“框架法”讲工程车从零到总装：先搭铝方管框架验证方案可行性，再补板件/打印件/机加件，能在前期暴露方案漏洞。细节含金量高：防撞架用不锈钢抵冲撞；避震器一头敲掉球头、孔 3 扩 5 换 M5 提高强度；抬升用 04C 链条配 15 齿链轮，链条截开可穿 M2 半牙/铰制孔螺栓，负载约 10kg，松弛先垫垫片再截节；抬升刚度靠两对滑块拉开距离（代价是行程）；导轨孔 3.5mm，装配需微调两轨平行度，可用限位件省掉调整；胀紧套打滑可垫一层保鲜膜。","s":"来源·BBS 22148","k":"auto"},{"i":"K0727","t":"「RM圆桌」19 期总目录：一帖直达全部机械相关期号","c":"其他","b":"官方「RM圆桌」19 期加一期特辑的总索引，一帖给出全部期号与链接（下供弹、测试、底盘、超级电容、自瞄、功率控制、抬升机构、大风车、PID、RTOS、车壳、拨弹、打击精度、赛前准备、飞坡、规则、陀螺仪、空中机器人、自定义客户端、竞培营工程车）。价值在于是检索入口：机械相关的第 1/2/3/7/11/12/15 期都能一跳直达，适合挂在百科里当索引入口，避免逐条搜索。","s":"来源·BBS 55076","k":"auto"},{"i":"K0728","t":"官方 RMU2026 场地图纸与可移动道具开源：能量单元 STEP 与三版场地模型","c":"赛事场地","b":"官方场地与道具 STEP 图纸汇总，按规则手册版本分档：RMUC2026 有 V2.0.0（1.25GB）、V1.2.0（993MB）、V1.0.0（649MB）三版，RMUL2026 3V3 场地图 1.68MB，另有能量单元 STEP 仅 0.84MB。可借鉴处有二：能量单元图纸可直接量取抓取接口与外形尺寸，用来核对夹爪开口与收纳仓容积；场地按规则版本分档也说明尺寸会随手册修订变，自建场地必须锁定与备赛一致的那一版。","s":"来源·官网/BBS 814728（2025-10-22）","k":"auto"},{"i":"K0729","t":"大符支撑张紧器被返的三条审图意见（带轮顶丝/分体带轮/纯螺丝预紧）","c":"经验避坑","b":"2026-11-11 14:37 高荣信把大符支撑张紧器拿去评审，被按成文清单返了三条（图上编号 4/5/6）：\n4）「带轮不能这样做顶丝设计」——顶丝孔开在齿槽上会破坏齿形，顶丝头还可能蹭皮带。正确画法是顶丝落在轮毂实心段，拧紧后整根藏在轮毂内孔里、端面不外露，一把内六角就能拆装。高荣信原以为「常见惰轮不就是用顶丝」，林创武看过剖面后认可，说明顶丝方案本身不错，错的是开孔位置。\n5）「不要分体式带轮（中间那个），且太宽」——轮毂+齿圈分体在自制件上同心度和轴向定位都难保证；林创武要求「上中下分三块至少中间的齿部分做整体打印件」，即齿形段必须一体。\n6）「纯靠螺丝的预紧力张紧太容易松了，可以参考步兵 yaw 上的张紧方式，或者轴承张紧」——螺纹自锁不足，振动下会退扣。\n可复用规则：顶丝孔只在轮毂实心段；同步带轮齿形段一体成型；纯螺纹预紧张紧器必退扣，改用偏心轴承张紧或加防松件。另林创武要求「把你用到的成品件写进文档」，成品件登记是采购与替换的前提。","s":"群聊·27炒鸡大符 2026-11-11 14:37–15:03（高荣信×林创武）","k":"auto"},{"i":"K0730","t":"张紧器螺纹调节件最小 M4、队内统一 M5，手调改蝶形螺母","c":"标准件紧固","b":"同一次评审里，张紧器的调节螺纹规格被定了口径：\n· 林创武：自制张紧器「把这颗螺丝型号换大点，至少 M4 以上」；\n· 高荣信：设计里用的就是 M5，「基本上都是用 M5」→ 通过。\n→ 记为队内默认值：张紧器调节螺杆 ≥M4，实际统一 M5。\n手调方案：15:01 高荣信贴出 304 不锈钢蝶形螺母（羊角螺母，M4/M5/M6/M8 齐全，单价 1~4 元）「打算用这种」，即把调节螺母换成可手拧件，现场调张力不用扳手。\n风险提示（群里未讨论，需补）：蝶形螺母防松比普通螺母更差，与「纯螺丝预紧会退扣」那条意见直接冲突，实际应配双螺母对锁或加弹垫/尼龙嵌件。\n参考原型：Ender-3 的 2040Y 轴同步带张紧器（成品 37.8 元/套，ELVES 产），但它是「固定在铝型材上」的结构，大符支架那个位置用不了现成件，只能自研。","s":"群聊·27炒鸡大符 2026-11-11 15:00–15:03","k":"auto"},{"i":"K0731","t":"扇叶可拆卸的接线走「快拆板+人工拔插连接器」，不做自动对接","c":"结构设计","b":"11-10 21:23 提的「扇叶可拆后接线要不要做快拆」，11-10 21:51 起有结论：\n· 张墉：这块大部分是苏伯伟（电控）负责；\n· 苏伯伟：在连接部分用快拆板，要拆的时候直接把线从连接器上拔掉就好；\n· 苏伯伟：先去问电控接口需求，然后估计要预留的孔位，再告诉结构侧（@钟自豪）。\n→ 结论：不做带触点的自动对接机构，走「机械快拆板 + 人工拔插连接器」。结构侧只需按电控给的接口尺寸预留过线孔/让位孔，不必为电气插接设计浮动或导向。\n判断依据：扇叶拆装是赛前/维护动作，不是场上自动动作，人力插拔更划算。这与 2026-11-06 重装组「连接机构最后只留 z 轴做电气插接」的思路相反，两者按「是否场上自动」来分。","s":"群聊·27炒鸡大符 2026-11-10 21:51–22:03","k":"auto"},{"i":"K0732","t":"3D 打印教程 Taurus 版 2026 更新：局部改参数、逐件打印、宏程序一键导 STL","c":"加工工艺","b":"林创武 2026-11-11 15:59 在 27机械组发新版《1_3D打印机从入门到入门教程（Taurus版）.pdf》（15 页 1.81MB），指出刘俊锋的打印机使用文档是「按旧版做的」，要求与时俱进。本文是新版独有、旧版没有的四块内容：\n1）局部参数修改器：同一零件某部位要更大强度时，右键「添加修改器」→ 立方体 → 用移动/缩放把该部位罩住 → 在「对象」里单独改立方体的密度（如 100）与墙层数（如 4），不用整件加密。\n2）逐件打印：「对象」→ 选盘 → 盘参数顺序 → 打印顺序 → 逐件。一件一件打，单件失败不毁整盘；每个零件外围会出现一圈禁入范围，零件之间不能接触否则撞头。\n3）SolidWorks 宏程序一键发切片：把「SolidWorks 一键发送 3D 打印工具」解压后，SW 里右键特征工具栏→自定义→命令→宏，新建宏按钮并指向「发送到 BambuStudio.dll」，设图标后一键把零件推进切片软件（本质仍生成 stl，只是省掉另存）。\n4）机型口径：实验室现役 H2D、P1S、X1C；打印板为纹理 PEI；喷嘴 0.4。H2D 是双喷嘴，需特殊设置。找不到机型时点「选择/移除打印机（系统预设）」勾选后确定。\n另有：SD 卡离线打印的文件命名要求「零件名-用户名-日期」；远程发送需打印机联网（可用手机热点）并在打印机上扫码绑定账号；打完必须清走支撑与附着层。\n本地：机械百科_数据/教程文档/3D打印机从入门到入门教程_Taurus版_20261111.pdf（旧条目 K0226 只有一句话，本文补实质内容）。","s":"群聊·27机械组 2026-11-11 15:59 林创武发的 PDF","k":"auto"},{"i":"K0733","t":"FDM 打印件孔径要放大 0.3~0.5mm，且底面朝向决定强度与表面质量","c":"加工工艺","b":"新版 Taurus 教程里两条可以直接抄进设计规范的量化结论：\n1）孔径补偿：FDM 是先加热熔化再冷却固化，热胀冷缩导致实际成型孔径比设计值小，所以打印件孔径要设计成 +0.3~+0.5mm——3mm 的孔画成 3.3~3.5mm。这条比「凭经验放大 0.2」更准，可直接用于配合孔。\n2）底面选择的判据：逐层堆积在横截面方向受力很差，且底面做不出光滑曲面。所以对某些截面有强度要求、或某些面有表面粗糙度要求时，必须手动改底面（自动朝向只是「选支撑最少的面」，不等于最优）。\n配套参数语义：墙层数=内外壁厚层数（越大越强）；稀疏填充密度 100% 为实心；支撑类型选树状（自动）好拆；零件高且与热床接触面积小时开 Brim。参数含义可把鼠标悬停查看，层高越小精度越高、时间越长。","s":"机械百科_数据/教程文档/3D打印机从入门到入门教程_Taurus版_20261111.pdf 第 7–9 页","k":"auto"},{"i":"K0734","t":"TPU 绝不能进 AMS：会堵死 AMS，且必须防潮","c":"材料板材","b":"拓竹机型的 AMS 是「电机把耗材往打印机方向推」的自动供料系统，TPU 太软会被齿轮咬变形并在管路里堆死——教程明确写「TPU 需外挂，不可放入 AMS 中（会堵）」。\n同时 TPU 易吸水受潮，受潮后打印质量下降（拉丝、气泡），所以不得长期裸露在空气中。队内现状与此吻合：AMS 长期闲置、唯一的烘干机长驻 TPU（见 2026-11-10 PETG 讨论）。\n外挂料盘操作：把机器上红色方框那路拔掉，接外挂料盘；进料要先把耗材往里怼到怼不动，再点「进料」，观察喷嘴是否出料。编辑耗材时材料选 Bambu Lab，TPU 统一选 TPU95A，其余按料盘标注选。\nAMS 与手动的差别：AMS 有电机推料，不需要手动怼；手动外挂必须自己怼到位，否则空打。","s":"机械百科_数据/教程文档/3D打印机从入门到入门教程_Taurus版_20261111.pdf 第 1–2 页","k":"auto"},{"i":"K0735","t":"靶车 V1.1（王家祚）：MGN12H2R400 双滑块 + 竖直/水平双底板插销","c":"案例开源","b":"2026-11-10 23:32 神图群提交「靶车v1.1-Sn-王家祚20261110.zip」，12.28MB，26 个 SLDPRT + 4 个 SLDASM。\n选型：直线导轨 MGN12H2R400（400mm 双滑块）×2 + MGN12C1R112（112mm 单滑块）；底板 4mm、装甲板背板 5mm、竖直滑轨底板 4mm、水平限位板 4mm、竖直限位板 3mm、铝方管垫板 2mm；铝型材上下铝方管 + M4 铝柱（D7×L20）+ M5 铝柱（D10×L60）；标准件含 RM2019 裁判系统支撑架 AH02、装甲模块 AM02、铝排 101040。\n设计读点：插销从「单销」升级为「竖直插销底板 3mm + 水平插销底板 5mm」两套，配大/中/小号插销并分左右方向——正对 2026-10-27 记的「靶车装甲板插销会脱出」：用不同方向、不同规格的销分担剪切与振动，避免单销扛全部。复用件含林填的插销（插销-林填2、插销固定-林填2）与陈秋杰 2023 装甲模块。\n本地：04_往年图纸与代码/靶车V1.1_王家祚_20261110.zip","s":"群聊·27神图群 2026-11-10 23:32（王家祚）","k":"auto"},{"i":"K0736","t":"限位件按受力分档填密度：水平限位 80%、滑轨上限位 40%","c":"加工工艺","b":"王家祚靶车 V1.1 里两个打印限位件的命名直接把工艺参数写进去了：「水平限位件（80密度，打印）」「滑轨上限位件（密度40，打印）」。\n含义：同一台车上，承受冲击的水平限位做 80% 填充，只做导向/防脱的滑轨上限位做 40% 填充——不是所有打印结构件都上 100% 或都用同一个切片配置，按是否承力分档可以在不牺牲功能的前提下省料省时。\n可复用做法：把填充密度写进零件命名（或至少写进图纸说明），加工的人不用再问；同理可扩展为「墙层数」标注。这与队员常用的「限位件一律 100% 实心」相比是更细的做法。","s":"04_往年图纸与代码/靶车V1.1_王家祚_20261110.zip 零件命名","k":"auto"},{"i":"K0737","t":"昴宿 Arbiter-01 总装零件表：67 齿内齿圈 0.01 变位 0.03 侧隙 + 自行车碗组轴承","c":"传动机构","b":"2026-11-11 21:11 植正雄在神图群发「昴宿Arbiter-01 总装 植正雄 20261111.zip」（11.55MB，13 SLDPRT + 2 SLDASM），这是行星减速箱的成品总装。零件清单本身等于参数表：\n· 「67齿内齿圈 0.01变位0.03侧隙」——内齿圈 67 齿、变位系数 0.01、侧隙 0.03mm，三个关键参数直接写进文件名（全队命名最规范的一处）；\n· 「官方3508太阳轮」+「M3508去阳齿」——太阳轮原样复用官方件，配 3508 输出轴改造件；\n· 「圆柱齿轮10_X_D70.6+0.33」——10 齿圆柱齿轮，齿顶圆 φ70.6；\n· 「碗组轴承 56.8-47.8-6.5 31g」——用自行车碗组轴承（外径 56.8/内径 47.8/高 6.5，31g）；\n· 自制四件套：行星架、端盖、输出端（有 20261018 与 20261106 两版）、轴承压紧；\n· 轴向件：轴承钢圆柱销 3-18、超薄垫片 3-0.2-5、M4-18 杯头螺栓；\n· 「机械组 包胶轮 植正雄」——参宿时代的包胶轮沿用。\n注意：全部零件都没有 -Sn 定级标记，按 11-07 命名规范属不可发加工状态，只是方案确认件。\n本地：04_往年图纸与代码/昴宿Arbiter-01总装_植正雄_20261111.zip","s":"群聊·27神图群 2026-11-11 21:11（植正雄）","k":"auto"},{"i":"K0738","t":"用自行车碗组轴承替代薄壁轴承：56.8×47.8×6.5 只要 31g","c":"标准件紧固","b":"昴宿 Arbiter-01 的输出端支撑用了一件「碗组轴承 56.8-47.8-6.5 31g」——不是薄壁交叉滚子或等截面轴承，而是自行车车头碗组（headset）轴承。\n优点：内径 47.8、外径 56.8、高仅 6.5mm，是标准的「大内径+薄壁」构型，正好卡在减速箱输出端要「大通孔+矮轴向」的位置；31g 比同尺寸工业薄壁轴承轻；单价便宜、现货随处可买（自行车配件渠道），坏了当天能换。\n代价/需注意：碗组轴承多为角接触或深沟球，额定动载荷低于同尺寸工业轴承，且没有精密公差分级（ABEC 等级低、游隙偏大），只适合低速、轻载、以定心为主的位置——减速箱输出端属于低速大扭矩，转速不高，正合适；但不能拿去替 yaw 那种要刚性的位置。\n这是一条可直接复用的降本选型：先看自行车/滑板/轮滑这类「民用大内径薄壁」品类，能覆盖不少机器人非关键回转支撑。","s":"群聊·27神图群 2026-11-11 21:11 图纸包零件命名（植正雄）","k":"auto"},{"i":"K0739","t":"昴宿减速箱 1110 装车实测：定版四天后上车，先跑再补图纸","c":"装配维护","b":"行星减速箱研发日志 2026-11-11 新增章节「1110 装上车——初见端倪」，正文只有标题 + 3 段实拍视频（26.3MB 横屏 1920×1080 / 18.5MB 横屏 / 16.7MB 竖屏 1080×1920），无文字描述。\n时间线：1106 定版（内齿圈 0.01 变位、0.03 侧隙）→ 1110 装上车实跑 → 1111 21:11 才把总装包发审图群。先装车验证、后补图纸，与「图纸齐了才敢做」的旧习惯相反，值得固化为流程。\n本地：机械百科_数据/设计资料/昴宿减速箱装车实测_20261110_01/02/03_竖屏.mp4（共 61.6MB）。\n配套：日志同章节末尾仍是「时机成熟之时：从 0 开始的研发之路」的 18 项校核总表，其中齿根弯曲、齿面接触、滑动率、行星轮轴承、销轴强度、载荷谱 6 项状态仍为「完全没有」，说明装车跑通 ≠ 校核闭环。","s":"知识库·行星减速箱研发日志 2026-11-11 新增「1110 装上车」","k":"auto"},{"i":"K0740","t":"同步带轮选 5M 不选 S5M 的真实原因是加工成本","c":"传动机构","b":"常识文档 2026-11-11 新增一句队内口径：「队里的传统都是用的 5M。因为 S5M 的平顶所对应的同步带轮不好加工，所需要的圆角更小，加工时长更长导致更贵（一般来说）」。\n这条补上了 K0332（5M 与 S5M 齿形/齿高/带厚/标准不同）缺失的选型落点：两者节距同为 5mm、性能上 S5M 更平稳低噪，但 S5M 的平顶齿形要求带轮齿槽根部圆角更小，刀具半径受限、走刀路径更长，自制/外协报价更高。\n→ 结论：非高速高精场合一律用 5M（圆弧齿 HTD）；S5M 只在需要低噪高速、且带轮能买到成品时用。\n引用时注意区分两句：性能上 5M 齿部厚实适合重载（K0332），成本上 5M 更好加工——两条同向，所以 5M 是默认解。","s":"知识库·机械组常识文档 2026-11-11 新增","k":"auto"},{"i":"K0741","t":"常识文档 0721「部件镂空与设计思路」整章被划删除线，标题改掉人名","c":"其他","b":"2026-11-11 机械组常识文档出现一次编辑动作，值得记下来：\n1）标题从「0721 豆小姐：」改成「0721 合理的部件镂空与设计思路」——去掉了人名前缀；\n2）该章正文（四大类：框架闭合、局部补强、截面优化、受力路径重构，共 60 余行）全部加上删除线保留但标记失效；\n3）原有正文没有删除，仍可读，只是视觉上降级。\n含义：这份内容是「保留存档但不再作为依据」。原因群内未说明（推测与内容来源或结论可靠性有关），引用该章前应先确认队内是否已另有替代口径，不要直接当规范用。\n同一次编辑另新增了 5M/S5M 的加工成本结论（见另一条）。\n可复用经验：队内文档用「删除线」而不是「删掉」来降级内容，检索时容易误读成有效条款——遇到划线章节要单独标注状态。","s":"知识库·机械组常识文档 2026-11-11 变更","k":"auto"},{"i":"K0742","t":"知识库 3D 打印教程存在两份旧版重复，新人直接照着旧版做","c":"队伍制度","b":"2026-11-11 15:58 林创武在 27机械组指出刘俊锋写的打印机使用文档「是按旧版做的」，随后发出新版 PDF（Taurus 版 2026-11）要求「与时俱进」。\n追查过程还原出一条典型的文档治理问题：\n· 刘俊锋用的是「许可岳最早发在微信群」的那份，后来许可岳又发了新版，刘把新版放在「重生」目录，自己写文档时却用了旧版；\n· 林创武查知识库发现同一主题挂了两份，且两份都是旧版；下方那份是熊哥和凯佳写的，算半个使用说明+注意事项，且「应该还没放进去」；\n· 植正雄定调：「那就统一一下，不要出现重复的文档」「看一下取舍谁」「简称不要堆屎山」。\n→ 待办（无人认领）：知识库该主题下两份旧文档二选一或合并，新版 PDF 入库替换。\n可复用规则：同一设备只允许存在一份主文档；微信群里发过的版本不算生效版本，必须落到知识库/文档库才算；换版时旧版下线，不能靠「新人自己看日期」分辨。","s":"群聊·27机械组 2026-11-11 15:58–16:19（林创武/刘俊锋/植正雄）","k":"auto"},{"i":"K0743","t":"图纸包命名体检：靶车包名小写 v 且日期缺连字符，昴宿全件无 -Sn 定级","c":"图纸规范","b":"2026-11-11 两份图纸包按 11-07 命名规范体检结果：\n① 靶车（王家祚）「靶车v1.1-Sn-王家祚20261110」：小写 v；日期前缺连字符（应为 V1.1-Sn-王家祚-20261110）；包名 ≠ 主装配体名——主装配体叫「靶车v1.1-Sn-王家祚-20261108」，日期比包名早两天，打开包第一眼仍看不出哪个是总装。零件层约 20/26 合规，「名称（尺寸）-姓名-日期」执行到位；混入旧件未改名：插销-林填2、机械组_模块功能_橡胶垫、机械组-装甲模块-陈秋杰-2023.01.02、小号插销（左方向）-v1.0-Sn-林填（挂了 -Sn 却无姓名日期）。\n② 昴宿（植正雄）「昴宿Arbiter-01 总装 植正雄 20261111」：用空格分隔而非连字符、无版本号；包内 15 件全部没有 -Sn 定级标记，按规定属不可发加工，只能算方案确认件。\n③ 累计看：连续两轮四份包里，「包名 = 主装配体名」仍只有刘悦一份做到。包名对不算对，打开包第一眼能看出「哪个是总装、谁画的、哪天的」才是标准——这句可直接当审图第一关话术。\n④ 复用旧件是命名混乱的主要来源：跨年份/跨人借用的件必须统一改名或在前缀标「借用_原姓名」。","s":"04_往年图纸与代码/靶车V1.1_王家祚_20261110.zip、昴宿Arbiter-01总装_植正雄_20261111.zip","k":"auto"},{"i":"K0744","t":"大疆图传模块 VT02 拆解视频（林博瀚转发，B 站）","c":"其他","b":"2026-11-10 23:00 林博瀚在 2027 大群转发 B 站视频《大疆裁判系统拆解：RoboMaster 图传模块 VT02》，链接 https://www.bilibili.com/video/BV1ayx56fEnN/ 。\n定位：属裁判系统电控/结构拆解，对机械侧的用处是看清图传模块的实际外形、安装孔位与线束走向，做安装座与走线让位时可参考；具体电路不论。\n本轮仅收线索，未下载视频（B 站视频不在飞书侧，且非机械主料）。需要时按链接自行观看。","s":"群聊·2027大群 2026-11-10 23:00（林博瀚）","k":"auto"},{"i":"K0745","t":"山东理工齐奇·工程机器人自定义控制器百元磁编方案（RM2026）","c":"结构设计","b":"纯磁编码器+同构小机械臂的自定义控制器，末端装一个小能量单元做映射，装配时拖动末端即可标定。整机连小键盘与电路板约150元，无重补与力控，优点是极轻、几乎无可坏件，区域赛到复活赛零故障。多处螺丝直接拧进孔径偏小的打印件，实测不易松动——对低成本打印件做铰链固定很有参考价值。开源含53MB装配模型与总装STEP。","s":"来源·BBS 1991635","k":"auto"},{"i":"K0746","t":"三川摩擦轮装车试射实测：轮径、固定座与打印架共振","c":"传动机构","b":"早期摩擦轮装车实测记录。轮径65mm时枪管必须加长避让否则摩擦轮卡住管身；用螺母点焊到固定座做限位，半小时连发无松动；同理3D打印（ABS）电机固定架在连发时产生明显共振，作者建议改用玻纤板或铝合金。PWM 1800（满速2000）下30发打穿15mm泡沫板。可借鉴的核心是「固定板刚度决定连发一致性」与螺母点焊限位的简易做法。","s":"来源·BBS 2769","k":"auto"},{"i":"K0747","t":"英雄MT4114摩擦轮尿弹排查：固定板弯曲导致挤压量不足","c":"经验避坑","b":"英雄发射机构摩擦轮间距36~38mm、满油仅直射2m，推算初速不足6m/s。跟帖给出成体系排查顺序：包胶过硬、轮径过小、枪管内台阶、两电机未同时转，以及最关键的——摩擦轮固定板在弹丸挤压时向两侧弯曲，实际挤压量不足。这把「尿弹」从电机问题拉回结构刚度问题，做发射机构时固定板应加厚、加筋或直接改金属件。","s":"来源·BBS 5800","k":"auto"},{"i":"K0748","t":"上海科技Magician六摩擦轮吊射英雄：38mm内切圆与0+压缩量限位","c":"案例开源","b":"21m吊射70%命中。关键参数：一级二级都用内切圆38mm的三摩擦轮布置，六颗摩擦轮尽量同批次（至少三颗一组同批）；石河子45A硬度60平轮；PU69620-5包胶限位轴承；摩擦轮固定板打销孔铰配以维持装配精度。限位理念为「0+压缩量双相切」，实践留小正压缩量；该打印限位寿命仅200~300发，作者明确建议上场版弃用。整车25kg，以去掉滑环换吊射能力。","s":"来源·BBS 716301","k":"auto"},{"i":"K0749","t":"Mid360雷达线自制指南：拖链线、航空头与弯折半径","c":"装配维护","b":"官方雷达线399元/1.5m，自制方案为M12航空头（A型12芯）+六类拖链网线+DC头，单根成本十几元。要点：必须选无氧铜芯才上锡；剥线不可过长（网线皮受热缩1~2mm）留3mm焊端；每根套热缩管；选拖链线正是因为雷达线要随云台反复弯折。对机械组的意义是——改线长属于结构接口的一部分，弯折半径与固定点要在设计阶段一并确定。","s":"来源·BBS 22982","k":"auto"},{"i":"K0750","t":"中南大学荷叶饭双轮足串联机器人：髋关节轴承组合与中空滑环","c":"案例开源","b":"髋关节用RU42交叉滚子轴承同时承径向与轴向载荷，大小腿连杆之间、两链轮之间均用推力滚针轴承隔离转动；腿部电机走线穿髋关节中心，用默伏龙2042-6线中空滑环过渡；髋部机架为铝合金一体CNC件，中心铝架取「井」字构型空心方管并在非承力区圆形镂空减重。可借鉴「关节载荷分离」的轴承搭配与一体化CNC机架思路。","s":"来源·BBS 715186","k":"auto"},{"i":"K0751","t":"华南虎机器人项目设计流程（RM AWARD 2025）：宁简勿繁与尺寸反推","c":"基础理论","b":"把整机开发拆成需求→方案收集→方案评估→框架设计→尺寸确定→详细设计与仿真校核。方案评估用低成本手段先筛可行性（查开源、数值计算、SW草图仿真）；尺寸确定阶段用标准件反推整车关键尺寸，并把线缆布置初方案一起定。两条硬原则：「宁简勿繁」、「最容易犯的错是心存侥幸」。可直接当队内设计流程模板用。","s":"来源·BBS 816172","k":"auto"},{"i":"K0752","t":"3D打印RFID卡扣快拆支架：PETG四层墙45%填充","c":"结构设计","b":"用卡口+抽拉代替螺丝或扎带固定RFID，更换无需工具，已在2024复活赛步兵与工程上验证未脱落。打印参数PETG 4层墙45%填充；作者自评未在高强度UC验证，建议侧边加槽用魔术贴兜底。可借鉴的是「卡扣快拆+耗材参数+验证强度」这种完整写法，比只放模型对复现者有用得多。","s":"来源·BBS 55531","k":"auto"},{"i":"K0753","t":"北信科偏置式大弹丸中心供弹：拨盘直径对照与内旋抬升必须分离","c":"传动机构","b":"给出各队拨盘尺寸对照：太原理工8齿约250mm、26济拨10齿283mm、26青云9齿289mm、25华工9齿230mm（用变曲率螺旋弹链缩尺寸）。核心结论：内旋段与抬升段必须完全分离，早年把两段耦合虽能缩体积，却显著增加拨弹阻力与卡弹风险；最小转弯半径受限于内侧MR83轴承，再小必然出问题。另建议中心供弹配主动预置轮压弹道散布，并提醒复刻时不要一上来就用机加件与碳板。","s":"来源·BBS 1938911","k":"auto"},{"i":"K0754","t":"天津大学北洋机甲英雄双级四摩擦轮：前快后慢、二级多退少补","c":"传动机构","b":"26赛季出战26场超级对抗赛，平均命中48%、局均伤害3800，全场35中25、吊射25中17。文档系统讲双级发射的转速配比逻辑：第一级把弹丸加速到略超目标射速，第二级对超速的减速、对欠速的补偿，从而压住弹速波动。1.82MB PDF，是目前站内双级摩擦轮最完整的一份设计经验，可与同济六摩擦轮、上科大六轮吊射对照读。","s":"来源·BBS 1501043","k":"auto"},{"i":"K0755","t":"大连理工凌BUG有控飞镖：MGN15滑轨与四根大拉簧参数","c":"案例开源","b":"发射架换MGN15滑轨+MGN15C滑块后精度与稳定性明显提升；用4根线径4mm、外径35mm、长300mm大拉簧，预压量需求小于南航方案、爆发力更大，但瞬时冲击大、微调精度差。精度核心在扳机位置、缓冲位置与镖体预置位置的配合。镖体改边条+主翼融合、碳片连尾翼，重量210→250g却抗碾压。另附视觉挡片解决场地顶部灯光误识别。","s":"来源·BBS 54237","k":"auto"},{"i":"K0756","t":"稳定30Hz十爪切线拨盘（4005版）","c":"传动机构","b":"十爪切线拨盘，最初用2006电机，最终上场版改4005并重构后只开源4005版（2006版易改，作者未放）。属高频供弹的成熟结构参考，附拨盘模型与配套代码。适合需要高供弹率又受空间限制的场景；改电机时注意2006与4005的安装接口差异。作者附了两年RM的调试经验，虽写得克制但结论可以直接用。","s":"来源·BBS 1936133","k":"auto"},{"i":"K0757","t":"合工大苍穹DM-2325轻量化切线拨盘：卡弹机理与拨爪下压解法","c":"传动机构","b":"用达妙2325替代2006/3508做轻量化小体积切供，电机倒置于一侧、经一组自加工玻纤齿轮减速驱动打印拨爪。最有价值的是卡弹机理：震动中底层弹丸离开底板，与切供出口形成干涉；解法是把拨爪扭转，使其推弹同时下压，27Hz卡弹率<0.3%、30Hz约0.7%。接触面贴特氟龙可再降卡弹但会磨损需维护。10万发测试中8万发时电机故障；2325的D型轴与2006不同，沿用2006抱紧联轴器曾失效。","s":"来源·BBS 1969507","k":"auto"},{"i":"K0758","t":"湘潭大学逐曦步兵侧切拨弹一体CNC版与自制减速箱268-17","c":"加工工艺","b":"24赛季打印件版拨弹「只有本人装才能达到预期性能」，故改为主体一体CNC的侧切拨弹，降低对装配水平的依赖——这是「打印件转CNC」的明确判据。减速箱268-17用双角接触轴承，可删外侧轴承平替XROLL且孔位通用。两条工程细节：需CREO8.0以上打开（SW会乱码），固定集成件要保留0.05mm薄片否则铨洲仿真失败。","s":"来源·BBS 714068","k":"auto"},{"i":"K0759","t":"北科大Reborn齿轮传动英雄与2mm PC车壳涂装工艺","c":"加工工艺","b":"开源含曲颈齿轮传动云台发射机构、减速电机直连切向拨弹盘、拖曳臂独立悬挂底盘。更实用的是2mm PC车壳完整流程：先展开钣金做图样→按视图导出2D→分功率激光切割（轮廓切透、图样高速低功率只切透覆膜）→保留覆膜热弯→分区撕膜喷漆。PC抗冲击、易弯折，是车壳首选材料，这套流程可直接复制。","s":"来源·BBS 8428","k":"auto"},{"i":"K0760","t":"RMUL山东区域交流会：空中机器人机械结构设计问答实录","c":"案例开源","b":"问答体记录总体布置取舍：动力带宽给高、其余飞控参数基本默认，靠调重心配平；裁判系统按「是否需要按键与看屏」分区放置，部分放最上层；共轴双桨推力只有1.5~1.6倍而非2倍；动力电机选型对了其他都好说；电池用TB47卧式塑料电池架，分电板供电。适合在做空中机器人总体布置前快速过一遍，含教练与队员的实战口径。","s":"来源·BBS 8818","k":"auto"},{"i":"K0761","t":"公牛插头改造的3元3D打印电池架","c":"结构设计","b":"拆开公牛GNT-10L1G插头取出金属插片，配3D打印主体（PLA/PETG-GF/CF）做TB47/48电池架，单件约3元，作者在空中机器人上高强度使用数月无问题。要点：必须用该型号插头；插片对槽推入后打M3螺丝；焊线前先降温防熔塑料。属「用市售成品件替代定制件」的省钱思路，但大电流接触可靠性依赖插头本体，后续该队另有镀金铜插头的8元改进版。","s":"来源·BBS 1889405","k":"auto"},{"i":"K0762","t":"盐城工学院SaltWave半舵半全向哨兵：10.7kg与自制双轴承减速箱","c":"案例开源","b":"哨兵整机机械开源，两个6020转向+两个3508驱动配自制双轴承减速箱，不加裁判系统仅10.7kg（检录含裁判系统约15kg），裁判系统读出稳定50W小陀螺（无超电）。作者观点：半舵虽只有两个驱动轮，解算与控制跟全舵一模一样，功率控制甚至可以更优。机械为硬件预留较开阔的走线空间，是「轻量化哨兵」的一个可对照样本。","s":"来源·BBS 1883272","k":"auto"},{"i":"K0763","t":"SCARA 构型：R-R-P-R 四轴的能力边界（能搬不能翻）","c":"基础理论","b":"SCARA 是水平关节型机械臂，标准四轴记作 R-R-P-R（R 转动、P 移动）：两个水平转动关节＋一个竖直升降关节＋一个末端旋转关节，共 4 个自由度。适合「伸出去取—抬起来—转运到存矿位」这类动作，特点是水平搬运快、竖直方向承载刚度较好。\n\n关键限制：标准四轴 SCARA 无法主动让物料俯仰或侧翻，要做姿态变化必须额外加腕部关节。选型时先问任务需不需要翻面——需要就别用四轴 SCARA 硬撑。","s":"飞书知识库·27赛季机械组周会分享·第二次周会","k":"auto"},{"i":"K0764","t":"龙门架构型（PPP）：直线好做，但有四个绕不开的难点","c":"结构设计","b":"龙门架属直角坐标构型，靠几个方向的直线运动把夹爪/吸盘送到目标位，可类比 3D 打印机的运动架子；三轴全直线即 PPP 构型。实际常只有两个移动轴，需调姿态时在末端加旋转关节。\n\n优势：直线位置控制直观、固定位置之间的搬运容易重复（可拆成几个轴依次移动，便于调试与编排自动动作），框架与导轨便于给载荷提供支撑。\n\n四个固有难点：① 空间占用大——导轨、横梁、存矿仓互抢车内空间；② 伸得越远越难稳——伸缩端弯矩增加，导轨与横梁会挠曲；③ 移动部件可能很重——抬升轴要带着横移、伸缩、腕部一起升降，驱动负担大；④ 复杂姿态只能靠腕部补足，纯 XYZ 三平移无法翻转物料。\n\n这也是矿石兑换任务出现后龙门架逐渐失宠的原因。","s":"飞书知识库·27赛季机械组周会分享·第二次周会","k":"auto"},{"i":"K0765","t":"码垛臂用平行四边形连杆锁定末端姿态（省掉腕部电机）","c":"传动机构","b":"普通串联臂抬起大臂、折叠小臂时末端朝向会跟着变；码垛臂用平行四边形连杆约束补偿这个变化，让末端安装座保持设计朝向，搬矿时不必靠独立腕部电机维持方向。\n\n三个好处：① 取矿/存矿动作容易保持一致，吸住后抬起、收回都能保持姿态；② 部分驱动可布置得更靠近根部，降低大臂运动负担（取决于传动设计）；③ 伸出与折叠靠臂杆折叠完成，不需要给整个伸出行程铺直线导轨，收纳紧凑。\n\n四个难点：连杆多容易与电机/车架/物料干涉；销轴、轴承、传动间隙会全部传到末端影响对位精度；承载能力随姿态变化（手臂水平伸远时根部关节最吃力）；基础码垛构型姿态能力有限，要俯仰/侧翻仍需加腕部自由度。\n\n我队 25 赛季工程即采用码垛臂构型。","s":"飞书知识库·27赛季机械组周会分享·第二次周会","k":"auto"},{"i":"K0766","t":"关节式串联机械臂的三个代价：根部负担、误差累积、控制复杂","c":"结构设计","b":"串联关节臂结构为「底座—大臂—小臂—手腕—末端」，运动方式接近人的手臂，优势是能同时灵活调整位置和姿态：取矿时让吸盘对准矿石表面、收矿时转向存矿位、兑换时调俯仰侧倾朝向，还能靠折叠改变接近方向适应受遮挡的位置。\n\n代价三条：① 根部关节负担大——肩部要托住后面所有臂杆、电机、腕部和负载，水平伸远时最吃力；② 误差逐级累积——关节间隙、臂杆变形、角度误差都会影响末端对位；③ 控制复杂——想让末端沿直线走需要多关节协调，处理逆运动学、限位与碰撞。\n\n2023 赛季上海交大六轴机械臂工程（碳纤维臂杆＋吸盘＋麦轮底盘）几乎可以说是开启了工程的机械臂时代，其联动限位盘设计至今仍被广泛借鉴。","s":"飞书知识库·27赛季机械组周会分享·第二次周会","k":"auto"},{"i":"K0767","t":"工程上层机构四种构型怎么选：任务决定结构，不是构型决定任务","c":"结构设计","b":"工程机器人上层机构可归为四类：SCARA、龙门架、码垛、关节串联式机械臂。选择逻辑不是「哪种先进」，而是当年的任务形态决定：\n\n· 取矿＋定点兑换时代（2021–2025）：SCARA 与龙门架够用，直线动作好编排；兑矿难度上升后码垛臂的紧凑与姿态保持优势显现。\n· 装配/交互任务时代（2026）：双臂导向落地，四级装配成为每台双臂工程的使命，串联关节臂成为主流。\n· 2027：工程与英雄融合为重装，连接机构（对接发射机构）取代机械臂成为新的核心矛盾。\n\n一句话结论：每一年的规则改动都在重塑上层机构——「与其说机械臂是工程的核心，不如说是任务决定了工程的结构」。","s":"飞书知识库·27赛季机械组周会分享·第二次周会","k":"auto"},{"i":"K0768","t":"历年工程上台阶五种方案合集：轮式臂／单自由度三连杆／履带腿／低配四轮腿／摆烂腿","c":"案例开源","b":"队内周会文档整理的登岛（上台阶）方案谱系，按机构类型分五类：\n\n1. 港科大：轮式机械臂上台阶——用机械臂撑地把自己顶上去。\n2. 北理工：单自由度三连杆变形上台阶——一套连杆完成折叠与支撑，自由度最省。\n3. 大工：履带腿底盘——履带越障＋腿抬升，稳但慢、体型大、功耗高。\n4. 低配版四轮腿（足）——四个摆臂轮，最低成本的入门路线。\n5. 华农自家「摆烂腿」——最简摆腿方案。\n\n配套本地视频：机械百科_数据/设计资料/双臂工程上台阶方案演示_20261112.mp4（双臂构型上台阶实测）。\n\n与既有条目 K0464（履带/四连杆/摆轮加腿三路线对比，二级台阶 200mm 高、三级 200×300）互补：K0464 讲取舍与实测问题，本条讲队外成品方案长什么样。","s":"飞书知识库·27赛季机械组周会分享·第二次周会＋B站演示视频","k":"auto"},{"i":"K0769","t":"2027 上台阶难度升级：从大台阶变小台阶，从机器人上台阶变「人」上台阶","c":"赛事场地","b":"队内周会文档的原话判断：27 赛季上台阶任务进一步变难——「从大台阶变成小台阶，从机器人上的台阶变成『人』上的台阶」。\n\n含义解读：台阶尺寸变小意味着单个台阶跨越余量更小、对落点精度与足端包络要求更高（过去靠大轮径一次冲上去的做法失效）；「人上的台阶」指规则把通行能力从机器人自身越障转成对操作/机构配合的要求。\n\n对机械组的直接影响：底盘方案要在设计初期就按「小台阶＋高精度落点」评估，摆腿/轮腿的行程、足端接触面积、抬升时的重心转移都要重算，不能沿用 26 赛季的大轮径冲坡思路。\n\n提醒：这是队内周会文档的表述，具体尺寸条款仍需回查规则手册对应章节后再定方案。","s":"飞书知识库·27赛季机械组周会分享·第二次周会","k":"auto"},{"i":"K0770","t":"飞镖发射从摩擦轮到拉簧：电磁铁释放力度不足，必须改扳机式","c":"传动机构","b":"我队飞镖发射的两次换代，是一条完整的失败—修正链：\n\n· 2024 以前：摩擦轮发射。实际测试散布较大、射程不足、飞镖飞行姿态不稳定，整体命中率低。\n· 2025：受南航等队伍机械镖方案启发，放弃摩擦轮转向拉簧蓄力。初期用电磁铁控制释放，但发射距离不足；改为扳机式释放机构后才基本达到比赛使用要求。\n\n结论可直接复用：拉簧储能靠电磁铁直接释放，吸力/行程不足以在短行程内放开大载荷，必须走机械扳机（或跷跷板式撒放），电磁铁只做扳机的触发件。这条与 27 赛季刘悦发射机构用「跷跷板＋DG995 舵机撒放」是同一个结论的两次独立验证。","s":"飞书知识库·27赛季机械组周会分享·第二次周会","k":"auto"},{"i":"K0771","t":"丝杆调拉簧伸长量：既调发射力度，也补弹簧衰减","c":"传动机构","b":"2025 赛季拉簧方案的核心可调环节：用丝杆机构调节拉簧的伸长量，从而调节发射力度。\n\n两个作用：① 赛前按靶距标定力度；② 拉簧长期使用后出现弹性衰减时，通过增大拉伸量直接补偿，不必换簧。这一条把「弹簧老化」从不可控变量变成可标定的补偿项，是 25 赛季创下队内飞镖命中率最高赛季的结构性原因之一。\n\n设计提示：丝杆调节端的行程要按「新簧到寿命末簧」的伸长量差值预留，并留可读刻度/限位，否则补偿量无法复用。","s":"飞书知识库·27赛季机械组周会分享·第二次周会","k":"auto"},{"i":"K0772","t":"飞镖装填三代演进：平行四边形前装填 → 大风车 → 齿轮齿条后装填","c":"结构设计","b":"三代装填机构的问题与改法，是一条很干净的迭代记录：\n\n① 25 分区赛：四舵机驱动平行四边形连杆的全自动前装填，用两块承载板把飞镖送进发射滑台。问题：装配误差较大、飞镖装填不平（多连杆累积误差直接体现在镖的姿态上）。\n② 25 国赛：机械夹爪式「大风车」装填，三个装填位置呈等边三角形分布，旋转 60° 切换下一发，20 秒内完成 4 发。装填速度与结构紧凑性明显提升。\n③ 26 赛季：后装填。舵机驱动挂钩完成换弹，飞镖靠重力滑落到承接平台，再由电机驱动齿轮齿条带动平台平行升降送入发射滑台。\n\n演进规律：从「多连杆推镖」（误差链长）→「旋转料仓」（定位靠单一转轴）→「重力落料＋直线升降」（把定位交给重力和导轨），每一步都在削减误差传递环节。\n\n本地视频：机械百科_数据/设计资料/2025飞镖大风车装填_20261112.mp4、2026飞镖后装填机构_20261112.mp4。","s":"飞书知识库·27赛季机械组周会分享·第二次周会","k":"auto"},{"i":"K0773","t":"制导镖翼展倒逼装填滑台重设计（机械镖/制导镖共轨）","c":"结构设计","b":"2026 首次大量使用制导镖，而制导镖与机械镖的主要外形差异是外部飞翼结构——翼展比机械镖大得多。后果：25 赛季的大风车装填方案装不进制导镖。\n\n改法：重新设计装填滑台，做成能同时容纳两种镖的共用滑道，使机械镖与制导镖都能平稳滑动并完成装填。\n\n可复用判据：装填/供弹类机构的包络要按「本队可能用到的最大外形件」设计，而不是按当季主力弹种设计。翼展、尾翼这类外凸特征在旋转料仓里会直接干涉，一旦后期加弹种就要推翻整套机构。","s":"飞书知识库·27赛季机械组周会分享·第二次周会","k":"auto"},{"i":"K0774","t":"镖架同轴缓冲：滑块滑轨＋皮筋，让发射架在导向约束下小幅摆动","c":"结构设计","b":"2026 赛季镖架缓冲的做法：采用滑块滑轨与皮筋连接相结合的结构，使发射架能在导向约束下实现一定范围的摆动，从而优化发射架的同轴缓冲性能。\n\n要点拆解：滑轨负责「约束方向」——后坐时只允许沿一个方向退让，保证复位后轴线不变；皮筋负责「提供回复力与阻尼」——吸收后坐能量并在发射后把架子拉回原位。二者分工，比单纯靠弹簧或硬连接都稳。\n\n效果：整体结构更稳定，装填可靠性与飞镖适配能力同时提升。与早期「自缓冲替代皮筋缓冲」的路线互补：纯皮筋缓冲回复力不可控，加滑轨约束后才可重复。","s":"飞书知识库·27赛季机械组周会分享·第二次周会","k":"auto"},{"i":"K0775","t":"2026 激光压制机制：被雷达照射满进度，飞机发射机构锁 45 秒","c":"赛事场地","b":"2026 赛季新增：雷达可用激光装置照射空中机器人的检测模块，当被瞄准进度达到上限后，飞机的发射机构会被锁定 45 秒。\n\n战术后果：飞机必须减少定点悬停，通过改变航线与攻击节奏降低被持续跟踪的风险。这直接改变了「悬停—瞄准—连发」这种高效率打法的可行性，也把飞机的机动航线设计提到与射击精度同等的位置。\n\n对机械侧的意义：检测模块的安装位置与朝向（能否被激光照到、照到后是否好恢复）开始影响兵种生存性，属结构布局层面要提前考虑的事。","s":"飞书知识库·27赛季机械组周会分享·第二次周会","k":"auto"},{"i":"K0776","t":"审图第一关的两个硬伤：只交装配体不交零件图、压缩包套压缩包","c":"图纸规范","b":"本轮神图群里审图人当场退回的两类问题，可直接做成提交前的自查项：\n\n① 只有装配体、没有零件图。植正雄对周昱翔的提交原话「只有个装配体，没有零件图」；提交人回复「我这里下下来是正常的」——说明问题出在打包环节（只勾了装配体，零件未随包）。自查：解压后零件数应等于装配体引用数，缺件会在他人机器上表现为零件丢失。\n② 压缩包套压缩包。植正雄「压缩包里有压缩包」并 @ 了钟坤霖。后果：审图人要多解一层、容易解到旧版本，且外层包名与实际内容不一致时无法核对版本。自查：一个包一层，包名＝主装配体名。\n\n配套命名体检（本轮两份包）：飞机基地V2.0-S1-梁孜瀚-20261111 包名合规，但内层「基地装甲板2/3/9、护甲1/2/6」等无姓名日期；果冻串腿云台20261111进度 包名缺 V 与 S 级，内层有「机械组-狗头-冯伟杰-202610.26」日期笔误、「Open CASCADE STEP translator 7.5 1.1.1（新」等导入件未改名、多处双点号「..SLDPRT」。","s":"群聊·27神图群 2026-11-11","k":"auto"},{"i":"K0777","t":"果冻串腿云台（冯伟杰）：双滑槽＋主动/从动杆平行四边腿，4310 云台＋3508 摩擦轮","c":"案例开源","b":"27 赛季步兵云台方案，39 件、47.8MB，2026-11-11 提交。结构路线：\n\n· 腿部：上下滑槽（上滑槽/下滑槽-20261103）＋主动杆/从动杆（20261108）构成平行四边形，主动杆与从动杆各带轴承（两个子装配），用双滑槽约束行程——「串腿」的典型画法：杆件成对、轴承内置、两条滑槽定轨迹。\n· 驱动：4310 电机（子装配）＋法兰轴承 6-13-5 与 4-11-4 两种规格；发射端用 3508 电机转子＋3508 摩擦轮 24 1.0。\n· 头部：狗头（子装配）、果冻嘴、头部 CNC、鹅颈 p 点前置版（连草图件一起在包内）——「果冻」指头部包胶/软材料外观件。\n· 感知与附件：裁判系统相机图传模块、官方测速模块、图传固定钣金、小电脑保护钣金件（20261110）、灯条＋灯条固定板（20261111）、UWB 定位模块、GYPO 陀螺仪、MVL-HF0624M-10MP 相机、101022 铝排。\n\n包内自带往年件 4310_-RAU_3505 系列（20250403 版）与步兵新小电脑（带壳）。\n\n本地：04_往年图纸与代码/果冻串腿云台20261111进度-冯伟杰.zip","s":"群聊·27神图群 2026-11-11 冯伟杰提交","k":"auto"},{"i":"K0778","t":"飞机基地 V2.0：合页＋连杆联动开合护甲，装甲/护甲双层分件（梁孜瀚）","c":"结构设计","b":"27 赛季空中机器人基地第二版，52 件、15MB，2026-11-11 提交，包名合规（V2.0-S1-梁孜瀚-20261111）。\n\n结构要点：\n· 开合护甲：以「合页模块」「护甲模块」「护甲加开合模块」三个子装配为核心，靠合页转轴＋连杆（连杆/连杆2/连杆底座/连杆底座2）实现护甲联动开合——一处驱动、多片护甲同步翻转。\n· 装甲与护甲分两层：基地装甲板 2/3/9、护甲 1/2/6 分别建件，配「装甲板固定板2-梁孜瀚」「装甲板固定板3」与「装甲板模块」子装配，可单独更换。\n· 骨架：铝型材 4040-2.0（100/250 两种长度）＋角码 4040 系列（30/60/120/150 五种）＋垂直角件、连接件 1/2/3，属型材框架路线。\n· 导向：光轴＋光轴固定座构成护甲翻转导向。\n· 复用：包内含「机械组-全向轮-刘俊锋-20251213」「机械组-合页1/2」等往年件。\n\n相对 V1.0（11-08 提交，55 件、45.6MB）：件数 55→52，新增独立的「开合护甲平台」与光轴导向件，装甲/护甲拆得更细。\n\n本地：04_往年图纸与代码/飞机基地V2.0-S1-梁孜瀚-20261111.zip","s":"群聊·27神图群 2026-11-11 梁孜瀚提交","k":"auto"},{"i":"K0779","t":"第九次机械组组会安排：11-14 13:00 土槽楼，分享大小 yaw 与舵轮全向轮","c":"队伍制度","b":"林创武 2026-11-12 10:36 发布（19:22 更正时间）：\n\n· 时间：11.14（本周六）下午 1 点。\n· 地点：土槽楼实验室。\n· 分享会内容：① 大小 yaw 结构设计；② 舵轮全向轮结构设计。\n· 另一项重点：强调建立兵种组内的文档体系。\n\n与会要求：必须与会人员＝本周汇报的队员、各兵种组负责人；全体新人参加；大二及以上老队员选择性参加。请假须会前向机械组组长说明。\n\n新人硬性 ddl：本周日（11.15）中午 12:00 前把本周进度图纸发至审图群，并更新研发文档。\n\n注：本条把「文档体系」从口号变成组会正式议题，配合本周知识库把重装组拆成「汇总→子文档」的动作，是同一件事的两面。","s":"群聊·27机械组通知群 2026-11-12","k":"auto"},{"i":"K0780","t":"H2D 局域网模式：同网段可「夺舍」免扫码，代价是不能远程代扫","c":"加工工艺","b":"2026-11-12 队内实测 H2D 打印机的局域网模式（刘俊锋总结）：\n\n好处：同一局域网内，打印机空闲时可直接连接发送任务（俗称「夺舍」），不用再拿手机扫码，省掉每次打印的扫码环节。\n坏处：做不到「让别处的人帮你扫码」这种远程代连——人不在机器旁边时，局域网模式反而堵死这条路。\n\n适用判断：常驻实验室自己的机器开局域网模式更顺；需要跨地点遥控他人机器时仍要走扫码/云端。另注意王雨阳踩过的坑：不熟悉时误开这个模式导致连不上，属设置项而非故障。\n\n关联：知识库《拓竹打印机使用教程》同日已被刘俊锋修改；同主题另有两份旧版文档，引用前先确认版本。","s":"群聊·27机械组 2026-11-12","k":"auto"},{"i":"K0781","t":"耗材采购口径：拓竹原厂耗材性价比存疑，先看测评再定品牌","c":"材料板材","b":"2026-11-12 植正雄派活（todo，ddl 11-16 08:00，负责人冯伟杰）：看测评并统计现有耗材、采购耗材。\n\n采购口径（原话要点）：不一定要买拓竹的；网上很多人反馈拓竹耗材性价比很低。\n\n可复用判断：打印机品牌与耗材品牌是两件独立的事。AMS/参数体系对原厂耗材更友好，但单价差距明显时可以用第三方耗材＋自行标定参数替代；下单前先看第三方实测（尺寸公差、含水率、批次稳定性），不要按品牌绑定采购。\n\n配套背景（与 11-10 PETG 讨论衔接）：队内已定「每次打前烘干」，采购应把干燥条件与包装密封一起纳入考虑。","s":"群聊·27机械组 2026-11-12","k":"auto"},{"i":"K0782","t":"知识库目录重构：重装组拆成「汇总→连接机构研发文档」，两份日志被移出可见范围","c":"队伍制度","b":"2026-11-12 知识库机械空间发生结构级调整（节点总数仍 231，但内容换血）：\n\n① 新增容器节点《2027重装组研发文档汇总》（KqW4wi3L7iysuDkiZMOckURZnGh），正文只有一个子页面列表。\n② 原子文档《2027重装组研发文档》（LAgywaWYJiHJb0kKdjZczjIWnRb）改名为《连接机构研发文档》，并移入上述汇总之下；同时删掉文末「# 底盘」「# 机械臂」两个空章节（原挂 2026.11.08 日期与《机械臂负载测试》引用块），即把机械臂内容从连接机构文档剥离，后续应另立子文档。\n③ 正文实质修正一处：底盘端自由度表述由「只有两个平移自由度（x 和 y）」改为「两个平移自由度（x、y）和一个旋转自由度 yaw」。\n④ 《行星减速箱研发日志》（In34wmSjBiBqLMkQvz8cvCYAnnc）与《2027赛季 串联腿开发日志》（IGsBwZYkSiBavFkox5PcBWYBnhd）从《平衡步兵研发文档汇总》下消失，`wiki +node-get` 返回 131006 permission_denied——文档被移出可见范围或收权限，不是抓取失败。\n\n操作建议：这两份日志是全年故障复盘的主要来源，本地存档（行星减速箱研发日志_2026版.md 63830 字节、2027赛季串联腿开发日志_2026版.md）目前是唯一可读副本，后续引用以本地为准，并尽快向作者确认是否重新开放。","s":"飞书知识库·机械空间 2026-11-12 结构变动","k":"auto"},{"i":"K0783","t":"港科大ENTERPRIZE RM2026 无变形过洞哨兵开源（整机压扁·双yaw·650发弹舱）","c":"结构设计","b":"思路是把一台常规哨兵整体压扁重画，正常哨兵该有的都有：小电脑、双雷达（MID360 倒挂在外侧板上）、双 yaw、全景相机，总高约 248mm。底盘沿用港科 25 舵轮，悬挂行程缩到 10mm 以压低舵轮组总高；大 yaw 由左右两块 5mm 竖玻纤板支撑，以底盘最高面为界分上下两层。因换新电池且底盘被舵轮占满，电池移到大 yaw 上，与小电脑、分电板、开发板同侧贯穿两层，另一侧做 650 发弹舱与 loader（复刻交龙切供改造）。小 yaw 用翎控 7015＋同步轮驱动、4310 直驱 pitch、侧供弹链，无俯角。可借鉴：高度受限时按“两层分区”分配质量与容积的布局法，以及大 yaw 惯量过大、4310 连续小陀螺约十分钟即过热的实测教训。","s":"来源·BBS 2018237","k":"auto"},{"i":"K0784","t":"吉大TARS Go RM2026 科技核心/兑换站机械结构开源（玻纤板+PLA·磁吸锁定）","c":"赛事场地","b":"为完整形态考核、操作手训练和可能的视觉识别方案自制科技核心，各处尺寸与外观与官方件基本一致。整体用玻纤板加 PLA 搭建，材料便宜、加工周期短；背面靠现成电脑支架固定，可自行改固定方式；能量单元与科技核心之间的吸力、各步骤完成后的锁定全部由磁铁实现；灯带表面覆均光纸与薄 TPU。作者复盘：柱子附近与旋转单元出现过打印件断裂，换 PETG 或 ABS 后效果较好，图纸制作较早仍有优化空间。可借鉴：低频使用的场地道具可用板材+打印件快速复刻，并把“吸力+过程锁定”合并到磁铁这一处实现，减少机构件。","s":"来源·BBS 2001719","k":"auto"},{"i":"K0785","t":"江南大学SHARK 鳞次SCALE：SolidWorks总装一键出BOM与分工艺加工文件（v0.6.9）","c":"加工工艺","b":"针对发加工前“数零件、另存图纸、标螺纹、抄采购单、改图后忘了补发”这套流程做的桌面工具：拖入总装（含多层子装配）自动读零件与数量并乘套数；按碳板/玻纤/CNC（有螺纹·无螺纹）/3D打印/光固化/尼龙/铝方管/PMMA 分文件夹，文件名前缀即数量；外购件汇总成 bom表.xlsx，Toolbox 螺钉自动写成“M3×10 杯头 12.9级”。CNC 件可对着 3D 按数字键标 M2~M12，生成带箭头的螺纹标注图与 STEP 同名放在一起发加工商，专治“没标螺纹按光孔做”。多实体零件可拆开命名、相同实体自动合并计数；每台车一个项目，改图后提示哪些件过时，补发默认只勾新的和改过的。原文件只读打开。","s":"来源·BBS 2004432","k":"auto"},{"i":"K0786","t":"涅槃战队 DM6220 测试小云台开源（GM6020版改型·正反装兼容·16mm滑环孔）","c":"结构设计","b":"站内已有 GM6020 小云台方案，作者因 6020 成本过高改用更便宜的达妙 DM6220；两者螺丝孔位与尺寸互不兼容，故按原思路重画一版。所有与电机装配的配合面都支持电机正反装（仅底座保留螺丝孔、未保留接线孔），并预留 16mm 滑环过线孔。因作者已毕业，此件转作公司测试设备用，未画末端 C 板与工业相机承载平台。直接给出 摇臂.step 与 底座.step 两个文件，便于自行打印与修改（作者另提到 makerworld 只能下 STL，逆向很痛苦）。可借鉴：小云台的最小可用构型，以及电机换型时把孔位做成双向兼容、一次适配两种装法的做法。","s":"来源·BBS 2205645","k":"auto"},{"i":"K0787","t":"合工大宣城WDR RMUC2027赛季规划：过洞步兵拨盘同步带传动与轮腿减重实测参数","c":"结构设计","b":"27 赛季两车机械方案。过洞步兵：按轮间距＋草图校核定出极限安全离地 50mm（可过 20° 坡）；为把 z 向压进 240mm，拨盘改同步带传动，选 HTD 5M、315mm（63齿）×9mm 宽、25T/25T（节圆 39.79mm）、中心距 95mm，齿轮啮合留作备选；轮径加到 153mm 兼顾越弹与越障；轮组改单/双悬挂可调＋大滑块，求四轮等高以消偏心。云台变形做了四队方案横评（厦大嘉庚电机直驱、五邑 IMCA X形连杆、华农 Taurus 死点连杆、WDR 自身同步带连杆），权衡后定 DM4340 直驱为保底、死点机构为备选。轮腿：髋关节宽 283mm、链轮中心距 94mm、件重 380g、小腿碳板 232g、轮端行程 230mm。","s":"来源·BBS 1988791","k":"auto"},{"i":"K0788","t":"南理工Alliance RM2026 五自由度科技核心/兑换站机械开源（啮合铝盘9°一格调角）","c":"赛事场地","b":"为完整形态考核与操作手装配训练自制科技核心，目标基本免维护，各装配步骤与外观高度还原官方件，步骤阻力与磁铁吸力也对齐官方制作手册。大臂关节用啮合铝盘做 9° 一格的角度调节（更细的角度会让 CNC 成本指数级上升），调角时通常需两人操作更省力；大臂铝管壁厚当时选了 3、冗余很大，可自行减薄；末端用三个 MG-8010E-i36，摆好位姿后给电机上力即可；图中预留了磁编码器、微动开关、光电门的位置与孔位。图纸走网盘（pwd 1397），含总装打包与部分步骤演示视频，灯带固定打印件藏在盾面零件的隐藏特征里。","s":"来源·BBS 1938962","k":"auto"},{"i":"K0789","t":"合工大苍穹 9齿英雄中心供弹拨盘开源（俯视外径289mm·全CNC可铨洲加工）","c":"传动机构","b":"中心供弹拨盘，拨叉 9 齿，俯视最大外径 289mm，几乎全部零件可走铨洲 CNC 加工。作者给了三条装配修正：18 颗 MR63 轴承建议换成 MR83；该处轴承轴向两侧垫 M3×0.2 垫片；M3-D6×50 铝柱建议改用光轴。可借鉴两点：一是它补齐了同部件多队参数横评（北信科 10 齿 283、青云 9 齿 289、华工 9 齿 230、太原理工 8 齿 250），便于按弹容量与转速选齿数/直径；二是全 CNC 化是对抗打印拨盘断裂、延长寿命的直接做法。附件 487MB，本轮未下载。","s":"来源·BBS 1884198","k":"auto"},{"i":"K0790","t":"同济SuperPower RM2025 大弹丸中心供弹结构开源（六爪迭代·底盘19kg）","c":"传动机构","b":"作者判断到 2024 赛季为止，上场效果较好且公开的大弹丸中心供弹只有哈工大、太原理工两家，故补上一条。以北信科/北理工六爪拨盘（体积小、属该构型开山之作）为基底迭代，针对复刻实测中发现的卡弹点位逐项改进。观察到哈工大与太原理工的共性是拨齿数量多、内螺旋曲线曲率大，作者认为这是上场稳定的关键。该盘装在 24 赛季气动英雄底盘上，自东部分区赛起至发文未再卡弹；底盘除气动云台外总重 19kg（含裁判系统、线材，保险杠双层厚铝管冗余约 1kg）。可借鉴：大弹丸中供弹的“多齿+大曲率”参数取向，以及轻量化底盘的参考路线。","s":"来源·BBS 349122","k":"auto"},{"i":"K0791","t":"能量机关压感传感器实物参数：φ310×0.3mm、不含LED、必须自配灯板","c":"赛事场地","b":"郭卓鑫 11-13 电话问到供应商：传感器直径 310mm、厚度 0.3mm，驱动板约 20×30mm，厂家默认用双面胶固定；传感器本身「上面没有 LED」，只负责判断击打，膜片是半透明的。→ 意味着灯板必须自己做，且传感器、分光板、灯板三者要叠合定位。王奇英问「这两块板子怎么合到一起、总得发光吧」之后，郭卓鑫给的叠法是：背面一块灯板，中间一层透明亚克力，亚克力最上面贴传感器。苏伯伟补：控制板只需一路 PWM 控灯，传感器信号经灯板连接器回扇叶控制板；传感器延伸段是柔性材料，能弯不能折。","s":"群聊·27炒鸡大符 2026-11-13 / 2026-11-19","k":"auto"},{"i":"K0792","t":"官方能量机关资料包到手：《RM大能量机关相关资料.7z》与 jq011 受控传感器图纸","c":"赛事场地","b":"郭卓鑫 11-14 16:24 从供应商处拿到《RM大能量机关相关资料.7z》（16.9MB）；苏伯伟 11-21 16:25 又发《00-jq011-sensor_V02_260129-BP-WG-CG00038(已受控).pdf》（A2 图幅、4.5MB，扫描件无文字层，pypdf 提不出字符）。这是队内第一次拿到传感器厂商的受控图纸，靶面叠层尺寸以后应以它为准，不再靠官方宣传视频截图推算。两份都已存 机械百科_数据/设计资料/。注意：本机没有 7-Zip/WinRAR，7z 内容暂未解开（header 压缩，无库可读）。","s":"群聊·27炒鸡大符 2026-11-14 / 2026-11-21","k":"auto"},{"i":"K0793","t":"大符滑环定案：内径 25.4、18 路、必须 20A 版本","c":"标准件紧固","b":"11-14 定（陈圳灏/庄汇杰/高荣信）。线数算法：电机电源+CAN、灯板 5×2 电源+CAN（板间通信）、R标一路信号 = 18 路。内径 21mm 不够——「我们最少也要上到 18 线，18 线没有 21，感觉要 25.4」。同规格 10A 版本带不动：「20a 的 18 线够，10a 的 18 线不行」。总装里落的型号是 MT2586-P1810（SLDPRT 与 STEP 各一份）。选型归电控负责，机械只留安装空间与轴孔径。这条填掉了库内「大符滑环选型仍是空白」的坑。","s":"群聊·27炒鸡大符 2026-11-13~14；图纸·大符总装V2.1","k":"auto"},{"i":"K0794","t":"大符中心轴改为 φ25×φ19×620 空心钢轴，配 25×47×12 顶丝轴承","c":"传动机构","b":"最早按「没有滑环、从轴心走线」画成中空管并留了 1m 长；确定用滑环后轴长缩到 620mm，外径 25（配 25.4 内径滑环）、内径 19，文件名即轴_25x19x620-高荣信-11.7。材质最后定钢：铝管约 100 元更便宜，但林创武「还是用钢吧，保险点」；单独买轴约 140 元。轴承用顶丝轴承_25x47x12。同步带 HTD 5M，11-22 01:12 实测周长 568mm。卡点：钢管商家「不好打孔」，需另找能带加工服务的供应商。","s":"群聊·27炒鸡大符 2026-11-13 / 11-18 / 11-22","k":"auto"},{"i":"K0795","t":"大符灯效层做减法：去掉黑色外壳，灯带入铝槽＋乳白均光板（参考港科大）","c":"结构设计","b":"官方只给灯板长度，不给角度，也不给外面那圈黑色外壳的尺寸。高荣信方案：把黑色外壳整去掉，红色灯带直接放进铝槽、上面盖乳白均光板，其余位置灯效的形状与位置做到与官方一致，整体显著减重；参考港科大做法。争议点在「不发光时要看起来是黑色」：深大用灰黑透光板，官方更黑，队里旧符是乳白板。林长耿倾向「找接近官方的」。植正雄的补强要求：单单一层铝管壁不抗弯，转角处要加，「薄弱地方记得补强」。","s":"群聊·27炒鸡大符 2026-11-13","k":"auto"},{"i":"K0796","t":"分光板是整块黑色 PC 铣出来的，所有镂空必须带圆角才加工得了","c":"加工工艺","b":"王奇英 11-18/19 两次确认：官方分光板是一块黑色 PC 板铣出、本身没有凹凸；若用打印件做凹凸结构强度不够——去年分光板就是打印件，最后碎裂到用不了，且当时是分件式一圈圈打出来的。11-19 定：PC 分光板用铝柱连底板、灯板直接连底板，中间间距靠铝柱保证。审图硬要求原话：「分光板的镂空要加圆角，不然加工不了」「所有挖槽的地方都记得加圆角」「这两处空隙要加填充物，不能空着」。","s":"群聊·27炒鸡大符 2026-11-18~19","k":"auto"},{"i":"K0797","t":"灯臂面板改亚克力＋PC 双层均光（官方 4+4，队内议 5mm）","c":"材料板材","b":"去年单层 PC 板被打坏，王奇英查官方灯臂是「一层亚克力加一层 PC 均光板」，官方厚度 4+4。讨论结论：跟着官方加亚克力，钟自豪
