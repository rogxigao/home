<style>
:root{

*{box-sizing:border-box}

.meta{max-width:1240px;margin:0 auto;padding:0 20px 12px;font-size:12px;color:var(--ink3);display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:13px 16px;cursor:pointer;position:relative;transition:.16s;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:.16s}
.card:hover{box-shadow:0 1px 2px rgba(20,22,26,.05),0 8px 22px rgba(20,22,26,.06);border-color:#dbe0e6;transform:translateY(-1px)}

.bd{font-size:10.5px;padding:1px 7px;border-radius:4px;background:var(--acc-soft);color:var(--acc);font-weight:600;flex:none}
.card p{margin:0;font-size:12.8px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .sr{font:11px var(--mono);color:var(--ink3);margin-top:5px}
mark{background:#ffe9a8;padding:0 1px;border-radius:2px}
.empty{padding:70px 20px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:6px}
.scrim{position:fixed;inset:0;background:rgba(20,22,26,.26);opacity:0;pointer-events:none;transition:.2s;z-index:40}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,95vw);background:#fff;z-index:50;transform:translateX(102%);
  transition:.26s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(20,22,26,.13)}
.drawer.on{transform:none}
.dh{padding:18px 24px 14px;border-bottom:1px solid var(--line2);display:flex;gap:12px}
.dh .x{flex:1}
.dh h2{font-size:19px;margin:6px 0 4px;line-height:1.45}
.dh .sr{font:11.5px var(--mono);color:var(--ink3)}
.close{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;color:var(--ink3);font-size:16px;flex:none}
.close:hover{color:var(--ink)}
.db{padding:20px 24px 60px;overflow:auto;font-size:14px;line-height:1.85;color:var(--ink2)}
.db p{margin:0 0 10px;white-space:pre-wrap}
.db .rel{margin-top:26px;padding-top:16px;border-top:1px solid var(--line2)}
.db .rel h4{font-size:12px;color:var(--ink3);margin:0 0 8px;font-weight:600;letter-spacing:.06em}
.db .rel a{display:block;font-size:13px;color:var(--acc);text-decoration:none;padding:5px 0;border-bottom:1px dashed var(--line2);cursor:pointer}
.db .rel a:hover{text-decoration:underline}
footer{max-width:1240px;margin:26px auto 0;padding:18px 20px 60px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}
footer b{color:var(--ink2)}
</style>

<script>
const DB = {"generated":"2026-11-23 14:43","total":854,"items":[{"t":"强度","c":"材料板材","b":"**屈服强度**\n\n材料开始发生**明显塑性变形**时的应力值，是衡量材料抵抗永久变形能力的关键指标。\n\n**抗拉强度**\n\n材料在拉伸试验中所能承受的**最大名义应力**，表示材料在断裂前抵抗破坏的最大能力。\n\n**抗压强度**\n\n材料承受**压力**的能力，直至被压坏时的单位面积载荷值。\n\n**抗弯强度**\n\n材料抵抗**弯曲**不断裂的能力，尤其用于考察陶瓷、铸铁等脆性材料。\n\n**抗剪强度**\n\n材料抵抗**剪切力**作用的能力。\n\n**抗扭强度**\n\n材料在扭转变形下，相应于最大扭矩的**最大剪断应力**。\n\n**疲劳强度**\n\n材料在**循环（交变）应力**作用下，经受无限次循环而不发生破坏的最大应力。\n\n**冲击强度**\n\n材料在**瞬间冲击载荷**作用下折断时单位面积所吸收的能量，也称冲击韧性。\n\n**断裂强度**\n\n材料发生**断裂**时的应力值。\n\n**蠕变强度**\n\n在**高温和恒定载荷**下，材料在规定的持续时间内产生的不超过一定限度的蠕变变形所对应的应力。\n\n**持久强度**\n\n在**给定温度和规定时间**内，导致试样发生断裂的应力值，更侧重于评估高温长期使用的断裂抗力。\n\n**剥离强度**\n\n衡量复合材料或粘接结构在**剥离方向**上的粘结能力","s":"飞书·机械组常识文档","k":"doc","i":"K0001"},{"t":"应力","c":"材料板材","b":"应力（stress），又称胁强，指物体受到外力而变形时，在其内部之间产生相互作用的内力。是单位面积上的内力。应力的单位为帕斯卡（Pascal），简称为帕（Pa）,1 Pa=1N/m2\n\n**正应力/法向应力**\n\n作用于截面某一点且与截面**垂直**的应力分量。\n\n包括**拉应力**和**压应力**。是材料发生拉伸或压缩变形的主要原因。\n\n**切应力/剪应力**\n\n作用于截面某一点且与截面**相切**的应力分量。\n\n表示材料内部相邻部分之间的**相互错动**趋势，是产生剪切变形的原因。\n\n**主应力**\n\n物体内某一点处，**切应力为零**的特定方向平面上的正应力。\n\n一点应力状态的特征值，包括最大主应力(σ₁)、中间主应力(σ₂)和最小主应力(σ₃)。是判断材料屈服或断裂的重要依据。\n\n**等效应力**\n\n将复杂的多轴应力状态等效转化为一个**单轴应力**的标量值。\n\n基于**畸变能密度理论**，用于在复杂载荷下预测材料的屈服行为。\n\n**静应力**\n\n**不随时间变化**或变化缓慢的应力。\n\n由静载荷产生，是静强度分析的基础。\n\n**变应力/交变应力**\n\n**随时间周期性变化**的应力。\n\n由变载荷产生，是导致构件发生**疲劳破坏**的主要原因。\n\n**应力集中**\n\n构件因**几何形状突变**而导致的局部应力显著增大的现象。\n\n发生在孔洞、缺口、沟槽等位置，对脆性材料强度影响尤为显著。\n\n**残余应力**\n\n在各种加工工艺结束后，材料内部**残存**的应力。\n\n不受外力时即存在，合理的分布可提高承载能力，不合理的分布则可能导致变形或开裂。\n\n**热应力**\n\n由于构件内部**温度分布不均**，热胀冷缩不同步而产生的内应力。\n\n在铸造、焊接、热处理等过程中尤为重要。\n\n**接触应力**\n\n两物体在压力下接触时，在接触表面局部区域产生的**很大应力**。\n\n齿轮传动、轴承滚动体与滚道接触时的主要失效分析对象，常基于赫兹接触理论计算。\n\n**体积应力**\n\n由于外载荷作用在零件**体积内部**而产生的应力。\n\n包括拉伸、压缩、剪切、扭转和弯曲等应力。\n\n**表面应力**\n\n由于外载作用在零件**工作表面**而产生的应力。\n\n包括挤压应力和接触应力。\n\n**名义应力**\n\n根据**名义载荷**（理想化、未考虑应力集中等因素的载荷）计算出的应力。\n\n常用于初步设计和估算。\n\n**计算应力**\n\n根据**计算载荷**（考虑了各种实际因素的载荷），按既定方法计算出的应力。\n\n用于更精确的强度校核。\n\n# 硬件板子端口预留空间\n\n1. 60口：32-37mm\n2. 30口：15-20mm\n\n# 法兰轴承基础参数\n\n# 机械组测试的目的\n\n# 加强筋设计规范\n\n但这是塑料零件......\n\n# 工程图标注小技巧\n\n# 同步带齿形\n\n同步带轮 S5M 和 5M 的核心区别在于齿形设计：5M是圆弧齿（HTD齿形），S5M是平顶圆弧齿（STD齿形）。  \n  \n· 齿形定义：5M齿形顶部为圆弧，齿槽平滑过渡；S5M齿形顶部为平顶，属于HTD的改良版。  \n· 关键参数 (节距5mm)：5M的齿高约为2.06mm，带厚约为3.8mm；S5M的齿高约为1.91mm，带厚约为3.4mm，比5M略矮。  \n· 适用标准：5M遵循国际标准（如GB/T、ISO）；S5M更常源于日本标准（JIS）。  \n· 传动性能：5M齿部厚实，适合重载场景；S5M齿顶平坦，侧重平稳与低噪音，适合高速、高精度定位场景。  \n· 齿形兼容性：不可混用。两者齿形参数不同，强行混用会导致噪音、震动甚至损坏。\n\n# 潘智杰倾情传授——打印件压轴承设计技巧\n\n# 滚子链换算\n\n节距p=链号\\*（25.4/16）\n\neg：08B对应12.7mm——8\\*（25.4/16）=12.7\n\n# 板材详解","s":"飞书·机械组常识文档","k":"doc","i":"K0002"},{"t":"一、常用的碳纤维：T300","c":"材料板材","b":"- 定位：入门级标准模量碳纤维，市面最常见的低成本碳板基材。\n- 核心参数：弹性模量约230GPa，和T700一致，但抗拉强度仅约3500MPa，比T700低约30%。\n- 特点：成本低、易采购，韧性略好，但抗冲击、抗分层、螺丝孔抗撕裂能力较弱。","s":"飞书·机械组常识文档","k":"doc","i":"K0003"},{"t":"二、常用的玻纤：FR4玻璃纤维板","c":"材料板材","b":"- 定位：RoboMaster官方推荐的标准**绝缘阻燃**玻纤板，机械组核心绝缘/防护板材。\n- 核心参数：E玻纤增强，弹性模量约72GPa，阻燃等级UL94 V-0，离火自熄，绝缘性能稳定。\n- 特点：价格适中、尺寸精度高、吸水率低、耐温155℃以上。\n- 注意：外观为水绿色，务必认准「FR4」标识，避免买到外观相似但不阻燃的G10板材。\n\n**FR4 = FR + 4**\n\n- FR = Flame Retardant，英文直译：阻燃、火焰阻滞\n- 4：NEMA 标准里的第 4 类玻纤环氧配方，特指「E 玻纤 + 溴化阻燃环氧树脂」体系","s":"飞书·机械组常识文档","k":"doc","i":"K0004"},{"t":"三、常见的环氧板：3240环氧板","c":"材料板材","b":"- 定位：低成本黄色环氧酚醛玻纤板，属于**非阻燃**通用板材，仅适合外围非电路场景。\n- 核心参数：E玻纤增强，弹性模量与FR4相近，但无阻燃剂，明火可**持续燃烧**，长期耐温约130℃。\n- 特点：价格便宜、加工性尚可，但尺寸公差大、易吸水变形、绝缘性能一般。\n- 适用场景：外层防护装甲、侧边外壳、外观挡板等完全远离电池/电路板的非承重部位。\n\n# 阻燃等级\n\n# 0721 豆小姐：\n\n“**花少量重量、大幅提升刚度 / 强度**” 的结构设计手法，核心逻辑都相通：**把独立受弯的零件拼成整体受力体系，或者把低效的弯曲受力，转化为高效的拉 / 压受力。**下面按你最熟悉的机甲 / 支架场景分类整理，全部是 RM、非标设计里高频用到的经典方案。","s":"飞书·机械组常识文档","k":"doc","i":"K0005"},{"t":"1. 口字型闭合箱型框架","c":"结构设计","b":"就是在你门型架的基础上，底部再加一根横梁，形成完整的矩形闭合框。\n\n- **原理**：开口的门型架抗扭能力很弱，一旦受扭就会变形；闭合的箱型结构，抗扭刚度会比开口结构高一个数量级，抗弯也会进一步提升。\n- **RM对应场景**：车架左右主侧板+上下横梁围成的主框、云台的完整外框，本质都是闭合箱型，整车抗颠、抗撞、抗扭的核心全靠它。","s":"飞书·机械组常识文档","k":"doc","i":"K0006"},{"t":"2. 三角斜撑（桁架化补强）","c":"结构设计","b":"在门型框/悬臂结构里，加一根斜杆拼成三角形，利用“三角形几何不变形”的特性。\n\n- **原理**：原来的横梁、立柱都是受弯，加了斜杆后，大部分力会变成斜杆的拉力/压力，材料利用率远高于受弯，加一根细斜杆就能让刚度翻倍。\n- **RM对应场景**：车架侧板的斜加强筋、发射机构支架的三角斜撑、大尺寸云台的斜拉补强，都是最常见的轻量化提刚操作。","s":"飞书·机械组常识文档","k":"doc","i":"K0007"},{"t":"3. 多跨连续框架","c":"结构设计","b":"在长跨度的横梁中间，多加1\\~2根立柱，把一整根长悬臂/长梁，切成几段短的。\n\n- **原理**：梁的变形和跨度的三次方成正比，跨度砍半，变形会降到原来的1/8左右，刚度提升极其夸张。\n- **RM对应场景**：长车架中间加中隔板、长云台横梁中间加支撑柱，都是用这个思路解决“长梁软、晃得厉害”的问题。\n\n---","s":"飞书·机械组常识文档","k":"doc","i":"K0008"},{"t":"1. 三角加强肋/筋板","c":"结构设计","b":"在悬臂根部、板件拐角处，加一块三角形的筋板。\n\n- **原理**：相当于局部增加了截面的“高度”，直接提升该处的抗弯能力，是解决“根部应力集中、根部变形大”的首选方案。\n- **RM对应场景**：所有悬臂支架的根部、轴承座侧边、电机安装座背面，几乎都能加筋，属于机械设计的“万金油”操作。","s":"飞书·机械组常识文档","k":"doc","i":"K0009"},{"t":"2. 板材翻边/卷边","c":"材料板材","b":"把薄铝板、碳板的边缘折起一个边（翻边），相当于把平板变成L型/槽型截面。\n\n- **原理**：平板的抗弯能力极差，折边后截面惯性矩会暴涨，几乎不增加重量，就能让平面外刚度提升几倍。\n- **RM对应场景**：钣金车架的折边、碳板的围边、薄安装板的翻边，都是用极低的成本解决“薄板软、容易颤”的问题。","s":"飞书·机械组常识文档","k":"doc","i":"K0010"},{"t":"3. 节点角撑","c":"结构设计","b":"在横梁和立柱的直角连接处，加一块三角板/角件把拐角顶住。\n\n- **原理**：很多框架“软”，不是板子本身不行，是节点处会转动、变形；加角撑相当于把“软节点”变成“刚节点”，让框架真正形成整体受力。\n- **RM对应场景**：车架横梁和侧板的连接角码、云台支架的拐角补强片，本质都是在强化节点刚度。\n\n---","s":"飞书·机械组常识文档","k":"doc","i":"K0011"},{"t":"1. 工字型/槽型截面","c":"材料板材","b":"把材料尽量放在远离截面中心的位置，做成“上下厚、中间薄”的工字型，或者凹槽型。\n\n- **原理**：抗弯靠的是截面最外侧的材料，中间部分贡献很小；把中间材料挪到两边，同样重量下，抗弯刚度能比实心矩形高好几倍。\n- **RM对应场景**：车架主梁、云台横梁常用的工字型铝梁、槽型碳板，都是这个原理。","s":"飞书·机械组常识文档","k":"doc","i":"K0012"},{"t":"2. 空心管截面","c":"材料板材","b":"同样重量的棒料，做成空心圆管/方管。\n\n- **原理**：抗扭、抗弯的效率远高于实心棒，尤其是抗扭，空心管的材料利用率是实心的数倍。\n- **RM对应场景**：轮组支撑轴、小直径推杆、转轴类零件，优先用空心管，减重又提刚。","s":"飞书·机械组常识文档","k":"doc","i":"K0013"},{"t":"3. 点阵/蜂窝拓扑结构","c":"结构设计","b":"3D打印零件内部做成蜂窝、点阵，而不是实心。\n\n- **原理**：和你之前学的拓扑优化一致，只在受力路径上保留材料，内部用轻质点阵填充，同样刚度下重量可以减轻30%\\~60%。\n- **RM对应场景**：异形关节件、轻量化云台支架、定制化3D打印零件，是高端轻量化的常用手段。\n\n---","s":"飞书·机械组常识文档","k":"doc","i":"K0014"},{"t":"1. 斜拉杆/拉索补强","c":"结构设计","b":"在悬臂梁的顶端，斜拉一根拉杆/钢缆到基座上。\n\n- **原理**：原来悬臂是纯受弯，加拉杆后，大部分载荷变成拉杆受拉、立柱受压，拉压的材料利用率远高于受弯，大跨度下变形会极小。\n- **RM对应场景**：大尺寸发射架、高云台的侧向补强，空间允许时效果极强。","s":"飞书·机械组常识文档","k":"doc","i":"K0015"},{"t":"2. 增加支撑点（悬臂变简支）","c":"结构设计","b":"给长悬臂的自由端加一个支撑，把“悬臂梁”变成“简支梁”。\n\n- **原理**：同样长度、同样载荷，简支梁的最大弯矩只有悬臂梁的1/4，变形也会小非常多。\n- **RM对应场景**：原来单侧固定的长轴，改成两端支撑；单边悬的横梁，另一端加个支撑座，硬度直接上一个台阶。","s":"飞书·机械组常识文档","k":"doc","i":"K0016"},{"t":"3. 对称双支撑布局","c":"结构设计","b":"把单悬臂的单侧受力，改成双立柱对称支撑（也就是你最开始的两根立柱+顶梁的原型）。\n\n- **原理**：载荷由两个支撑共同承担，每个零件的受力减半，同时对称结构天然抗扭、抗倾覆能力更强。\n- **RM对应场景**：云台的双Pitch支撑臂、发射机构的双侧立板，都是典型的双支撑布局，比单悬臂稳得多。\n\n---","s":"飞书·机械组常识文档","k":"doc","i":"K0017"},{"t":"底层一句话总结","c":"结构设计","b":"所有这些手法的本质都是一个思路：**让更多材料参与受力，让力走更短、更高效的路径，尽量用拉压代替弯曲**。你做拓扑优化的时候，软件自动生成的那些异形结构，也是在自动遵循这个规律。\n\n---\n\n# 围箍效应（环箍约束效应）\n\n围箍效应（环箍约束效应） 完整闭合空心截面（圆管、方管、矩形管、箱型截面），四周管壁互相牵制、彼此约束，像 “箍” 一样限制相邻板件向外 / 向内自由变形、鼓曲、凹陷，大幅提升板件抗屈曲能力、整体刚度与极限承载力。\n\n---\n\n# 达克罗\n\n达克罗不是特指某一种垫圈，它**是一类表面涂层工艺**，垫圈、螺栓、螺母、衬套、钣金件都可以做达克罗处理。垫圈只是众多能做达克罗处理的零件之一，垫圈还分平垫、弹垫、自锁垫等不同款式。\n\n达克罗涂层核心作用：（5 点，按优先级排序）\n\n1. 超强防锈防腐\n2. 杜绝氢脆，保护高强件\n3. 适配铝件，减少电化学腐蚀\n4. 耐高温、工况适应性强\n5. 薄涂层，不影响装配精度\n\n# 碳纤维板（Carbon Fiber Reinforced Polymer，**CFRP板**）的成型工艺\n\n主要取决于产品性能要求、生产批量和成本。常见工艺如下：","s":"飞书·机械组常识文档","k":"doc","i":"K0018"},{"t":"手糊成型（Hand Lay-up）","c":"材料板材","b":"这是最基础、成本最低的工艺。\n\n**工艺流程：**\n\n1. 模具处理（脱模剂）\n2. 铺放碳纤维布\n3. 刷涂树脂（环氧树脂最常见）\n4. 多层重复铺设\n5. 固化（室温或加热）\n6. 脱模、修边\n\n**优点**\n\n- 设备简单\n- 成本低\n- 适合小批量、样件\n\n**缺点**\n\n- 人工因素影响大\n- 厚度一致性差\n- 孔隙率较高\n- 力学性能一般\n\n---","s":"飞书·机械组常识文档","k":"doc","i":"K0019"},{"t":"真空袋成型（Vacuum Bagging）","c":"基础理论","b":"在手糊基础上增加真空压力，是实验室和高校最常见的方法之一。\n\n**工艺流程**  \n铺层 → 铺脱模布 → 导流网 → 真空袋 → 抽真空 → 加热固化\n\n真空压力通常约为：\n\n> **-0.08～-0.10 MPa**\n\n**优点**\n\n- 排除气泡\n- 提高纤维体积分数\n- 表面质量好\n- 成本适中\n\n**缺点**\n\n- 仍属于半人工工艺\n- 效率一般\n\n适用于：\n\n- 无人机\n- 机器人零件\n- 科研试件\n\n---","s":"飞书·机械组常识文档","k":"doc","i":"K0020"},{"t":"热压罐成型（Autoclave Molding）","c":"基础理论","b":"航空航天领域应用最广，也是性能最高的工艺之一。\n\n**工艺流程**  \n预浸料铺层 → 真空袋封装 → 热压罐加压加热 → 固化 → 脱模\n\n典型参数：\n\n- 温度：120～180 ℃（甚至更高）\n- 压力：0.4～0.7 MPa\n- 真空：约-0.09 MPa\n\n**优点**\n\n- 孔隙率极低（通常<1%）\n- 力学性能最佳\n- 尺寸精度高\n\n**缺点**\n\n- 设备昂贵\n- 周期长\n- 能耗高\n\n应用：\n\n- 飞机机翼\n- 航天器\n- F1赛车\n- 高端自行车\n\n---","s":"飞书·机械组常识文档","k":"doc","i":"K0021"},{"t":"模压成型（Compression Molding）","c":"材料板材","b":"适合大批量生产碳纤维板。\n\n**工艺流程**  \n预浸料/SMC放入模具 → 合模 → 加热加压 → 固化 → 脱模\n\n压力通常：\n\n> **5～20 MPa**\n\n**优点**\n\n- 生产效率高\n- 厚度一致\n- 自动化程度高\n\n**缺点**\n\n- 模具成本高\n- 不适合复杂铺层\n\n应用：\n\n- 汽车覆盖件\n- 电子产品外壳\n- 体育用品\n\n---","s":"飞书·机械组常识文档","k":"doc","i":"K0022"},{"t":"拉挤成型（Pultrusion）","c":"材料板材","b":"主要用于生产连续板材、型材和棒材。\n\n工艺流程：\n\n连续纤维 → 树脂浸渍 → 加热模具 → 连续拉出 → 定长切割\n\n特点：\n\n- 连续生产\n- 效率高\n- 成本低\n- 长度几乎不受限制\n\n适用于：\n\n- 碳纤维板\n- 工字梁\n- 管材\n- 建筑加固板\n\n---","s":"飞书·机械组常识文档","k":"doc","i":"K0023"},{"t":"树脂传递模塑（RTM，Resin Transfer Molding）","c":"队伍制度","b":"近年来汽车行业应用越来越多。\n\n工艺流程：\n\n干纤维预成型 → 放入闭模 → 注入树脂 → 固化 → 脱模\n\n**优点**\n\n- 双面光洁\n- 尺寸精度高\n- 自动化程度高\n\n**缺点**\n\n- 模具投资较高\n- 工艺控制要求高\n\n应用：\n\n- 汽车\n- 医疗器械\n- 无人机\n- 轨道交通\n\n---","s":"飞书·机械组常识文档","k":"doc","i":"K0024"},{"t":"碳纤维板典型制造流程（以高性能板材为例）","c":"材料板材","b":"```Plain Text\n碳纤维丝\n      │\n      ▼\n织造成碳纤维布\n      │\n      ▼\n浸渍环氧树脂（制成预浸料）\n      │\n      ▼\n铺层（按0°/45°/90°等方向设计）\n      │\n      ▼\n真空封装\n      │\n      ▼\n热压罐或热压机固化\n      │\n      ▼\n脱模\n      │\n      ▼\n修边\n      │\n      ▼\nCNC加工\n      │\n      ▼\n成品碳纤维板\n```","s":"飞书·机械组常识文档","k":"doc","i":"K0025"},{"t":"对于机械工程和科研领域","c":"材料板材","b":"如果是制备**力学性能测试试样**或开展**复合材料研究**，最常采用的是：\n\n- **真空辅助成型（Vacuum Bagging）**：设备成本适中，性能较好，适合高校实验室。\n- **热压罐成型（Autoclave）**：用于航空航天级高性能试样，质量最高。\n- **热压模压（Hot Press Molding）**：许多高校和科研院所会采用热压机配合预浸料制备平板试样，工艺稳定、厚度均匀，适合制作拉伸、压缩和弯曲等标准试样。\n\n如果你的研究方向涉及**农业机械、机械设计或碳纤维结构件**，我还可以介绍**碳纤维层合板（Laminate）的铺层设计（如0°/±45°/90°）**、**成型缺陷（孔隙、分层、树脂富集）以及力学性能与成型工艺之间的关系**，这些内容在论文和科研中非常常见。\n\n# 力学分类\n\n# 有关汽车行驶中摩擦力的几个问题\n\n# 等寿命摩擦","s":"飞书·机械组常识文档","k":"doc","i":"K0026"},{"t":"核心定义","c":"材料板材","b":"一对相互摩擦、啮合的构件（摩擦副），通过材料匹配、几何参数优化、载荷分配设计，使两个接触零件磨损速率接近，达到大致相同的使用寿命；避免其中一个零件快速磨损失效，另一个还有大量剩余寿命，造成浪费。","s":"飞书·机械组常识文档","k":"doc","i":"K0027"},{"t":"通俗理解","c":"传动机构","b":"最坏设计：小链轮很快磨秃、链条完好，或者链条拉长报废、链轮几乎无损；一者提前失效，整套传动被迫提前更换。 ✅ 等寿命目标：链条达到允许伸长量的同时，链轮齿磨损程度同步到达报废标准；两者接近同时达到使用极限。\n\n# 链轮包角\n\n链传动包角：链条紧贴、啮合在链轮轮齿上的那段圆弧对应的圆心角度。 \n分为：小链轮包角 α₁、大链轮包角 α₂。\n工程上重点关注小链轮包角。\n\n# 宝藏视频and宝藏UP\n\n一个视频所讲解的知识点给我带来如此震撼的感觉，上一次已经是很久之前了，大概是证明椭圆的“a+b=定值”等价于“任意一个焦点发出的光线，最终一定经过另外一个焦点”的那个视频了。\n\n# 维拉专利 Wera Hex‑Plus\n\n- Hex‑Plus**是几何轮廓，不是钢材 / 涂层**；批头六角平面做内凹，避开尖角，靠平面传递力矩，不是顶点受力Wera Tools。\n- 可承受最多**+20% 扭矩**，兼容全部标准公制内六角螺丝，不需要特殊螺丝Wera Tools。\n- 作用：减小缺口效应，防止螺丝内六角被碾圆滑牙，**不能防止批头本身过载折断**Wera。\n\n# 威帝斯——高速钢镀钛","s":"飞书·机械组常识文档","k":"doc","i":"K0028"},{"t":"🔧核心参数","c":"标准件紧固","b":"1. **基体材质**：HSS高速钢，淬火加硬，抗扭，不易崩尖\n2. **涂层**：PVD镀钛（氮化钛TiN，金黄色）\n\n   - 降低摩擦，螺丝不易滑牙\n   - 提升表面耐磨、防锈，延长刀头寿命\n3. **常用规格（公制）**：H0.9 /1.27 /1.3 /1.5 /2.0 /2.5 /3.0 mm内六角批头\n4. **手柄**：铝合金防滑滚花手柄，快换直柄结构","s":"飞书·机械组常识文档","k":"doc","i":"K0029"},{"t":"📌高速钢镀钛原理","c":"加工工艺","b":"- 高速钢(HSS)提供强度韧性；**镀钛是表面薄层，不增加基体硬度**，主要减摩擦、耐磨防锈，不能把普通钢变成超硬钢。\n\n---\n\n# 不同体系的硬度测量单位\n\n1. **HRA：洛氏硬度 A 标尺（HR‑A）**\n\n- 属于**洛氏硬度 HR**，金属硬度\n- 压头：金刚石圆锥，砝码加载\n- 对象：钢、硬质合金这类硬金属\n\n1. **邵氏 A（Shore A）**\n\n- 属于**邵氏硬度**，高分子（橡胶、硅胶、PU）\n- 压头：小钢针，弹簧弹力，不是砝码\n- 对象：橡胶、弹性体，软到中等硬度塑胶\n- 我们常用的“包胶轮65A”的A就是这个**邵氏 A**\n\n---\n\n# 📊线切割    中走丝 vs. 快走丝 vs. 慢走丝","s":"飞书·机械组常识文档","k":"doc","i":"K0030"},{"t":"基本介绍","c":"加工工艺","b":"**走丝方式与速度**\n\n- **中走丝**：复合走丝。粗加工高速（8-12 m/s），精加工切换低速（1-3 m/s）。\n- **快走丝**：高速往复走丝，速度高，通常在8-12 m/s左右。\n- **慢走丝**：低速单向走丝，速度极低，通常**低于0.2 m/s**。\n\n**电极丝材质与使用**\n\n- **中走丝**：主要用**钼丝**，可**重复使用**，但损耗比快走丝小。\n- **快走丝**：用**钼丝**，可**反复使用**，比较节约。\n- **慢走丝**：用**铜丝**（或镀锌丝），**一次性使用**，放电后即废弃。\n\n**加工精度**\n\n- **中走丝**：较高。通常可达**±0.005mm**，优化后可达**±0.003mm**。\n- **快走丝**：较低。受电极丝抖动和损耗影响大，精度相对较差。\n- **慢走丝**：极高。可达**0.001mm级**，接近磨削水平。\n\n**表面粗糙度 (Ra)**\n\n- **中走丝**：较好。通常在**Ra 1.41.7μm\\*\\*，优化后可达\\*\\*Ra 0.651.2μm**。\n- **快走丝**：较差。表面有明显切割条纹，光洁度低。\n- **慢走丝**：极好。可达**Ra 0.8μm**或更优，表面质量均匀。\n\n**切割速度与效率**\n\n- **中走丝**：**平均效率高**。虽然多次切割会拉低单次速度，但综合效率优于快走丝，尤其粗切阶段速度很快。\n- **快走丝**：**单次切割速度快**，但仅能完成粗加工，综合效率受限于后续手工修模。\n- **慢走丝**：**绝对速度慢**，但可实现“一次成型”，无需后续处理，总周期可控。\n\n**成本与价格**\n\n- **中走丝**：**性价比高**。机床价格和运行成本（钼丝重复使用）远低于慢走丝，略高于快走丝。\n- **快走丝**：**最低**。机床和耗材成本都非常低。\n- **慢走丝**：**最高**。机床昂贵，且铜丝一次性消耗，运行成本高。\n\n**典型应用场景**\n\n- **中走丝**：对精度和光洁度有一定要求的**精密模具**、精密零件、复杂异形件等。\n- **快走丝**：精度要求不高的**粗加工**、一般模具、零件下料等。\n- **慢走丝**：**高精度、高附加值**的精密模具、航空航天零件、医疗器械等尖端领域。","s":"飞书·机械组常识文档","k":"doc","i":"K0031"},{"t":"总结：抉择","c":"加工工艺","b":"选择的关键在于权衡**精度需求**与**成本预算**。\n\n- 如果你追求**极致精度和表面质量**，且预算充足，**慢走丝**是唯一选择。\n- 如果你的加工需求以**粗加工**为主，对精度要求不高，**快走丝**最具成本效益。\n- 对于大多数**精密模具和零件**的加工，**中走丝**在成本、精度和效率之间取得了很好的平衡，是性价比极高的折中方案，这也是它成为国内主流选择的原因之一。\n\n---\n\n# 齿轮变位\n\n角度变位是齿轮变位的一种，它的核心在于一对啮合齿轮的**变位系数之和不为零（x₁ + x₂ ≠ 0）**。最简单的理解方式是：它通过改变齿轮的啮合角来**主动调整中心距**，以适应不同的装配或设计需求。","s":"飞书·机械组常识文档","k":"doc","i":"K0032"},{"t":"⚙️ 核心特征：与“高度变位”的对比","c":"材料板材","b":"变位齿轮分为两种，关键区别在于变位系数和是否为零：\n\n- **高度变位 (x₁ + x₂ = 0)**：中心距和啮合角**保持不变**，只是通过“一正一负”的变位来改善单个齿轮的强度或避免根切，不能用来调整中心距。\n- **角度变位 (x₁ + x₂ ≠ 0)**：中心距和啮合角会**发生改变**。这是它最根本的特征，也是它能“配凑中心距”的原因。","s":"飞书·机械组常识文档","k":"doc","i":"K0033"},{"t":"🎯 主要目的：为什么要用角度变位？","c":"传动机构","b":"工程师采用角度变位通常是为了实现以下目的：\n\n- **灵活配凑中心距**：这是最核心的用途。当设计要求的中心距无法通过标准齿轮实现时，可通过角度变位调整，而不必改变齿数或模数。\n- **提升承载能力**：**正变位**（x₁ + x₂ > 0）能增大啮合角，使齿根变厚，从而显著提高轮齿的弯曲强度和接触强度。\n- **改善啮合特性**：可用于更灵活地选择齿数，并优化齿面的滑动率，使传动更平稳、磨损更均匀。","s":"飞书·机械组常识文档","k":"doc","i":"K0034"},{"t":"⚠️ 需要注意的代价","c":"传动机构","b":"角度变位并非“免费的午餐”，采用它通常意味着需要权衡：\n\n- **重合度可能下降**：尤其是正变位，在提升强度的同时，往往会导致端面重合度**略微减小**，可能影响传动的平稳性。\n- **计算更复杂**：相比高度变位，其几何尺寸的计算过程更为繁琐，需要考虑啮合角的变化。\n\n角度变位是一种通过**主动改变啮合角**来**灵活调整中心距、并定向改善齿轮强度**的设计手段，在行星传动等对空间和强度有要求的场合应用广泛。\n\n角度变位是齿轮变位的一种，它的核心在于一对啮合齿轮的**变位系数之和不为零（x₁ + x₂ ≠ 0）**。最简单的理解方式是：它通过改变齿轮的啮合角来**主动调整中心距**，以适应不同的装配或设计需求。","s":"飞书·机械组常识文档","k":"doc","i":"K0035"},{"t":"工具购买指南（自己买了就不能偷拿别人的了哟）","c":"标准件紧固","b":"在装车与装场地时我们会用到很多工具\n\n小型工具类：\n\n内六角扳手M2—M5（非常常用）\n\n内六角扳手M6—M8（不太常用）\n\n迷你十字套筒（包含M2—M4）7字套筒（M3和M4）\n\n尖嘴钳（小空间）和虎头钳（大空间）\n\n工具箱（先买便宜的）\n\n进阶工具：航模螺丝刀（不易滑丝M2—M4）\n\n# 嘶，好像没有什么事情干，让我来学习一下四冠王\n\n【机械部入门【机械原理】】 \n\n【机械部入门【工程材料】】 \n\n【机械部入门【材料力学】】 \n\n# OK，这些都太EZ（其实并非）了，该开始做场地道具了","s":"飞书·重生之我进入Taurus机械组","k":"doc","i":"K0036"},{"t":"打印机修理（直接放官方链接）","c":"加工工艺","b":"x1c堵头修理\n\nh2d堵头修理\n\n**如有其他情况，请寻找师兄师姐解决**\n\n# 从你的想象到世界现象\n\n终于会使用这些加工工具了，接下来自己设计一些东西吧。\n\n设计并不是一件简单的事，需要你怀着一颗真正的工程师的心去完成这个过程。在设计的过程中，你要有以下几个步骤：","s":"飞书·重生之我进入Taurus机械组","k":"doc","i":"K0037"},{"t":"1.学习","c":"结构设计","b":"拿到一个任务，首先要理解这个任务，了解这个任务是为了干什么，接着去学习这个任务相关的内容。例如我现在要设计一个机械臂，那么我就要理解为什么设计这个机械臂，我设计这个机械臂是为了实现什么功能，为了实现这些功能我要做出什么设计，这个设计是否合理，这个设计在装配时会有什么问题，如何设计才能更加的便于装配。\n\n在经验较少的初期可以去robomaster论坛（","s":"飞书·重生之我进入Taurus机械组","k":"doc","i":"K0038"},{"t":"2.设计","c":"图纸规范","b":"**管图纸的命名：**\n\n装配体命名规范：装配体名V1.0-Sn-自己的名字-20251112\n\n零件命名规范：零件名（该零件的尺寸参数等）-自己的名字-20251112\n\n例如:英雄V1.0-ST-自己的名字-20251112\n\n       深沟球轴承（5-14-5）-自己的名字-20251112\n\n注:\n\n装配体大改动小数点前的数字加1，小改动小数点后的数字加1，初始版本号为V1.0\n\nSn表示审核号，n表示审核次数，n为T时表示审核通过，可发加工。\n\n要求**每个装配体的每个零件的每个版本**在保存时都要更改零件名，无论是多么小的改动都要改，更改版本号即可。\n\n**严格按照此命名规范命名**\n\n**设计**\n\n1.首先，设计 ≠ 画图，设计并不只是用SolidWorks把想法建出来，这是一个误区。真正的设计，本质是在一堆的约束条件下，找到最合理的那一个方案。\n\n约束类型：\n\n| **约束类型** | **具体例子** |\n|-|-|\n| 功能约束 | 机构要完成什么动作？行程、速度、负载多大？ |\n| 空间约束 | 机器人留给这个机构的空间有多大？不能碰到裁判系统、不能超重？ |\n| 强度约束 | 受力多大？会不会断、会不会变形？ |\n| 加工约束 | 这个形状加工得出来吗？公差能达到吗？成本能接受吗？ |\n| 装配约束 | 装得进去吗？坏了方便拆吗？ |\n\n2.好的设计是什么样的\n\n1.功能达标；\n\n2.可靠耐用；\n\n3.可加工；\n\n4.易装配维护。\n\n顺序是先**能实现**，再**能可靠实现**，最后才追求**做得完美**。\n\n3.设计的基本流程\n\n设计时应首先了解需要的标准件的规格（在淘宝上查，理论上都是会给2d图纸，实在没有就找淘宝商家要3d模型。），此时将关键的参数记下或者根据2d图纸画出零件图，装配到装配图中进行干涉检查。\n\n| **步骤** | **要回答的问题** | **产出物** |\n|-|-|-|\n| ① 需求分析 | 到底要做什么？约束是什么？ | 一份明确的需求清单 |\n| ② 方案构思 | 用什么原理、什么结构来实现？ | 方案草图 + 机构选型 |\n| ③ 结构设计 | 每个零件长什么样、怎么连起来？ | 三维模型 + 工程图 |\n| ④ 验证迭代 | 能不能用、会不会坏？哪里要改？ | 检查报告 + 改进后的新版本 |\n\n干涉检查\n\nSolidWorks中有自带的干涉检查功能\n\n1.点击评估；\n\n2.干涉检查；\n\n3.选中需要进行干涉检查的零件；\n\n4.点击计算进行干涉检查，得出结果；\n\n5.点击干涉位置可以看出具体位置，干涉位置会被标红。","s":"飞书·重生之我进入Taurus机械组","k":"doc","i":"K0039"},{"t":"3.审图","c":"图纸规范","b":"新入队的成员，经验较少，设计难免会有一些漏洞，这时以自己的阅历可能无法发现这些问题。这时我们会要求将自己的设计图纸发到神图群（审图群），把自己的图纸交给经验丰富的师兄师姐来帮你找到漏洞，并提出建议，然后自己根据建议做出更改，直到审图通过。","s":"飞书·重生之我进入Taurus机械组","k":"doc","i":"K0040"},{"t":"4.发加工","c":"加工工艺","b":"发加工是将一些非标件交给加工商的过程，我们队里常把购买成品件也算在发加工这一流程内。\n\n1.购买标准件\n\n要想购买标准件，首先要了解什么是标准件，标准件指所有实现了标准化的机械零部件，包括紧固件，传动件、轴承、弹簧、密封件、液压/气动元件等。标准件通常有统一的标准（国标，欧标等），标准件的价格通常远低于定制件。(标准件的存在提高了设计效率、保证了产品质量和互换性、降低了生产成本，对于现代的工业体系来说标准件是不可或缺的一部分。)\n\n购买标准件的常见渠道是万能的淘宝，在淘宝上可以购买到几乎所有需要的标准件和非标件（非标件我们常在与我们队有合作的厂家那里定制）。\n\n2.定制非标件\n\n1.打印件\n\n将文件导出为stl或者step，之后导入Bambu Studio调好参数后，使用3d打印机将这些零件打印出来。\n\n2.板材\n\n将文件导出dwg或dxf后，导入到ArtCAM，规划好刀路后，使用雕刻机对完整的板材进行切割即可。必要情况下会与合作的厂家直接联系，流程是将文件到出为step或dwg、dxf，需要注意的是在这里对文件的命名要有一定的可读性，包括材料，数量，板材厚度等，例如：\n\n3.cnc铝合金\n\n铝合金的加工分为两种\n\n1.在铨洲智造平台\n\n点击智能制造\n\n上传文件（此处的文件格式为step）\n\n确定上传\n\n等待解析\n\n解析完后检查是否有问题\n\n没有问题后就立即下单\n\n2.找其他合作的加工商加工（通常是在微信上联系）。\n\n将自己的图纸导出为step文件发给加工商，通常需要带有工程图。\n\nSolidWorks工程图制作教程：\n\n此视频只介绍了如何制作工程图，工程图中最重要的是标注公差、同心度、平行度等形位公差。","s":"飞书·重生之我进入Taurus机械组","k":"doc","i":"K0041"},{"t":"5.装配","c":"结构设计","b":"自己设计的东西当然要自己装\n\n自己装的好处：\n\n1.如果你在设计时就已经考虑了如何装配，那么你的装配速度会更加的快，会更加的得心应手。\n\n2.如果你在设计时未考虑如何装配，那么你的装配可能会很难受，但是这也是一段学习的过程，是经验的积累过程，很多的事情都是经历过了之后才会有更深的印象，也会对设计有更多的理解。","s":"飞书·重生之我进入Taurus机械组","k":"doc","i":"K0042"},{"t":"1.2 缺点与遗留问题","c":"装配维护","b":"- **抗撞击冗余不足**：局部薄弱结构（挡板边角、限位凸起）耐冲击性差（大小弹丸击打），多次对抗后易出现松动、掉漆、板材翘边、螺丝滑丝等问题，需要频繁检修。\n- **维护体系不完善**\n\n---","s":"飞书·场地道具开发维护文档","k":"doc","i":"K0043"},{"t":"2.4 飞镖组需求","c":"结构设计","b":"- **飞镖靶靶体及移动结构**：飞镖组只需要一个飞镖靶，轨道移动部分要基本和赛场上的一样，可以把轨道斜放，加宽轨道支撑，不要跟去年一样只有一个单独支撑点，靶子需要能承受较大冲击载荷，不轻易变形，靶子和绿灯同步移动，靶面与地面角度要符合规则要求，飞镖靶整体要有充分缓冲结构，防止被射爆，减少锐边直接出现在飞镖发射轨迹上。\n- **飞镖靶整体框架**：增加后腿支撑，减少因撞击力度过大导致有后翻趋势而产生的移动；减少飞镖能直接穿过去的结构，防止刮伤飞镖。\n- **缓冲**：用高密度海绵，或相关能吸收动能且能恢复原样的材料，要大面积，厚，耐用的，不容易被打穿的材料。\n\n---","s":"飞书·场地道具开发维护文档","k":"doc","i":"K0044"},{"t":"4. 个人建议","c":"装配维护","b":"1. GGBoom：各组之间要做到及时沟通协商。电控、视觉调车出现问题，必须及时向机械等相关小组反馈，协同处理故障。备赛过程中，超过半数的问题，本质是沟通协调不到位造成的信息差所导致。\n2. 林创武: 让我想想\n3. 王奇英：场地道具对于每个兵种测试都是很重要的，相关的场地道具负责人不是说把东西设计出来装好就可以了，而是需要相关人员一整个赛季的维护，不要等到要测了，才匆匆忙忙去检查场地道具，然后发现问题，急急忙忙的修，又发现缺零件又急急忙忙的发零件，所有人都要等你，拖累进度。负责人要负起相关责任，测试前提前检修，长时间测试要做到连续检修，相关回坏的零件提前发，提前准备好，从容不迫的做好自己负责的东西，对整个队都有帮助。\n\n---","s":"飞书·场地道具开发维护文档","k":"doc","i":"K0045"},{"t":"8. 飞镖靶","c":"材料板材","b":"- **飞镖靶耐用性不足**：为减少飞镖直接击打基地上面的板材和滑轨等有锐边的结构而导致飞镖寿命下降，采用的“碳管+钢管+高密度海绵横穿靶体固定”，但是由于飞镖发射的速度力量太大，加上设计的结构受力不合理，经常把海绵碳管部分射弯，导致其丧失应有特性，基地和镖体寿命大大下降；靶子本身结构设计不合理，在受到正面猛烈撞击时会压迫内部铝排连接件，经常导致铝排弯曲，拆换不了。\n- **飞镖靶稳定性不足**：飞镖靶在每次击打时会受到很大的撞击力，会导致飞镖靶产生前后移动，老设计太直了。全部都是垂直铝型材，在受击打时会后翻移动，不稳定。\n- **缓冲材料简陋**：去年直接捡垃圾，用包装的海绵和薄的海绵垫临时作为缓冲，凑合用了一个赛季，缓冲材料老是被打穿，耐用性不好。","s":"飞书·场地道具开发维护文档","k":"doc","i":"K0046"},{"t":"会议基础信息","c":"图纸规范","b":"第一周不做硬性图纸要求，但一定要有所学习和收获。\n\n会议地点：土槽实验室\n\n| 未参会： |  |  |  |  |\n|-|-|-|-|-|\n| 已请假： |  |  |  |  |","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0047"},{"t":"模板：步兵组-轮腿底盘-植正雄：","c":"案例开源","b":"- **已经学会：**中石油、华工和华农的链轮画法及其根据来源。即上交和中石油是依据机械设计手册里三段式画法而设计，华工和华农则是通过插件生成的五段式齿型。区别是，五段式的啮合及受力更科学，但加工成本更高，且由于是通过插件生成，修改难度很高，灵活性不足。\n\n- **正在学习：**链条画法。一些学校的开源是干脆直接不画链条；一些则是拉伸一个简易的圈代替。前者不利于计算重量和机械仿真（包括干涉范围的确定、周边螺栓选型等等），后者不利于干涉检查，且二者都是对链条画法的“避而不谈”，这样的行为有违背“穷究原理”的精神。\n\n- **这周还干了：**维护四号；新贝贝康气弹簧的选型；学习理论力学。\n- **预计下周（或未来）需要学：**学习完链条的画法之后，将学习链条及链轮选型的依据和过程\n- 疑难：\n\n1. 为什么上交要选自行车九速链条？我们以前用的04B链条和这个比有什么优缺点？\n2. 为什么是19齿链轮？且主动轮和从动轮是1：1的传动比？\n3. 中轴为什么要上移（和髋关节电机形成等腰三角形而不是三点共线）？\n4. 为什么连炜生那么帅？如何克服羡慕嫉妒之情？\n5. 是人类吗？\n6. 阳台不帅吗？你不羡慕嫉妒吗？","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0048"},{"t":"重装组-过洞工程底盘-赖钰婷：","c":"结构设计","b":"**已经学会**：同济工程以及华农英雄3508内嵌麦轮的轴系结构，两者在电机与轮的装配方面，同济采用D型联轴器而华农采用涨紧套，由于考虑到我设计的轮组的减震结构的需要，我选着采用同济的方案。\n\n华农的                                                                                      同济的\n\n正在学习：\n\n各种轴系以及铰链结构，还有连杆。\n\n**这周还干了：**\n\n维护洞程机械爪，自己画了个轮系。\n\n**预计下周（或未来）需要学：**\n\n计算机械臂长度，继续看各种开源\n\n疑难：\n\nCNC加工的联轴器会不会夹不紧轴，用久了会不会滑动。","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0049"},{"t":"步兵组 钟炜熙 轮腿的腿","c":"结构设计","b":"**这周还干了**：饭堂招新 出面试题 做面试题 大致画了一条腿\n\n**预计下周（或未来）需要学：画髋关节 画底盘 链轮加强筋设计**\n\n疑难：\n\n1.花键具体画法\n\n2.气弹簧选型计算 安装位置\n\n5.连杆长度如何选\n\n6.怎么降低机加零件成本（更加了解工艺）","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0050"},{"t":"飞镖组-镖架与镖体-王奇英","c":"结构设计","b":"本周学习:卡卡镖镖体结构大概了解了他们镖体的构型，看了镖架底盘补偿机构的大概机构      线性代数整书刚要和知识点\n\n下周任务，把卡卡镖镖体结构大致画出来，然后改良旧镖架的机构零件选型和某些上赛季有问题的地方，改良预计一周不好改出来\n\n疑难:\n\n1.底盘补偿机构电机选型，移动结构选型\n\n2.镖体打印件结构设计","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0051"},{"t":"哨兵组-过洞哨兵优化-刘俊锋","c":"结构设计","b":"本周学习：初步思考想要达到的效果与外形，看看别的学校的过洞构型，初步定为华工中科大的云台摆放和二全二舵底盘（实际增加舵轮带来的收益还需思考），**补考**\n\n下周任务：画图：底盘与云台的初步尺寸，实现基础功能。\n\n看看其他学校的全向轮与舵轮开源，了解机械相关知识拓展大脑与完善招新题库。\n\n 疑难：暂无（因为补考几乎还没开始思考）","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0052"},{"t":"飞镖组-镖架-刘悦","c":"案例开源","b":"本周：大概了解华东理工大学的自缓冲结构，军训休息期间给一些排介绍了一下我们战队\n\n下周：有时间多看一些开源并深入研究\n\n疑难：还没有认真思考（这几天一直在带训，挺累的，下训后只想睡觉）\n\n# 第二周 9月13日 周日","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0053"},{"t":"飞镖组-镖体-周昱翔","c":"赛事场地","b":"本周进度：思考镖架减重，未得出可行方案，暂时搁置\n\n              画镖体，还差外壳和内部固定硬件板子的零件和缓冲设计，滑台配合等。\n\n               招新\n\n                预计下周周末前出完整镖体","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0054"},{"t":"步兵组-刀盾构型串联腿-冯伟杰","c":"结构设计","b":"本周进度：已经构思完了整体云台构型，目前底盘在画，头的部分还没开始，只是构思了下，腿的话改了短连杆，把小腿长改成了236，再按比例放缩其他连杆。\n\n头的话是想采用趴下状态，这周跟师兄学习了死点连杆，具体云台的图纸还要构思，小电脑打算是放在头的后方，目前唯一的可能难点是头可能会过长，影响翻到自救，目前还在探索。\n\n还干了啥：招新，维护轮腿狗洞，完善二面试题。\n\n下周目标：大体完成除腿外的部分的图纸，尽量赶进度","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0055"},{"t":"重装组-上台阶英雄底盘-梁雍淇","c":"赛事场地","b":"本周进度：根据上周的想法画了底盘草图，然后建模，底盘大概画了快一半。\n\n这周还干了：帮忙招新，校科联那边我也帮忙招新，跟着新生拉练\n\n预计下周：完善底盘，把摆轮和yaw画了。dfh的图也想想","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0056"},{"t":"Decision本周新增表格（需每个人复制并自行填写）","c":"结构设计","b":"| 项目 | 必须回答的问题 |\n|-|-|\n| 整车功能点 | （思考整车各部分，如云台，底盘，必须完成什么？） |\n| 异常 | (每周对所画的部分，思考其出现异常是怎么样的？怎么去解决这个异常？） |\n| 验收 | （每周对所画的部分，思考什么数据能够证明该部分达到要求？） |\n| 安装 | （每周对所画的部分，思考怎么去安装？允许多大的安装误差、定位误差、姿态误差？） |\n| 已完成内容 | （详细记录本周及之前完成的进度） |\n| 下一周目标 | （规划下一周需完成的内容） |\n| 阻碍 | （本周遇到自己查阅资料仍解决不了的疑难点；画图出现的某处的画法不了解的点；必须自己先想再问） |\n| 预计交付时间 | （整车各部分完成的时间规划，给出明确的ddl） |","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0057"},{"t":"点评须知","c":"队伍制度","b":"1.根据自身项目经验，对每个队员的具体时间任务安排提出优化建议\n\n2.根据自己看出的画图设计问题，优先问：现象是什么？正常情况应该是什么？你认为有哪些可能原因？现在有什么证据？你准备怎么排除？\n\n3.引导队员通过**现象**+ **假设**+ **证据**+ **下一步**去解决问题","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0058"},{"t":"汇报须知","c":"图纸规范","b":"1.汇报人会前必须明确:\n\n**目标是什么?**\n\n**现状是什么?**\n\n**最大的Blocker是什么?**\n\n**有什么方案?**\n\n**今天必须做什么决策?**\n\n2.先汇报本周完成内容（总概），再简单明了的讲解自己的设计思路（同时打开自己所结束的结构的图纸，对着图讲解），同时讲解自己对该部分**异常，验收和安装**的理解，有条理的介绍完自己本周设计的所有部分，再提出本周的阻碍点，最后汇报自己的下一周目标以及各部分明确的ddl\n\n3.保持简单明了，思路清晰","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0059"},{"t":"哨兵组-半舵半全哨兵-刘俊锋","c":"赛事场地","b":"| 项目 | 必须回答的问题 |\n|-|-|\n| 整车功能点 | 底盘实现快速跨越隧道，在全向轮侧上方放尽多的内容，云台弹链顺畅，减少小yaw重量，云台快拆 |\n| 异常 | 四轮安装如何保证落在地上稳定不知道会不会影响小陀螺和电控解算 |\n| 验收 | 高度压在240左右，舵轮电机屁股到地面压在200mm以内，云台pitch折叠 |\n| 安装 | 舵轮通过cnc固连在铝方管上，全向轮单边板材固定，但要尽可能保证四个轮子都能接触地面  云台通过cnc快拆，尽量居于中心，弹链需要较高的同轴度，直角弹链压力角压到25以内  云台旋转圆与底盘保护的距离不能让弹丸进入且需要一定方法让弹丸滚出 |\n| 已完成内容 | 粗略完成3508舵和全向轮的绘制 |\n| 下一周目标 | 中秋前完成底盘元器件和裁判系统的摆放，中秋假期完成云台基础功能 |\n| 阻碍 | 暂无 |\n| 预计交付时间 | 底盘基础功能9.24——云台基础功能9.27——优化细节绘制10.3 |","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0060"},{"t":"步兵组-过洞串腿步兵-冯伟杰","c":"结构设计","b":"| 项目 | 必须回答的问题 |\n|-|-|\n| 整车功能点 | 主要功能点在保持原有串腿的优点下实现趴姿过洞，并用折叠头来解决俯仰角过小的问题 |\n| 异常 | 将底盘压缩后可以拉长多少底盘来弥补弹仓容量，还能保证翻倒自救，后续将问问师兄的建议 |\n| 验收 | 基本实现必要功能，发射机构等等后期优化 |\n| 安装 | 腿的轴系较为精密，需要较为精确的加工商。 |\n| 已完成内容 | 初步完成了腿的绘制 |\n| 下一周目标 | 认真规划底盘和云台，然后开画，尽量完成头的规划和底盘的大体结构然后和电控开始规划下走线 |\n| 阻碍 | 我忘了链轮是怎么画出来的了。。 |\n| 预计交付时间 | 底盘-9.24———云台-9.29——优化细节——10.3 |","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0061"},{"t":"飞机组-机场-唐宇轩","c":"结构设计","b":"项目必须回答的问题整车功能点可伸缩式降落平台，并且有稳定可靠的归中装置异常空间不足导致出现干涉问题，通过调整尺寸和材料选择完成改进验收在所有功能保证的情况下将机场尺寸压缩到300*300，高度不超过上限的10%，后续根据飞机实际尺寸进行调整安装主轴需要较高的同轴度，皮带传动部分要保持精度较高的水平面，摇杆也要保持良好水平面，其余的装配需要的精度要求不高已完成内容归中平台的电机摆放和驱动设计已完成，主轴传动完成了基础设计，不过模数还没设计好下一周目标彻底完成皮带传动结构设计，同时完成外壳的拆分与重组设计，还有电池架设计，要是有剩余时间将之前过程中出现的螺丝干涉优化完毕阻碍传动结构需要向学长请教，后期压缩机场尺寸可能会遇到困难预计交付时间皮带传动9.24-------外壳与电池架9.29------优化细节-------10.3","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0062"},{"t":"重装组 摆轮底盘六摩擦 史金凯","c":"结构设计","b":"项目必须回答的问题整车功能点云台：三大弧轮 三小平轮 双滑槽 底盘：稳定快速上二级台阶的底盘异常平轮参数下 弧轮距离过近 解决：调整参数连杆过短发生干涉 解决 ：更改连杆参数验收（每周对所画的部分，思考什么数据能够证明该部分达到要求？）安装一级用三弧轮 使用cnc做垫高 精度更高 避免碳板厚度不均匀导致弧轮装配同心度较差连杆轴系 装配时使用塞打螺丝贯穿已完成内容拨盘90% 弹链90% 发射机构75% 下一周目标画滑槽 画完之后完成云台 之后再学习重力补偿阻碍暂无预计交付时间滑槽下周开始进行 进度快的话有机会画底盘","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0063"},{"t":"重装组 上台阶英雄底盘 梁雍淇","c":"结构设计","b":"| 项目 | 必须回答的问题 |\n|-|-|\n| 整车功能点 | 摆轮腿底盘＋支撑导轮，稳定上三级台阶 |\n| 异常 | 摆轮改成链传动后，大部分地方用打印件支撑，不确定会不会影响强度 |\n| 验收 | 目前暂无验证的具体方法，我觉得可以通过仿真或者之后的暴力测试去考虑用打印件还是板材 |\n| 安装 | 有思考 |\n| 已完成内容 | 腿和摆轮基本画完，等待细节完善 |\n| 下一周目标 | 下周需要忙面试和dfh时间不多，尽量把底盘画完 |\n| 阻碍 | 不知道怎么改善这个草图一改就很多报错要花很多时间改，很苦恼 |\n| 预计交付时间 | 底盘9.25前，拨盘9.27，云台10.1前，后面两天细节优化 |","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0064"},{"t":"重装组-上台阶底盘及后摆轮腿-李开弘","c":"结构设计","b":"| 项目 | 上台阶底盘及后摆轮腿 |\n|-|-|\n| 整车功能点 | 整车可完成三级台阶跨越 |\n| 异常 | 调整后的后腿连杆如何避免超尺寸，后摆轮的传动方式以及安装 |\n| 验收 | 草图验证 |\n| 安装 | 碗组轴承安装，链条链轮组装及装配 |\n| 已完成内容 | 上三级台阶构型分析论证，整车基本草图绘制，腿连杆参数确定并绘制，机械臂学习中 |\n| 下一周目标 | 完成底盘，开始绘制机械臂 |\n| 阻碍 | 画法上基本无问题，小腿改装比较困难，主要是摆轮模组的安装问题 |\n| 预计交付时间 | 下周完成底盘9.26，考核结束10.3时绘制完机械臂并一起装配交付 |","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0065"},{"t":"飞镖组—镖体，镖架--周昱翔","c":"结构设计","b":"| 项目 | 必须回答的问题 |\n|-|-|\n| 整车功能点 | 镖体前部缓冲结构，舵机快拆验证，外壳快拆验证。镖架底盘调平，减重。降高度，丝杆相关的限位。发射架缓冲设计改良 |\n| 异常 | 稳定性验证，重心分配。丝杆装配差异 |\n| 验收 | 型材和标准件相关部分的质量计算，重心计算。可能要用上仿真等进行辅助。 |\n| 安装 | 孔位数据沿用前有设计。其他需要结合打印误差优化，只能先给通用值 |\n| 已完成内容 | 镖体整体设计，细节优化和仿真，快拆机构设计和部分尼龙铆钉固定方式的保留。与原有滑台配合方便测试。镖架部分底盘结构 |\n| 下一周目标 | 底盘和发射架整体结构 |\n| 阻碍 | SW崩溃问题？曲面放样效果不佳。其实问题都不大 |\n| 预计交付时间 | 镖架：底盘9.20，发射架9.26，细节优化10.3 |","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0066"},{"t":"步兵组 钟炜熙 轮腿底盘，云台","c":"结构设计","b":"| 项目 | 必须回答的问题 |\n|-|-|\n| 整车功能点 | 跳跃台阶，飞坡改成的狗洞，翻到自起，小惯量云台，精准的发射机构 |\n| 异常 | 底盘元器件摆放拥挤，画图时需调整尺寸防止干涉 |\n| 验收 | 静力学仿真保证强度合理 |\n| 安装 | 精密配合的区域最好保证加工精度如腿部轴系 |\n| 已完成内容 | 底盘，鹅颈弹链，优化pitch连杆参数 |\n| 下一周目标 | 完成云台设计 |\n| 阻碍 | 拨盘画法，云台发射部分怎么优化 |\n| 预计交付时间 | 9.19-9.25云台 9.26-9.27拨盘 9.28-10.3yaw轴弹仓 |","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0067"},{"t":"飞镖组 镖架 刘悦","c":"结构设计","b":"项目必须回答的问题整车功能点（思考整车各部分，如云台，底盘，必须完成什么？）发射机构：撒放；缓冲(滑台缓冲、镖架缓冲)，镖架缓冲:发射架底座稳定，不会受发射后坐力影响而位移 ；拉簧、拉绳安装、预紧装置：发射架精度的来源是对拉簧释放的能量进行精准的控制滑台:可以通过合理调配飞镖及发射滑块与拉簧及滑轮组这两部分的重量分配，使得发射过程中的振动尽可能小，达到提高精度，增加发射架使用寿命的目的  装填机构：通用性，装4发镖并同时适配无控和有控飞镖；速度，20秒内完成4发飞镖的装填和发射  底盘：完成yaw方向调整，最好可以roll补偿，降高度调高pitch异常(每周对所画的部分，思考其出现异常是怎么样的？怎么去解决这个异常？）异常出现死点，合理设计双摇杆机构验收（每周对所画的部分，思考什么数据能够证明该部分达到要求？）草图验证安装（每周对所画的部分，思考怎么去安装？允许多大的安装误差、定位误差、姿态误差？）有思考怎么安装，后续把撒放器和舵机实物找出来测量一下已完成内容（详细记录本周及之前完成的进度）基本画完撒放结构下一周目标（规划下一周需完成的内容）画完缓冲、拉簧、拉绳安装、预紧装置阻碍（本周遇到自己查阅资料仍解决不了的疑难点；画图出现的某处的画法不了解的点；必须自己先想再问）暂无预计交付时间（整车各部分完成的时间规划，给出明确的ddl）9.27 发射机构10.7 装填、底盘","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0068"},{"t":"飞机组-机场-钟坤霖","c":"结构设计","b":"| 项目 | 必须回答的问题 |\n|-|-|\n| 整车功能点 | 底层抽屉式展开，平台全展开能为单机提供xy方向各+-3cm，+-3.75cm的降落面积，降落后的归中定位 |\n| 异常 | 归中后飞机起飞可能会撞到限位挡板  平台开合后的空隙大，归中过程中飞机可能会掉落或卡住  归中行程长导致花的时间长  在保证第一层平台底高于40mm时总收纳高度难压  导向和伸缩过程可能会卡顿  归中导杆力臂过长（400mm）  重心不居中  抽屉导轨作为导向会有轻微变形 |\n| 验收 | 改限位为低矮台阶（5mm高），拉远飞机归中位置到挡板距离（30+mm），限位由2动2定改为3动1定  在原来的平台底板上新增可重叠补板，做板与板间的高低差（0.2mm左右），增加斜坡，加补板填平螺丝头高度带来的高度差保持平面防卡住  修改单推杆行程（150mm->75mm两个，75mm->30mm两个）  上下两平台间做部分重叠（25mm），螺丝用极薄头（m2头厚1.2mm，m3头厚1mm，m4头厚1.2mm，m5头厚1.3mm）  采用直线轴承配导向轴配卡簧以及滑块滑轨做导向  修改推杆摆放位置，力臂缩短（400mm->200mm)  换为滑轨滑块 |\n| 安装 | 导向轴两端用cnc固定，直线轴承用卡簧-pla打印件-卡簧固定，上下平台距离，第一层平台距离机场台高相距1mm，收纳高度198mm左右（限高200） |\n| 已完成内容 | 综合考量上述异常后重新画了一板平台单体，已完成整体结构的绘制 |\n| 下一周目标 | 画完整体，检查平台单体，若画得没问题简单搭一个测试一下实际效果 |\n| 阻碍 | 如何约束才能保证长力臂下导杆路径不偏移（平行度） |\n| 预计交付时间 | 整车--9.23，优化细节---9--26 |","s":"飞书·每周图纸评审会记录","k":"doc","i":"K0069"},{"t":"1. 与场地相关的赛季变更","c":"赛事场地","b":"相较 RMUC 2026，2027 赛季在场地上做了以下调整（第 1.2 节，P13）：\n\n| 变更项 | 说明 |\n| --- | --- |\n| 原飞坡 | 改为**隧道** |\n| 操作间 | 整体布置调整 |\n| 新增 | **制高点、机库平台、工作台** |\n| 取消 | 飞行区、无线充电装置放置区、停机坪 |\n\n结论：能量机关本身的结构与上一赛季保持了「中央高地正上方、5 灯臂、红蓝双侧共轴」的形态，但**机库平台**是新增元素，且机库平台与能量机关立柱存在空间关系（见第 4 节 S109 条款），画图时必须一起考虑。\n\n---","s":"整理文档·01_场地与能量机关位置","k":"doc","i":"K0070"},{"t":"2. 战场总览与尺寸公差","c":"赛事场地","b":"战场为 **28m × 15m** 区域（第 4.1 节，P29）：\n\n- 内部为木质结构，表面铺设 **2mm** 厚 PVC 地胶（或 PVC 夹线地胶）；\n- 部分结构存在金属保护层；\n- 外围为黑色钢制围挡，**上边沿距战场地面 2.4m**。","s":"整理文档·01_场地与能量机关位置","k":"doc","i":"K0071"},{"t":"2.1 官方给出的误差范围（画图时的重要前提）","c":"图纸规范","b":"| 对象 | 误差要求 |\n| --- | --- |\n| 小于 100mm 的尺寸 | ±5mm 以内 |\n| 大于等于 100mm 的尺寸 | ±5% 以内 |\n| 战场结构角度 | ±3° 以内 |\n| **场地道具角度** | **±1° 以内** |\n| 图纸尺寸单位 | mm |\n\n> 原文（P29）：「除特殊标注外，全文描述的所有尺寸均存在一定公差……为确保场地稳定性和安全性，实际制作时可能会对场地的细节尺寸、工艺进行调整，未在图纸中详细注明的战场元素/尺寸，请以实际场地为准。」\n> 「渲染图仅供示意，场地具体尺寸细节以对应图纸为准。」\n\n**对画图的直接含义**：官方给的是「示意 + 主控尺寸」，细节需要你自己补；自己出图时公差不要照抄这个表，而要按加工工艺给（激光切割 ±0.2mm、折弯 ±0.5°、焊接件按 GB/T 19804 等）。\n\n---","s":"整理文档·01_场地与能量机关位置","k":"doc","i":"K0072"},{"t":"3. 能量机关在场地中的位置关系","c":"赛事场地","b":"能量机关位于**战场中央**，属于「中央高地」区域（第 4.3.2 节，P50 起）：\n\n```\n中央高地\n├─ 4.3.2.1 装配区        位于战场中央，能量机关正下方\n│   └─ 科技核心          设在能量机关下方，重装机器人把能量单元装配进科技核心\n├─ 4.3.2.2 机库平台      位于战场中央，红蓝双方各一；空中系统只能装在这里\n└─ 4.3.2.3 能量机关      位于装配区正上方，电机驱动，红蓝两侧\n```\n\n- 装配区含 **14° 坡、12° 坡、46° 坡** 等地形（图 4-28 装配区轴测图）；\n- 能量机关「**中部由于重量较大，会出现轻微下坠的现象，下坠范围为 0~50mm**」；\n- 「由于观察视角问题及传动间隙，观察一方能量机关时可能会看到对方能量机关的一部分」——说明红蓝两侧是**共轴、背靠背**的两套回转体。\n\n> 画图含义：如果做的是整机复刻，回转轴是**共用一根**的；下坠 0~50mm 是官方对实物装配状态的容忍量，不要求图纸体现，但**装配说明里应写清轴向间隙与支撑方式**，否则做出来会晃。\n\n---","s":"整理文档·01_场地与能量机关位置","k":"doc","i":"K0073"},{"t":"4. 与能量机关立柱相关的硬性条款","c":"赛事场地","b":"**S109**（《机器人制作规范手册》3.x，P50 页附近）：\n\n> 能量机关立柱上设有一处 **长 150mm、高 150mm 的红外发射区域**。该区域沿立柱**宽度方向居中**布置，**下边缘与机库平台底面齐平**。参赛队须根据该区域的位置设计机库主控模块的安装位置及方向……\n\n**画图含义**：立柱不是一根简单方管——它上面要留 150×150 的红外窗口，且窗口高度由**机库平台底面**定位。画立柱时必须先确定机库平台底面标高，再反推窗口位置。这条是**检录会看**的内容，属于「不做错」的硬约束。\n\n---","s":"整理文档·01_场地与能量机关位置","k":"doc","i":"K0074"},{"t":"5. 场地道具训练（对做实物有直接参考价值）","c":"赛事场地","b":"第 7 章「场地道具训练」（P140）：\n\n- 组委会提供的训练道具为**与正式比赛相似的场地道具与木制结构**；\n- 每队 2 次训练机会，每次 30 分钟（含进退场）；\n- 组委会**只提供可移动道具**，不提供 17mm / 42mm 弹丸；\n- 「使用 42mm 弹丸测试时请注意避免主动击打能量机关」。\n\n**含义**：队伍自制的训练用大符，属于「可移动道具」这一层级——**轻、可拆、可搬**，这应当是方案设计的第一约束，而不是照着赛场实物 1:1 做一根两米多的钢立柱。\n\n---","s":"整理文档·01_场地与能量机关位置","k":"doc","i":"K0075"},{"t":"6. 规则层面的红线（画图时不能碰的）","c":"赛事场地","b":"| 条款 | 内容 |\n| --- | --- |\n| R61 | 比赛过程中，机器人不得破坏战场、场地道具或弹丸，亦不可影响场地道具的正常功能 |\n| R62 | 不得使用 42mm 弹丸、飞镖、空中机器人击打能量机关和机库 |\n\n**画图含义**：灯臂、靶面、灯条必须能被 17mm 弹丸反复打而不变形、不脱落；固定方式优先用**螺栓 + 防松**，不要用卡扣、磁吸、双面胶。\n\n---","s":"整理文档·01_场地与能量机关位置","k":"doc","i":"K0076"},{"t":"7. 本章信息可信度说明","c":"赛事场地","b":"- 第 1、2、5、6 节内容来自规则手册正文，**可直接引用**。\n- 第 3、4 节的结构关系来自正文与图 4-28 / 4-31，**尺寸细节需对照原图**（见 `03_能量机关_结构与尺寸.md`）。\n- 官方声明「渲染图仅供示意」，三维渲染图上的比例不可作为尺寸依据，**只认标注数字**。","s":"整理文档·01_场地与能量机关位置","k":"doc","i":"K0077"},{"t":"1. 一句话概括","c":"赛事场地","b":"能量机关是一个**持续旋转的 5 臂靶盘**，机器人用 17mm 弹丸打亮起的装甲模块，按「打中的环数」和「点亮的灯臂数量」换取攻击 / 防御 / 热量冷却增益。\n\n- 红蓝两侧**共轴**：红方顺时针转，蓝方就逆时针转；开局随机定方向，全局不变。\n- 被打中的一方自己得增益，另一方不受影响，双方可同时持有。\n\n---","s":"整理文档·02_能量机关机制与时序","k":"doc","i":"K0078"},{"t":"2. 转速（决定你的传动设计）","c":"赛事场地","b":"| 状态 | 转速 |\n| --- | --- |\n| 小能量机关 | 固定 **π/3 rad/s**（≈1.047 rad/s，即 **6 秒一圈 / 10 rpm**） |\n| 大能量机关（非激活态） | 固定 **π/3 rad/s** |\n| 大能量机关（正在激活） | 周期性变化 |\n\n大能量机关激活态的速度目标函数：\n\n```\nspd = a · sin(ω · t) + b        单位：rad/s\na ∈ [0.780, 1.045]\nω ∈ [1.884, 2.000]\nb = 2.090 − a                   （始终成立）\n```\n\n- 每次进入可激活状态时，`t` 重置为 0，`a`、`ω` 在区间内**随机取值**；\n- 实际转速与目标函数的**时间误差 ≤ 500ms**。\n\n**算一遍（这几个数画图时天天要用）**：\n\n- 基础转速 π/3 = **1.047 rad/s** → 一圈 2π/1.047 = **6.0 秒**，即 **10 rpm**。\n- 灯臂端点线速度（按 Ø1400 取 r=0.7m）：v = ω·r = 1.047 × 0.7 ≈ **0.73 m/s**。\n- 激活态速度区间：`spd ∈ [b−a, b+a] = [2.090−2a, 2.090]`。\n  - a = 0.78 时：**0.53 ~ 2.09 rad/s**（约 6~20 rpm）；\n  - a = 1.045 时：**0 ~ 2.09 rad/s**——**最低点会瞬间停住**，这是大符打靶最难的地方。\n- 峰值永远是 **2.09 rad/s ≈ 3.0 秒一圈（20 rpm）**。\n\n> 判断电机选型对不对的硬指标：\n> 1. 要能稳在 **10 rpm（6s/圈）** 匀速；\n> 2. 要能跟随 **0~20 rpm 的正弦加减速**，且在 0 rpm 附近不抖；\n> 3. 加速度峰值约 `a·ω² ≈ 1.045 × 4 ≈ 4.2 rad/s²`，转动惯量折算到电机侧后按 2 倍安全系数选扭矩。\n\n---","s":"整理文档·02_能量机关机制与时序","k":"doc","i":"K0079"},{"t":"3. 时间轴（比赛内）","c":"赛事场地","b":"| 时间 | 事件 |\n| --- | --- |\n| 0:00 – 3:00 | **小能量机关**阶段 |\n| 0:00 | 双方各获得 1 次激活小符机会 |\n| 1:30 | 双方各再获得 1 次（可累积） |\n| 3:00 | 切换为**大能量机关** |\n| 3:00 / 4:15 / 5:30 | 双方各获得 1 次激活大符机会（可累积） |\n\n- 机会通过**步兵操作手选手端**或**哨兵串口**触发；\n- 进入「正在激活」后 **20 秒**未完成，自动退回未激活（机会消耗）。\n\n---","s":"整理文档·02_能量机关机制与时序","k":"doc","i":"K0080"},{"t":"4. 大符的激活流程（决定灯效结构与打靶面）","c":"赛事场地","b":"1. 随机点亮 5 块装甲模块中的 **2 块**，亮特殊灯效，对应灯臂**中轴出现箭头状流动灯效**；\n2. 弹丸须在 **2.5 秒**内击中**被点亮**的装甲模块的**可检测区域**；\n3. 命中后该灯臂改变灯效，此后 **1 秒**内可再击中另一个被点亮的模块；**不论是否成功**，系统立刻重新随机点亮 2 块；\n4. 一组 = 2 块装甲；**击中该组第一块即视为该组成功**（第二块打不打中都算）；\n5. 5 组全部完成 → 已激活；灯臂中部灯效指示进度（1/5、2/5 ……）。\n\n**失败条件（任一即重置）**：\n- 未能在 2.5 秒内击中点亮模块；\n- 击中**非**随机点亮的模块。\n\n**灯效时序**：重新随机点亮下一组之前，灯臂与装甲模块灯效会**熄灭至多 200ms**（为保证时序匹配）。\n\n> 画图含义：\n> 1. 每块装甲模块是**独立可点亮单元**，5 块 = 5 路独立灯（+ 每臂中轴 1 路流动灯 + 中部进度灯）→ **至少 11 路可控灯**，走线必须走中轴空心轴或滑环。\n> 2. 2.5s / 1s / 200ms 这些是**电控时序**，机械上只要保证「灯不被结构遮挡、不被弹丸打坏」。\n\n---","s":"整理文档·02_能量机关机制与时序","k":"doc","i":"K0081"},{"t":"5.1 平均环数 → 增益","c":"赛事场地","b":"| 平均环数区间 | 攻击增益 | 防御增益 | 热量冷却增益 |\n| --- | --- | --- | --- |\n| [1, 3] | 150% | 25% | 无 |\n| (3, 7] | 150% | 25% | 2 倍 |\n| (7, 8] | 200% | 25% | 2 倍 |\n| (8, 9] | 200% | 25% | 3 倍 |\n| (9, 10] | 300% | 50% | 5 倍 |\n\n每块装甲模块被划分为 **1~10 环**（10 环为最内圈或最外圈，以官方图为准，见 03 文档的说明）。","s":"整理文档·02_能量机关机制与时序","k":"doc","i":"K0082"},{"t":"5.2 激活灯臂数 → 增益持续时间","c":"赛事场地","b":"| 激活灯臂数 | 持续时间（秒） |\n| --- | --- |\n| 5 | 30 |\n| 6 | 35 |\n| 7 | 40 |\n| 8 | 45 |\n| 9 | 50 |\n| 10 | 60 |\n\n> **推论（待确认）**：「激活灯臂数」能到 10，而结构上只有 5 臂，说明大符每个灯臂很可能有 **2 块装甲模块**（正面 + 背面，红蓝各一面），或每臂分上下两块。这是大符结构上最容易画错的地方，见本文第 9 节存疑点。","s":"整理文档·02_能量机关机制与时序","k":"doc","i":"K0083"},{"t":"5.3 累计激活次数 → 有效检测环数收窄","c":"赛事场地","b":"| 己方大符累计被激活次数 | 可继续检测的环数 |\n| --- | --- |\n| 1 次 | 4,5,6,7,8,9,10 环 |\n| 2 次 | 7,8,9,10 环 |\n\n> 每激活一次，**有效击打区域缩小**（1~3 环先失效）。这是裁判系统的逻辑，机械上意味着：**环的划分必须靠灯效或图案明确区分**，10 环区域要清晰可辨。","s":"整理文档·02_能量机关机制与时序","k":"doc","i":"K0084"},{"t":"6. 状态机（4 态）","c":"赛事场地","b":"```\n未激活 ──触发──> 正在激活 ──5组全中──> 已激活 ──增益结束──> 未激活\n                    │\n                    └──超时20s / 打错 / 超2.5s──> 激活失败 ──> 未激活\n```\n\n| 状态 | 灯效表现 | 结构上要支持的 |\n| --- | --- | --- |\n| 未激活 | 常暗 / 呼吸（以图 5-18 为准） | 灯珠可单独控制 |\n| 正在激活 | 2 块亮 + 中轴箭头流动 + 中部进度 1/5~5/5 | 独立寻址灯带 |\n| 已激活 | 5 臂全亮 | 满功率供电、散热 |\n| 激活失败 | 复位 | 可复位、无误触发 |\n\n---","s":"整理文档·02_能量机关机制与时序","k":"doc","i":"K0085"},{"t":"7. 检测精度","c":"赛事场地","b":"> 「能量机关装甲模块对弹丸击打位置的检测精度为**径向 1mm**。」（P98）\n\n**含义**：环的判定是**径向**的，不是按面积。因此靶面图案（同心圆）的**同心度**直接决定环数判定——如果你自己做训练靶，靶心偏移 5mm，10 环区域就整体偏了。\n\n---","s":"整理文档·02_能量机关机制与时序","k":"doc","i":"K0086"},{"t":"8. 从机制倒推的结构要求（画图 Check List）","c":"传动机构","b":"| 机制要求 | 结构对应 |\n| --- | --- |\n| 5 臂均布、共轴双向 | 单根主轴 + 双回转体；红蓝独立驱动或同轴反转 |\n| 输出恒定 10 rpm（6s/圈） | 按电机额定转速反算减速比（6020 量级需 ~1:9，3508 量级需 ~1:50） |\n| 激活态 0~20 rpm 正弦跟随 | 减速箱背隙要小，否则低速抖动 |\n| 每臂 2 块独立可点亮靶（推断） | 靶面分件、每块独立灯腔与走线 |\n| 径向 1mm 判定 | 靶面与转轴同心度 ≤ 0.5mm，装配定位销 |\n| Ø308 靶 / Ø300 有效区 | 靶面外径留 4mm 边框（308−300=8，径向 4） |\n| 弹丸反复击打 | 靶面材料抗冲击，建议 2mm 铝板 + 可换面板 |\n| 0~50mm 下坠 | 轴向支撑 + 止推轴承，装配说明注明间隙 |\n\n---","s":"整理文档·02_能量机关机制与时序","k":"doc","i":"K0087"},{"t":"9. 存疑点（需要向队里/官方确认）","c":"赛事场地","b":"1. **10 环的内外顺序**：官方文字只说「每块装甲模块被划分为 1~10 环」，未说明 10 环在内还是在外，需看图 5-17「能量机关击打区域示意图」原图确认。\n2. **每臂 2 块装甲的正反关系**：表 5-23 允许 10 臂激活，推断为红蓝各一面，但规则未直说，需向队里确认或在答疑中提。\n3. 大符在「正在激活」时转速变化，**是否影响红蓝两侧同步**（共轴反转）——规则只说共轴，未说两侧转速是否同时变化。","s":"整理文档·02_能量机关机制与时序","k":"doc","i":"K0088"},{"t":"1. 整机（图 4-31）","c":"结构设计","b":"| 项目 | 数值 | 来源 | 说明 |\n| --- | --- | --- | --- |\n| 灯臂数量 | **5** 个，均匀分布 | ✅ 正文 | — |\n| 相邻灯臂夹角 | **72°** | 📐 图 4-31 | 5×72°=360°，与「均布」自洽 |\n| 灯臂端点包络圆 | **Ø1400** | 📐 图 4-31 | 即最大回转直径，**整机设计的第一约束** |\n| 底座上表面 → 顶部结构 | **2300** | 📐 图 4-31 | 从装配区台面量起，不含底座台阶 |\n| 底座（台阶）高度 | **300** | 📐 图 4-31 | 到战场地面 |\n| 能量机关顶部离地 | ≈ **2600** | 📐 推算 | 2300 + 300 |\n| 中部下坠量 | **0~50mm** | ✅ 正文 | 因中部重量大，属正常现象 |\n| 红蓝关系 | 共轴，背靠背 | ✅ 正文 | 观察一侧时可能看到另一侧的一部分 |\n\n> 读图提醒：2300 的箭头**从底座上表面起到顶部横架的上沿**，不是到灯臂顶端。别把 2300 当成整机高度直接用。\n\n---","s":"整理文档·03_能量机关结构与尺寸","k":"doc","i":"K0089"},{"t":"2. 灯臂（图 4-32）","c":"结构设计","b":"| 编号 | 含义（按图上位置描述） | 数值 | 备注 |\n| --- | --- | --- | --- |\n| A | 灯臂顶端**外廓总宽** | **372** | 决定臂端包络 |\n| B | 靶面安装框**内宽** | **320** | 与 372 差 52，即两侧各 26 的边框 |\n| C | 灯臂**长度**（顶端 → 肩部） | **382** | 与 Ø1400 一起定肩部半径 |\n| D | 顶端包边宽度 | **29** | 细节 |\n| E | 靶框下沿宽度 | **36** | 细节 |\n| F | 折边 / 板厚 | **24**（两处） | 钣金折边宽度 |\n| G | 中心加强筋宽度 | **60** | 主承力筋 |\n| H | 加强筋长度 | **330** | — |\n| I | 加强筋相对中心的偏置 | **136** | 定位用 |\n| J | 肩部侧边长度 | **203** | 与轮毂连接段 |\n| K | 角撑 / 折边 | **20** | 细节 |\n| L | 斜撑长度 | **215** | 约 45° 方向 |\n| M | 靶面楔形夹角 | **120°**（上下各一） | 靶框与面板的过渡 |\n| N | 圆靶**有效检测直径** | **Ø300** | ✅ 正文同值 |\n| O | 圆靶**最大直径** | **Ø308** | ✅ 正文同值 |\n\n> 372 / 382 这类数字看起来是「设计值」而不是「配合值」，实际加工允许 ±1~2mm；但 **Ø308 / Ø300 / Ø106 / 72° / Ø1400** 属于功能尺寸，必须按图做。\n\n---","s":"整理文档·03_能量机关结构与尺寸","k":"doc","i":"K0090"},{"t":"3. 中心标识（图 4-33）","c":"其他","b":"| 项目 | 数值 | 来源 |\n| --- | --- | --- |\n| 中心圆形标识直径 | **Ø106** | 📐 图 4-33 |\n| 图形内容 | 黑底 + 红色 RM 风格「R」标 | 图示 |\n| 位置 | 回转体正中心 | 图示 |\n\n---","s":"整理文档·03_能量机关结构与尺寸","k":"doc","i":"K0091"},{"t":"4. 尺寸链推演 + 实测复核","c":"其他","b":"已知：灯臂端点包络 Ø1400 → **R = 700**；灯臂长 382。\n\n```\n灯臂端点半径            R_tip   = 700\n灯臂长度                L_arm   = 382\n肩部（与轮毂连接）半径   R_hub  ≈ 700 − 382 = 318\n臂端宽度                372  →  单侧 186\n靶面直径                308  →  半径 154\n靶面有效区              300  →  半径 150\n```","s":"整理文档·03_能量机关结构与尺寸","k":"doc","i":"K0092"},{"t":"4.1 已实测确认：靶心半径 R_target = 521.7mm ✅","c":"赛事场地","b":"我把官方 `RMUC2027_V1.0.0.stp`（653MB）里的圆形特征全部提取出来，筛出半径 **154.0mm（即 Ø308）** 的圆，聚类后做最小二乘圆拟合，结果：\n\n| 项 | 实测值 |\n| --- | --- |\n| 靶面圆心到回转轴距离 **R_target** | **521.7 mm**（5 处残差  所以 **R_target = 522mm** 可以放心用。这是画图时最要紧的一个定位尺寸，官方手册上没直接标，现在有了。","s":"整理文档·03_能量机关结构与尺寸","k":"doc","i":"K0093"},{"t":"4.2 仍未确认的两个量 ❓","c":"案例开源","b":"| 待确认 | 怎么量 |\n| --- | --- |\n| 靶面到回转中心平面的**轴向偏置 Z_target** | 在 STEP 里取靶面圆心坐标，减去轮毂对称面标高 |\n| 轮毂**实际半径** R_hub | 318 是减出来的，实际有过渡圆角；在模型上量轮毂外圆 |\n\n> 量法：SolidWorks 打开 STEP →「评估 → 测量」点靶面圆心与轴心；或用「插入 → 参考几何体 → 点」取圆心坐标。\n\n---","s":"整理文档·03_能量机关结构与尺寸","k":"doc","i":"K0094"},{"t":"5. 官方 STEP 模型（最可靠的一手资料）","c":"赛事场地","b":"组委会已开源 2027 场地图纸（STEP 格式）：\n\n| 文件 | 大小 | 说明 |\n| --- | --- | --- |\n| `RMUC2027_V1.0.0.stp` | 653.44 MB | RMUC 全场地图纸，含中央高地与能量机关 |\n| `能量单元.stp` | 3.07 MB | 「能量单元」道具（重装机器人装配进科技核心的那个），**不是能量机关本体** |\n| `RMUL2027_3V3_V1.0.0.stp` | 1.99 MB | 联盟赛 3V3 场地 |\n| `RMUL2027_1V1_V1.0.0.stp` | 1.11 MB | 联盟赛 1V1 场地 |\n\n- 来源帖：《RMU 2027 场地图纸&可移动道具开源》 \n- 官方声明：**「仅做参考使用，若此模型与规则手册标注或与比赛现场场地有结构出入，以规则手册和现场场地为准。」**\n- 本地已存：`01_官方规则与规范/官方能量单元模型.stp`（3.0 MB）；全场模型 `官方场地模型_RMUC2027.stp` 见 `01_官方规则与规范/` 目录\n\n**用 SolidWorks 打开 650MB STEP 的建议**：\n1. 先另存为零件，别直接开装配；\n2. 打开时勾选「输入诊断」关掉（太慢），直接用「插入 → 特征 → 删除实体」把无关场地删掉，只留中央高地；\n3. 用「评估 → 测量」取靶心、轴心坐标；\n4. 把量到的三个关键量回填到本文件第 4 节。\n\n---","s":"整理文档·03_能量机关结构与尺寸","k":"doc","i":"K0095"},{"t":"6. 建模基准建议（省你后面返工）","c":"结构设计","b":"| 项 | 建议 |\n| --- | --- |\n| 原点 | 定在**回转轴线与 5 臂对称平面的交点**，Z 轴向上 |\n| 方向 | 一条灯臂沿 +Y，其余按 72° 圆周阵列 |\n| 红蓝 | 建一侧，另一侧**镜像 + 绕 Z 轴 36° 错位**（背靠背 5 臂交错） |\n| 阵列 | 用「圆周阵列」而不是复制 5 次——改一个臂全部跟着改 |\n| 配合 | 靶面与轴用**同心 + 端面贴合**，不要用「距离」硬怼 |\n| 干涉 | 建完必做「干涉检查」与「间隙验证」（最小间隙设 2mm） |\n| 包络 | 单独建一个 Ø1400 的草图圆当**包络检查基准**，随时看有没有超 |\n\n---","s":"整理文档·03_能量机关结构与尺寸","k":"doc","i":"K0096"},{"t":"7. 这份文档还缺什么（下一步要补的）","c":"赛事场地","b":"- [x] ~~靶心半径 R_target~~ → 实测 **521.7mm**（见 4.1）\n- [ ] 靶面轴向偏置 Z_target、轮毂实际半径（量 STEP）\n- [ ] 灯臂是「一整块钣金」还是「框 + 面板 + 灯腔」三层结构（看图 4-32 的层叠关系，倾向后者）\n- [ ] 每臂装甲模块数量（5 还是 10），见 `02_能量机关_机制与时序.md` 第 9 节\n- [ ] 灯条型号 / 灯腔深度 / 走线通道（这块官方完全没给，得自定）\n- [ ] 官方是否有单独的「能量机关」STEP（当前开源包里只有整场模型和能量单元）","s":"整理文档·03_能量机关结构与尺寸","k":"doc","i":"K0097"},{"t":"1. 官方范例长什么样","c":"图纸规范","b":"这张图是一个 60×30×13.5 的铝制转接块，信息密度很高，逐项拆：\n\n| 要素 | 官方做法 | 你要学的 |\n| --- | --- | --- |\n| 视图数量 | **4 个**：主视（正面）、俯视（下方带孔面）、左视（侧面）、**轴测图**（右下） | 轴测图不是装饰，是给加工师傅 3 秒看懂零件形状用的 |\n| 视图排布 | 符合第一角投影（GB），主视图左上，俯视图在其正下方 | 别把视图乱摆，师傅会骂 |\n| 尺寸标注 | 全部**集中标注**，不重复、不交叉；基准统一在左侧和下方 | 先定基准面，再标尺寸 |\n| 公差 | `Ø21.00 +0.05/0`、`Ø22.00 +0.05/0` | **只有配合尺寸才给公差**，外形尺寸给整数 |\n| 螺纹孔 | `4-M3 ↧6`、`2-Ø2.50 ↧4.5 ↧3` | 「数量-规格 ↧深度」是标准写法，同时表达沉孔/过孔 |\n| 倒角/圆角 | 图上 R 与 C 角直接标 | 不标就是不加工 |\n| 标题栏 | 本图为整页附图，**省略了标题栏** | 正式出图必须有 |\n\n> 观察结论：官方这张图**没有一个多余标注，也没有一个该有的标注缺失**。你现在画的每一张图，都应该是这个密度。\n\n---","s":"整理文档·04_制作规范与制图规范","k":"doc","i":"K0098"},{"t":"2. 一张合格的零件图/装配图必须有的 9 项","c":"图纸规范","b":"这是你们队内评审会看的东西，也是我给你的自检表：\n\n| # | 要素 | 具体内容 | 常见错误 |\n| --- | --- | --- | --- |\n| 1 | **图幅与比例** | A3/A2，比例 1:1 / 1:2 / 1:5，写在不带「：」的框里 | 缩放打印后比例失真 |\n| 2 | **标题栏** | 零件名、图号、材料、数量、比例、版本、设计/审核/日期、单位 mm | 漏「材料」「版本」 |\n| 3 | **视图** | 主视 + 至少 2 个投影视图 + 1 个轴测图 | 只有主视图 |\n| 4 | **尺寸** | 完整、清晰、不重复、不封闭尺寸链（留一个自由尺寸） | 尺寸链封闭导致过约束 |\n| 5 | **公差** | 配合尺寸给公差（H7/h6 之类），关键形位公差（同心度、垂直度、平面度） | 全图无公差，加工全凭手感 |\n| 6 | **表面粗糙度** | 配合面 Ra1.6 / 一般面 Ra3.2 / 不加工面标「保留」 | 漏标，师傅默认按最糙做 |\n| 7 | **技术要求** | 去毛刺、未注圆角 R2、未注公差按 GB/T 1804-m、表面处理（阳极氧化/喷塑） | 写在备注栏而不是标题栏上方 |\n| 8 | **BOM 表**（装配图） | 序号、名称、数量、材料、规格/型号、备注（标准件写国标号） | 标准件不写型号 |\n| 9 | **版本与日期** | V1.0 / V1.1，改了什么写进「变更记录」 | 反复覆盖同名文件，最后不知道哪版对 |\n\n---","s":"整理文档·04_制作规范与制图规范","k":"doc","i":"K0099"},{"t":"3.1 回转相关（决定能不能转、转得正不正）","c":"图纸规范","b":"| 部位 | 建议公差 | 原因 |\n| --- | --- | --- |\n| 轴承座内孔 | H7 | 轴承外圈配合 |\n| 主轴轴承位 | h6 / k6 | 轴承内圈配合 |\n| 轮毂与主轴的同轴度 | Ø0.05（或标注「同轴度 φ0.05 A」） | 5 臂同时偏，靶心圆就歪 |\n| 轮毂端面与轴的垂直度 | 0.05 | 端面跳动会让靶面前后晃 |","s":"整理文档·04_制作规范与制图规范","k":"doc","i":"K0100"},{"t":"3.2 靶面相关（决定环数判定准不准）","c":"材料板材","b":"- 靶面圆心与安装孔的**位置度**：Ø0.5；\n- 靶面平面度：0.3（亚克力/铝板铣平）；\n- 靶面与轮毂的**同心度 ≤ 0.5mm**——这是由「径向 1mm 检测精度」倒推的，靶心偏 0.5，最外圈判定就偏半个环宽。","s":"整理文档·04_制作规范与制图规范","k":"doc","i":"K0101"},{"t":"3.3 钣金/激光切割件","c":"加工工艺","b":"| 项目 | 标注方式 | 工艺能力 |\n| --- | --- | --- |\n| 外形轮廓 | 给闭合轮廓 + 总尺寸 | 激光切割 ±0.2mm |\n| 折弯 | 标折弯线 + 折弯角 + 内 R（板厚 t 时 R≈t） | 折弯角 ±0.5° |\n| 折弯扣除 | 展开图给 K 因子或直接给展开长 | 与厂沟通 |\n| 孔到折弯边距离 | ≥ 2t + R，否则会拉变形 | 这条最容易被新人忽略 |\n| 去毛刺 | 技术要求写「所有锐边去毛刺 C0.5」 | — |\n\n> **血泪提醒**：激光切割件在图上标「折弯 90°」是不够的，必须给**展开图**或**折弯系数**，否则切出来折完尺寸不对，整批报废。","s":"整理文档·04_制作规范与制图规范","k":"doc","i":"K0102"},{"t":"3.4 亚克力/PC 件","c":"加工工艺","b":"- 激光切割亚克力会**有 0.1~0.3mm 的锥度**，配合孔建议留 0.2 余量；\n- 亚克力不能攻丝（会裂），要么用螺母+沉孔，要么用热熔铜螺母；\n- 灯腔用 3mm 乳白亚克力做匀光板，比直接露灯珠好看十倍。\n\n---","s":"整理文档·04_制作规范与制图规范","k":"doc","i":"K0103"},{"t":"4. 材料与工艺选型（大符常用）","c":"加工工艺","b":"| 零件 | 推荐材料 | 工艺 | 理由 |\n| --- | --- | --- | --- |\n| 立柱 / 底架 | 2020 / 4040 铝型材 + 角件 | 型材切割 + 螺栓 | 可拆、可调、便宜，符合「可移动道具」 |\n| 灯臂主体 | 2mm 5052 铝板 | 激光切割 + 折弯 | 轻、刚性够、不锈 |\n| 靶面基板 | 2mm 铝板 + 3mm 乳白亚克力 | 激光 + 铣 | 抗 17mm 弹丸冲击 |\n| 靶面图案 | 哑光 PVC 贴纸 / UV 打印 | 外协 | 必须哑光，亮面反光会让视觉识别崩 |\n| 轮毂 | 6061 铝，6~8mm 厚 | CNC / 激光 + 车 | 要装轴承，必须机加工 |\n| 主轴 | 45# 钢或 6061，Ø15~20 | 车削 | 悬臂结构，刚度优先 |\n| 中心 R 标 | Ø106 亚克力 + 背光 | 激光 + 丝印 | 与图 4-33 一致 |\n| 灯条 | WS2812B 5V 灯带 / 灯板 | — | 独立寻址，满足「2 块随机点亮」 |\n\n---","s":"整理文档·04_制作规范与制图规范","k":"doc","i":"K0104"},{"t":"5. 电气与结构的接口（画图时就要想好）","c":"案例开源","b":"| 需求 | 结构应对 |\n| --- | --- |\n| 5 臂 × 2 靶 × 独立灯控 | 灯带串接走**中轴空心轴**，或每臂独立走线 + 集线环 |\n| 旋转体到固定体走线 | 滑环（贵）或「限位 ±180° 来回摆」或无线（东大 3SE 方案） |\n| 供电 | 旋转体上放电池最省事；否则必须滑环 |\n| 传感器 | 官方出售**能量机关传感器模组（柔性压力传感器）**，495 元/套，供应商：墨现科技（东莞） |\n\n> 这一条决定了你的方案是「像赛场那样滑环供电」还是「自带走电 + 无线通信」。**两条路线的图完全不一样**，必须在第一周就定下来。\n\n---","s":"整理文档·04_制作规范与制图规范","k":"doc","i":"K0105"},{"t":"6. 图纸交付前的 12 条自检（打印出来贴屏幕）","c":"图纸规范","b":"1. [ ] 标题栏：名称、图号、材料、数量、比例、版本、日期、设计人 —— 齐了吗\n2. [ ] 视图够不够看懂？给没画过这个零件的人看 30 秒，他能说出来形状吗\n3. [ ] 有没有轴测图\n4. [ ] 尺寸有没有重复标注 / 封闭尺寸链\n5. [ ] 配合尺寸给公差了吗\n6. [ ] 形位公差（同心度、垂直度、平面度）标了吗\n7. [ ] 粗糙度标了吗\n8. [ ] 技术要求写了吗（去毛刺、未注公差、表面处理）\n9. [ ] 钣金件给展开图 / 折弯系数了吗\n10. [ ] 标准件写了型号和国标号吗（轴承 6202-2RS、螺栓 GB/T 70.1 M4×12）\n11. [ ] BOM 数量和图上序号对得上吗\n12. [ ] 文件名是 `图号_名称_V版本_日期` 吗（别叫「最终版-真的最终.dwg」）\n\n---","s":"整理文档·04_制作规范与制图规范","k":"doc","i":"K0106"},{"t":"1. 通知原文（逐条转写）","c":"队伍制度","b":"1. 每个人都要出**一份对应场地道具的图纸和方案文档**。\n2. **每周**都要将自己的图纸发到对应场地道具**飞书群中审核**，第一周没图纸也要**发文档出来作为进度**。\n3. 鼓励在画图或者选型过程中把问题发对应场地道具飞书群中，**一起解决**。\n4. **不能**以绘制场地道具为由**长期不来实验室**，也不能忽视**实践任务**的技能培养。\n5. 做到**每周都有进度**，严禁摆烂几周，最后一周再赶进度。\n6. 本次场地道具任务、**考勤要求**以及**实践任务**，作为新人**第一次考核**，纳入我们对新人的考量之中；对于考核中不合预期的组员，会做**严肃规劝退队**处理。\n\n---","s":"整理文档·05_队伍任务与考核要求","k":"doc","i":"K0107"},{"t":"2. 把通知翻译成「每周必须交什么」","c":"队伍制度","b":"| 条款 | 硬性动作 | 频次 | 判定标准 |\n| --- | --- | --- | --- |\n| ① 每人一份图纸 + 方案文档 | 提交 2 份文件：**方案文档** + **图纸包** | 最终 1 次 | 图纸能被第三方照着加工 |\n| ② 每周发群审核 | 每周日在飞书群发**本周产出** | **每周 1 次** | 第一周允许只有文档，之后必须有图 |\n| ③ 问题发群 | 每周至少提 **2~3 个具体问题**（不是「这个怎么画」而是「A 方案 3mm 铝板够不够」） | 每周 | 群里有你的提问记录 |\n| ④ 到实验室 | 每周 **≥ 3 次**，累计 ≥ 10 小时 | 每周 | 考勤表 |\n| ⑤ 不许最后赶工 | 每周有可交付物（哪怕是一张草图） | 每周 | 无「空窗周」 |\n| ⑥ 纳入考核 | 以上全部计入第一次考核；不合预期 → 规劝退队 | — | — |\n\n> 注意 ④「实践任务」这四个字：意思是**除了画图，还要动手**（切板、打磨、装配、调试）。你不能只交 DWG。这一点会直接影响我在学习计划里的安排——每周都留了动手时间。\n\n---","s":"整理文档·05_队伍任务与考核要求","k":"doc","i":"K0108"},{"t":"2.5 周报与考勤：官方机制（10-24 通知原文，比群消息更硬）","c":"队伍制度","b":"上面那六条是群里发的提醒，下面这三条是通知里的**制度**，执行方式不一样：\n\n| 制度 | 怎么做 | 频次/标准 |\n| --- | --- | --- |\n| **周报** | 飞书主页右下角「更多 → 工作台 → 周报」 | 每周一次 |\n| **周报内容** | **必须附实践任务照片**（分螺丝、用雕刻机、用打印机），再写学习内容和场地道具进度 | — |\n| **考勤** | 「更多 → 工作台 → 考勤」，上班打卡；走时也要打下班卡 | 每周 **> 10 小时**，地点土槽楼或负二 |\n\n> 所以是两条线并行：**周报走工作台**（带照片），**图纸发到大符群审核**（带文件）。别只做一样。\n\n另外两条硬要求：\n\n- 必读《重生之我进入Taurus机械组》《分零件须知》\n- 自备一套内六角扳手\n\n---","s":"整理文档·05_队伍任务与考核要求","k":"doc","i":"K0109"},{"t":"机械组-大符-高荣信","c":"赛事场地","b":"- **已经学会**：……（这周真正掌握的东西，写具体，\"学会了 SolidWorks\"不算）\n- **正在学习**：……（还在啃的，说明卡在哪一步）\n- **这周还干了**：……（画了什么、切了什么、帮谁干了什么）\n- **预计下周（或未来）需要学**：……\n- **疑难**：\n  1. ……\n  2. ……\n```\n\n> 「疑难」不要空着。空着等于没思考。队里的人是真的会在这一栏里问\"花键怎么画\"\"气弹簧怎么选\"的。","s":"整理文档·05_队伍任务与考核要求","k":"doc","i":"K0110"},{"t":"3.2 项目评审表（进入设计阶段后，第 2 周起）","c":"赛事场地","b":"| 项目 | 必须回答的问题 |\n| --- | --- |\n| 整车功能点 | 大符要实现什么、给谁用 |\n| 异常 | 出了什么问题、怎么改的 |\n| 验收 | 做到什么程度算过（要可量化） |\n| 安装 | 哪些部位要精度（同轴度 0.05、平面度 0.3…） |\n| 已完成内容 | 这周做完了什么 |\n| 下一周目标 | 下周做到什么 |\n| 阻碍 | 卡在哪、需要谁帮 |\n| 预计交付时间 | 分节点给日期 |\n\n> 评审时师兄大概率只盯**「验收」和「安装」**两行——它们逼你想清楚\"怎么算做完\"和\"哪里必须准\"。","s":"整理文档·05_队伍任务与考核要求","k":"doc","i":"K0111"},{"t":"3.3 附件命名","c":"赛事场地","b":"```\n大符_方案文档_V0.1_20261101.pdf\n大符_轮毂_DWG-03_V0.1_20261108.pdf\n```\n\n按 `项目_零件_图号_版本_日期` 来，别出现「最终版」「真的最终版」。","s":"整理文档·05_队伍任务与考核要求","k":"doc","i":"K0112"},{"t":"4. 飞书云文档：已接入（2026-10-26 08:47）","c":"装配维护","b":"那份 wiki 是「机械」知识空间的根节点，下面有 **8 个子页面**。已通过飞书连接器（你的账号身份）读取，详见 `08_队伍知识库_飞书实录.md`。\n\n三件最要紧的事：\n\n1. **`场地道具开发维护文档` 第 10 节「大符」是空的** —— 你的任务不是照着已有需求画图，而是**先把需求定义出来**，画完再补回这一节。\n2. **队伍的真实周报格式**是：`已经学会 / 正在学习 / 这周还干了 / 预计下周需要学 / 疑难`。每周发群按这个写（见第 3 节的模板，已按队伍格式更新）。\n3. **机械组对场地道具的技术要求只有两条**：高稳定性、高冗余；耐磨抗造。\n\n> 另外有一条来自王奇英的建议值得记住：场地道具负责人要负责**一整个赛季的维护**，不是\"设计出来装好就完事\"。方案文档里应该有「维护方案」这一节（易损件清单、备件、检修周期）。\n\n---","s":"整理文档·05_队伍任务与考核要求","k":"doc","i":"K0113"},{"t":"5. 风险提示（说实话）","c":"材料板材","b":"1. **26 天做完一套大符图纸，时间很紧。** 一个新人从零学 SolidWorks 到出可加工图纸，正常要 6~8 周。你只有不到 4 周，所以计划里我砍掉了「从零学软件」的部分，改成「边画边学」。\n2. **第 6 条不是吓唬人。** 「规劝退队」写进通知里，说明这次是筛选。每周的可见进度 > 单次的高质量产出。\n3. **最大的坑不是画图，是选型。** 走线方案（滑环 / 电池 + 无线）、驱动方案（直驱 / 减速）、材料（铝 / 亚克力 / 型材）这三个决定一旦定错，图要重画。所以第一周必须把它们定下来，哪怕只是拍脑袋定，也要定。","s":"整理文档·05_队伍任务与考核要求","k":"doc","i":"K0114"},{"t":"一、先把「完成」定义清楚","c":"图纸规范","b":"不然 26 天会糊掉。11/20 那天，你手上应该有这 5 样东西：\n\n| # | 交付物 | 形式 | 及格线 |\n| --- | --- | --- | --- |\n| 1 | **方案文档** | PDF，8~15 页 | 说清「做什么、为什么这么设计、怎么装、多少钱」 |\n| 2 | **三维模型** | SolidWorks 装配体 | 能转、无干涉、包络 ≤ Ø1400 |\n| 3 | **工程图** | DWG + PDF，≥ 8 张 | 第三方能照着加工，无需口头补充 |\n| 4 | **BOM** | Excel | 每个件的名称/规格/数量/材料/来源/单价 |\n| 5 | **装配说明** | 2~3 页 | 装配顺序、关键间隙、调试要点 |\n| 6 | **飞书第 10 节补写** | 飞书文档正文 | 把「大符」这一节从空变成有内容 |\n\n> 「第三方能照着加工」是唯一标准，**外加队伍那两条**：高稳定性、高冗余；耐磨抗造。\n> 第 6 项容易被忽略，但它是唯一会留在队里的东西——明年的人打开飞书，看到的是你写的这一节。\n\n---","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0115"},{"t":"二、四周总览","c":"图纸规范","b":"```\n10/26 ────────── 11/1 │ 11/2 ────────── 11/8 │ 11/9 ───────── 11/15 │ 11/16 ── 11/20\n   第 1 周 认知 + 方案     第 2 周 建模 + 选型        第 3 周 出图 + 工艺       第 4 周 定稿 + 验证\n   ─────────────────────────────────────────────────────────────────────────────────\n   产出：方案文档 v0.1      产出：3D 模型 v1 + BOM      产出：工程图包 v1         产出：v1.0 全套\n   无图纸也合规             首次出图                    8 张以上                  可下单\n```\n\n| 周次 | 日期 | 主题 | 核心产出 | 提交节点 |\n| --- | --- | --- | --- | --- |\n| W1 | 10/26 一 – 11/1 日 | 读懂它 + 定方案 | 方案文档 v0.1（含尺寸表、结构分解、选型结论） | **11/1 周日 20:00** |\n| W2 | 11/2 一 – 11/8 日 | 建出来 | 装配体 v1 + 关键零件 + BOM v1 | 11/4 周三打卡；**11/8 周日 20:00** |\n| W3 | 11/9 一 – 11/15 日 | 画成图 | 工程图 ≥8 张（总装 + 7 个关键件）+ 加工清单 | 11/11 周三预审；**11/15 周日 20:00** |\n| W4 | 11/16 一 – 11/20 五 | 定稿 + 落地 | 图纸 v1.0 + BOM 终版 + 装配说明 + 试装记录 | 11/18 组内评审；**11/20 定稿** |\n\n---","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0116"},{"t":"学什么","c":"赛事场地","b":"| 内容 | 材料 | 到什么程度 |\n| --- | --- | --- |\n| 大符是什么、怎么被打 | `02_能量机关机制与时序.md` | 能给别人讲清「5 臂、6 秒一圈、打亮的那块、按环数给增益」 |\n| 场地里它在哪、周围有什么 | `docs/01_赛事规则_场地与能量机关位置.md` | 知道装配区/科技核心/机库平台的关系 |\n| 有哪些尺寸是死的 | `03_能量机关结构与尺寸.md` | 能默写 8 个关键数字 |\n| 图纸长什么样 | `docs/04_制作规范与制图规范.md` | 知道标题栏 7 个字段 |\n| **队伍怎么要求** | `08_队伍知识库实录.md` | 知道第 10 节是空的、两条技术要求、周报格式 |\n| **结构设计方法** | 飞书「资料汇总」里前三份 PDF：结构件设计流程经验总结 / 结构设计的思维逻辑 / 传动机构简述 | 各翻一遍，不求记住，求知道去哪查 |\n| SolidWorks 基础 | B 站「SolidWorks 零基础」前 10 集 | 会草图、拉伸、旋转、装配配合、出工程图 |","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0117"},{"t":"每天的安排","c":"图纸规范","b":"| 日期 | 任务 | 时长 | 产出 |\n| --- | --- | --- | --- |\n| **10/26 一** | 读 01、02 两份文档；**解压并打开往年图纸总装**（`04_往年图纸与代码/往年大符总装_2024版/a机械组-能量机关总装2-林涵-20240524.SLDASM`），把装配树过一遍 | 3h | 手绘结构分解图 + 装配树截图 |\n| **10/27 二** | 读 03，抄一份**尺寸表**（自己手打，别复制）；对照往年图纸标出哪些零件用在哪 | 2h | `progress/W1_尺寸表.xlsx` |\n| **10/28 三** | 读 04；装好 SolidWorks 工程图模板（GB 图框 + 标题栏）；**量往年总装的头部质量（评估→质量属性）** | 3h | 一份模板 + 质量数据 |\n| **10/29 四** | **去实验室**：看实物大符、量轴的直径与悬臂长度；找王奇英问\"断头侠\"的失效过程 | 3h | 现场照片 + 访谈笔记 |\n| **10/30 五** | 写方案文档：结构方案做 **A/B 两套对比**（见下），重点回答\"怎么减重、怎么抗弯\" | 3h | 文档初稿 |\n| **10/31 六** | **去实验室**：动手——切一块靶面板，或帮师兄装东西（拍照留档，周报要用） | 4h | 实物照片 |\n| **11/1 日** | 改文档、配图、导出 PDF；**工作台填周报（附实践照片）+ 20:00 在大符群发文档** | 2h | **方案文档 v0.1 + 周报** |","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0118"},{"t":"方案文档 v0.1 必须回答的 8 个问题","c":"材料板材","b":"1. 这是给谁用的？（队内训练 / 视觉调试 / 操作手练打）\n2. 放在哪？室内还是室外？能不能搬？（决定尺寸和重量）\n3. 转不转？转多快？用什么电机？\n4. 红蓝两面做不做？还是只做一面？\n5. 靶面怎么检测命中？（压力传感器 / 微动开关 / 键轴 / 只做灯不检测）\n6. 电怎么进旋转体？（滑环 / 自带电池 / 限位来回摆）\n7. 主体用什么材料？（铝型材 + 铝板 / 全亚克力 / 木结构）\n8. 大概多少钱？几周能做完？\n\n> 第 5 和第 6 条是**全部设计的岔路口**，第 1 周必须拍板，拍错了后面全返工。","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0119"},{"t":"两个方案模板（照着填，但方向已经变了）","c":"传动机构","b":"队里有一整套 2024 版总装（`04_往年图纸与代码/往年大符总装_2024版/`），已知问题是**头部太重、支撑轴压弯**。所以真正要选的是「改」还是「重画」：\n\n| 项 | 方案 A：改旧图（推荐） | 方案 B：重画轻量版 |\n| --- | --- | --- |\n| 做法 | 沿用 2024 总装的底座/传动/滑环，只重做**轴系 + 扇叶** | 全部重画，只沿用 M3508 + 同步带 3.75 的传动比 |\n| 工作量 | 2~3 周可出图 | 4 周起，风险高 |\n| 风险 | 受旧结构限制，改动空间小 | 时间不够，画不完 |\n| 加分 | 有对比、有失效分析、改动可验证 | 原创性高 |\n| 建议 | **先按 A 做，画出 1~2 个关键件的 B 版做对比** | 只做轴和扇叶的替代方案，不整套重画 |\n\n> 判断依据：王奇英说\"支撑扇叶的轴已经有点歪了\"，而图纸里 2024-11-22 才补的加固件——说明**加固是被动救火，不是设计**。你要做的是把它变成设计（算弯矩、定轴径、加斜撑或缩短悬臂）。","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0120"},{"t":"本周验收（自己打分）","c":"结构设计","b":"- [ ] 能不看资料说出：5 臂 72°、Ø1400、2300/300、Ø308/Ø300、Ø106、6 秒一圈\n- [ ] 能说清往年方案的六块结构（底座/回转/传动/导电/扇叶/中心）分别由哪些零件组成\n- [ ] 能手画结构分解图，标出「哪部分转、哪部分不转」\n- [ ] 量出头部质量，粗算轴根部的弯矩\n- [ ] 方案文档里有 A/B 对比和明确的「选 A（或 B），因为……」\n- [ ] 11/1 20:00 前：周报填了（带照片）、文档也发群了\n\n---","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0121"},{"t":"学什么","c":"传动机构","b":"| 内容 | 材料 | 到什么程度 |\n| --- | --- | --- |\n| 自顶向下建模 | SW「布局草图 / 骨架零件」教程 | 会用骨架草图驱动 5 臂阵列 |\n| 圆周阵列 + 镜像 | — | 改一个臂，5 个都变 |\n| 装配配合 | 同心/重合/距离/角度 | 不用「固定」硬怼 |\n| 干涉检查 | SW「评估 → 干涉检查」 | 能读出干涉体积 |\n| 标准件 | 轴承 6202/6004、GB/T 70.1 内六角、同步带轮 | 知道去哪下模型（米思米/怡合达） |\n| 电机参数 | GM6020 / M3508 规格书 | 知道额定转速、扭矩、安装孔位 |","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0122"},{"t":"关键动作（按顺序）","c":"结构设计","b":"1. **11/2 一**：把官方 STEP 里的中央高地部分导入，量靶心半径 R_target、轴向偏置 Z_target（`03` 文档第 4 节那两个未知量）。\n2. **11/3 二**：建骨架草图——一个 Ø1400 的包络圆 + 5 条 72° 中心线 + 高度 2300/300 的基准面。**这张草图决定后面所有零件的位置。**\n3. **11/4 三**：建轮毂 + 主轴 + 轴承座（回转核心）。当晚截图发群打卡。\n4. **11/5 四**：**去实验室**，把人家的轴承、型材、电机拿来量实物，修正模型。\n5. **11/6 五**：建一条灯臂（板 + 折边 + 加强筋 + 靶框），阵列 5 份，镜像出红蓝。\n6. **11/7 六**：**去实验室**，装配练习 / 帮忙干活 3h；回来做干涉检查。\n7. **11/8 日**：出 3 张图（整体轴测、正视图、俯视图）+ BOM v1，**20:00 发群**。","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0123"},{"t":"本周产出","c":"结构设计","b":"- `大符_装配体_v1.SLDASM`\n- 关键零件 6~10 个 `.SLDPRT`\n- `BOM_v1.xlsx`（含标准件型号）\n- 3 张预览图（轴测/正视/俯视）\n- 一张「干涉检查报告」截图（有干涉就列出来，不丢人）","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0124"},{"t":"本周验收","c":"图纸规范","b":"- [ ] 包络 ≤ Ø1400（用包络草图量）\n- [ ] 5 臂 72° 均布，红蓝镜像正确\n- [ ] 干涉检查 0 处（或已知干涉有解释）\n- [ ] 靶面能拆（单独一个零件，不是和灯臂焊死）\n- [ ] BOM 里每个件都有来源（自制/采购/库存）\n\n> 常见翻车：第 2 周就想把灯条、走线、螺栓全画进去，结果第 3 周没时间出图。**模型只画到「能表达结构和尺寸」为止，螺钉孔位画出来就行，螺钉本身不用一颗颗装。**\n\n---","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0125"},{"t":"出图清单（建议）","c":"加工工艺","b":"| # | 图名 | 类型 | 关键标注 |\n| --- | --- | --- | --- |\n| 1 | 大符总装图 | 装配 | BOM、总体尺寸 Ø1400×2600、安装接口 |\n| 2 | 底架/立柱 | 焊接/型材 | 高度、孔位、S109 红外窗口 150×150 |\n| 3 | 主轴 | 车削件 | Ø 公差 h6、同轴度、表面 Ra1.6 |\n| 4 | 轮毂 | CNC | 轴承孔 H7、5 臂安装孔位置度 |\n| 5 | 轴承座 | CNC | 同轴度、垂直度 |\n| 6 | 灯臂（钣金） | 展开图 + 折弯图 | 折弯线、折弯角、展开长、孔边距 |\n| 7 | 靶面板 | 激光切割 | Ø308/Ø300、环线、安装孔 |\n| 8 | 中心 R 标 | 激光 + 丝印 | Ø106 |\n| 9 | 灯腔/走线 | 装配示意 | 走线路径、过线孔 |\n| 10 | 电机安装板 | 钣金/CNC | 电机孔位、张紧槽 |","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0126"},{"t":"每天的安排","c":"图纸规范","b":"| 日期 | 任务 |\n| --- | --- |\n| 11/9 一 | 建 GB 工程图模板（A3/A2 两套），设好图层、线型、字体、标题栏 |\n| 11/10 二 | 出图 1~3（总装、底架、主轴） |\n| 11/11 三 | 出图 4~5；**当晚把 2 张图发群预审**（让别人先挑错，别等周日） |\n| 11/12 四 | **去实验室**：拿图纸跟实物对，看标注合不合理 |\n| 11/13 五 | 出图 6~8（钣金三件套） |\n| 11/14 六 | **去实验室**：按图试切一件（靶面板或灯臂），验证图对不对 |\n| 11/15 日 | 补齐 9~10、做加工清单、导 PDF 合并，**20:00 发群** |","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0127"},{"t":"本周验收","c":"图纸规范","b":"- [ ] 每张图有标题栏、比例、材料、图号、版本\n- [ ] 配合尺寸都有公差\n- [ ] 钣金件有展开图\n- [ ] 标准件写了型号\n- [ ] 试切件能装上去（哪怕只有一个件）\n\n---","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0128"},{"t":"本周目标","c":"赛事场地","b":"**把「我的图」变成「队里能用的图」。** 只剩 5 天，不再新增设计，只做修改、核对、归档。\n\n| 日期 | 任务 | 产出 |\n| --- | --- | --- |\n| 11/16 一 | 收齐群里/评审的修改意见，逐条列成清单（改/不改 + 理由） | 意见闭环表 |\n| 11/17 二 | 按清单改图，出 v1.1 | 图纸 v1.1 |\n| 11/18 三 | **组内评审**（请师兄/组长过一遍），现场记录问题 | 评审记录 |\n| 11/19 四 | 最后一轮修改；补装配说明（顺序、间隙、调试） | 装配说明 |\n| **11/20 五** | **定稿**：图纸 v1.0 + BOM 终版 + 加工文件（DWG/PDF/DXF）+ 归档 + **把内容补写进飞书「场地道具开发维护文档」第 10 节「大符」** | **全套交付** |","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0129"},{"t":"归档结构（建议照这个建文件夹）","c":"图纸规范","b":"```\n大符_交付_20261120/\n├─ 01_方案文档/\n│   └─ 大符方案文档_v1.0.pdf\n├─ 02_三维模型/\n│   ├─ 大符_装配体_v1.0.SLDASM\n│   └─ 零件/*.SLDPRT\n├─ 03_工程图/\n│   ├─ PDF/*.pdf\n│   ├─ DWG/*.dwg\n│   └─ DXF_激光切割/*.dxf\n├─ 04_BOM/\n│   └─ BOM_v1.0.xlsx\n├─ 05_装配说明/\n│   └─ 装配与调试说明_v1.0.pdf\n└─ 06_过程记录/\n    ├─ 每周进度截图/\n    └─ 评审意见与闭环.xlsx\n```","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0130"},{"t":"本周验收","c":"图纸规范","b":"- [ ] 所有评审意见都有「改了/没改 + 理由」\n- [ ] 图纸版本号统一为 v1.0，文件名规范\n- [ ] 加工文件能直接发给厂家（DXF 无多余图层、单位 mm）\n- [ ] 装配说明写清「先装什么、后装什么、哪里要留间隙」\n\n---","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0131"},{"t":"七、时间账（先看清楚再开始）","c":"图纸规范","b":"| 项目 | 每周 | 合计（4 周） |\n| --- | --- | --- |\n| 实验室（≥3 次 × 3h） | 9~12h | 36~48h |\n| 线上学习 + 画图 | 6~8h | 24~32h |\n| 写文档/出图/改图 | 4~6h | 16~24h |\n| **合计** | **19~26h** | **76~104h** |\n\n平均每天 **3~4 小时**。如果你还有高数、C 语言、驾考科目二要顾，这个强度是**满负荷**的。建议：\n\n- 把「实验室日」固定成周二/周四/周六，别临时找时间；\n- 高数作业放在实验室回来的晚上（脑子还热）；\n- 第 3 周最累，提前把那个周末空出来。\n\n---","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0132"},{"t":"八、常见坑（都是别人踩过的）","c":"图纸规范","b":"| 坑 | 后果 | 怎么躲 |\n| --- | --- | --- |\n| 第 1 周不定走线方案 | 第 3 周发现要滑环，结构全改 | 第 1 周必须拍板 |\n| 模型画得太细（每颗螺钉） | 没时间出图 | 螺钉只画孔 |\n| 图纸不标公差 | 加工回来装不上 | 配合面必标 |\n| 钣金不给展开图 | 折弯后尺寸不对，整批报废 | 展开图 + K 因子 |\n| 等「画完美了再发群」 | 违反第 5 条，考核扣分 | 半成品也发，附「哪里不确定」 |\n| 只画图不下实验室 | 违反第 4 条，直接进观察名单 | 每周固定 3 次 |\n| 最后一周才改图 | 改不完 | 第 3 周就开始预审 |\n\n---","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0133"},{"t":"九、跟踪表（打印出来，每周日打勾）","c":"图纸规范","b":"| 周次 | 提交了吗 | 图纸张数 | 实验室次数 | 群里提问数 | 自评（1-5） | 师兄反馈 |\n| --- | --- | --- | --- | --- | --- | --- |\n| W1 10/26-11/1 | ☐ | 0（文档） | ☐☐☐ | ☐☐☐ | | |\n| W2 11/2-11/8 | ☐ | 3（预览） | ☐☐☐ | ☐☐☐ | | |\n| W3 11/9-11/15 | ☐ | ≥8 | ☐☐☐ | ☐☐☐ | | |\n| W4 11/16-11/20 | ☐ | ≥8 + 全套 | ☐☐☐ | ☐☐☐ | | |\n\n---","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0134"},{"t":"十、给你的三句话","c":"图纸规范","b":"1. **第 1 周的文档比第 3 周的图纸更重要**——它决定你后面三周是不是在白干。\n2. **每周都发，哪怕很烂。** 通知第 5 条针对的不是质量差，是「消失」。\n3. **图纸是给加工师傅看的，不是给评审看的。** 评审看的是你有没有想过加工。","s":"整理文档·06_学习计划_1026至1120","k":"doc","i":"K0135"},{"t":"1. 资料获取状态总表","c":"赛事场地","b":"| # | 资料 | 状态 | 本地位置 / 链接 |\n| --- | --- | --- | --- |\n| 1 | 《RoboMaster 2027 超级对抗赛比赛规则手册 V1.0.0》 | ✅ 已提取 | 原始 PDF 在 `E:\\workbuddy\\robomaster\\`；要点见 `docs/01`、`docs/02` |\n| 2 | 《RoboMaster 2027 高校系列赛机器人制作规范手册 V1.0.0》 | ✅ 已提取 | 原始 PDF 在 `E:\\workbuddy\\robomaster\\`；要点见 `docs/04` |\n| 3 | 官方「规则/资料中心」wiki | ⚠️ 部分 | 页面为前端渲染，正文需登录/脚本；**导航目录已完整抓取**，见第 2 节 |\n| 4 | 队伍飞书云文档 | ❌ 未获取 | 需登录，见 `docs/05` 第 4 节（请导出 PDF 给我） |\n| 5 | 官方场地图纸 STEP（RMUC 2027 全场） | ✅ 已下载 | `01_官方规则与规范/官方场地模型_RMUC2027.stp`（624MB） |\n| 6 | 官方「能量单元」STEP | ✅ 已下载 | `01_官方规则与规范/官方能量单元模型.stp`（3MB）——注意它不是能量机关 |\n| 7 | 队伍群任务通知（截图） | ✅ 已转写 | `docs/05` |\n| 8 | 官方标准模型入口（robomaster.com） | ✅ 已定位 | 见第 3 节 |\n\n---","s":"整理文档·07_参考资料与开源方案","k":"doc","i":"K0136"},{"t":"2. 官方「规则/资料中心」目录（已抓取，可作为找资料的索引）","c":"赛事场地","b":"站点：\n\n```\n比赛规则 Rulebooks\n├─ 阅读指南\n├─ RMUC 2027 比赛规则文件          ← 就是本地这两份 PDF\n├─ RMUL 2027 比赛规则文件\n├─ RMU 2027 通信协议\n└─ 2026 及更早（归档）\n\n赛事产品 Event Products\n├─ 裁判系统（机载端各模块、赛事引擎、RM Assistant）\n├─ 配件（弹丸、电机、电调、开发板……）\n└─ 机器人套件\n\n技术评审 Technical Assessment（RMUC 2027）\n├─ 赛季规划 Season Planning\n├─ 规则测评 Rule Exam\n├─ 中期进度文档 Mid-term Progress Documentation\n├─ 裁判系统考核\n├─ 完整形态考核 + 细则\n└─ 赛季总结\n\n培训体系 Learning Labs\n├─ 参赛攻略 Beginner's Guide\n├─ 课程沙龙 Course Workshop\n└─ 开源材料 Open-source Materials   ← 有空可以翻，里面有机械/视觉入门\n```\n\n> 为什么抓目录有用：这个站的正文是前端渲染，直接抓是空壳。但**导航目录是服务端直出的**，所以「有哪些文件」这件事是可靠的。以后找东西先看这张表。\n\n---","s":"整理文档·07_参考资料与开源方案","k":"doc","i":"K0137"},{"t":"3. 官方开源：2027 场地图纸（一定要下）","c":"赛事场地","b":"**帖子**：《RMU 2027 场地图纸&可移动道具开源》 \n\n| 文件 | 格式 | 大小 | 说明 |\n| --- | --- | --- | --- |\n| `RMUC2027_V1.0.0.stp` | STEP | 653 MB | **全场模型，含中央高地和能量机关** |\n| `RMUL2027_3V3_V1.0.0.stp` | STEP | 1.99 MB | 联盟赛 3V3 |\n| `RMUL2027_1V1_V1.0.0.stp` | STEP | 1.11 MB | 联盟赛 1V1 |\n| `能量单元.stp` | STEP | 3.07 MB | 能量单元道具（不是能量机关本体） |\n\n官方声明：「仅做参考使用，若此模型与规则手册标注或与比赛现场场地有结构出入，以规则手册和现场场地为准。」\n\n**我做了什么**：把全场 STEP 下载到本地，并从里面提取了半径 154mm（Ø308）的圆形特征做拟合，**实测出靶心半径 R=521.7mm**——这个数手册上没标，是画图的关键定位尺寸。详见 `docs/03` 第 4.1 节。\n\n---","s":"整理文档·07_参考资料与开源方案","k":"doc","i":"K0138"},{"t":"4. 官方出售：能量机关传感器模组（自建训练大符必看）","c":"赛事场地","b":"**公告**：《RoboMaster 2027 机甲大师高校系列赛物资购买说明》\n\n| 项目 | 内容 |\n| --- | --- |\n| 物料名称 | 能量机关传感器模组（**柔性压力传感器**） |\n| 单价 | **495 元/套**（含税，不含运费，运费到付） |\n| 供应商 | 墨现科技（东莞）有限公司 |\n| 联系人 | 刘磊星 15820434522 / leixing.liu@mxkj.net.cn |\n| 发货 | 收到货款 3 个工作日内 |\n| 购买备注 | 「RM + 学校全称 + 联系人姓名」 |\n\n> **这条很关键**：如果队伍不想自己搞环数检测（微动开关/键轴/摄像头），直接买这套柔性压力传感器模组，495 元就能有官方的检测方案。你的方案文档里应该把「买 / 自己做」作为一个决策点写清楚。\n\n---","s":"整理文档·07_参考资料与开源方案","k":"doc","i":"K0139"},{"t":"5.1 深圳大学 RobotPilots｜可环数检测能量机关（RM2023）","c":"案例开源","b":"- 链接：\n- 方案：**微动开关**检测环数，成本低、控制简单\n- 开源内容：机械图纸 + STP 模型 + F103/F407 控制板 PCB + 代码 + 技术报告《基于微动开关的可环数检测能量机关》\n- 网盘：` 提取码 `RPNB`\n- 成绩：2023 赛季击打 40 环及以上次数最多的队伍之一\n\n**值得抄的点**：机械结构分件方式、环数分区怎么和开关对应。","s":"整理文档·07_参考资料与开源方案","k":"doc","i":"K0140"},{"t":"5.2 东南大学 3SE｜无线键轴大能量机关（RM AWARD 2024）","c":"赛事场地","b":"- 链接：\n- 代码：\n- 方案：**机械键盘键轴**做击打检测 + **无线（ESP32/BLE）** 代替滑环 + 完整灯效与操作上位机\n- 特点：支持大小符模式、正反方向、灯效参数整定、环数成绩回传、OTA 升级\n\n**值得抄的点**：\n1. **无线方案**——彻底绕开滑环，旋转体自带电池，这在结构上省掉一大块设计；\n2. **键轴方案**——比微动开关手感一致、寿命长、易更换；\n3. 他们的公众号/文档里写了「常见问题」，比如键轴被打坏会自动屏蔽，这是实战经验。\n\n> 你第 1 周要拍板的「电怎么进旋转体」，答案基本就在 5.2 里。**先看别人的方案，再决定自己画什么**，这不是抄，这是省时间。\n\n---","s":"整理文档·07_参考资料与开源方案","k":"doc","i":"K0141"},{"t":"6. 其他常用资源","c":"图纸规范","b":"| 用途 | 去处 |\n| --- | --- |\n| 标准件模型（轴承、螺栓、同步带轮） | 米思米（misumi.com.cn）、怡合达（yaheda.com） |\n| 铝型材与角件 | 同上，或本地五金市场 |\n| SolidWorks 教程 | B 站搜「SolidWorks 工程图 国标模板」「钣金展开」 |\n| GB 制图标准 | GB/T 14689（图幅）、GB/T 1804（未注公差）、GB/T 1184（形位公差） |\n| 官方答疑（规则问题） | 规则手册 1.4 节给了问卷入口，备赛期 5 个工作日内答复 |\n\n---","s":"整理文档·07_参考资料与开源方案","k":"doc","i":"K0142"},{"t":"7. 还没拿到的东西（等你补）","c":"加工工艺","b":"| 缺什么 | 为什么需要 | 怎么给我 |\n| --- | --- | --- |\n| 队伍飞书云文档 | 队内规范、验收标准、共享资料位置 | 导出 PDF 放 `E:\\workbuddy\\rm2027\\` |\n| 队内往届大符图纸/模型 | 直接决定你要不要从零画 | 同上 |\n| 队内加工资源（有没有激光切割机、外协哪家） | 决定图纸标注的工艺公差 | 告诉我一句话就行 |\n| 评审人 / 评审节奏 | 决定每周提交给谁看 | 同上 |","s":"整理文档·07_参考资料与开源方案","k":"doc","i":"K0143"},{"t":"1. 空间结构（实测，8 个子页面）","c":"赛事场地","b":"```\n机械（根节点 / 一句话：对技术抱有尊重，对有技术的人抱有尊重）\n├─ DRAWING REVIEW MEETING        每周图纸评审会议记录（最有用）\n├─ 机械组常识文档                 材料、螺纹、轴承、加强筋、同步带、链条、板材\n├─ 海纳百川学无止境-资料汇总        7 份设计 PDF + 论文 + 教材\n├─ 场地道具开发维护文档            ← 你的任务书，第 10 节「大符」是空的\n├─ Taurus 雕刻机使用说明 2025.02\n├─ 拓竹打印机使用教程\n├─ 机械设计美学\n└─ 佬登语录（空）\n```\n\n---","s":"整理文档·08_队伍知识库实录","k":"doc","i":"K0144"},{"t":"2. 最重要的一条：第 10 节「大符」是空的","c":"赛事场地","b":"`场地道具开发维护文档` 有 11 节，第 10 节标题写着「大符」，正文**一个字都没有**。\n\n这意味着两件事：\n\n1. **你不是在填一份已写好的需求，你是在定义这份需求。** 写方案文档时，\"大符要满足什么\"这一节由你提出，然后给师兄确认。\n2. **写完之后，你应该把内容补回这一节。** 这比交一份 PDF 更有价值——它是队里的资产，明年的人会看。这个动作也能直接证明你的「维护意识」。","s":"整理文档·08_队伍知识库实录","k":"doc","i":"K0145"},{"t":"这份文档里已经写好的部分（可直接引用）","c":"装配维护","b":"**3.1 机械组技术要求**（就两句话，但是全部标准）：\n\n> - **高稳定性、高冗余设计**\n> - **耐磨抗造**\n\n**1.2 往期缺点复盘**（去年踩过的坑）：\n\n> - **抗撞击冗余不足**：局部薄弱结构（挡板边角、限位凸起）耐冲击性差（大小弹丸击打），多次对抗后易出现松动、掉漆、板材翘边、螺丝滑丝等问题，需要频繁检修。\n> - **维护体系不完善**\n\n**4. 个人建议 · 王奇英（这段最该读）**：\n\n> 场地道具对于每个兵种测试都是很重要的，相关的场地道具负责人不是说把东西设计出来装好就可以了，而是需要相关人员**一整个赛季的维护**，不要等到要测了，才匆匆忙忙去检查场地道具……负责人要负起相关责任，测试前提前检修，长时间测试要做到连续检修，相关回坏的零件提前发，提前准备好。\n\n> 这段话把「交付图纸」和「负责一个道具」区分开了。你的方案文档里应该有一节叫「维护方案」——易损件清单、备件数量、检修周期。这一节能让你从\"交作业的新人\"变成\"能担事的人\"。\n\n**2.4 飞镖组需求**（唯一写满的一节，可作写法参考）：把需求拆成「靶体 / 移动结构 / 框架 / 缓冲」四条，每条都写了**为什么**（比如\"不要跟去年一样只有一个单独支撑点\"）。\n\n---","s":"整理文档·08_队伍知识库实录","k":"doc","i":"K0146"},{"t":"组别-项目-姓名：","c":"经验避坑","b":"- 已经学会：……\n- 正在学习：……\n- 这周还干了：……\n- 预计下周（或未来）需要学：……\n- 疑难：\n  1. ……\n  2. ……\n```\n\n> 注意最后一项「疑难」：里面既有真问题（\"花键具体画法\"\"气弹簧选型计算\"），也有玩笑话。这说明**提问题是被鼓励的、甚至是必须的**，空着反而不好。","s":"整理文档·08_队伍知识库实录","k":"doc","i":"K0147"},{"t":"3.2 项目评审表格式（进入设计阶段后用）","c":"队伍制度","b":"| 项目 | 必须回答的问题 |\n| --- | --- |\n| 整车功能点 | 这个机构要实现什么 |\n| 异常 | 出了什么问题、怎么改进的 |\n| 验收 | 做到什么程度算过 |\n| 安装 | 哪些部位需要高精度（同轴度、平面度） |\n| 已完成内容 | 这周做完了什么 |\n| 下一周目标 | 下周要做到什么 |\n| 阻碍 | 卡在哪、需要谁帮 |\n| 预计交付时间 | 分节点给日期 |\n\n> 这张表的精髓是**「验收」和「安装」两行**——它逼你想清楚\"怎么算做完\"和\"哪里必须准\"。评审时师兄大概率就盯这两行。","s":"整理文档·08_队伍知识库实录","k":"doc","i":"K0148"},{"t":"3.3 第一周的规则（跟你现在的处境一模一样）","c":"图纸规范","b":"> **「第一周不做硬性图纸要求，但一定要有所学习和收获。」**\n\n这句话直接印证了群通知里那条「第一周没图纸也要发文档」。**所以你这周不用交图，交文档就行，但文档里必须能看出你学了什么。**\n\n---","s":"整理文档·08_队伍知识库实录","k":"doc","i":"K0149"},{"t":"4. 机械组常识文档：能直接查的东西","c":"图纸规范","b":"23k 字，目录如下（画图时会反复查）：\n\n| 章节 | 内容 | 你用得上吗 |\n| --- | --- | --- |\n| 材料 | 常用材料牌号与特性 | ✅ 选型时 |\n| 官方及常用零部件质量或型号 | 电机/轴承等 | ✅ BOM 时 |\n| 螺纹深度选型表 | 不同规格的推荐旋合深度 | ✅✅ 出图必查 |\n| 铨洲螺纹孔规则说明 | 外协厂的加工规则 | ✅✅ 画孔前必看 |\n| 振心铝方管型号大全 / 挤压成型 / 强度 | 型材选型 | ✅ 底架设计 |\n| 剪切应力 / 强度 / 应力 | 力学基础 | 需要时 |\n| 法兰轴承基础参数 | 轴承型号表 | ✅ 回转结构 |\n| 加强筋设计规范 | 底宽≤3.4d、高≤3.4d、筋间距≥2.4d（注：原文是塑料件规范） | ✅ 灯臂加强筋 |\n| **工程图标注小技巧** | 螺纹标注完整格式（M20×2LH-5g6g-S） | ✅✅ 出图必看 |\n| 同步带齿形 | 5M 与 S5M 的区别与不可混用 | ✅ 传动选型 |\n| 打印件压轴承设计技巧 | 潘智杰的经验 | ✅ 3D 打印件 |\n| 滚子链换算 | p = 链号×25.4/16；分度圆 d = p/sin(π/Z) | 用链条时 |\n| 板材详解 | 碳纤维 T300、玻纤 FR4、环氧板 3240 | ✅ 面板选材 |\n| 阻燃等级 | — | 需要时 |\n| 框架补强（口字型/三角斜撑/加强肋/翻边/角撑/工字截面） | 六类补强手法 | ✅✅ 大符抗冲击设计 |","s":"整理文档·08_队伍知识库实录","k":"doc","i":"K0150"},{"t":"两条立刻能用的","c":"图纸规范","b":"**① 螺纹标注完整格式**（很多人只写 M3，是错的）：\n\n```\nM20×2LH - 5g6g - S\n│   │ │    │  └ 旋合长度（S短 / N中 / L长）\n│   │ │    └── 顶径公差带 5g，中径公差带 6g\n│   │ └────── 左旋（右旋不标）\n│   └──────── 螺距 2（细牙）\n└──────────── 公称直径 20\n```\n\n**② 加强筋的比例关系**：底宽 ≤ 3.4d、高 ≤ 3.4d、两筋中心距 ≥ 2.4d（d 为筋厚）。原文注明是塑料件规范，用在铝板上要打折，但**比例关系可以借鉴**——你的灯臂主筋是 60 宽、板厚 24，比例 2.5，正好落在合理区间。\n\n---","s":"整理文档·08_队伍知识库实录","k":"doc","i":"K0151"},{"t":"5. 资料汇总：7 份设计 PDF（都在飞书上，可直接下）","c":"结构设计","b":"| 文件 | 大小 | 对你 |\n| --- | --- | --- |\n| 轻量化设计指南.pdf | 3.7 MB | 减重时看 |\n| 基于拓扑优化的 FSC 镂空链轮设计.pdf | 2.0 MB | 参考思路 |\n| **结构件设计流程经验总结.pdf** | 7.9 MB | ✅✅ 第一周就该看 |\n| **结构设计的思维逻辑.pdf** | 1.2 MB | ✅✅ 第一周就该看 |\n| **传动机构简述.pdf** | 3.7 MB | ✅ 选回转方案时 |\n| 各种关于悬挂的摘抄及底部压杆悬挂方案分析.pdf | 1.8 MB | 暂时不用 |\n| 机械设计（濮良贵 第十版）/ 机械原理（孙桓 第九版） | 77 / 235 MB | 工具书 |\n\n> 前三份（结构件设计流程、结构设计思维逻辑、传动机构简述）建议在第一周翻完，比看视频教程有用。\n\n---","s":"整理文档·08_队伍知识库实录","k":"doc","i":"K0152"},{"t":"6. 以后怎么保持同步","c":"赛事场地","b":"飞书连接器已接通（用户身份，含 `wiki:node:read`、`docx:document:readonly`）。文档更新后，跟我说一句就行：\n\n```\n读一下飞书「场地道具开发维护文档」，看看大符那节有没有更新\n```\n\n我会重新拉取并更新本文档。不需要再导出 PDF。\n\n**当前权限缺口**：`search:docs:read`（全库搜索）没有授权，所以我还不能跨库搜\"大符\"。需要的话跑一次：\n\n```bash\nlark-cli auth login --scope \"search:docs:read\"\n```\n\n不急，先用目录导航也够。\n\n---","s":"整理文档·08_队伍知识库实录","k":"doc","i":"K0153"},{"t":"7. 这份文档改变了什么","c":"案例开源","b":"| 原来（我按行业常规猜的） | 现在（队伍真实情况） |\n| --- | --- |\n| 周报模板：本周完成/产出/决策/问题/计划 | **已经学会/正在学习/这周还干了/下周需要学/疑难** |\n| 验收标准：第三方能照着加工 | 加上队伍的「高稳定性、高冗余、耐磨抗造」 |\n| 大符需求：无 | 需求由你定义，且要写回飞书第 10 节 |\n| 维护：没提 | **一整个赛季的维护**是明确要求，方案里要有维护章节 |\n| 参考资料：网上找 | 飞书里有 7 份 PDF，前三份必看 |","s":"整理文档·08_队伍知识库实录","k":"doc","i":"K0154"},{"t":"1. 群清单（9 个，抓了 7 个）","c":"队伍制度","b":"| 群 | 消息数 | 价值 |\n| --- | --- | --- |\n| **27炒鸡大符** | 84 | ★★★ 你的主战场，往年图纸就是在这里发的 |\n| 场地道具开发维护大队 | 178 | ★★ 各道具进度与需求 |\n| 27机械组通知群 | 65 | ★★★ 任务分配、周报/考勤制度原文 |\n| 27机械组 | 41 | ★★ 组会与日常 |\n| RM2027通知群 | 141 | ★ 全队通知 |\n| Taurus实验室 | 154 | ★ 实验室管理与耗材 |\n| 2027赛季大群 | 15 | ☆ 没什么内容 |\n| Taurus资金报销 / 飞书活跃度打卡 | — | 无关，未抓 |\n\n---","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0155"},{"t":"2. 三条改变计划的信息（来自 27机械组通知群，10-24 20:54）","c":"队伍制度","b":"林创武发的十一条，原文摘要：\n\n1. **分组**：靶车 王家祚/尹嘉玮 · 前哨站 梁泽锐/李馨琪 · 飞镖用基地 冯昭荣/钟湃予 · **能量机关 高荣信、钟自豪** · 飞机撞击靶+三级台阶 梁孜瀚/徐奕昊 · 科技核心 张彦泽/王雨阳\n2. 每人**单独出一份完整图纸**，作为新人第一次考核；但\"独立出图不是单打独斗\"\n3. 设计流程五步：**规则尺寸研讨 → 需求收集及优先级划分 → 方案收集及最终选型 → 结构设计及最终成型 → 跨组交流及落地装配**\n4. **出图 ddl：11 月 20 号前**\n5. 有切板需求可以找师兄带你用雕刻机\n6. 图纸不可能一版就成，要在对应群里发图纸审核\n7. 实践技能：打印机、雕刻机、零件分类、内六角拆装\n8. **周报制度**：飞书主页右下角「更多 → 工作台 → 周报」\n9. **周报必须附实践任务照片**（分螺丝、用雕刻机、用打印机）\n10. **考勤制度**：土槽楼或负二打卡，**每周 > 10 小时**，工作台 → 考勤，上下班都要打卡\n11. 必读《重生之我进入Taurus机械组》《分零件须知》，买一套内六角扳手\n\n> **修正**：之前我按\"群里发文档\"设计的提交方式要改——**周报是走飞书工作台的**，群里的图纸审核是另一件事，两件都要做。\n\n---","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0156"},{"t":"3.1 林创武 10-25 20:36 发的往年图纸","c":"赛事场地","b":"> 「@高荣信 @钟自豪 这是往年图纸」\n> 文件：`机械组-能量机关总装终版-林涵-20240524.7z`（28 MB）\n\n**已下载并解压** → `04_往年图纸与代码/往年大符总装_2024版/`，共 **105 个 SolidWorks 文件**，含总装 `a机械组-能量机关总装2-林涵-20240524.SLDASM`。","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0157"},{"t":"3.2 王奇英（去年做的大符）的两句提醒——这是全场最有价值的信息","c":"赛事场地","b":"> 「注意头不要太重了，小心**断头侠**」\n> 「我们现在的**支撑扇叶的轴已经有点歪了**」\n\n对照图纸文件名，这话有实据：2024-11-22 和 11-23 补了 `扇叶加固件`、`扇叶加固管`、`骑马夹`——都是赛季中后期加的。说明**原设计头部偏重，轴被压弯，靠打补丁救回来的**。\n\n你这一版的第一优先级就是：**减重 + 提高轴的抗弯刚度**。","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0158"},{"t":"3.3 郭卓鑫 10-24 23:00 发的代码","c":"赛事场地","b":"> 「这是大符代码，重构过的，逻辑还是比较完美的，但是灯控部分保留了之前的屎」\n> 文件：`RM_Rune-main.zip`（65 MB）→ 已下载到 `04_往年图纸与代码/`\n\n结构：`mainboard/` + `leafboard/` 双板，STM32 工程（Keil MDK-ARM），`leafboard` 是扇叶端（灯控），`mainboard` 是主板。\n他还提了一句：**扇叶切换的缓冲时间是 100ms，可以改小试试**（对应规则里「灯效熄灭至多 200ms」）。","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0159"},{"t":"4.1 底座与机架","c":"结构设计","b":"| 零件 | 推测作用 |\n| --- | --- |\n| `机械组-架子`、`铝方管长`、`铝方管短 1/2/3` | 主体焊接/螺接框架 |\n| `底板 1/2/3`、`底板连接件1` | 底平面与配重 |\n| `U型槽 1~5` | 五个扇叶的根部定位/走线槽 |\n| `骑马夹`（2024-11-23） | 后期补的管夹，加固用 |","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0160"},{"t":"4.2 回转与支撑（你这次的重点）","c":"结构设计","b":"| 零件 | 说明 |\n| --- | --- |\n| `轴`、`轴固定板`、`轴承夹紧件 1/2` | 主轴与定位 |\n| **`平面推力滚针轴承 内径110`** | 承受轴向载荷（头部重量全压在这） |\n| `推力球轴承 厚5mm` | 辅助轴向定位 |\n| `深沟球轴承` | 径向定位 |\n| `中心垫高件` | 抬升回转面 |\n\n> 内径 110 的推力滚针轴承——这个规格说明**设计者一开始就知道头部很重**。但轴还是弯了，问题不在轴承，在**轴的悬臂长度和直径**。","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0161"},{"t":"4.3 传动","c":"传动机构","b":"| 零件 | 参数 |\n| --- | --- |\n| `M3508 电机` | 驱动 |\n| `小带轮 14M 齿数16 d71` | 主动轮 |\n| `大带轮 14M 齿数60 d267` | 从动轮 |\n| 传动比 | **60/16 = 3.75** |\n\n> 用 M3508（额定约 469 rpm）配 3.75，输出约 125 rpm ≈ 2.1 rad/s，正好覆盖规则要求的 0~2.09 rad/s 区间。**这一套是算过的，可以直接沿用。**","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0162"},{"t":"4.4 导电","c":"案例开源","b":"| 零件 | 说明 |\n| --- | --- |\n| `滑环固定件1`、`滑环固定板1` | **用了滑环**，不是电池+无线 |\n| `线路保护板` | 走线保护 |\n\n> 所以队里现有方案是**滑环路线**。你要改无线方案，得先说服人——因为代码、滑环件都是现成的。","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0163"},{"t":"4.5 扇叶（头部）","c":"材料板材","b":"| 零件 | 说明 |\n| --- | --- |\n| `机械组-扇叶.SLDASM` | 单臂总成 |\n| `PC板 1~5`、`透明PC` | **面板是 PC（聚碳酸酯）**，抗冲击，不是亚克力 |\n| `灯框 1/2/3`、`灯板`、`均光板（靶子）` | 灯腔三层结构 |\n| `靶盘`、`可识别装置`、`靶子固定件 1/2`、`新靶子固定件` | 靶面与视觉识别 |\n| `扇叶固定板`、`扇叶固定板1`、`扇叶加固板` | 面板固定 |\n| **`扇叶加固件`、`扇叶加固管`（2024-11-22）** | **后期补强** |\n| `遮挡板打印件 1/2/3` | 3D 打印遮光 |","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0164"},{"t":"4.7 从文件名日期看迭代史","c":"标准件紧固","b":"```\n2024-01-11  初版：底板、U型槽、扇叶、灯框、铝方管\n2024-01-17~23  密集迭代：轴、轴承夹紧、固定板、遮挡板、铜柱\n2024-03-27~29  靶子固定件、电池架（打法/供电变更）\n2024-05-24  传动件1 修订 + 总装定版\n2024-11-20~23  扇叶加固件、加固管、Rpc、骑马夹  ← 赛季中补强\n```\n\n**最后那一行是关键**：这套图交出去半年后还在加加固件。你 11/20 交的版本，最好一次把这个问题解决掉。\n\n---","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0165"},{"t":"5. 历史故障清单（从大符群聊天提取，直接当维护方案写）","c":"装配维护","b":"| 时间 | 现象 | 原因 | 处理 |\n| --- | --- | --- | --- |\n| 08-01 | 大小符都不亮 | 环误触 | 螺丝拧松一点 |\n| 08-01 | 灯板异常 | **灯板上几个弹簧掉了** | 补装弹簧 |\n| 08-02 | 符上不了电 | **电源线断了**（线太短） | 焊回去 |\n| 08-03 | 有个靶子不亮 | 没插电 | 插上 |\n| 08-04 | 亮扇叶但不转 | — | 王奇英现场处理 |\n| 08-08 | 有个灯臂一直亮 | 未复现 | — |\n\n> 六次故障，**四次是电气连接**（弹簧、电源线、插头），只有一次是机械。你的方案文档里「维护方案」一节可以直接列这张表——这叫**有数据支撑的风险评估**。\n\n---","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0166"},{"t":"6. 云文档情况","c":"赛事场地","b":"| 空间 | 节点 |\n| --- | --- |\n| 机械 | 8 个子页面（已全部抓取，见 `08`） |\n| Hardware | 11 个节点，全是电控/PCB 相关，与大符无关 |\n\n**没找到的两份必读文档**：《重生之我进入Taurus机械组》《分零件须知》。群里被引用过（\"按《分零件须知》中要求去分\"），但没有链接，全库搜索需要 `search:docs:read` 权限（你上次的授权没走完）。\n\n> 你可以直接把这两份的链接发我，或者在飞书里搜一下把链接贴过来。\n\n---","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0167"},{"t":"7. 由此产生的行动项","c":"结构设计","b":"| # | 事项 | 截止 |\n| --- | --- | --- |\n| 1 | 打开 `a机械组-能量机关总装2-林涵-20240524.SLDASM`，通读装配树 | 今天 |\n| 2 | 量出头部重量（SolidWorks 质量属性），算轴的弯矩 | 本周内 |\n| 3 | 定\"减重+抗弯\"方案：缩悬臂 / 加粗轴 / 加斜撑 / 换材料 | 第 1 周 |\n| 4 | 周报改走飞书工作台，**附实践照片** | 本周日起 |\n| 5 | 考勤打卡，每周 > 10h | 本周起 |\n| 6 | 要《重生之我进入Taurus机械组》《分零件须知》链接 | 尽快 |\n| 7 | 找王奇英聊一次\"断头侠\"的具体失效过程 | 本周内 |\n\n---","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0168"},{"t":"8. 一句话总结","c":"赛事场地","b":"**你以为要从零画一个大符，其实队里有一整套 2024 年的完整总装——但它有一个已知的致命伤（头部太重、轴弯了）。你这次真正的任务，是在这套图的基础上把它修好，而不是重画一遍。**","s":"整理文档·09_群聊与文件实录","k":"doc","i":"K0169"},{"t":"2. 工具购买清单（自己买，别拿别人的）","c":"标准件紧固","b":"| 类别 | 具体 |\n| --- | --- |\n| 小型工具 | 内六角扳手 M2–M5（极常用）、M6–M8（较少用）、迷你十字套筒（M2–M4）、7 字套筒（M3/M4） |\n| 钳类 | 尖嘴钳（小空间）、虎头钳（大空间） |\n| 收纳 | 工具箱（先买便宜的） |\n| 进阶 | 航模螺丝刀（PVD 镀钛，M2–M4 不易滑丝） |\n\n> 群里通知也写了\"自备一套内六角扳手\"，指的就是这个。","s":"整理文档·10_必读文档摘要","k":"doc","i":"K0170"},{"t":"3. 理论补课（四冠王 B 站课）","c":"基础理论","b":"- 机械原理 BV1JB4y1w7gq\n- 工程材料 BV1po4y1273q\n- 材料力学 BV15K4y1d7Pe\n\n> 你现在最该看的是**材料力学**——因为你要解决的是\"轴被压弯\"。","s":"整理文档·10_必读文档摘要","k":"doc","i":"K0171"},{"t":"5. 打印机堵头自救","c":"其他","b":"- X1C：`wiki.bambulab.com/zh/x1/troubleshooting/nozzle-clog`\n- H2D：`wiki.bambulab.com/zh/h2/troubleshooting/clogging`\n\n---","s":"整理文档·10_必读文档摘要","k":"doc","i":"K0172"},{"t":"6. ★ 图纸命名规范（强制，直接用）","c":"图纸规范","b":"```\n装配体：装配体名 V1.0-Sn-自己的名字-20251112\n零  件：零件名（尺寸参数）-自己的名字-20251112\n```\n\n例子：\n\n```\n英雄 V1.0-ST-高荣信-20261118\n深沟球轴承（5-14-5）-高荣信-20261118\n```\n\n规则细则：\n\n| 项 | 规则 |\n| --- | --- |\n| 版本号 | 初始 V1.0；**大改动小数点前 +1**（V1.0→V2.0）；**小改动小数点后 +1**（V1.0→V1.1） |\n| Sn | 审核号，n = 审核次数，**n 为 T 表示审核通过、可发加工** |\n| 保存 | **每个零件、每个版本**存盘都要改名，改动再小也要改 |\n| 要求 | 严格按照此规范，\"无论是多么小的改动\" |\n\n> 对照往年图纸：`a机械组-扇叶加固件-林涵-20241122` 就是老格式（零件名-人名-日期），没带 V1.0-Sn。**你按新规范来，师兄会看出来你读过文档。**","s":"整理文档·10_必读文档摘要","k":"doc","i":"K0173"},{"t":"7. ★ 什么叫\"设计\"（这段话值得抄下来）","c":"结构设计","b":"> 「设计 ≠ 画图。真正的设计，本质是在一堆的约束条件下，找到最合理的那一个方案。」\n\n五类约束：\n\n| 约束 | 问自己 |\n| --- | --- |\n| 功能约束 | 要完成什么动作？行程、速度、负载多大？ |\n| 空间约束 | 留给它的空间多大？不能碰裁判系统、不能超重？ |\n| 强度约束 | 受力多大？会不会断、会不会变形？ |\n| 加工约束 | 这个形状加工得出来吗？公差能达到吗？成本能接受吗？ |\n| 装配约束 | 装得进去吗？坏了方便拆吗？ |\n\n好设计的四个标准，**有先后顺序**：\n1. 功能达标 → 2. 可靠耐用 → 3. 可加工 → 4. 易装配维护\n\n> 「先能实现，再能可靠实现，最后才追求做得完美。」","s":"整理文档·10_必读文档摘要","k":"doc","i":"K0174"},{"t":"8. 设计流程（跟你这次的活完全对得上）","c":"结构设计","b":"| 步骤 | 要回答的问题 | 产出物 |\n| --- | --- | --- |\n| ① 需求分析 | 到底要做什么？约束是什么？ | 明确的需求清单 |\n| ② 方案构思 | 用什么原理、什么结构？ | 方案草图 + 选型 |\n| ③ 结构设计 | 每个零件长什么样、怎么连？ | 三维模型 + 工程图 |\n| ④ 验证迭代 | 能不能用、会不会坏？ | 检查报告 + 新版本 |\n\n选标准件的方法：先在淘宝查规格（商家一般给 2D 图，没有就找他要 3D 模型），把关键参数记下，或按 2D 图画出来放进装配体做干涉检查。","s":"整理文档·10_必读文档摘要","k":"doc","i":"K0175"},{"t":"10. ★ 审图走\"神图群\"","c":"图纸规范","b":"> 「我们会要求将自己的设计图纸发到**神图群（审图群）**，交给经验丰富的师兄师姐帮你找漏洞，提出建议，然后自己根据建议做出更改，**直到审图通过**。」\n\n所以完整链路是：**画图 → 发大符群（进度）→ 发神图群（审图）→ 通过（Sn 变 T）→ 发加工**。\n\n之前我只知道\"发飞书群审核\"，现在清楚了：**进度群和审图群是两个群，两件事。**","s":"整理文档·10_必读文档摘要","k":"doc","i":"K0176"},{"t":"11. 发加工","c":"加工工艺","b":"| 类型 | 怎么做 |\n| --- | --- |\n| 标准件 | 淘宝/合作厂家买，价格远低于定制 |\n| 3D 打印件 | 导出 STL/STEP → Bambu Studio 调参数 → 打印 |\n| 板材 | 导出 DWG/DXF → ArtCAM 排刀路 → 雕刻机切 |\n| 外协 | 铨洲智造平台上传 STEP；**文件名要含材料、数量、厚度** |\n\n外协命名示例（文档原图）：\n\n```\n玻纤2mm 数量2 相机.DWG\n碳管外径16内径14长度325数量1.STEP\n```\n\n> 注意：**外协文件名和内部图纸命名是两套规则**。内部讲版本与审核，外协讲材料与数量。别搞混。\n\n---","s":"整理文档·10_必读文档摘要","k":"doc","i":"K0177"},{"t":"2. 三条分螺丝原则","c":"标准件紧固","b":"1. 螺丝、铝柱等**螺丝库有的**分类 → 先分整包，放进对应小盒\n2. **拆车下来的**同类零件 → 也放进对应小盒\n3. **螺丝库没有的**分类（轴承、角码、铝排、钣金、联轴器）→ 用**空的无标签蓝盒**或透明袋装好并标注","s":"整理文档·10_必读文档摘要","k":"doc","i":"K0178"},{"t":"4. 分螺丝流程","c":"图纸规范","b":"| 场景 | 做法 |\n| --- | --- |\n| 分整包 | 看包装型号 → 放对应蓝盒 |\n| 拆车件 | 游标卡尺量尺寸 → 统一收集 → 放对应蓝盒 |\n| 一箱零散件 | 同上，量完归类 |\n| 未分类件 | 空蓝盒或透明袋 + 标注信息 |\n\n---","s":"整理文档·10_必读文档摘要","k":"doc","i":"K0179"},{"t":"三、这两份文档改变了什么","c":"图纸规范","b":"| 原来 | 现在 |\n| --- | --- |\n| 图纸命名：随便起，别叫\"最终版\" | **强制格式** `名称V1.0-Sn-姓名-日期`，Sn 到 T 才能发加工 |\n| 审核：发大符群 | 大符群发进度，**神图群审图**，两条线 |\n| 设计：先建模再改 | 先做需求分析（五类约束），再构思、设计、验证 |\n| 出图标准：第三方能加工 | 加上队伍的四条：功能达标 / 可靠耐用 / 可加工 / 易维护，**按此顺序** |\n| 外协：直接发文件 | 文件名必须含**材料、数量、厚度** |","s":"整理文档·10_必读文档摘要","k":"doc","i":"K0180"},{"t":"3.1.1 重装机器人","c":"赛事场地","b":"重装机器人可以通过获取并装配能量单元，获取多样化的团队增益；满足一定条件后，还可以发射42mm\n弹丸。\n表 3-3 重装机器人的关键特征\n关键特征\n说明\n初始区域\n启动区\n运行方式\n不限，最多配置1 个遥控器和1 个自定义终端\n多机通信\n允许\n发射机构\n1 个可安装的模块化42mm 发射机构\n射击初速度上限（m/s） 成功安装模块化42mm 发射机构后为16.5\n扣血与超限惩罚机制\n\n射击初速度超限：适用\n\n射击热量超限和冷却：适用\n\n底盘功率超限：适用\n\n攻击伤害或撞击：适用\n\n裁判系统模块离线：适用\n\n判罚伤害：适用\n详见“5.1 扣血与超限惩罚机制”\n回血与复活机制\n\n回血方式：可通过允许的增益点或远程兑换血量。\n\n复活方式：读条复活或兑换立即复活。\n详见“5.3 回血与复活机制”\n弹丸的装载和补给\n\n三分钟准备阶段，机器人可预装42mm 和17mm 弹丸，初始允许发弹\n量为0。\n\n七分钟比赛阶段，可通过允许的增益点兑换或远程兑换允许发弹量。\n© 2026 大疆 版权所有   23\n关键特征\n说明\n经验与性能体系\n不适用\n注：重装机器人的属性随比赛进程变化而变化。\n可激活的增益点\n\n基地增益点\n\n中央高地增益点\n\n地形跨越增益点（公路、高地、隧道）\n\n制高点增益点\n\n前哨站增益点\n\n装配区增益点\n\n补给区增益点\n\n堡垒增益点\n详见“5.6.4 场地增益机制”\n表 3-4 模块化42mm 发射机构的关键特征\n关键特征\n说明\n初始区域\n工作台\n弹丸的装载与补给\n\n三分钟准备阶段，可预装42mm 和17mm 弹丸，初始允许发弹量为0。\n\n七分钟比赛阶段，可通过允许的增益点兑换或远程兑换允许发弹量。","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0181"},{"t":"3.1.2 步兵机器人","c":"赛事场地","b":"步兵机器人可以发射17mm 弹丸。\n表 3-5 步兵机器人的关键特征\n关键特征\n说明\n初始区域\n启动区\n运行方式\n不限，最多配置1 个遥控器和1 个自定义终端\n多机通信\n允许\n关键特征\n说明\n发射机构\n1 个17mm 发射机构\n射击初速度上限（m/s）\n25\n扣血与超限惩罚机制\n\n射击初速度超限：适用\n\n射击热量超限和冷却：适用\n\n底盘功率超限：适用\n\n攻击伤害或撞击：适用\n\n裁判系统模块离线：适用\n\n判罚伤害：适用\n详见“5.1 扣血与超限惩罚机制”\n回血与复活机制\n\n回血方式：可通过允许的增益点或远程兑换血量。\n\n复活方式：读条复活或兑换立即复活。\n详见“5.3 回血与复活机制”\n弹丸的装载和补给\n\n三分钟准备阶段，可预装42mm 和17mm 弹丸，初始允许发弹量为0。\n\n七分钟比赛阶段，可通过允许的增益点兑换或远程兑换允许发弹量。\n详见“5.4 经济体系”\n经验与性能体系\n适用\n注：底盘功率上限、初始血量、上限血量、射击热量上限、射击热量冷却速率\n等参数与等级、底盘类型相关，详见“5.5 经验及性能体系”。\n可激活的增益点\n\n基地增益点\n\n中央高地增益点\n\n地形跨越增益点（公路、高地、隧道）\n\n制高点增益点\n\n前哨站增益点\n\n补给区增益点\n© 2026 大疆 版权所有   25\n关键特征\n说明\n\n堡垒增益点\n详见“5.6.4 场地增益机制”","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0182"},{"t":"3.1.3 哨兵机器人","c":"赛事场地","b":"哨兵机器人可全自动或半自动运行，可以发射17mm 弹丸。\n表 3-6 哨兵机器人的关键特征\n关键特征\n说明\n初始区域\n启动区\n运行方式\n最多配置1 个遥控器用于调试\n多机通信\n可以向所有己方机器人发送数据，但只能接收雷达的数据\n发射机构\n1 个17mm 发射机构\n射击初速度上限（m/s）\n25\n扣血与超限惩罚机制\n\n射击初速度超限：适用\n\n射击热量超限和冷却：适用\n\n底盘功率超限：适用\n\n攻击伤害或撞击：适用\n\n裁判系统模块离线：适用\n\n判罚伤害：适用\n详见“5.1 扣血与超限惩罚机制”\n回血与复活机制\n\n回血方式：可通过允许的增益点或远程兑换血量。\n\n复活方式：读条复活或兑换立即复活。\n详见“5.3 回血与复活机制”\n弹丸的装载和补给\n\n三分钟准备阶段，可预装17mm 和42mm 弹丸，初始允许发弹量为300。\n\n七分钟比赛阶段，可通过允许的增益点兑换或直接获取、远程兑换允许发\n关键特征\n说明\n弹量。\n详见“5.4 经济体系”\n经验与性能体系\n不适用经验与性能体系，性能与机器人操作方式相关，具体如下：\n自动哨兵机器人\n\n初始血量/上限血量为400\n\n射击热量上限为260\n\n射击热量冷却速率为30/秒\n\n底盘功率上限为100W\n半自动哨兵机器人\n\n初始血量/上限血量为200\n\n射击热量上限为100\n\n射击热量冷却速率为10/秒\n\n底盘功率上限为60W\n详见“5.7.2 哨兵机器人特殊机制”\n可激活的增益点\n\n基地增益点\n\n中央高地增益点\n\n地形跨越增益点（公路、高地、隧道）\n\n制高点增益点\n\n前哨站增益点\n\n补给区增益点\n\n堡垒增益点\n详见“5.6.4 场地增益机制”\n© 2026 大疆 版权所有   27\n3.2 组合系统","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0183"},{"t":"3.2.1 空中系统","c":"赛事场地","b":"空中系统可在战场中执行多样化的攻击和侦察任务。\n表 3-7 空中机器人的关键特征\n关键特征\n说明\n初始区域\n机库\n运行方式\n全自动，但须配备一个遥控器用于急停\n多机通信\n仅允许通过机库间接通信\n表 3-8 机库的关键特征\n关键特征\n说明\n初始区域\n机库平台\n运行方式\n不限，最多配置1 个遥控器\n多机通信\n允许\n发射机构\n不适用\n弹丸的装载和补给\n不允许","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0184"},{"t":"3.2.3 雷达系统","c":"赛事场地","b":"雷达可自主获取战场信息，并通过多机通信向己方机器人或裁判系统选手端发送信息，还可以截获对方的\n信息。\n表 3-10 雷达系统的关键特征\n关键特征\n说明\n初始区域\n雷达基座\n运行方式\n自动运行，最多配置1 个遥控器用于调试\n多机通信\n可以向所有己方机器人发送数据，但只能接收哨兵机器人的数据","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0185"},{"t":"3.3.1 自定义终端","c":"赛事场地","b":"自定义终端（原自定义控制器与自定义客户端）是参赛队伍自制的一套多用途设备，用于监测机器人运动、\n状态，控制机器人动作，接收裁判系统赛事引擎服务器发送的比赛相关信息与机器人图传画面，并能够向\n赛事引擎服务器发送赛事专用交互指令，以拓展人机交互可能性。\n典型的自定义终端可由一个显示设备、一个运算平台（包括存储器、控制器与运算器）及一组输入设备组\n成；也可采用一体化形式，例如：带有网口的手持平板设备。\n示例：某队伍制作了自定义终端，能够接收机器人图传并在自制显示器上呈现，同时叠加通过非官方\n链路显示的自制UI，并通过配套的控制器对机器人进行操控。由此，该队伍无需使用官方裁判系统选\n手端与遥控器亦能完成比赛。\n操作间内所有自定义终端均可以互相有线连接并通信，且自定义终端可以通过操作间设置的RJ45 接口有\n线接入赛事引擎服务器并收发相关内容。\n自定义终端可以接收裁判系统选手端显示且己方可获取的赛事信息，例如：双方血量、己方经济、比赛剩\n余时间以及比赛关键事件等。\n自定义终端可向裁判系统发送选手端所支持的赛事指令，例如：赛前选择性能体系、赛中兑换允许发弹量、\n干预哨兵行动等主动指令。\n© 2026 大疆 版权所有   29","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0186"},{"t":"4.1 战场概述","c":"赛事场地","b":"\n除特殊标注外，全文描述的所有尺寸均存在一定公差。小于100mm 的尺寸结构误差在±\n5mm 以内，大于等于100mm 的尺寸误差在±5%以内，战场结构的角度误差在±3°以内，\n场地道具的角度误差在±1°以内，场地说明图纸尺寸参数单位为mm。为确保场地稳定性和\n安全性，实际制作时可能会对场地的细节尺寸、工艺进行调整，未在图纸中详细注明的战场\n元素/尺寸，请以实际场地为准。\n\n战场为中心对称布局，全文所涉及的场地模块部分描述及说明图以红方图示为例，蓝方同理。\n场地环境复杂，可能存在不均匀磁场、场馆空调风等不完全对称的环境因素。\n\n渲染图仅供示意，场
