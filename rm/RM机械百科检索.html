地具体尺寸细节以对应图纸为准；未尽事宜以适应性训练实际情况为准。\n\n战场内设有多处增益点与禁区。为确保文档简洁清晰，本章不作逐一赘述，其具体定义将分\n别在“5.6.4.1 场地增益点概述”与“7.2.3.2 机器人与场地道具交互”中统一说明。\nRMUC 的核心比赛场地被称为“战场”。战场是一个长为28m、宽为15m 的区域，内部为木质结构，表\n面铺设厚度为2mm 的PVC 地胶或PVC 夹线地胶，部分结构存在金属保护层，主要包含基地区、高地区、\n公路区等。战场外围有上边沿距离战场地面高度为2.4m 的黑色钢制围挡。\n图 4-1 战场俯视渲染图\n图 4-2 战场斜视渲染图\n图 4-3 战场轴测渲染图\n© 2026 大疆 版权所有   31\n[1]\n补给区\n[2]\n公路区\n[3]\n公路隧道\n[4]\n前哨站\n[5]\n远高地隧道\n[6]\n近高地隧道 [7]\n红方机库平台 [8]\n蓝方装配区\n[9]\n堡垒\n[10] 制高点\n[11] 飞镖发射站\n[12] 雷达基座\n[13] 工作台\n[14] 资源站\n[15] 基地\n[16] 中央高地\n[17] 蓝方机库平台 [18] 能量机关\n[19] 科技核心\n[20] 红方装配区\n[21] 梯形高地\n[22] 风机\n图 4-4 战场模块示意图\n[1] 与战场长边平行且为飞镖发射站朝向\n图 4-5 战场模块定位尺寸图\n© 2026 大疆 版权所有   33\n全文场地尺寸以左右倾斜面为基准标注，实际战场非水平地面，以战场中轴线为轴，向长边两侧倾斜1°~2°，\n具体如下图所示。战场倾斜会导致弹丸向长边两侧流动。\n为了使弹丸顺利回收，在战场部分木制结构与地面的交线可能存在高度约50mm 的开槽，并且\n在比赛结束后会短暂开启战场木制结构内的涵道风机。\n[1] 较高处 [2] 较低处 [3] 基地底座 [4] 堡垒底座 [5] 装配区底座\n图 4-6 战场倾斜示意图\n图 4-7 风机示意图\n风机在场地中会根据场地木质结外形构嵌入到木质结构中。\n[1] 进风口 [2] 出风口\n© 2026 大疆 版权所有   35","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0187"},{"t":"4.2 基地区","c":"赛事场地","b":"基地区包含启动区、基地、飞镖发射站、制高点、雷达基座、补给区、堡垒。\n[1] 飞镖发射站 [2] 制高点 [3] 风机\n[4] 启动区 [5] 雷达基座\n[6] 堡垒\n[7] 工作台 [8] 补给区 [9] 资源站\n图 4-8 基地区示意图","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0188"},{"t":"4.2.2 基地","c":"赛事场地","b":"基地是双方攻防的核心，放置于双方启动区中央的基地底座上。\n基地由基地主体、6 块基地装甲模块、飞镖检测模块、基地护甲等组成。基地护甲有两种形态：护甲闭合\n和护甲展开。\n图 4-10 基地底座示意图\n[1] 基地装甲模块 [2] 飞镖检测模块\n图 4-11 基地护甲闭合形态尺寸图\n图 4-12 基地护甲展开形态尺寸图\n飞镖检测模块位于基地和前哨站上部，由飞镖装甲模块、飞镖检测传感器和飞镖引导灯组成。\n其中飞镖检测模块的飞镖装甲模块可检测飞镖的击打；飞镖检测传感器可检测飞镖触发装置发射的红外光\n束。当飞镖触发装置向飞镖检测模块的投影完全落在飞镖装甲模块内，且飞镖检测模块同时检测到红外光\n束和击打时，系统认为该模块被飞镖命中；仅检测到击打时，则系统认为该模块被弹丸击中。飞镖引导灯\n发射520nm 波段的绿色可见光，飞镖引导灯在近似为点光源时其发光强度约为10cd，发光部分直径约为\n55mm，用于引导飞镖击打目标。\n当飞镖触发装置向飞镖检测模块的投影未完全落在飞镖装甲模块内，也有一定概率被飞镖检测模\n块成功识别。\n© 2026 大疆 版权所有   39\n基地飞镖检测模块\n前哨站飞镖检测模块\n图 4-13 飞镖检测模块示意图\n[1] 飞镖装甲模块 [2] 飞镖检测传感器 [3] 飞镖引导灯","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0189"},{"t":"4.2.3 飞镖发射站","c":"赛事场地","b":"飞镖发射站是飞镖系统的唯一放置区，由发射站主体、滑台和闸门组成。飞镖发射站内设置有照明装置，\n不可关闭。裁判系统自检阶段飞镖发射站闸门会短暂开启（约5 秒），开启期间内，飞镖检测模块会静止于\n基地固定目标的对应位置。在三分钟准备阶段与十五秒裁判系统自检阶段中，前哨站和基地的飞镖引导灯\n均亮起。\n[1] 闸门 [2] 状态指示灯 [3] 飞镖系统放置空间 [4] 滑台 [5] 发射站主体\n图 4-14 飞镖发射站示意图\n图 4-15 滑台滑出示意图\n© 2026 大疆 版权所有   41\n[1] 飞镖系统放置平面 [2] 支撑轮\n图 4-16 滑台尺寸图","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0190"},{"t":"4.2.5 雷达基座","c":"赛事场地","b":"雷达基座用于放置雷达系统，上端为面积3.4m*1.16m 的平台。平台平面中央与战场中心轴线对齐，距战\n场地面高度约为2.4m，四周有高度为1.1m 的围栏。平台旁边设有传感器数据线槽孔，比赛时根据实际\n场地情况进行使用。\n雷达运算平台端通过220V 市电供电，其放置平台放置有：\n\n1 台仅支持HDMI 信号输入的官方显示设备，其显示分辨率为1920*1080。参赛队伍可将其用于确认\n雷达系统运行的情况。\n\n1 根HDMI 公头信号线，用于连接雷达系统和官方显示设备。\n\n1 个新国标5 孔插座，其中单相两极和单相三极插孔可以同时接入，为雷达系统供电，该插座不可移\n动。\n[1] 雷达信息波\n[2] 传感器数据线槽孔\n[3] 雷达信息波发射面\n[4] 雷达传感器放置平台 [5] 雷达运算端放置平台\n图 4-18 雷达基座示意图\n© 2026 大疆 版权所有   43\n[1] 战场出入口 [2] 出入口台阶 [3] 雷达基座\n图 4-19 雷达基座的相对位置示意图","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0191"},{"t":"4.2.6 补给区","c":"赛事场地","b":"补给区包括资源站、补给区增益点、工作台，是机器人进行血量恢复、补充允许发弹量、获取能量单元、\n安装模块化42mm 发射机构的重要区域。\n[1] 风机 [2] 补给区\n图 4-20 补给区示意图\n© 2026 大疆 版权所有   45\n资源站是重装机器人获取能量单元的区域，其中设置有6 个能量单元，均以磁吸的方式固定在能量单元放\n置区内。重装机器人需沿能量单元旋转对称轴的方向取出能量单元，该过程除克服重力外，还需额外施加\n至多10N 的力以克服磁吸力。\n[1] 能量单元放置区 [2] 挡板\n图 4-21 资源站示意图\n能量单元的实际安装位置相对于图示，可能存在绕对称轴的角度偏差。图示仅做示意，具体请以\n实际放置情况为准。\n图 4-22 能量单元放置区示意图\n工作台位于补给区，机器人可以拾取并安装模块化42mm 发射机构。\n图 4-23 工作台示意图\n© 2026 大疆 版权所有   47\n公路区面向补给区的墙体设置有金属材质的视觉标签，用于相机图传模块判断机器人是否位于补给区，如\n下所示。\n[1] 视觉标签\n红方视觉标签\n蓝方视觉标签\n图 4-24 视觉标签示意图","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0192"},{"t":"4.3.2 中央高地","c":"赛事场地","b":"中央高地位于战场中部，两端通过坡道与公路区连接。\n[1] 红方装配区 [2] 蓝方装配区 [3] 12°坡\n[4] 风机\n[5] 金属板\n图 4-27 中央高地示意图\n© 2026 大疆 版权所有   51\n4.3.2.1 装配区\n装配区位于战场中央，能量机关正下方。装配区分为红、蓝双方。能量机关下方设置有科技核心，重装机\n器人可以将能量单元装配至科技核心，具体如下图所示。\n[1] 能量机关\n[2] 科技核心 [3] 红方装配区 [4] 14°坡\n[5] 蓝方装配区 [6] 12°坡\n[7] 46°坡\n[8] 12°坡\n图 4-28 装配区轴测图\n图 4-29 装配区尺寸图\n© 2026 大疆 版权所有   53\n4.3.2.2 机库平台\n机库平台位于战场中央，机库平台分为红、蓝双方。双方仅能把空中系统安装在机库平台。\n[1] 红方机库平台 [2] 蓝方机库平台\n图 4-30 机库平台示意图\n4.3.2.3 能量机关\n能量机关位于装配区正上方。能量机关由电机驱动并按照一定规律同步转动。能量机关分为红蓝两侧，一\n侧为红方能量机关，另一侧为蓝方能量机关。\n\n能量机关中部由于重量较大，会出现轻微下坠的现象，下坠范围为0~50mm。\n\n由于观察视角问题及传动间隙，观察一方能量机关时可能会看到对方能量机关的一部分。\n能量机关有5 个均匀分布的灯臂，具体位置和尺寸如下所示：\n图 4-31 能量机关示意图\n图 4-32 能量机关灯臂尺寸示意图\n© 2026 大疆 版权所有   55\n实际灯臂的圆靶最大直径为308mm，实际有效检测直径为300mm。\n图 4-33 能量机关中心标识尺寸图\n4.3.2.4 前哨站\n前哨站放置于前哨站底座上，由前哨站主体、3 块前哨站装甲模块、飞镖检测模块组成。飞镖检测模块示\n意图请参阅“图 4-13 飞镖检测模块示意图”。前哨站增益点位于前哨站四周，具体位置如下图所示。\n[1] 前哨站底座 [2] 前哨站 [3] 中部装甲\n图 4-34 前哨站示意图\n© 2026 大疆 版权所有   57","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0193"},{"t":"4.4.1 起伏路段","c":"其他","b":"起伏路段位于公路区，其表面按照一定间距、图示方向排布着凸起，如下所示。\n[1] 起伏路段\n图 4-36 起伏路段示意图\n[1] 凸起\n图 4-37 凸起示意图\n© 2026 大疆 版权所有   59","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0194"},{"t":"4.5.1 可移动道具","c":"其他","b":"能量单元为可移动道具，可被机器人抓取和携带。能量单元是重量约为400±50g 的中空柱体，双端不对\n称。\n随着比赛的进行，可移动道具表面可能出现轻微破损或灰尘积累，该情况需参赛队伍自行适应，\n但污损严重的可移动道具将不会被用于正式比赛。\n[1] 铁片\n图 4-39 能量单元示意图\n© 2026 大疆 版权所有   61","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0195"},{"t":"4.5.2 弹丸","c":"赛事场地","b":"机器人可通过发射弹丸攻击装甲模块，进而造成伤害。比赛中使用的弹丸参数及安排如下所示：\n表 4-1 弹丸参数及使用安排\n类型\n外观\n颜色\n尺寸\n质量\n邵氏硬度\n材质\n使用安排\n额定数量\n42mm\n发光弹丸\n与高尔夫球\n外形相似\n半透明\n42.5mm\n±0.5mm\n44.5g\n±0.5g\n90±5A\n塑胶\nTPE\n赛季全程\n100 发/局\n17mm\n荧光弹丸\n球形\n黄绿色\n16.8mm\n±0.2mm\n3.2g±\n0.1g\n90±5A\n塑胶\nTPU\n赛季全程\n有限，但不\n少于3000\n发/局","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0196"},{"t":"2.1.5 外观设计","c":"赛事场地","b":"为了防止机器人的外观设计影响赛场上射击对抗以及观赛体验，设计与制作机器人外观时需遵循以下规范：\n基础要求：\nS31 机器人的线路需整齐、无金属线芯裸露，无法避免的外露线材需用拖链、理线器等材料进行保护。\nS32 机器人的外观中不得出现明显影响美观的材料，如洗脸盆、塑料瓶、瓦楞纸、床单、白色泡沫板、气\n垫膜等。\nS33 不得使用渔网作为外观设计材料，但是可以用于制作空中机器人保护罩。\nS34 不得设计或使用尖锐结构，以防造成场地破坏和人员伤害。\nS35 地面机器人在距地面0～400mm 高度范围内，所有外露机构可能与其他机器人装甲模块检测面发生\n直接接触的结构边缘，均应进行圆角处理，圆角半径应不小于10mm。\n检录区将提供柔性防护材料供现场领取使用。但由于柔性材料现场覆盖后，可能存在与机\n器人结构、运动机构或功能部件不适配的情况，建议参赛队伍在赛前提前完成保护罩加装，\n或使用柔性材料对相关结构进行包覆处理。\n光泽度：\nS36 机器人任意大于10mm*20mm 的区域外观的光泽度不得大于30Gs。光轴、摄像头镜片等降低光泽\n度后无法使用的物品除外，但此类物品与装甲模块左右边缘的最短直线距离需大于100mm。\n涂装颜色：\n\n建议全队机器人外观风格协调一致。\n\n建议单个机器人外观上带有两个己方学校校徽或队徽，分别贴在不同方向。单个校徽或队徽\n的面积大小不超过100mm*100mm。校徽或队徽需处于机器人的显眼位置，且与装甲模块\n两侧灯条的距离不小于30mm。如果出现外观不满足规范的情况，检录工作人员会要求更\n正校徽或者队徽的粘贴位置或大小。\nS37 红方机器人保护壳颜色可使用红色系，蓝方机器人可使用蓝色系。机器人至多出现4 处对方赛队颜\n色的区域，且单个区域的面积不得超过60mm*60mm。\n在设计机器人时，建议尽可能不使用红色系或蓝色系的配件。\nS38 校徽、队徽的喷绘或贴纸不得影响机器人视觉特征，不可发光。\n保护壳安装：\n建议参赛队伍采用不易破损的韧性材料进行保护壳制作，同时对保护壳进行可靠性测试，避免\n赛场上的对抗导致保护壳损坏，从而出现违规情况。\n装饰要求：\nS39 广告位需放置在机器人的左右两侧，且与装甲模块边缘的距离不小于30mm。\nS40 广告位喷绘或贴纸不得影响机器人视觉特征，不可发光。\nS41 单个机器人广告位面积大小不得超过100mm*100mm，每台机器人最多可设置2 个广告位用于赞\n助商露出。如果出现外观不满足规范的情况，检录工作人员会要求更正广告位的粘贴位置或大小。\nS42 附属设备（自定义终端）及其部件，其硬件或软件（含用户界面UI）均不得以任何形式展示赞助商\n的品牌名称、标识、广告语等相关元素。\n© 2026 大疆 版权所有   17\n校徽或队徽、广告位可进行反白处理，也可保留原色。\n2.1.6 发射机构\n发射机构：能够让弹丸以固定路径和一定初速度离开机器人的机构。\nS43 使用压缩气体作为弹丸发射动力的加速行程不得大于200mm（进入测速模块前需要完成加速）。\nS44 机器人发射机构需能够稳定发射10 发17mm 弹丸或者5 发42mm 弹丸。\nS45 每个发射机构均需遵循规范安装对应的测速模块。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0197"},{"t":"2.4 机器人技术规范","c":"结构设计","b":"\n最大收纳尺寸：机器人需存在一种状态满足最大收纳尺寸限制，包含裁判系统及其支架。\n\n最大伸展尺寸：机器人任意时刻的最大尺寸限制，以机器人机械结构可能展开到极限姿态为\n准，包含裁判系统及其支架。组合系统与系统单元存在物理连接时，所连接的系统单元均计\n入组合系统的最大伸展尺寸。在检录时，参赛队伍需主动展示所有的机械结构变形情况，在\n变形前、中、后机器人任意形态均不得超过最大伸展尺寸要求。\n\n本节中，机器人的长、宽、高分别对应机体坐标系的X 轴、Y 轴、Z 轴方向上的长度。其中，\n空中机器人、雷达的X 轴、Y 轴方向任选，Z 轴垂直于其放置平面，飞镖系统不适用坐标系\n相关规范。\nS66 除雷达系统、自定义终端、模块化42mm 发射机构外，机器人在尺寸发生变化时不得被拆分为独立\n单体；同时连接结构需满足下列要求：\n\n允许使用机械铰接或球接（例如：合页、转轴、球头轴承、直线导轨）、其他通过实体本体结构互\n锁的可动连接。\n\n禁止使用柔性牵引连接（例如：线缆、绳索、链条、皮带）、依赖吸附/摩擦维持的连接（例如：\n吸盘、磁吸、仅靠摩擦力的连接）。\n螺丝、扎带等零件的松紧调节但不拆除不视为拆分为独立单体。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0198"},{"t":"3 裁判系统安装规范","c":"装配维护","b":"建议用户首先阅读裁判系统各模块的说明书，了解裁判系统各模块的功能以及安装方式。正确安装裁判系\n统的各模块后，再阅读《裁判系统用户手册》了解整个裁判系统的功能。\n文件下载地址：\n在安装、使用裁判系统时，参考以下建议：\n\n在机器人运行过程中，裁判系统任意模块不与地面、墙面等其他物体产生碰撞、摩擦等可能产生损坏\n的交互行为。\n\n裁判系统各模块应按照说明手册中指定的方式进行连接，应做好相应保护以保证连接稳定。\nS105 除本手册中提及的安装方式外，禁止对裁判系统机载端进行任何的拆卸、改装。\nS106 机器人仅可安装当前赛季借用的裁判系统。\nS107 在比赛和检录期间更换裁判系统机载端模块时，需遵循以下时间要求（不包含升级固件的用时）：\n表 3-1 裁判系统机载端各模块最长更换时间\n模块\n最长更换时间（分钟）\n主控模块\n5\n电源管理模块\n10\n灯条模块\n5\n小装甲模块\n2\n装甲支撑架\n7\n相机图传模块（发送端）\n5\n场地交互模块\n7\n17mm 测速模块\n7\n42mm 测速模块\n7\n定位模块\n4\n© 2026 大疆 版权所有   45\n模块\n最长更换时间（分钟）\n超级电容管理模块\n3\nS108 机器人在翻倒期间，如不符合制作规范，裁判可能根据实际情况免除判罚，但机器人主动进入的任\n何状态均不视为异常工况。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0199"},{"t":"3.3 主控模块安装规范","c":"装配维护","b":"参考主控模块尺寸，在机器人特定位置预留安装孔位。\n[1] 红外接收器 [2] 按键\n[3] 电源指示灯 [4] 黑色金属圈航空线接口\n[5] 金属下壳\n[6] 升级接口 [7] 塑胶上壳\n[8] 屏幕\n图 3-1 主控模块示意图\n3.3.1 安装步骤\n1.\n使用4 颗M2.5 螺钉将主控模块固定至机器人特定位置。\n安装参考：可自行设计零件，且四周做好非金属挡板保护，避免受弹丸击打。\n© 2026 大疆 版权所有   49\n2.\n使用包装内的航空转接线，将主控模块与电源管理模块的黑色金属圈的航空线接口连接。\n主控模块与电源管理模块连接时，中间不得串连其它的裁判系统机载端模块。\n[1] 航空转接线\n图 3-2 主控模块连线示意图\n3.3.2 安装要求\n主控模块的安装需应满足下列要求，否则可能造成无法连接赛事服务器、连接质量不稳定等情况。\n\n机器人在工作状态下，主控模块的上表面应水平朝上，以各自天线中心为顶点，应至少存在一个锥角\n为60°（立体角为π(2-√3)sr）、无限延伸范围内无导电材料遮挡的锥体或对无线信号传输无干扰的等\n效空间（需为同一锥体且调整后的图形的完整锥体的母线需在上半球内），具体如下图所示。\n[1] 禁止遮挡区域\n图 3-3 主控模块禁止遮挡区域\n\n主控模块应安装在散热良好的位置，否则极有可能因为主控模块散热问题导致赛中出现工作异常。\n\n主控模块屏幕、按键、接口、红外接收器等上方应避免遮挡。在设计保护装置时，应使用透明材质且\n便于打开，若不可打开，则需将屏幕、按键、接口、红外接收器完全外露。若造成遮挡，可能导致完\n全无法连接比赛服务器、无法进行异常排查等问题。\n\n以Logo 的中心点正下方8.5mm 处为球心，70mm 半径的上半球内应避免导电材料、电磁吸收材料\n或其他可能产生WIFI 信号干扰的部件。\n若云台或机械臂等机构所带的电磁屏蔽材料或电磁干扰设备在运动的过程中经过该区域，\n可能导致WiFi 信号被干扰。\n[1] 天线中心\n图 3-4 主控模块安装位置示意图\nS109 能量机关立柱上设有一处长150mm、高150mm 的红外发射区域。该区域沿立柱宽度方向居中布\n置，下边缘与机库平台底面齐平。参赛队须根据该区域的位置设计机库主控模块的安装位置及方向，\n确保主控模块的红外接收器朝向该区域并处于有效接收范围内，以便于连入服务器。\n© 2026 大疆 版权所有   51\n[1] 红外发射区域 [2] 主控模块\n图 3-5 机库主控模块安装示意图\n准备阶段上电后若一定时间没有成功连入服务器，可以在红外范围内适当调整主控位置。\nS110 正式比赛时，飞镖系统、雷达系统需参照组委会指定的方式连接电源管理模块与主控模块。\n对于雷达系统：\n战场提供有线方式使得雷达系统连入战场网络和服务器。雷达运算平台端方式平台提供了有线接入点：单\n端母头航空线。场地人员需将雷达运算平台端上电源管理模块中的主控接口，通过官方的航空对接线连接\n到有线接入点上。\n为了使雷达系统能够快速地完成接入并成功连接，请遵循以下要求：\n\n在比赛过程中，雷达系统无需自身携带主控，检录前请取下机器人上调试用的主控。\n\n雷达系统的电源管理模块必须外露，且放在工作人员容易操作的位置。\n\n雷达系统电源管理模块上的主控接口不可连接任何设备。该航空线需理顺收纳，不可相互缠绕，且应\n易于拉出并连接在有线接入点上。\n对于飞镖系统：\n战场提供有线方式使得飞镖系统连入战场网络和服务器。飞镖发射站内提供一根线长为800mm 的单端母\n头航空线。场地人员需通过官方的航空对接线将飞镖系统连接到有线接入点上。\n为了使飞镖系统能够快速地完成接入并成功连接，请遵循以下要求：\n\n在比赛过程中，飞镖系统无需自身携带主控，检录前请取下机器人上用于调试的主控。\n\n连接电源管理模块和主控之间的航空线可以不借助工具方便拔插。\n\n飞镖系统的电源管理模块必须外露，且放在工作人员容易操作的位置。\n\n飞镖系统的电源管理模块安装位置需尽可能靠近飞镖发射站有线连接接入点，且另一端不可连接任何\n设备。该航空线需理顺收纳，不可相互缠绕，且应易于拉出并接在有线接入点上。\n[1] 0.8m 长裁判系统母头连接线 [2] 飞镖系统放置平面\n图 3-6 飞镖发射站裁判系统航空线位置示意图\n© 2026 大疆 版权所有   53","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0200"},{"t":"3.4 电源管理模块安装规范","c":"装配维护","b":"参考电源管理模块尺寸，在机器人特定位置预留安装孔位。\n[1] 连接状态指示灯\n[2] 系统状态指示灯\n[3] 发射机构电源输出指示灯\n[4] 云台电源输出指示灯 [5] 底盘电源输出指示灯 [6] 底部安装面\n图 3-7 电源管理模块示意图\n3.4.1 安装步骤\n灯条模块、相机图传模块（发送端）、测速模块和定位模块的航空线接口均为等效接口，相互可\n串行连接。\n使用4 颗M2.5 螺钉将电源管理模块固定至机器人上。\n[1] 电源管理模块\n图 3-8 电源管理模块安装示意图\n© 2026 大疆 版权所有   55\n[1]\n装甲模块SM06B-GHS-TB 接口\n[2] 场地交互模块SM04B-GHS-TB 接口\n[3]\n超级电容管理模块SM04B-GHS-TB 接口 [4] 主控模块接口（该航空线接口的金属圈为黑色）\n[5]\n其它裁判系统机载端模块的接口（测速、定位、图传、灯条，该航空线接口的金属圈为银白色）\n[6]\n裁判系统串口SM03B-GHS-TB 接口\n[7] 系统升级SM03B-GHS-TB 接口\n[8]\n裁判系统电源XT60 接口（输入）\n[9] Mini PC 电源XT30 接口（输出）\n[10] 裁判系统电源XT30 接口（输出）⸺连接底盘\n[11] 裁判系统电源XT30 接口（输出）⸺连接云台\n[12] 裁判系统电源XT30 接口（输出）⸺连接发射机构\n图 3-9 电源管理模块接口示意图\n[1] 航空转接线\n图 3-10 电源管理模块接线示意图\n3.4.2 安装要求\n电源管理模块的安装需保证满足以下要求：\n电源管理模块需被稳固固定在耐热材料上且处于散热良好的位置，各个接口做好保护。电源管\n理模块在使用过程中会存在发热现象，若使用双面胶等胶类固定电源管理模块，极有可能导致\n电源管理模块脱落，从而带来安全隐患。因电源管理模块固定不当或散热不良造成的后果由参\n赛队伍自行承担。\nS111 对于有底盘功率限制的机器人，需计入底盘功率的机构所使用的电能禁止跳过电源管理模块的监控。\nS112 飞镖系统、雷达系统需使用组委会安装于场地的主控模块。因此，参赛队伍在设计机器人时需满足\n以下要求：\n\n在设计飞镖系统、雷达系统结构时，需将电源管理模块的主控模块接口外露。\n\n在设计飞镖系统结构时，需将电源管理模块安装在靠近飞镖发射站入口的位置。\nS113 仔细区分电源管理模块的接口，确保接线正确，机器人的机构供电参照“表 3-4 电源管理模块接口\n说明”。\n除地面机器人底盘电源外，为保证机器人其他的电源供电接口（如云台电源、42mm 发\n射机构电源）供电稳定，这些供电接口可由电池供电，并通过继电器或其他手段进行控制，\n© 2026 大疆 版权所有   57\n但需通过下表相应的电源管理模块接口进行通断控制（继电器或其他手段必须通过相应\n的接口供电，确保机器人裁判系统可以控制接通和断开“裁判系统电源接口（输出）”所\n连接的所有设备电源，否则视为作弊。\n\n接入电源管理模块供电接口的用电器在电源管理模块供电接口断电时需立即断电。\n\n若雷达系统或飞镖发射架需要24V 供电接口，可由电源管理模块的“Mini PC”接\n口或电池直接供电。\n表 3-4 电源管理模块接口说明\n接口\n兵种\nChassis\nGimbal\nAmmo-Booster\nMini PC\n重装机器人\n底盘电源\n云台电源\n42mm 发射机构电源\nMini PC 电源\n步兵机器人\n底盘电源\n云台电源\n17mm 发射机构电源\nMini PC 电源\n机库\n不供电\n执行机构电源\n不供电\nMini PC 电源\n哨兵机器人\n底盘电源\n云台电源\n17mm 发射机构电源\nMini PC 电源\n飞镖发射架\n不供电\n不供电\n不供电\nMini PC 电源\n雷达运算平台端 不供电\n不供电\n不供电\nMini PC 电源\nS114 拥有发射机构的机器人在电源管理模块Ammo-Booster 接口断电时，发射机构（摩擦轮电机、拨弹\n盘电机、电磁阀等）也需同时断电。\nS115 对于有底盘功率限制的机器人的电路板和线路必须满足以下要求：\n\n与底盘供电相关的电路板必须独立于云台、发射机构的电源。不允许由电源管理模块“Chassis”\n接口供电的电路板接入电源管理模块的其它供电接口。\n\n机器人底盘相关的所有线路必须清晰，裁判会在比赛后对机器人进行抽查，参赛队需配合抽查，\n把机器人相关部件拆开并展示相关线路。建议在设计和布局线路时考虑裁判抽查的需求，因线路\n检查进行拆装机器人造成的备赛时间损失由参赛队自行承担。\n\n机器人与电源管理模块“Chassis”接口相连接的电路板，即与底盘电源相关的电路板，与连接\n电源管理模块其它供电口的电路板之间只使用线径规格小于或等于24AWG 的线缆进行连接，并\n仅用于通信用途，流经总电流必须小于等于50mA。\n\n电源管理模块输入电压要求：22V-26V。“图 3-9 电源管理模块接口示意图”中\n10、11、12 号电源输出接口可由裁判系统控制接通和断开。\n\n关于电源管理模块个接口负载阈值，请参阅《电源管理模块说明书》。\n\n系统负载波动较大时，9-12 号电源输出接口电压会产生波动。建议参赛队伍对电\n压敏感的负载（如Mini PC）做好稳压措施。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0201"},{"t":"3.5 灯条模块安装规范","c":"装配维护","b":"[1] 辅助灯条 [2] 主灯条 [3] 固定支架 [4] 航空线接口\n图 3-11 灯条模块示意图\n© 2026 大疆 版权所有   59\n3.5.1 安装步骤\n1.\n选装：灯条模块可用固定架的底部螺钉孔固定，安装在机器人合适的位置上。\n图 3-12 灯条模块螺钉安装位置图\n图 3-13 灯条模块底部示意图\n2.\n使用包装内的航空转接线，将灯条模块与电源管理模块上带银白色金属圈的航空线接口连接。\n[1] 航空转接线\n图 3-14 灯条模块接线示意图\n3.5.2 安装要求\n灯条模块的安装需满足以下要求：\nS116 左右辅助灯条的连线需与地面平行。\n安装灯条模块时建议参考以下规范：至少从一个水平方向上下倾斜45°直视机器人时，可\n以完整看到主灯条和辅助灯条的状态，否则比赛过程中灯条灯效传递的信息可能会丢失、\n对异常情况的发现和处理可能会延误。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0202"},{"t":"3.6 装甲模块安装规范","c":"装配维护","b":"装甲模块需通过指定的装甲支撑架安装至机器人上。\nS117 装甲支撑架可仅使用后部安装面或底部安装面安装在机器人底盘上。\nS118 仅允许使用官方提供的装甲支撑架安装装甲模块，禁止修改或破坏装甲支撑架。\n指定装甲支撑架外形如下图所示：\n图 3-15 指定装甲支撑架示意图\n© 2026 大疆 版权所有   61\nS119 请勿对装甲模块进行任何修改或装饰。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0203"},{"t":"3.6.1 通用规范","c":"结构设计","b":"机器人底盘：承载机器人动力系统及其附属部件的机构；支撑机器人机体的机构。\n机器人机体坐标系是标准的X，Y，Z 笛卡尔坐标系，坐标原点为机器人的质量中心，根据地面机器人装甲\n模块安装要求，以机器人所使用的底盘构型理论上最大效率方向为该机器人的X 轴和指向地心的Z 轴正\n方向建立机器人坐标系。若特殊底盘构型（例：舵轮）存在多个最大效率方向，则可任选其中一个方向作\n为X 轴，多种形态的底盘X 轴定义参考下图：\n图 3-16 机器人坐标系示意图\n图 3-17 机器人不同底盘形态X 轴示意图\n3.6.1.1 装甲模块安装\nS120 机器人进行装甲模块安装时，装甲模块和装甲支撑架需稳固连接。装甲模块的装甲支撑架底部连接\n面需与XY 平面平行，使得装甲模块受力面所在平面的法向量所在直线与Z 轴负方向所在直线的锐\n角夹角为75°。装甲模块不含侧灯的两条边与XY 平面夹角小于5°。定义安装好的装甲模块受击打面\n的法向量（与Z 轴负方向夹角为锐角）在XY 平面上的投影为该装甲模块的方向向量。4 块装甲模\n块的方向向量需分别与机器人机体坐标系的正X 轴、负X 轴、正Y 轴、负Y 轴一一对应，方向向\n量和对应坐标轴之间的角度误差不能超过5°。\nS121 机器人本身的运动学方程也需建立在上述机体坐标系下。装甲模块的安装方式需与机器人本身的结\n构特性或者运动学特性共享同一个参考坐标系。X 轴上安装的装甲模块几何中心点连线与Y 轴上安\n装的装甲模块几何中心点连线要互相垂直。安装于Y 轴的单个装甲模块在发生偏移后，其几何中心\n相对于机器人的几何中心的偏移量在X 轴上的分量不得超过50mm，安装于X 轴上的装甲模块同\n理。\n3.6.1.2 刚性连接\nS122 安装好的装甲模块和装甲支撑架需与底盘刚性连接。比赛过程中，装甲模块与底盘不可发生相对移\n动。刚性连接定义如下图所示，向装甲模块下边缘中点施加一个竖直向上的60N 的力，装甲模块受\n击打面角度α 变化不得大于2.5°。\n图 3-18 装甲模块受力示意图\n3.6.1.3 机器人变形\nS123 原则上，比赛开始后，任何一块装甲模块不能主动地相对于机器人整体的质量中心发生移动。如果\n© 2026 大疆 版权所有   63\n参赛机器人因为机器人结构设计需求导致机器人具有可变形特性，其装甲模块需满足：任何时候，\n任何一块装甲模块不得相对于机器人底盘发生连续、往复的快速移动。快速移动定义为移动速度超\n过0.5m/s。\nS124 地面机器人任意两块装甲模块下边缘高度差不得超过100mm，在机器人跨越地形时，允许其短暂\n不符合该条例。\nS125 对于地面机器人，变形前、中、后，装甲模块下边缘距离地面高度不得超过400mm，且装甲模块下\n边缘不得直接接触地面。\n\n当支撑机器人机体的平面不是地面时，装甲模块的安装高度应以支撑机器人机体的最高\n平面为准。\n\n若机器人无任何支撑平面，则无需符合该要求。\n3.6.1.4 装甲模块保护\nS126 参赛队伍需为地面机器人设计保险杠，减少因装甲模块撞击而造成的伤害。\nS127 在水平地面上任意一侧紧靠竖直刚性平面时，装甲模块不能直接接触该刚性平面，如下图所示：\n[1] 墙\n图 3-19 机器人保护示意图\nS128 除装甲支撑架外，任何结构禁止与装甲模块产生任何接触。\n3.6.2 安装步骤\n地面机器人的装甲模块安装步骤相同。下面以步兵机器人装甲模块为例对安装步骤进行讲解。以下安装步\n骤以仅使用装甲支撑架底部安装面为例。\n1.\n在底盘预留4 组安装孔位，每一块装甲模块对应一组安装孔，每一组的4 个安装孔位的大小和相对位\n置均保持一致。\n2.\n每个装甲支撑架都需使用2 颗M4 螺钉固定至底盘上。安装完成后的效果如下图所示：\n图 3-20 装甲支撑架安装示意图\n3.\n安装装甲模块至装甲支撑架，并使用M4 螺钉固定。具体安装步骤如下：\n图 3-21 装甲模块安装示意图\n1)\n将装甲模块下方卡槽装入装甲支撑架下方卡扣。\n2)\n将装甲模块上方端面装入装甲支撑架上方卡扣。\n© 2026 大疆 版权所有   65\n3)\n装入紧固螺钉。\n4.\n使用包装内提供的6-pin 连接线串联各装甲模块至电源管理模块的装甲模块接口。装甲支撑架的2 个\n6-pin 接口均为等效接口。\n\n根据机器人自身情况合理连线，保证连接稳固，避免线材受损。\n\n连接时建议均分电源管理模块中两个6-pin 接口上串联装甲模块的数量，以均分该接\n口的电流。\n[1] 电源管理模块\n图 3-22 装甲模块连线示意图\n具体安装步骤以后续更新为准。\n3.6.3 安装要求\nS129 步兵机器人和哨兵机器人的装甲模块受击打面下边缘105°内、上边缘120°内，左、右边缘145°内不\n得被遮挡。\n[1] 顶部用M4 螺钉固定\n图 3-23 装甲模块安装规范示意图\n[1] 无限延伸\n图 3-24 步兵和哨兵机器人装甲模块禁止遮挡区域\nS130 重装机器人的所有装甲模块受击打面下边缘105°内不得被遮挡。4 块装甲模块中至少3 块装甲模块\n© 2026 大疆 版权所有   67\n满足上边缘120°内，左、右边缘145°内不得被遮挡，允许有至多1 块装甲模块可以在受击打面上边\n缘120°内，左、右边缘145°内发生有条件遮挡，遮挡条件为：在该装甲","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0204"},{"t":"3.7 测速模块安装规范","c":"装配维护","b":"测速模块有两种类型，分别是17mm 测速模块和42mm 测速模块。\n17mm 测速模块：\n[1] 光电管\n[2] 测速模块夹紧螺钉孔\n[3] M2.5 安装螺钉孔 [4] LED 灯条\n[5] 瞄准器\n图 3-26 17mm 测速模块示意图\n© 2026 大疆 版权所有   69\n42mm 测速模块：\n[1] 光电管\n[2] 测速模块夹紧螺钉孔\n[3] M2.5 安装螺钉孔 [4] LED 灯条\n[5] 瞄准器\n图 3-27 42mm 测速模块示意图\nS131 禁止拆除测速模块的瞄准器。\n3.7.1 安装步骤\n目前17mm 测速模块有3 种固定方案。3 种固定方案均符合裁判系统17mm 测速模块的安装规范，参赛\n队伍自行选择其中的一种固定方案。\n3.7.1.1 17mm 测速模块固定方案一\n17mm 发射管尺寸限制：\n[1] 朝向发射口 [2] 建议壁厚不得小于1mm\n图 3-28 17mm 发射管示意图\n17mm 发射管的制作要求：\nS132 保证光电管不被遮挡。\nS133 禁止使用透明材料、发光材料和禁止发射管附近使用红外传感器。\nS134 保证发射管内壁无强反光材质，以免干扰测速模块的正常工作。\n建议对发射管内壁进行磨砂或哑光处理。\n固定方案一安装步骤：\n1.\n将测速模块套于发射管上。\n2.\n使用M3 螺钉穿过测速模块夹紧螺钉孔，夹紧发射管。\n© 2026 大疆 版权所有   71\n3.\n使用航空转接线连接测速模块的航空线接口至电源管理模块航空线接口。\n安装完成后需避免发射管发生旋转、错位导致遮挡光电管的情况。\n安装完成后的效果图如下所示：\n图 3-29 测速模块安装示意图\n3.7.1.2 17mm 测速模块固定方案二\n参赛队员自行设计加工转接零件，连接17mm 测速模块与发射机构。\n转接零件详细工程图见“附录1 17mm 测速模块转接零件工程图”，三维模型可从RoboMaster 官网的\n测速模块产品页面下载，仅供参考。\n转接零件参考如下图所示：\n[1] 前部凸台 [2] 后部凸台\n图 3-30 17mm 转接零件示意图\n[1] LED 灯条固定螺钉M2.5 [2] 螺钉M3\n[3] 自制零件1 [4] 侧面固定孔\n[5] 后部凸台\n[6] 自制零件2 [7] 螺钉M2.5\n[8] 螺钉M3\n图 3-31 17mm 转接零件固定方式示意图\n固定方案二安装步骤：\n1.\n拆除测速模块左右两侧各1 颗固定LED 灯条的M2.5 螺钉，其中一侧位置如图中[1]所示，禁止拆除\n其他测速模块LED 灯条固定螺钉。\n2.\n通过左右两侧侧面固定孔（其中一侧位置如图中[4]所示），用2 颗M2.5x14 螺钉将转接零件固定在测\n速模块上。\n3.\n利用2 颗M3 螺钉将机器人原有板类零件1 固定在测速模块上端。\n4.\n利用2 颗M3 螺钉和四颗螺钉M2.5 将机器人原有板类零件2 固定在测速模块下端。\n5.\n使用航空转接线将测速模块的航空线接口连接至电源管理模块航空线接口。\n除步骤1 中的两颗螺钉允许拆除，测速模块上其余螺钉一律不允许私自拆装，违者视为破坏\n裁判系统。\n© 2026 大疆 版权所有   73\n3.7.1.3 17mm 测速模块固定方案三\n参赛队员自行设计加工发射管零件，连接17mm 测速模块与发射机构。\n[1] 发射管 [2] 自制零件1 [3] M2.5 螺钉\n图 3-32 17mm 短发射管安装示意图\n固定方案三安装步骤：\n1.\n将测速模块插入短发射管中。\n2.\n利用4 颗M2.5 螺钉将机器人原有板类零件1 固定在测速模块下端。\n3.\n使用航空转接线连接测速模块的航空线接口至电源管理模块航空线接口。\n\n发射管装入测速模块部分的长度不大于23mm，避免遮挡测速模块的测速光电管。\n\n发射管外径建议控制在21mm + 0.05 范围内，发射管直径偏小会使发射管外壁和测速模\n块内壁间隙较大，导致弹丸散布面积加大。\n\n此种方案因为测速模块和发射机构零件没有相对定位，所以会存在因为测速模块轴线与弹\n丸发射轴线不重合的现象，从而导致部分弹丸触碰测速模块内壁的现象。此时参赛队员可\n按需在机器人原有板类零件1 和测速模块之间加上垫片，调整测速模块和机器人原有板\n类零件1 的安装角度。\n3.7.1.4 42mm 测速模块固定方案\n42mm 测速模块固定方案可参考17mm 测速模块的3 种固定方案。\n42mm 发射管尺寸限制：\n[1]\n朝向发射口\n[2]\n壁厚不得小于1mm\n图 3-33 42mm 发射管示意图\n42mm 发射管的制作要求：\nS135 保证光电管不被遮挡。\nS136 禁止使用透明材料、发光材料和禁止在发射管附近使用红外传感器。\nS137 保证发射管内壁无强反光材质，以免干扰测速模块的正常工作。\n建议对发射管内壁进行磨砂或哑光处理。\n固定方案安装步骤：\n1.\n将测速模块套于发射管上。\n2.\n使用M3 螺钉穿过测速模块夹紧螺钉孔，夹紧发射管。\n3.\n使用航空转接线连接测速模块的航空线接口至电源管理模块航空线接口。\n3.7.2 安装要求\n测速模块的安装需保证满足以下要求：\n建议每个测速模块至少有一个灯条发光面的法线位于水平面以上的半球内且检录人员在距离\n测速模块1m 外，垂直于测速模块灯条发光面正视测速模块灯条时能","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0205"},{"t":"3.8 场地交互模块安装规范","c":"装配维护","b":"参考场地交互模块结构尺寸和安装接口，在机器人底盘预留安装孔位。\n[1] 背面 [2] LED 灯条 [3] 正面\n图 3-37 场地交互模块示意图\n3.8.1 安装步骤\n1.\n使用包装内提供的4-pin 连接线将场地交互模块与电源管理模块上的RFID 接口连接。\n图 3-38 场地交互模块连线示意图\n2.\n使用M3 螺钉固定场地交互模块至底盘，安装时切勿压到连接线，并注意保持场地交互模块与地面有\n适当的距离。\n图 3-39 场地交互模块安装示意图\n3.8.2 安装要求\n场地交互模块的安装需遵循以下规范，否则可能会导致模块检测质量下降。由于安装不规范导致的后果将\n由参赛队伍自行承担。\n\n场地交互模块附近应避免安装大面积导电材料，避免存在大电流或高频信号干扰（如电机线、\nRoboMaster 中心板、CAN 线、超级电容）。\n\n场地交互模块的正面和背面没有导电材料遮挡，背面与金属板、碳板等导电材料至少要保留30mm 距\n离。\nS146 场地交互模块不得超出装甲模块组成的矩形区域最外延。此外，在机器人变形过程中，该模块相对\n于底盘仅允许沿Z 轴方向移动，不得在其他方向发生相对位移。\n\n场地交互模块有效探测距离为100mm（±5%），安装后实际探测距离以测试为准。若\n有效探测距离缩短或者无法正常工作，请检查安装是否合理。具体有效探测距离请参\n阅《场地交互模块说明书》以及《电源管理模块说明书》。\n\n由于机器人内部电磁环境复杂，测试场地交互模块有效探测距离时需在机器人所有模\n块正常工作（比如超级电容、动力电机和无线充电线圈均工作等）时进行；若机器人\n有多种工作工况（如电容充电和放电，电机变速和匀速），则还需进行不同工况下的场\n地交互模块有效探测距离测试。\n© 2026 大疆 版权所有   79","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0206"},{"t":"3.9 相机图传模块（发送端）安装规范","c":"装配维护","b":"\n图传链路数据从相机图传模块（发送端）的UART 串口输出。\n\n相机图传模块（发送端）UART 串口支持3.3V TTL 电平。UART 串口为RX、TX、GND，\n请勿将电源正极接入UART 串口。\n参考发送端结构尺寸和安装接口，在特定位置预留安装孔位。\n[1] 进风口 [2] 指示灯 [3] 球心位置 [4] 天线\n[5] 相机\n[6] 出风口 [7] 安装通孔 [8] 安装螺纹孔\n图 3-40 相机图传模块（发送端）示意图\n相机图传模块（发送端）以上图为准，其余图纸中出现的相机图传模块（发送端）均仅供参考。\n3.9.1 安装步骤\n1.\n使用4 颗M3 螺钉固定发送端至机器人的适当位置。\n[1] 相机图传模块（发送端）\n图 3-41 相机图传模块（发送端）安装示意图\n2.\n使用航空转接线将相机图传模块（发送端）的航空线接口与电源管理模块上图传接口的航空线接口连\n接。\n3.9.2 安装要求\n相机图传模块（发送端）的安装需保证满足以下要求，否则可能会导致图像质量下降、图传链路传输不稳\n定、机器人异常离线等情况。\n\n避免遮挡相机图传模块（发送端）的指示灯。\n\n以相机图传模块（发送端）底面中心为顶点，应存在一个母线与相机图传模块（发送端）底面平行且\n位于相机正前方，锥角为60°（立体角为π(2-√3) sr）且无限延伸范围内无导电材料遮挡的锥体，如\n下图所示。\nS147 不得遮挡相机图传模块（发送端）的进风口、出风口。\n建议各进风口、出风口150mm 范围内无遮挡。\n© 2026 大疆 版权所有   81\n[1] 禁止遮挡区域 [2] 区域轴线\n图 3-42 相机图传模块（发送端）禁止遮挡区域\n\n以相机图传模块发送端的天线底面连线中心为球心，70mm 半径的上半球内无导电材料、电磁吸收材\n料或其他可能产生无线信号干扰的部件，如“图 3-40 相机图传模块（发送端）示意图”所示。\n\n若采用图传链路，需对相机图传模块（发送端）的UART 串口部分进行保护，如采用泡棉、非金属挡\n板等保护装置。\n\n相机图传模块（发送端）的接口、指示灯无遮挡。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0207"},{"t":"3.10 相机图传模块（接收端）使用规范","c":"其他","b":"[1] 散热孔\n图 3-43 相机图传模块（接收端）示意图\n3.10.1 安装要求\n相机图传模块（接收端）的使用需满足以下要求，否则可能会导致其图像质量下降、遥控数据传输卡顿等，\n甚至工作异常。\nS148 相机图传模块（接收端）附近需避免金属遮挡。\nS149 散热口不得被遮挡。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0208"},{"t":"3.11 定位模块安装规范","c":"装配维护","b":"参考定位模块尺寸，在机器人特定位置预留安装孔位。\n[1] 裁判系统连接线 [2] 顶部 [3] 前方\n图 3-44 定位模块示意图\n3.11.1 安装步骤\n1.\n使用2 颗M3 螺钉固定定位模块至机器人的特定位置。如下图所示：\n图 3-45 定位模块安装示意图\n© 2026 大疆 版权所有   83\n2.\n使用包装内的航空转接线，连接定位模块至电源管理模块上带银白色金属圈的航空线接口。\n图 3-46 定位模块连线示意图\n3.11.2 安装要求\n定位模块的安装需保证满足以下要求，若不按照要求安装，可能会导致定位模块定位异常。\nS150 定位模块安装支架需要与机器人刚性连接，即在支架任意位置施加一个与其垂直的40N 的力，定位\n模块底部所在平面相对于水平面偏移不超过10°。\nS151 定位模块的顶部朝上水平安装。定位模块上方145°内不得被导体遮挡，如下图所示。若定位模块安\n装于可主动变形或参与机械联动的机构，则机器人变形前、机器人变形过程中和变形后均需要满足\n定位模块遮挡的相关要求。\n[1] 无限延伸\n图 3-47 定位模块安装示意图\nS152 定位模块的安装位置距离相机图传模块至少为150mm。距离以模块最外沿之间的最短直线距离为\n准。\nS153 定位模块周边100mm 范围内不得存在会产生强烈磁场的磁体、导磁体、易被磁化的物体或部件，\n以避免对定位模块产生干扰。\n常见的可能会产生磁场干扰的部件包括：电机、被磁化的金属、吸铁石。\nS154 不得使用磁体、导磁体、粘黏性材质固定定位模块。\n\n定位模块包装内附带安装螺丝，建议使用该螺丝进行安装（若螺丝丢失可在现场领\n用）。\n\n若选用其他螺丝，需符合相关规范。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0209"},{"t":"3.12 超级电容管理模块安装规范","c":"装配维护","b":"超级电容管理模块用于检测超级电容模组的容值，以及检测比赛过程中的超级电容模组能量。超级电容管\n理模块的尺寸预计为60*30*7.5mm（L*W*H），使用热缩管作为模块的外部保护。\n硬件接口包括1 个XT30 公头、2 个XT30 母头和1 个超级电容管理模块通信接口。\n\nXT30 母头型号为XT30PW-F。\n\nXT30 公头型号为XT30PW-M。\n3.12.1 安装步骤\n功率控制板是调节电源管理模块Chassis 接口的输出功率和超级电容模组的输入功率、输出功\n率以满足规则中功率限制的模块。此模块为参赛队伍自制。\n1.\n将超级电容管理模块安装在超级电容模组的输出接口与功率控制板的输入接口之间。\n2.\n使用带XT30 接口的线材连接超级电容模组与超级电容管理模块。\n3.\n使用带XT30 接口的线材连接功率控制板与超级电容管理模块。\n4.\n使用4-pin 连接线连接超级电容管理模块的通信接口与电源管理模块的CAN1 接口。\n© 2026 大疆 版权所有   85\n超级电容管理模块接线如下图所示：\n[1] 机器人底盘供电接口\n[2]\n功率控制板\n[3] 超级电容模组\n[4]\n超级电容管理模块\n[5] 超级电容管理模块接口（输出，XT30 母头）⸺连接功率控制板\n[6] 超级电容管理模块检录接口（输出，XT30 母头）⸺仅用于检录\n[7] 超级电容管理模块通信接口（CAN，SM04B-GHS-TB 接口）⸺连接电源管理模块\n[8] 超级电容管理模块接口（输入，XT30 公头）⸺连接超级电容模组\n[9] 电源管理模块的Chassis 输出接口\n[10]\n电源管理模块\n图 3-48 超级电容管理模块接线示意图\n3.12.2 安装要求\n\n超级电容管理模块的通信接口需连接至电源管理模块的CAN1 接口，否则无法正常使用。\n\n检录时，工作人员会按照超级电容管理模块接线示意图检查参赛队伍超级电容模组安装是否符\n合要求，检查完成后会在模块与电容组上贴好检录通过的标识。建议参赛队伍设计便于看到标\n识的结构，以免检录时需要频繁拆装机器人结构。\nS155 超级电容管理模块的XT30 接口峰值电流与最大持续电流均不得大于15A。\nS156 电容电压需要由满电降低至1V 以下，如果电压出现异常快速降低等现象将无法通过检录。\nS157 超级电容管理模块的检录接口需引出至少100mm 长的XT30 母头接口的线材。\nS158 重装机器人、步兵机器人、哨兵机器人均需安装超级电容管理模块。若机器人没有超级电容模组，\n则只需采用4-pin 线将超级电容管理模块接入电源管理模块。\nS159 超级电容管理模块需安装在机器人容易操作的位置，以便检录时操作超级电容管理模块。\nS160 超级电容模组仅允许使用一个供电接口，且需按照“图 3-48 超级电容管理模块接线示意图”进行\n连接，不得连接机器人上的其他电路。\n© 202 /robomaster/04_往年图纸与代码/往年大符总装_2024版/","s":"本地资料·参考模型","k":"file","i":"K0228"},{"t":"大符控制代码（STM32 双板）","c":"案例开源","b":"mainboard + leafboard 双板 Keil 工程，含灯控与随机点亮逻辑。\n\n本地路径：E:/workbuddy/robomaster/04_往年图纸与代码/大符控制代码_2024版.zip","s":"本地资料·参考模型","k":"file","i":"K0229"},{"t":"官方场地模型 RMUC2027（STEP）","c":"赛事场地","b":"624 MB 全场模型，含中央高地与能量机关，可用于量取任何场地尺寸。\n\n本地路径：E:/workbuddy/robomaster/01_官方规则与规范/官方场地模型_RMUC2027.stp","s":"本地资料·参考模型","k":"file","i":"K0230"},{"t":"官方能量单元模型（STEP）","c":"赛事场地","b":"3 MB，重装机器人装配进科技核心的能量单元道具。\n\n本地路径：E:/workbuddy/robomaster/01_官方规则与规范/官方能量单元模型.stp","s":"本地资料·参考模型","k":"file","i":"K0231"},{"t":"3.1.2 步兵机器人","c":"赛事场地","b":"步兵机器人可以发射 17mm 弹丸。\n\n表 3-5 步兵机器人的关键特征\n\n关键特征 说明\n\n初始区域 启动区\n\n运行方式 不限，最多配置 1 个遥控器和 1 个自定义终端\n\n多机通信 允许\n\n24 © 2026 大疆 版权所有 关键特征 说明\n\n发射机构 1 个 17mm 发射机构\n\n射击初速度上限（m/s） 25\n\n扣血与超限惩罚机制  射击初速度超限：适用\n\n 射击热量超限和冷却：适用\n\n 底盘功率超限：适用\n\n 攻击伤害或撞击：适用\n\n 裁判系统模块离线：适用\n\n 判罚伤害：适用\n\n详见“5.1 扣血与超限惩罚机制”\n\n回血与复活机制  回血方式：可通过允许的增益点或远程兑换血量。\n\n 复活方式：读条复活或兑换立即复活。\n\n详见“5.3 回血与复活机制”\n\n弹丸的装载和补给  三分钟准备阶段，可预装 42mm 和 17mm 弹丸，初始允许发弹量为 0。\n\n 七分钟比赛阶段，可通过允许的增益点兑换或远程兑换允许发弹量。\n\n详见“5.4 经济体系”\n\n经验与性能体系 适用\n\n注：底盘功率上限、初始血量、上限血量、射击热量上限、射击热量冷却速率\n\n等参数与等级、底盘类型相关，详见“5.5 经验及性能体系”。\n\n可激活的增益点  基地增益点\n\n 中央高地增益点\n\n 地形跨越增益点（公路、高地、隧道）\n\n 制高点增益点\n\n 前哨站增益点\n\n 补给区增益点\n\n© 2026 大疆 版权所有 25 关键特征 说明\n\n 堡垒增益点\n\n详见“5.6.4 场地增益机制”","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0232"},{"t":"3.2.2 飞镖系统","c":"赛事场地","b":"飞镖系统可通过发射飞镖攻击对方前哨站、基地。\n\n表 3-9 飞镖系统的关键特征\n\n关键特征 说明\n\n初始区域 飞镖发射站\n\n运行方式 不限，最多配置 1 个遥控器\n\n多机通信 允许\n\n28 © 2026 大疆 版权所有","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0233"},{"t":"4.2.5 雷达基座","c":"赛事场地","b":"雷达基座用于放置雷达系统，上端为面积 3.4m\\*1.16m 的平台。平台平面中央与战场中心轴线对齐，距战\n\n场地面高度约为 2.4m，四周有高度为 1.1m 的围栏。平台旁边设有传感器数据线槽孔，比赛时根据实际\n\n场地情况进行使用。\n\n雷达运算平台端通过 220V 市电供电，其放置平台放置有：\n\n 1 台仅支持 HDMI 信号输入的官方显示设备，其显示分辨率为 1920\\*1080。参赛队伍可将其用于确认\n\n雷达系统运行的情况。\n\n 1 根 HDMI 公头信号线，用于连接雷达系统和官方显示设备。\n\n 1 个新国标 5 孔插座，其中单相两极和单相三极插孔可以同时接入，为雷达系统供电，该插座不可移\n\n动。\n\n\\[1\\] 雷达信息波 \\[2\\] 传感器数据线槽孔 \\[3\\] 雷达信息波发射面\n\n\\[4\\] 雷达传感器放置平台 \\[5\\] 雷达运算端放置平台\n\n图 4-18 雷达基座示意图\n\n© 2026 大疆 版权所有 43 \\[1\\] 战场出入口 \\[2\\] 出入口台阶 \\[3\\] 雷达基座\n\n图 4-19 雷达基座的相对位置示意图\n\n44 © 2026 大疆 版权所有","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0234"},{"t":"4.2.6 补给区","c":"赛事场地","b":"补给区包括资源站、补给区增益点、工作台，是机器人进行血量恢复、补充允许发弹量、获取能量单元、\n\n安装模块化 42mm 发射机构的重要区域。\n\n\\[1\\] 风机 \\[2\\] 补给区\n\n图 4-20 补给区示意图\n\n© 2026 大疆 版权所有 45 资源站是重装机器人获取能量单元的区域，其中设置有 6 个能量单元，均以磁吸的方式固定在能量单元放\n\n置区内。重装机器人需沿能量单元旋转对称轴的方向取出能量单元，该过程除克服重力外，还需额外施加\n\n至多 10N 的力以克服磁吸力。\n\n\\[1\\] 能量单元放置区 \\[2\\] 挡板\n\n图 4-21 资源站示意图\n\n能量单元的实际安装位置相对于图示，可能存在绕对称轴的角度偏差。图示仅做示意，具体请以\n\n实际放置情况为准。\n\n46 © 2026 大疆 版权所有 图 4-22 能量单元放置区示意图\n\n工作台位于补给区，机器人可以拾取并安装模块化 42mm 发射机构。\n\n图 4-23 工作台示意图\n\n© 2026 大疆 版权所有 47 公路区面向补给区的墙体设置有金属材质的视觉标签，用于相机图传模块判断机器人是否位于补给区，如\n\n下所示。\n\n\\[1\\] 视觉标签\n\n红方视觉标签\n\n蓝方视觉标签\n\n图 4-24 视觉标签示意图\n\n48 © 2026 大疆 版权所有","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0235"},{"t":"4.3.2 中央高地","c":"赛事场地","b":"中央高地位于战场中部，两端通过坡道与公路区连接。\n\n\\[1\\] 红方装配区 \\[2\\] 蓝方装配区 \\[3\\] 12°坡\n\n\\[4\\] 风机 \\[5\\] 金属板\n\n图 4-27 中央高地示意图\n\n© 2026 大疆 版权所有 51","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0236"},{"t":"4.3.2.1 装配区","c":"赛事场地","b":"装配区位于战场中央，能量机关正下方。装配区分为红、蓝双方。能量机关下方设置有科技核心，重装机\n\n器人可以将能量单元装配至科技核心，具体如下图所示。\n\n\\[1\\] 能量机关 \\[2\\] 科技核心 \\[3\\] 红方装配区 \\[4\\] 14°坡\n\n\\[5\\] 蓝方装配区 \\[6\\] 12°坡 \\[7\\] 46°坡 \\[8\\] 12°坡\n\n图 4-28 装配区轴测图\n\n52 © 2026 大疆 版权所有 图 4-29 装配区尺寸图\n\n© 2026 大疆 版权所有 53","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0237"},{"t":"4.3.2.2 机库平台","c":"赛事场地","b":"机库平台位于战场中央，机库平台分为红、蓝双方。双方仅能把空中系统安装在机库平台。\n\n\\[1\\] 红方机库平台 \\[2\\] 蓝方机库平台\n\n图 4-30 机库平台示意图\n\n54 © 2026 大疆 版权所有","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0238"},{"t":"4.3.2.3 能量机关","c":"赛事场地","b":"能量机关位于装配区正上方。能量机关由电机驱动并按照一定规律同步转动。能量机关分为红蓝两侧，一\n\n侧为红方能量机关，另一侧为蓝方能量机关。\n\n 能量机关中部由于重量较大，会出现轻微下坠的现象，下坠范围为 0~50mm。\n\n 由于观察视角问题及传动间隙，观察一方能量机关时可能会看到对方能量机关的一部分。\n\n能量机关有 5 个均匀分布的灯臂，具体位置和尺寸如下所示：\n\n图 4-31 能量机关示意图\n\n图 4-32 能量机关灯臂尺寸示意图\n\n© 2026 大疆 版权所有 55 实际灯臂的圆靶最大直径为 308mm，实际有效检测直径为 300mm。\n\n图 4-33 能量机关中心标识尺寸图\n\n56 © 2026 大疆 版权所有","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0239"},{"t":"4.3.2.4 前哨站","c":"赛事场地","b":"前哨站放置于前哨站底座上，由前哨站主体、3 块前哨站装甲模块、飞镖检测模块组成。飞镖检测模块示\n\n意图请参阅“图 4-13 飞镖检测模块示意图”。前哨站增益点位于前哨站四周，具体位置如下图所示。\n\n\\[1\\] 前哨站底座 \\[2\\] 前哨站 \\[3\\] 中部装甲\n\n图 4-34 前哨站示意图\n\n© 2026 大疆 版权所有 57","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0240"},{"t":"4.4.1 起伏路段","c":"其他","b":"起伏路段位于公路区，其表面按照一定间距、图示方向排布着凸起，如下所示。\n\n\\[1\\] 起伏路段\n\n图 4-36 起伏路段示意图\n\n\\[1\\] 凸起\n\n图 4-37 凸起示意图\n\n© 2026 大疆 版权所有 59","s":"官方·比赛规则手册 V1.0.0","k":"doc","i":"K0241"},{"t":"2.1.6 发射机构","c":"其他","b":"发射机构：能够让弹丸以固定路径和一定初速度离开机器人的机构。\n\nS43 使用压缩气体作为弹丸发射动力的加速行程不得大于 200mm（进入测速模块前需要完成加速）。\n\nS44 机器人发射机构需能够稳定发射 10 发 17mm 弹丸或者 5 发 42mm 弹丸。\n\nS45 每个发射机构均需遵循规范安装对应的测速模块。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0242"},{"t":"2.1.8 17mm 荧光弹丸充能装置","c":"结构设计","b":"参考 17mm 荧光弹丸充能装置尺寸，在机器人的特定位置预留安装孔位。\n\n\\[1\\] 发射状态弹丸 \\[2\\] 17mm 荧光弹丸充能装置 \\[3\\] 预置状态弹丸\n\n图 2-1 17mm 荧光弹丸充能装置安装示意图\n\n© 2026 大疆 版权所有 19 发射状态弹丸是指与摩擦轮等发射结构接触瞬间，上图所示位置的弹丸；预置状态弹丸是指供\n\n弹链路中处于发射状态的弹丸的前一发弹丸。\n\n安装步骤：\n\n在 RMUL 中，机器人无需安装荧光充能装置。\n\n1. 将紫外灯板安装在机器人特定位置，安装的灯板需平行且对称放置于弹丸通道中心平面，两灯板灯珠\n\n上表面距离小于 20mm，灯板最前端端面距离发射状态弹丸前端小于 30mm，且每个灯珠都需要保\n\n证 120°的照射 FOV，安装位置如上图所示。\n\n2. 安装的供弹管道为金属时，尽可能增大供弹管道与灯板的接触面积，拧紧螺丝便于热量传导，非金属\n\n供弹管道必须安装好散热片。\n\n3. 完成紫外灯板接线后，XT30 端口可自行接入 12V 或 24V 供电。\n\n安装要求：\n\n 建议紫外灯板灯珠面与发射器金属零件紧密贴合安装，灯珠背面与散热片紧密贴合，散热片外\n\n需要留出至少 20mm 避空，保证有流动空气可以直接接触散热片。\n\n 建议导电材料与灯板供电线焊盘处做避空，防止短路。\n\n 建议紫外灯板背面或散热片表面避免覆盖胶布、塑料等影响散热的部件。\n\n 使用过程中，注意检查有无脏污遮挡灯珠或者灯珠损坏情况，如有，请及时更换，避免影响检\n\n录。\n\nS51 紫外灯板的安装需保证不出现明显漏光，以防紫外线对人体造成损伤。\n\nS52 紫外灯板灯珠排列方向与弹丸在链路中运行方向一致，无任何结构遮挡灯珠照射弹丸，以保证弹丸\n\n充能效果。\n\nS53 17mm 发射机构的最大射频需大于等于 10Hz，弹丸射击初速度需要大于 20m/s，自测时要以实际\n\n比赛工况射频或发射机构最大射频射击，且亮度能够满足自测要求，该要求将在后续更新。\n\nS54 在 17mm 荧光充能装置检录时，机器人需以比赛工况射频或发射机构最大射频射击弹丸。\n\nS55 如使用官方的荧光充能装置，需使用配套的散热片及其配套元件。\n\nS56 自制的紫外灯板需选用波长为 390-410nm 的紫外灯珠。\n\n关于自制紫外灯板的建议：\n\n 建议灯珠发光角度为 120°。\n\n20 © 2026 大疆 版权所有  建议单个灯板发光总功率为 3W（两个灯板共 6W）。\n\n 建议电路板材质为铝基板或铜基板。\n\n 散热片规格要求、灯珠排布间距、灯板总长度等建议参照荧光充能装置。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0243"},{"t":"2.4.5.1 安装规范","c":"装配维护","b":"S92 飞镖需安装官方指定的飞镖触发装置。\n\n本赛季官方指定使用的飞镖触发装置为“飞镖触发装置 2”。\n\n飞镖触发装置的质量约为 39.5g±2g，外形及尺寸如下图所示。\n\n参考飞镖触发装置尺寸，在飞镖头部位置预留安装孔位。\n\n© 2026 大疆 版权所有 39 \\[1\\] 供电负极 \\[2\\] 供电正极 \\[3\\] 串口线 \\[4\\] Logo\n\n\\[5\\] 飞镖触发装置 \\[6\\] 安装耳 \\[7\\] 3P 2.54mm 排线\n\n图 2-7 飞镖触发装置示意图","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0244"},{"t":"2.4.5.1.2 安装要求","c":"装配维护","b":"S93 飞镖触发装置在电池电压较低的情况下会出现亮度偏暗的情况，参赛队伍需要保障比赛过程中飞镖\n\n所使用的电池电压至少在 4V 以上。若飞镖触发装置实际工作电压低于 4V，则基地和前哨站可能无\n\n法检测飞镖命中。\n\nS94 飞镖触发装置安装完成后，需保证飞镖触发装置的上方、下方、左侧、右侧不被飞镖结构遮挡，以\n\n飞镖触发装置底面的中心为圆心半径 125mm 的上半球内不得有任何遮挡，如下图所示。\n\n40 © 2026 大疆 版权所有 \\[1\\] 左侧 \\[2\\] 上方 \\[3\\] 右侧\n\n\\[4\\] 下方 \\[5\\] 禁止遮挡区域 \\[6\\] 飞镖触发装置内无限制区域\n\n图 2-8 飞镖触发装置禁止遮挡区域示意图\n\nS95 飞镖摄像头或其它装置可安装在飞镖触发装置内部空腔，安装面积不得超出如下图所示阴影区域。\n\n\\[1\\] 阴影区域\n\n图 2-9 飞镖触发装置内部空腔示意图","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0245"},{"t":"3.3.1 安装步骤","c":"装配维护","b":"1. 使用 4 颗 M2.5 螺钉将主控模块固定至机器人特定位置。\n\n安装参考：可自行设计零件，且四周做好非金属挡板保护，避免受弹丸击打。\n\n© 2026 大疆 版权所有 49 2. 使用包装内的航空转接线，将主控模块与电源管理模块的黑色金属圈的航空线接口连接。\n\n主控模块与电源管理模块连接时，中间不得串连其它的裁判系统机载端模块。\n\n\\[1\\] 航空转接线\n\n图 3-2 主控模块连线示意图","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0246"},{"t":"3.3.2 安装要求","c":"装配维护","b":"主控模块的安装需应满足下列要求，否则可能造成无法连接赛事服务器、连接质量不稳定等情况。\n\n 机器人在工作状态下，主控模块的上表面应水平朝上，以各自天线中心为顶点，应至少存在一个锥角\n\n为 60°（立体角为 π(2-√3)sr）、无限延伸范围内无导电材料遮挡的锥体或对无线信号传输无干扰的等\n\n效空间（需为同一锥体且调整后的图形的完整锥体的母线需在上半球内），具体如下图所示。\n\n\\[1\\] 禁止遮挡区域\n\n图 3-3 主控模块禁止遮挡区域\n\n50 © 2026 大疆 版权所有  主控模块应安装在散热良好的位置，否则极有可能因为主控模块散热问题导致赛中出现工作异常。\n\n 主控模块屏幕、按键、接口、红外接收器等上方应避免遮挡。在设计保护装置时，应使用透明材质且\n\n便于打开，若不可打开，则需将屏幕、按键、接口、红外接收器完全外露。若造成遮挡，可能导致完\n\n全无法连接比赛服务器、无法进行异常排查等问题。\n\n 以 Logo 的中心点正下方 8.5mm 处为球心，70mm 半径的上半球内应避免导电材料、电磁吸收材料\n\n或其他可能产生 WIFI 信号干扰的部件。\n\n若云台或机械臂等机构所带的电磁屏蔽材料或电磁干扰设备在运动的过程中经过该区域，\n\n可能导致 WiFi 信号被干扰。\n\n\\[1\\] 天线中心\n\n图 3-4 主控模块安装位置示意图\n\nS109 能量机关立柱上设有一处长 150mm、高 150mm 的红外发射区域。该区域沿立柱宽度方向居中布\n\n置，下边缘与机库平台底面齐平。参赛队须根据该区域的位置设计机库主控模块的安装位置及方向，\n\n确保主控模块的红外接收器朝向该区域并处于有效接收范围内，以便于连入服务器。\n\n© 2026 大疆 版权所有 51 \\[1\\] 红外发射区域 \\[2\\] 主控模块\n\n图 3-5 机库主控模块安装示意图\n\n准备阶段上电后若一定时间没有成功连入服务器，可以在红外范围内适当调整主控位置。\n\nS110 正式比赛时，飞镖系统、雷达系统需参照组委会指定的方式连接电源管理模块与主控模块。\n\n对于雷达系统：\n\n战场提供有线方式使得雷达系统连入战场网络和服务器。雷达运算平台端方式平台提供了有线接入点：单\n\n端母头航空线。场地人员需将雷达运算平台端上电源管理模块中的主控接口，通过官方的航空对接线连接\n\n到有线接入点上。\n\n为了使雷达系统能够快速地完成接入并成功连接，请遵循以下要求：\n\n 在比赛过程中，雷达系统无需自身携带主控，检录前请取下机器人上调试用的主控。\n\n 雷达系统的电源管理模块必须外露，且放在工作人员容易操作的位置。\n\n 雷达系统电源管理模块上的主控接口不可连接任何设备。该航空线需理顺收纳，不可相互缠绕，且应\n\n易于拉出并连接在有线接入点上。\n\n对于飞镖系统：\n\n战场提供有线方式使得飞镖系统连入战场网络和服务器。飞镖发射站内提供一根线长为 800mm 的单端母\n\n头航空线。场地人员需通过官方的航空对接线将飞镖系统连接到有线接入点上。\n\n为了使飞镖系统能够快速地完成接入并成功连接，请遵循以下要求：\n\n 在比赛过程中，飞镖系统无需自身携带主控，检录前请取下机器人上用于调试的主控。\n\n52 © 2026 大疆 版权所有  连接电源管理模块和主控之间的航空线可以不借助工具方便拔插。\n\n 飞镖系统的电源管理模块必须外露，且放在工作人员容易操作的位置。\n\n 飞镖系统的电源管理模块安装位置需尽可能靠近飞镖发射站有线连接接入点，且另一端不可连接任何\n\n设备。该航空线需理顺收纳，不可相互缠绕，且应易于拉出并接在有线接入点上。\n\n\\[1\\] 0.8m 长裁判系统母头连接线 \\[2\\] 飞镖系统放置平面\n\n图 3-6 飞镖发射站裁判系统航空线位置示意图\n\n© 2026 大疆 版权所有 53\n\n# 3.4 电源管理模块安装规范\n\n参考电源管理模块尺寸，在机器人特定位置预留安装孔位。\n\n\\[1\\] 连接状态指示灯 \\[2\\] 系统状态指示灯 \\[3\\] 发射机构电源输出指示灯\n\n\\[4\\] 云台电源输出指示灯 \\[5\\] 底盘电源输出指示灯 \\[6\\] 底部安装面\n\n图 3-7 电源管理模块示意图\n\n54 © 2026 大疆 版权所有","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0247"},{"t":"3.4.1 安装步骤","c":"装配维护","b":"灯条模块、相机图传模块（发送端）、测速模块和定位模块的航空线接口均为等效接口，相互可\n\n串行连接。\n\n使用 4 颗 M2.5 螺钉将电源管理模块固定至机器人上。\n\n\\[1\\] 电源管理模块\n\n图 3-8 电源管理模块安装示意图\n\n© 2026 大疆 版权所有 55 \\[1\\] 装甲模块 SM06B-GHS-TB 接口 \\[2\\] 场地交互模块 SM04B-GHS-TB 接口\n\n\\[3\\] 超级电容管理模块 SM04B-GHS-TB 接口 \\[4\\] 主控模块接口（该航空线接口的金属圈为黑色）\n\n\\[5\\] 其它裁判系统机载端模块的接口（测速、定位、图传、灯条，该航空线接口的金属圈为银白色）\n\n\\[6\\] 裁判系统串口 SM03B-GHS-TB 接口 \\[7\\] 系统升级 SM03B-GHS-TB 接口\n\n\\[8\\] 裁判系统电源 XT60 接口（输入） \\[9\\] Mini PC 电源 XT30 接口（输出）\n\n\\[10\\] 裁判系统电源 XT30 接口（输出）⸺连接底盘\n\n\\[11\\] 裁判系统电源 XT30 接口（输出）⸺连接云台\n\n\\[12\\] 裁判系统电源 XT30 接口（输出）⸺连接发射机构\n\n图 3-9 电源管理模块接口示意图\n\n56 © 2026 大疆 版权所有 \\[1\\] 航空转接线\n\n图 3-10 电源管理模块接线示意图","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0248"},{"t":"3.4.2 安装要求","c":"装配维护","b":"电源管理模块的安装需保证满足以下要求：\n\n电源管理模块需被稳固固定在耐热材料上且处于散热良好的位置，各个接口做好保护。电源管\n\n理模块在使用过程中会存在发热现象，若使用双面胶等胶类固定电源管理模块，极有可能导致\n\n电源管理模块脱落，从而带来安全隐患。因电源管理模块固定不当或散热不良造成的后果由参\n\n赛队伍自行承担。\n\nS111 对于有底盘功率限制的机器人，需计入底盘功率的机构所使用的电能禁止跳过电源管理模块的监控。\n\nS112 飞镖系统、雷达系统需使用组委会安装于场地的主控模块。因此，参赛队伍在设计机器人时需满足\n\n以下要求：\n\n 在设计飞镖系统、雷达系统结构时，需将电源管理模块的主控模块接口外露。\n\n 在设计飞镖系统结构时，需将电源管理模块安装在靠近飞镖发射站入口的位置。\n\nS113 仔细区分电源管理模块的接口，确保接线正确，机器人的机构供电参照“表 3-4 电源管理模块接口\n\n说明”。\n\n除地面机器人底盘电源外，为保证机器人其他的电源供电接口（如云台电源、42mm 发\n\n射机构电源）供电稳定，这些供电接口可由电池供电，并通过继电器或其他手段进行控制，\n\n© 2026 大疆 版权所有 57 但需通过下表相应的电源管理模块接口进行通断控制（继电器或其他手段必须通过相应\n\n的接口供电，确保机器人裁判系统可以控制接通和断开“裁判系统电源接口（输出）”所\n\n连接的所有设备电源，否则视为作弊。\n\n 接入电源管理模块供电接口的用电器在电源管理模块供电接口断电时需立即断电。\n\n 若雷达系统或飞镖发射架需要 24V 供电接口，可由电源管理模块的“Mini PC”接\n\n口或电池直接供电。\n\n表 3-4 电源管理模块接口说明\n\n接口\n\n兵种 Chassis Gimbal Ammo-Booster Mini PC\n\n重装机器人 底盘电源 云台电源 42mm 发射机构电源 Mini PC 电源\n\n步兵机器人 底盘电源 云台电源 17mm 发射机构电源 Mini PC 电源\n\n机库 不供电 执行机构电源 不供电 Mini PC 电源\n\n哨兵机器人 底盘电源 云台电源 17mm 发射机构电源 Mini PC 电源\n\n飞镖发射架 不供电 不供电 不供电 Mini PC 电源\n\n雷达运算平台端 不供电 不供电 不供电 Mini PC 电源\n\nS114 拥有发射机构的机器人在电源管理模块 Ammo-Booster 接口断电时，发射机构（摩擦轮电机、拨弹\n\n盘电机、电磁阀等）也需同时断电。\n\nS115 对于有底盘功率限制的机器人的电路板和线路必须满足以下要求：\n\n 与底盘供电相关的电路板必须独立于云台、发射机构的电源。不允许由电源管理模块“Chassis”\n\n接口供电的电路板接入电源管理模块的其它供电接口。\n\n 机器人底盘相关的所有线路必须清晰，裁判会在比赛后对机器人进行抽查，参赛队需配合抽查，\n\n把机器人相关部件拆开并展示相关线路。建议在设计和布局线路时考虑裁判抽查的需求，因线路\n\n检查进行拆装机器人造成的备赛时间损失由参赛队自行承担。\n\n 机器人与电源管理模块“Chassis”接口相连接的电路板，即与底盘电源相关的电路板，与连接\n\n电源管理模块其它供电口的电路板之间只使用线径规格小于或等于 24AWG 的线缆进行连接，并\n\n仅用于通信用途，流经总电流必须小于等于 50mA。\n\n58 © 2026 大疆 版权所有  电源管理模块输入电压要求：22V-26V。“图 3-9 电源管理模块接口示意图”中\n\n10、11、12 号电源输出接口可由裁判系统控制接通和断开。\n\n 关于电源管理模块个接口负载阈值，请参阅《电源管理模块说明书》。\n\n 系统负载波动较大时，9-12 号电源输出接口电压会产生波动。建议参赛队伍对电\n\n压敏感的负载（如 Mini PC）做好稳压措施。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0249"},{"t":"3.5.1 安装步骤","c":"装配维护","b":"1. 选装：灯条模块可用固定架的底部螺钉孔固定，安装在机器人合适的位置上。\n\n图 3-12 灯条模块螺钉安装位置图\n\n图 3-13 灯条模块底部示意图\n\n2. 使用包装内的航空转接线，将灯条模块与电源管理模块上带银白色金属圈的航空线接口连接。\n\n\\[1\\] 航空转接线\n\n图 3-14 灯条模块接线示意图\n\n60 © 2026 大疆 版权所有","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0250"},{"t":"3.5.2 安装要求","c":"装配维护","b":"灯条模块的安装需满足以下要求：\n\nS116 左右辅助灯条的连线需与地面平行。\n\n安装灯条模块时建议参考以下规范：至少从一个水平方向上下倾斜 45°直视机器人时，可\n\n以完整看到主灯条和辅助灯条的状态，否则比赛过程中灯条灯效传递的信息可能会丢失、\n\n对异常情况的发现和处理可能会延误。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0251"},{"t":"3.6.1.1 装甲模块安装","c":"赛事场地","b":"S120 机器人进行装甲模块安装时，装甲模块和装甲支撑架需稳固连接。装甲模块的装甲支撑架底部连接\n\n面需与 XY 平面平行，使得装甲模块受力面所在平面的法向量所在直线与 Z 轴负方向所在直线的锐\n\n角夹角为 75°。装甲模块不含侧灯的两条边与 XY 平面夹角小于 5°。定义安装好的装甲模块受击打面\n\n的法向量（与 Z 轴负方向夹角为锐角）在 XY 平面上的投影为该装甲模块的方向向量。4 块装甲模\n\n块的方向向量需分别与机器人机体坐标系的正 X 轴、负 X 轴、正 Y 轴、负 Y 轴一一对应，方向向\n\n量和对应坐标轴之间的角度误差不能超过 5°。\n\nS121 机器人本身的运动学方程也需建立在上述机体坐标系下。装甲模块的安装方式需与机器人本身的结\n\n构特性或者运动学特性共享同一个参考坐标系。X 轴上安装的装甲模块几何中心点连线与 Y 轴上安\n\n装的装甲模块几何中心点连线要互相垂直。安装于 Y 轴的单个装甲模块在发生偏移后，其几何中心\n\n相对于机器人的几何中心的偏移量在 X 轴上的分量不得超过 50mm，安装于 X 轴上的装甲模块同\n\n理。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0252"},{"t":"3.6.1.4 装甲模块保护","c":"赛事场地","b":"S126 参赛队伍需为地面机器人设计保险杠，减少因装甲模块撞击而造成的伤害。\n\nS127 在水平地面上任意一侧紧靠竖直刚性平面时，装甲模块不能直接接触该刚性平面，如下图所示：\n\n\\[1\\] 墙\n\n图 3-19 机器人保护示意图\n\nS128 除装甲支撑架外，任何结构禁止与装甲模块产生任何接触。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0253"},{"t":"3.6.2 安装步骤","c":"装配维护","b":"地面机器人的装甲模块安装步骤相同。下面以步兵机器人装甲模块为例对安装步骤进行讲解。以下安装步\n\n64 © 2026 大疆 版权所有 骤以仅使用装甲支撑架底部安装面为例。\n\n1. 在底盘预留 4 组安装孔位，每一块装甲模块对应一组安装孔，每一组的 4 个安装孔位的大小和相对位\n\n置均保持一致。\n\n2. 每个装甲支撑架都需使用 2 颗 M4 螺钉固定至底盘上。安装完成后的效果如下图所示：\n\n图 3-20 装甲支撑架安装示意图\n\n3. 安装装甲模块至装甲支撑架，并使用 M4 螺钉固定。具体安装步骤如下：\n\n图 3-21 装甲模块安装示意图\n\n1) 将装甲模块下方卡槽装入装甲支撑架下方卡扣。\n\n2) 将装甲模块上方端面装入装甲支撑架上方卡扣。\n\n© 2026 大疆 版权所有 65 3) 装入紧固螺钉。\n\n4. 使用包装内提供的 6-pin 连接线串联各装甲模块至电源管理模块的装甲模块接口。装甲支撑架的 2 个\n\n6-pin 接口均为等效接口。\n\n 根据机器人自身情况合理连线，保证连接稳固，避免线材受损。\n\n 连接时建议均分电源管理模块中两个 6-pin 接口上串联装甲模块的数量，以均分该接\n\n口的电流。\n\n\\[1\\] 电源管理模块\n\n图 3-22 装甲模块连线示意图\n\n具体安装步骤以后续更新为准。\n\n66 © 2026 大疆 版权所有","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0254"},{"t":"3.6.3 安装要求","c":"装配维护","b":"S129 步兵机器人和哨兵机器人的装甲模块受击打面下边缘 105°内、上边缘 120°内，左、右边缘 145°内不\n\n得被遮挡。\n\n\\[1\\] 顶部用 M4 螺钉固定\n\n图 3-23 装甲模块安装规范示意图\n\n\\[1\\] 无限延伸\n\n图 3-24 步兵和哨兵机器人装甲模块禁止遮挡区域\n\nS130 重装机器人的所有装甲模块受击打面下边缘 105°内不得被遮挡。4 块装甲模块中至少 3 块装甲模块\n\n© 2026 大疆 版权所有 67 满足上边缘 120°内，左、右边缘 145°内不得被遮挡，允许有至多 1 块装甲模块可以在受击打面上边\n\n缘 120°内，左、右边缘 145°内发生有条件遮挡，遮挡条件为：在该装甲模块受击打面所在的平面上，\n\n距离装甲模块的上边缘大于 150mm，或距离左、右边缘大于 170mm 可以发生遮挡，即下图阴影\n\n部分不可被遮挡。\n\n本章节禁止遮挡区域在机器人最大伸展尺寸范围内无限延伸。\n\n\\[1\\] 无限延伸\n\n图 3-25 重装机器人装甲模块禁止遮挡区域\n\n68 © 2026 大疆 版权所有","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0255"},{"t":"3.7 测速模块安装规范","c":"装配维护","b":"测速模块有两种类型，分别是 17mm 测速模块和 42mm 测速模块。\n\n17mm 测速模块：\n\n\\[1\\] 光电管 \\[2\\] 测速模块夹紧螺钉孔\n\n\\[3\\] M2.5 安装螺钉孔 \\[4\\] LED 灯条\n\n\\[5\\] 瞄准器\n\n图 3-26 17mm 测速模块示意图\n\n© 2026 大疆 版权所有 69 42mm 测速模块：\n\n\\[1\\] 光电管 \\[2\\] 测速模块夹紧螺钉孔\n\n\\[3\\] M2.5 安装螺钉孔 \\[4\\] LED 灯条\n\n\\[5\\] 瞄准器\n\n图 3-27 42mm 测速模块示意图\n\nS131 禁止拆除测速模块的瞄准器。\n\n70 © 2026 大疆 版权所有","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0256"},{"t":"3.7.1.1 17mm 测速模块固定方案一","c":"标准件紧固","b":"17mm 发射管尺寸限制：\n\n\\[1\\] 朝向发射口 \\[2\\] 建议壁厚不得小于 1mm\n\n图 3-28 17mm 发射管示意图\n\n17mm 发射管的制作要求：\n\nS132 保证光电管不被遮挡。\n\nS133 禁止使用透明材料、发光材料和禁止发射管附近使用红外传感器。\n\nS134 保证发射管内壁无强反光材质，以免干扰测速模块的正常工作。\n\n建议对发射管内壁进行磨砂或哑光处理。\n\n固定方案一安装步骤：\n\n1. 将测速模块套于发射管上。\n\n2. 使用 M3 螺钉穿过测速模块夹紧螺钉孔，夹紧发射管。\n\n© 2026 大疆 版权所有 71 3. 使用航空转接线连接测速模块的航空线接口至电源管理模块航空线接口。\n\n安装完成后需避免发射管发生旋转、错位导致遮挡光电管的情况。\n\n安装完成后的效果图如下所示：\n\n图 3-29 测速模块安装示意图","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0257"},{"t":"3.7.1.2 17mm 测速模块固定方案二","c":"标准件紧固","b":"参赛队员自行设计加工转接零件，连接 17mm 测速模块与发射机构。\n\n转接零件详细工程图见“附录 1 17mm 测速模块转接零件工程图”，三维模型可从 RoboMaster 官网的\n\n测速模块产品页面下载，仅供参考。\n\n转接零件参考如下图所示：\n\n\\[1\\] 前部凸台 \\[2\\] 后部凸台\n\n图 3-30 17mm 转接零件示意图\n\n72 © 2026 大疆 版权所有 \\[1\\] LED 灯条固定螺钉 M2.5 \\[2\\] 螺钉 M3 \\[3\\] 自制零件 1 \\[4\\] 侧面固定孔\n\n\\[5\\] 后部凸台 \\[6\\] 自制零件 2 \\[7\\] 螺钉 M2.5 \\[8\\] 螺钉 M3\n\n图 3-31 17mm 转接零件固定方式示意图\n\n固定方案二安装步骤：\n\n1. 拆除测速模块左右两侧各 1 颗固定 LED 灯条的 M2.5 螺钉，其中一侧位置如图中\\[1\\]所示，禁止拆除\n\n其他测速模块 LED 灯条固定螺钉。\n\n2. 通过左右两侧侧面固定孔（其中一侧位置如图中\\[4\\]所示），用 2 颗 M2.5x14 螺钉将转接零件固定在测\n\n速模块上。\n\n3. 利用 2 颗 M3 螺钉将机器人原有板类零件 1 固定在测速模块上端。\n\n4. 利用 2 颗 M3 螺钉和四颗螺钉 M2.5 将机器人原有板类零件 2 固定在测速模块下端。\n\n5. 使用航空转接线将测速模块的航空线接口连接至电源管理模块航空线接口。\n\n除步骤 1 中的两颗螺钉允许拆除，测速模块上其余螺钉一律不允许私自拆装，违者视为破坏\n\n裁判系统。\n\n© 2026 大疆 版权所有 73","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0258"},{"t":"3.7.1.3 17mm 测速模块固定方案三","c":"加工工艺","b":"参赛队员自行设计加工发射管零件，连接 17mm 测速模块与发射机构。\n\n\\[1\\] 发射管 \\[2\\] 自制零件 1 \\[3\\] M2.5 螺钉\n\n图 3-32 17mm 短发射管安装示意图\n\n固定方案三安装步骤：\n\n1. 将测速模块插入短发射管中。\n\n2. 利用 4 颗 M2.5 螺钉将机器人原有板类零件 1 固定在测速模块下端。\n\n3. 使用航空转接线连接测速模块的航空线接口至电源管理模块航空线接口。\n\n 发射管装入测速模块部分的长度不大于 23mm，避免遮挡测速模块的测速光电管。\n\n 发射管外径建议控制在 21mm + 0.05 范围内，发射管直径偏小会使发射管外壁和测速模\n\n块内壁间隙较大，导致弹丸散布面积加大。\n\n 此种方案因为测速模块和发射机构零件没有相对定位，所以会存在因为测速模块轴线与弹\n\n丸发射轴线不重合的现象，从而导致部分弹丸触碰测速模块内壁的现象。此时参赛队员可\n\n按需在机器人原有板类零件 1 和测速模块之间加上垫片，调整测速模块和机器人原有板\n\n类零件 1 的安装角度。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0259"},{"t":"3.7.1.4 42mm 测速模块固定方案","c":"标准件紧固","b":"42mm 测速模块固定方案可参考 17mm 测速模块的 3 种固定方案。\n\n74 © 2026 大疆 版权所有 42mm 发射管尺寸限制：\n\n\\[1\\] 朝向发射口 \\[2\\] 壁厚不得小于 1mm\n\n图 3-33 42mm 发射管示意图\n\n42mm 发射管的制作要求：\n\nS135 保证光电管不被遮挡。\n\nS136 禁止使用透明材料、发光材料和禁止在发射管附近使用红外传感器。\n\nS137 保证发射管内壁无强反光材质，以免干扰测速模块的正常工作。\n\n建议对发射管内壁进行磨砂或哑光处理。\n\n固定方案安装步骤：\n\n1. 将测速模块套于发射管上。\n\n2. 使用 M3 螺钉穿过测速模块夹紧螺钉孔，夹紧发射管。\n\n3. 使用航空转接线连接测速模块的航空线接口至电源管理模块航空线接口。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0260"},{"t":"3.7.2 安装要求","c":"装配维护","b":"测速模块的安装需保证满足以下要求：\n\n建议每个测速模块至少有一个灯条发光面的法线位于水平面以上的半球内且检录人员在距离\n\n测速模块 1m 外，垂直于测速模块灯条发光面正视测速模块灯条时能看到 80%的灯条面积，否\n\n则比赛过程中灯条灯效传递的信息可能会丢失、对异常情况的发现和处理可能会延误。\n\n© 2026 大疆 版权所有 75 S138 测速模块需安装在发射机构末端，确保弹丸完全加速后进入测速模块。\n\nS139 测速模块安装时需满足：与弹丸发射方向垂直的面与 Logo 面的交线需与地面保持水平，如下图所\n\n示，在发射弹丸时需要时刻保持该规范要求，允许与地面存在 5°的夹角。\n\n\\[1\\] 弹丸方向 \\[2\\] 垂直于弹丸方向的平面 \\[3\\] Logo 面与\\[2\\]的交线\n\n图 3-34 测速模块安装示意图\n\nS140 测速模块在水平校准时，Logo 面需朝上。\n\nS141 测速模块需固定牢固，不得主动与发射机构内的发射弹丸相邻的预置弹丸产生相对移动。\n\nS142 安装在测速模块内的发射管禁止使用铁质或其他易被磁化的材料。\n\nS143 对于强磁性物质或工作状态下会产生强磁性的设备，其在静止或者运行过程中对测速模块的磁力角\n\n影响需在 2°以内（RMUL 不需要遵循此规范）。\n\n在校准测速模块后，短按主控模块确认键再短按下翻键，按照如下操作观察主控模块机器人\n\n实时坐标变化（具体操作详见《裁判系统用户手册》机载端章节）：\n\n 分别旋转云台 90°、180°、240°后，对比真实转动角度的误差值小于 15°。\n\n 对于强磁性物质，在满足上述规范要求安装后，观察测速模块的角度值是否在 2°以内\n\n浮动。\n\n 对于工作状态下会产生强磁性的设备，将设备上电后分别处于静置与运行状态（例如：\n\n摩擦轮电机上电后静置与转动状态），观察测速模块的角度值是否在 2°以内浮动。\n\nS144 如测速模块安装规范示意图所示，以 Logo 位置为球心，直径 50mm 内不允许使用易被磁化的物质\n\n（铁、钴、镍制品和图传模块发送端散热风扇、工业相机机身等），直径 100mm 内不允许使用除相\n\n机图传模块、工业相机机身以外的含有磁性的物质（摩擦轮电机、云台电机等）以避免测速模块内\n\n的磁力计被干扰。\n\n76 © 2026 大疆 版权所有 \\[1\\] 球心位置\n\n图 3-35 测速模块安装规范示意图\n\n 提供 4 个 M2.5 的螺纹孔。\n\n 切勿遮挡光电管的孔位，否则会导致测速模块自检失败。\n\n 测速模块的航空线离摩擦轮较近，使用时注意保护线材不被磨损。\n\nS145 参赛队需确保模块化 42mm 发射机构与重装机器人之间的电气隔离，具体要求为：\n\n 对于重装机器人引出的裁判系统四芯航空线连接端子，在不接入外部电源的前提下，任意两两短\n\n接，重装机器人的裁判系统需正常工作。\n\n 对于模块化 42mm 发射机构引出的裁判系统四芯航空线连接端子，在接入的外部电源电压不超\n\n过 30V 的前提下，外部电源正负极与排针任意两两连接，模块化 42mm 发射机构的裁判系统至\n\n多离线但不能损坏。\n\n\\[1\\] 棕色-GND \\[2\\] 橙色-CAN\\_L \\[3\\] 红色-12V 供电 \\[4\\] 黄色-CAN\\_H\n\n图 3-36 裁判系统线序示意图\n\n实际检录以上操作需参赛队伍自行完成\n\n© 2026 大疆 版权所有 77","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0261"},{"t":"3.8.1 安装步骤","c":"装配维护","b":"1. 使用包装内提供的 4-pin 连接线将场地交互模块与电源管理模块上的 RFID 接口连接。\n\n图 3-38 场地交互模块连线示意图\n\n78 © 2026 大疆 版权所有 2. 使用 M3 螺钉固定场地交互模块至底盘，安装时切勿压到连接线，并注意保持场地交互模块与地面有\n\n适当的距离。\n\n图 3-39 场地交互模块安装示意图","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0262"},{"t":"3.8.2 安装要求","c":"装配维护","b":"场地交互模块的安装需遵循以下规范，否则可能会导致模块检测质量下降。由于安装不规范导致的后果将\n\n由参赛队伍自行承担。\n\n 场地交互模块附近应避免安装大面积导电材料，避免存在大电流或高频信号干扰（如电机线、\n\nRoboMaster 中心板、CAN 线、超级电容）。\n\n 场地交互模块的正面和背面没有导电材料遮挡，背面与金属板、碳板等导电材料至少要保留 30mm 距\n\n离。\n\nS146 场地交互模块不得超出装甲模块组成的矩形区域最外延。此外，在机器人变形过程中，该模块相对\n\n于底盘仅允许沿 Z 轴方向移动，不得在其他方向发生相对位移。\n\n 场地交互模块有效探测距离为 100mm（±5%），安装后实际探测距离以测试为准。若\n\n有效探测距离缩短或者无法正常工作，请检查安装是否合理。具体有效探测距离请参\n\n阅《场地交互模块说明书》以及《电源管理模块说明书》。\n\n 由于机器人内部电磁环境复杂，测试场地交互模块有效探测距离时需在机器人所有模\n\n块正常工作（比如超级电容、动力电机和无线充电线圈均工作等）时进行；若机器人\n\n有多种工作工况（如电容充电和放电，电机变速和匀速），则还需进行不同工况下的场\n\n地交互模块有效探测距离测试。\n\n© 2026 大疆 版权所有 79","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0263"},{"t":"3.9.1 安装步骤","c":"装配维护","b":"1. 使用 4 颗 M3 螺钉固定发送端至机器人的适当位置。\n\n\\[1\\] 相机图传模块（发送端）\n\n图 3-41 相机图传模块（发送端）安装示意图\n\n2. 使用航空转接线将相机图传模块（发送端）的航空线接口与电源管理模块上图传接口的航空线接口连\n\n接。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0264"},{"t":"3.9.2 安装要求","c":"装配维护","b":"相机图传模块（发送端）的安装需保证满足以下要求，否则可能会导致图像质量下降、图传链路传输不稳\n\n定、机器人异常离线等情况。\n\n 避免遮挡相机图传模块（发送端）的指示灯。\n\n 以相机图传模块（发送端）底面中心为顶点，应存在一个母线与相机图传模块（发送端）底面平行且\n\n位于相机正前方，锥角为 60°（立体角为 π(2-√3) sr）且无限延伸范围内无导电材料遮挡的锥体，如\n\n下图所示。\n\nS147 不得遮挡相机图传模块（发送端）的进风口、出风口。\n\n建议各进风口、出风口 150mm 范围内无遮挡。\n\n© 2026 大疆 版权所有 81 \\[1\\] 禁止遮挡区域 \\[2\\] 区域轴线\n\n图 3-42 相机图传模块（发送端）禁止遮挡区域\n\n 以相机图传模块发送端的天线底面连线中心为球心，70mm 半径的上半球内无导电材料、电磁吸收材\n\n料或其他可能产生无线信号干扰的部件，如“图 3-40 相机图传模块（发送端）示意图”所示。\n\n 若采用图传链路，需对相机图传模块（发送端）的 UART 串口部分进行保护，如采用泡棉、非金属挡\n\n板等保护装置。\n\n 相机图传模块（发送端）的接口、指示灯无遮挡。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0265"},{"t":"3.10.1 安装要求","c":"装配维护","b":"相机图传模块（接收端）的使用需满足以下要求，否则可能会导致其图像质量下降、遥控数据传输卡顿等，\n\n甚至工作异常。\n\nS148 相机图传模块（接收端）附近需避免金属遮挡。\n\nS149 散热口不得被遮挡。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0266"},{"t":"3.11.1 安装步骤","c":"装配维护","b":"1. 使用 2 颗 M3 螺钉固定定位模块至机器人的特定位置。如下图所示：\n\n图 3-45 定位模块安装示意图\n\n© 2026 大疆 版权所有 83 2. 使用包装内的航空转接线，连接定位模块至电源管理模块上带银白色金属圈的航空线接口。\n\n图 3-46 定位模块连线示意图","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0267"},{"t":"3.11.2 安装要求","c":"装配维护","b":"定位模块的安装需保证满足以下要求，若不按照要求安装，可能会导致定位模块定位异常。\n\nS150 定位模块安装支架需要与机器人刚性连接，即在支架任意位置施加一个与其垂直的 40N 的力，定位\n\n模块底部所在平面相对于水平面偏移不超过 10°。\n\nS151 定位模块的顶部朝上水平安装。定位模块上方 145°内不得被导体遮挡，如下图所示。若定位模块安\n\n装于可主动变形或参与机械联动的机构，则机器人变形前、机器人变形过程中和变形后均需要满足\n\n定位模块遮挡的相关要求。\n\n\\[1\\] 无限延伸\n\n图 3-47 定位模块安装示意图\n\nS152 定位模块的安装位置距离相机图传模块至少为 150mm。距离以模块最外沿之间的最短直线距离为\n\n准。\n\n84 © 2026 大疆 版权所有 S153 定位模块周边 100mm 范围内不得存在会产生强烈磁场的磁体、导磁体、易被磁化的物体或部件，\n\n以避免对定位模块产生干扰。\n\n常见的可能会产生磁场干扰的部件包括：电机、被磁化的金属、吸铁石。\n\nS154 不得使用磁体、导磁体、粘黏性材质固定定位模块。\n\n 定位模块包装内附带安装螺丝，建议使用该螺丝进行安装（若螺丝丢失可在现场领\n\n用）。\n\n 若选用其他螺丝，需符合相关规范。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0268"},{"t":"3.12 超级电容管理模块安装规范","c":"装配维护","b":"超级电容管理模块用于检测超级电容模组的容值，以及检测比赛过程中的超级电容模组能量。超级电容管\n\n理模块的尺寸预计为 60\\*30\\*7.5mm（L\\*W\\*H），使用热缩管作为模块的外部保护。\n\n硬件接口包括 1 个 XT30 公头、2 个 XT30 母头和 1 个超级电容管理模块通信接口。\n\n XT30 母头型号为 XT30PW-F。\n\n XT30 公头型号为 XT30PW-M。","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0269"},{"t":"3.12.1 安装步骤","c":"装配维护","b":"功率控制板是调节电源管理模块 Chassis 接口的输出功率和超级电容模组的输入功率、输出功\n\n率以满足规则中功率限制的模块。此模块为参赛队伍自制。\n\n1. 将超级电容管理模块安装在超级电容模组的输出接口与功率控制板的输入接口之间。\n\n2. 使用带 XT30 接口的线材连接超级电容模组与超级电容管理模块。\n\n3. 使用带 XT30 接口的线材连接功率控制板与超级电容管理模块。\n\n4. 使用 4-pin 连接线连接超级电容管理模块的通信接口与电源管理模块的 CAN1 接口。\n\n© 2026 大疆 版权所有 85 超级电容管理模块接线如下图所示：\n\n\\[1\\] 机器人底盘供电接口 \\[2\\] 功率控制板\n\n\\[3\\] 超级电容模组 \\[4\\] 超级电容管理模块\n\n\\[5\\] 超级电容管理模块接口（输出，XT30 母头）⸺连接功率控制板\n\n\\[6\\] 超级电容管理模块检录接口（输出，XT30 母头）⸺仅用于检录\n\n\\[7\\] 超级电容管理模块通信接口（CAN，SM04B-GHS-TB 接口）⸺连接电源管理模块\n\n\\[8\\] 超级电容管理模块接口（输入，XT30 公头）⸺连接超级电容模组\n\n\\[9\\] 电源管理模块的 Chassis 输出接口 \\[10\\] 电源管理模块\n\n图 3-48 超级电容管理模块接线示意图","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0270"},{"t":"3.12.2 安装要求","c":"装配维护","b":" 超级电容管理模块的通信接口需连接至电源管理模块的 CAN1 接口，否则无法正常使用。\n\n 检录时，工作人员会按照超级电容管理模块接线示意图检查参赛队伍超级电容模组安装是否符\n\n合要求，检查完成后会在模块与电容组上贴好检录通过的标识。建议参赛队伍设计便于看到标\n\n识的结构，以免检录时需要频繁拆装机器人结构。\n\n86 © 2026 大疆 版权所有 S155 超级电容管理模块的 XT30 接口峰值电流与最大持续电流均不得大于 15A。\n\nS156 电容电压需要由满电降低至 1V 以下，如果电压出现异常快速降低等现象将无法通过检录。\n\nS157 超级电容管理模块的检录接口需引出至少 100mm 长的 XT30 母头接口的线材。\n\nS158 重装机器人、步兵机器人、哨兵机器人均需安装超级电容管理模块。若机器人没有超级电容模组，\n\n则只需采用 4-pin 线将超级电容管理模块接入电源管理模块。\n\nS159 超级电容管理模块需安装在机器人容易操作的位置，以便检录时操作超级电容管理模块。\n\nS160 超级电容模组仅允许使用一个供电接口，且需按照“图 3-48 超级电容管理模块接线示意图”进行\n\n连接，不得连接机器人上的其他电路。\n\n© 2026 大疆 版权所有 87 附录 1 17mm 测速模块转接零件工程图\n\n88 © 2026 大疆 版权所有\n\n# 附录 2 参考图纸\n\n附录图 1 前哨站装甲贴纸\n\n附录图 2 前哨站飞镖检测模块贴纸\n\n© 2026 大疆 版权所有 89 附录图 3 基地小装甲贴纸\n\n附录图 4 基地飞镖检测模块贴纸\n\n90 © 2026 大疆 版权所有","s":"官方·机器人制作规范 V1.0.0","k":"doc","i":"K0271"},{"t":"机械工程师设计手册（电子版，队群分享）","c":"基础理论","b":"《新编机械设计手册》电子版，但**不是 PDF**——是一个 Windows 电子书程序（YKYBook.exe），解压后约 372 MB、22204 个文件，全书以图片页形式存储（15649 个 GIF + 4545 个页面片段），只能装目录点选，不能全文搜索。\n\n全书 16 章：常用数据与资料、一般标准与规范、常用机械工程材料、公差配合与表面粗糙度、螺纹连接、轴毂连接、带传动与链传动、齿轮传动、蜗杆传动、滚动轴承、滑动轴承、润滑与密封、联轴器与离合器、减速器、轴的设计、常用电动机。\n\n对本任务最有用的三章：公差配合（轴承座 H7、轴 h6 的依据）、滚动轴承（选型与寿命计算）、带传动（同步带选型）。\n\n使用前提：需要 7-Zip 或 WinRAR 解压，再运行 YKYBook.exe；包内有 regist.htm，可能需要注册码。\n\n本地路径：E:/workbuddy/robomaster/机械百科_数据/设计资料/机械工程师设计手册电子版.rar","s":"群聊·27机械组 林填 2026-10-24","k":"auto","i":"K0272"},{"t":"Taurus 雕刻机使用说明（2025.02）","c":"加工工艺","b":"雕刻机操作要点：原点一般设左上角；AutoCAM 板材尺寸按 300×300 或 400×400 设置，也可量废板尺寸；刀头直径 2~4mm，非必要不用 2mm 刀（易断刀），仅当零件含半径小于 1.5mm 的圆角时才必须用。\n\n本地路径：E:/workbuddy/robomaster/02_队伍制度与必读/Taurus雕刻机使用说明_2025.02.md","s":"飞书·Taurus雕刻机使用说明","k":"auto","i":"K0273"},{"t":"拓竹 3D 打印机使用教程（队内版）","c":"加工工艺","b":"队内打印机操作教程，含切片参数、上机流程与常见问题处理。配套官方排障链接（X1C / H2D 堵头）。\n\n本地路径：E:/workbuddy/robomaster/02_队伍制度与必读/拓竹打印机使用教程.md","s":"飞书·拓竹打印机使用教程","k":"auto","i":"K0274"},{"t":"齐鲁 ADAM：雕刻机切片技术分享","c":"加工工艺","b":"把 RM 常见板件的雕刻技术做了系统总结：板材（玻纤/碳板）在框架、防撞、弹舱上的应用，以及为何自加工比外协更可控——急件时外协周期会拖进度。含雕刻机路径软件安装教程与 ArtCAM 基础编辑。适合作为队内雕刻机培训材料。\n\n原文：https://bbs.robomaster.com/article/1969137","s":"BBS·文章 1969137","k":"auto","i":"K0275"},{"t":"RM2027 铨 CNC 新电池架修改方案（夜雨声幽）","c":"结构设计","b":"针对 27 赛季新规则导致电池无法倒置放入新装甲板支架的问题，给出电池架修改方案。关键尺寸：新装甲板支架间距 71mm，电池最宽处 70.5mm，属极限配合。完整复刻需拆掉官方新电池架电路板并装到自制架上；方案优先适配作者自己的隧道构型底盘，兼容性有限，复刻需谨慎。\n\n原文：https://bbs.robomaster.com/article/1971089","s":"BBS·文章 1971089","k":"auto","i":"K0276"},{"t":"RM2026 珠海科技 舵轮英雄机器人结构设计开源","c":"案例开源","b":"舵轮底盘与中供弹解耦的构型。适合研究「底盘与发射机构如何互不干扰」这一经典问题，含完整结构开源。\n\n原文：https://bbs.robomaster.com/article/1971215","s":"BBS·文章 1971215","k":"auto","i":"K0277"},{"t":"重装机器人特化末端执行器（盐城 SaltWave）","c":"案例开源","b":"重装机器人末端执行器与机械臂对接机构，开源 STEP + STL。可用于参考快换接口、对接定位与轻量化设计。\n\n原文：https://bbs.robomaster.com/article/1970686","s":"BBS·文章 1970686","k":"auto","i":"K0278"},{"t":"RM2026 齐鲁 Adam：9 孔中心供弹机械结构","c":"案例开源","b":"中心供弹结构的孔位优化方案，含三维模型。适合研究弹仓容积、供弹顺畅性与结构强度的取舍。\n\n原文：https://bbs.robomaster.com/article/1970674","s":"BBS·文章 1970674","k":"auto","i":"K0279"},{"t":"RM2026 齐鲁 Adam：舵轮哨兵机械结构开源","c":"案例开源","b":"舵轮方案用在哨兵上的完整机械结构，含底盘与云台布局。\n\n原文：https://bbs.robomaster.com/article/1970665","s":"BBS·文章 1970665","k":"auto","i":"K0280"},{"t":"RM2026 五邑 IMCA：隧道步兵机械开源","c":"案例开源","b":"针对 27 赛季新增隧道地形的步兵构型（2026 赛季已开始适配）。对底盘高度、通过性有直接参考价值。\n\n原文：https://bbs.robomaster.com/article/1970482","s":"BBS·文章 1970482","k":"auto","i":"K0281"},{"t":"RM2026 南科大 ARTINX：低成本耐用轮腿 PCB 滑环","c":"案例开源","b":"轮腿机器人用的 PCB 滑环方案，主打便宜耐用，含机械文件与硬件工程。滑环是旋转关节的关键件，这个思路也可借鉴到大符这类旋转道具上。\n\n原文：https://bbs.robomaster.com/article/1969968","s":"BBS·文章 1969968","k":"auto","i":"K0282"},{"t":"LinkGo：快速 2D 连杆设计工具（诺丁汉联队）","c":"结构设计","b":"连杆机构的快速二维设计与验证工具，输入杆长与铰点即可看运动轨迹。做腿、臂、四连杆时用来快速试参数，比在 SolidWorks 里反复改草图快。\n\n原文：https://bbs.robomaster.com/article/1970481","s":"BBS·文章 1970481","k":"auto","i":"K0283"},{"t":"RM2026 铨 CNC：中心供弹结构开源","c":"案例开源","b":"CNC 标准化设计思路，含轴承分流片等零件。重点在「怎么把供弹结构做成可加工、可复现的 CNC 件」。\n\n原文：https://bbs.robomaster.com/article/1970334","s":"BBS·文章 1970334","k":"auto","i":"K0284"},{"t":"42mm 栓动发射器开源","c":"案例开源","b":"42mm 口径的栓动发射机构，主要零件为 PLA 打印件。适合研究发射机构的闭锁与上膛结构。\n\n原文：https://bbs.robomaster.com/article/1970708","s":"BBS·文章 1970708","k":"auto","i":"K0285"},{"t":"双极发射系统画图顺序：枪管→鹅颈→滑槽→拨盘","c":"结构设计","b":"英雄发射器设计有严格先后顺序，顺序错了会导致前后结构不自洽、图纸干涉、尺寸不合理。①枪管是精度基准，必须优先定：枪管上要留限位、入弹口、上下滑槽旋转点，枪管总长与最低俯角会干涉鹅颈，最高仰角会干涉上弹链。②鹅颈（定高度、后置量、上下两转弯半径），把枪管外形尺寸表征进鹅颈草图以定高度与后置量。③按发射器构型+限位构型选滑槽构型。④最后画拨盘：预制弹位由「鹅颈下直线弹链长度」+「拨盘直角段上弹链长度」共同决定。","s":"飞书知识库·机械·26赛季英雄技术传承文档","k":"auto","i":"K0286"},{"t":"鹅颈转弯半径遵循下小上大，压力角目标≤30°","c":"传动机构","b":"鹅颈三个待定尺寸：高度、后置量、上下两个转弯半径。原则「下小上大」：下转弯半径（以中间那个圆计）至少 >40mm（此时压力角约33°）；弹链系统压力角目标约30°或更小（工业传动一般要求<40°），尽量增大上转弯半径以降低滑槽转弯处压力角与阻力。另外下弹链需要一段直线弹链去顺滑过渡到大滑环处；pitch 连杆及连杆上轴承的位置也要一并计入干涉检查。","s":"飞书知识库·机械·26赛季英雄技术传承文档","k":"auto","i":"K0287"},{"t":"滑槽构型必须与限位构型配套选型（三种组合）","c":"结构设计","b":"①双摩擦轮构型+三点（大概率非均布）限位：可选下单滑槽，效果最好且能画出基本不干涉的下单滑槽；上滑槽可选上单滑槽或上立体滑槽。②倒三摩擦轮+正三限位：上滑槽旋转点定在发射器上，上转弯半径比下滑槽大约44mm，须防上滑槽干涉鹅颈上弹链，通常在上滑槽靠枪管处布轴承改善入枪顺滑；选上立体滑槽可天然避开上弹链、轴承布置范围更大更顺滑。此时若下滑槽点在枪管，极限情况会打不到下摩擦轮（华工办法）；若滑槽点在弹链上，因滑槽长且偏直线、下转弯半径小，很可能戳进弹链。③上三摩擦+倒三限位（有限位包胶）：滑槽点在枪管易戳到包胶轴承，需主动下移相当距离并做顺滑平接。最终采用西交开源的双滑槽画法——空间狭窄、易干涉场景下可复刻性最好。","s":"飞书知识库·机械·26赛季英雄技术传承文档","k":"auto","i":"K0288"},{"t":"重力补偿核心公式 k = mgl /(h1·h2) 与零原长弹簧","c":"传动机构","b":"目标：使云台可转动部分的重力矩与弹簧弹力矩始终相等。设计时使 θ1 与 θ2 恒相等，并采用广工重力补偿开源提出的「零原长弹簧」概念（用压簧+零件组合实现两连接点 A、B 可重合，等效零原长）。按图中三角形 AOB 用正弦定理推导，最终等式可化为 k = mgl/(h1h2)（x 与 θ 的相关项在提前设计中令其为1）。于是可先预设合适的 k（如 k=3，或实测选用的 0.21 绿色模具弹簧），反推 h1、h2 长度使其不干涉且适配云台。选型硬约束：模具弹簧极限压缩量的 80%（各颜色不同，需查表）必须大于最大俯角工况下的最大压缩量，保证不超弹性极限。实际重量通常比计算略重但差距不大，可用打印件试压调出各角度都顺滑的补偿量。","s":"飞书知识库·机械·26赛季英雄技术传承文档","k":"auto","i":"K0289"},{"t":"重力补偿弹簧压缩过量会造成 pitch 非线性与抖动","c":"经验避坑","b":"重力补偿弹簧压缩量过大时会扭曲变形并与光杆摩擦，在 pitch 低角度出现「摩擦力+弹簧力」叠加，补偿呈非线性，导致电机输出力随角度不一致，表现为 pitch 难调且抖动。对策：限制最大压缩量、保证弹簧与光杆同轴导向、必要时改多根弹簧并联分散单根压缩量，并在装配后用打印件实测各角度手感再定弹簧预压。","s":"飞书知识库·机械·26赛季英雄技术传承文档","k":"auto","i":"K0290"},{"t":"立体滑槽用拟合法设计：五步与一个致命约束","c":"结构设计","b":"立体滑槽应优先用拟合法而非草图法——草图法只适配短滑槽，且往往只能得出圆弧段。步骤：①先画某一角度（取最低俯角最省事，此时上弹链滑槽点正好是上滑槽最右点）的上滑槽轴承与前后延伸部分，含旋转点；②把该草图零件拖进装配体，按分段把 pitch 角度分成若干点，各角度下上弹链滑槽点即上滑槽上的一点；③拖动时优先保证弹丸刚接触上滑槽时该轴承位于上弹链固定轴承之上或同位置，前延伸引导线与枪管轴线偏移不宜过大（允许略微下偏）；④各点用样条曲线连成平滑曲线得到滑槽；⑤为避让上弹链，把原轴承排布曲线放到左右各17°的平面做双排轴承，用扫描特征+多引导线（样点取在轴承之间，留出甲片状特征）成型，再装回云台审顺滑度。致命约束：上旋转点不可离 pitch 旋转中心过近，否则上滑槽过短、转弯过急，弹丸会被「夹」在滑槽轴承内阻力激增——上赛季出现此问题，拨盘输出力矩突破 25N·m，卡弹并把上滑槽推断。","s":"飞书知识库·机械·26赛季英雄技术传承文档","k":"auto","i":"K0291"},{"t":"切供拨盘从六齿改七齿：卡弹反转与电机换型","c":"传动机构","b":"改进动机：往年六齿拨盘存在拨齿与入弹口轴承之间卡住弹丸的问题；本队有卡弹反转程序，会主动遮挡最后一个弹位用于退弹，导致落弹位比别队少一个、落弹效率下降，故 26 赛季改 7 齿。电机由 3508（减速比1:100）换 DM4340p：纵向体积大幅减小，不再挤占弹仓空间、减少弹丸局部架起；且带绝对编码器，可上电自动预制；扭矩仍然充裕。设计要点：分析拨齿推弹丸的姿态；按弹丸受力方向做分区润滑（润滑效果排序：轴承 > 特氟龙材料 > 特氟龙贴纸 > 普通打印件），推弹丸中间则外围与上方需更好润滑、底板可省，推弹丸上方则底板润滑优先级最高（自润滑材料久用必磨损且难更换）；受力最频繁的拨齿允许一定强度冗余；最后结合整车弹链长度确定预制状态。","s":"飞书知识库·机械·26赛季英雄技术传承文档","k":"auto","i":"K0292"},{"t":"拨盘压力角、偏内/偏外推与 2mm 预制余量","c":"传动机构","b":"拨弹分三阶段：弹丸进入直线轨道 → 拨齿推弹丸 → 弹丸推弹丸。圆形轨迹段压力角约 4.66°。偏外推：拨齿接触弹丸时间更长，受力方向先向内再向外，压力角 4.66°→约-8°→-90° 脱离；偏内推：接触更短、脱离更快，压力角单调增大。两种都能做顺，选择不绝对。真正关键的是预制相位：必须让预制时拨齿推弹的压力角较小（出力效率高），并留约 2mm 的弹丸间距余量，保证每次推弹都是「稳定往上把弹丸推出限位」。若预制时压力角过大，弹丸会推不过限位、先上推再坠落，再靠第三阶段弹丸推弹丸补推，实测表现是弹道更散、弹速更低。其他队搅弹方案：华南虎在弹仓某一面壁做活页+舵机不断开合刷新弹丸状态；辽科在拨盘电机上方加铝柱，每拨一次搅动一次。","s":"飞书知识库·机械·26赛季英雄技术传承文档","k":"auto","i":"K0293"},{"t":"定一级调参法：发射器参数测试顺序与二级禁止减速","c":"加工工艺","b":"前提：单发限位包胶轴承的硬度与尺寸、一二级摩擦轮的硬度与尺寸先定型。测试顺序（从前往后）：限位压缩量 → 出限位到接触一级摩擦轮的距离 → 一级压缩量 → 二级压缩量。「定一级调参法」：调一级压缩量时只上下移动该摩擦轮、不左右移动，以一级摩擦轮轴向位置为基准调其他参数——可最大程度避免摩擦轮与前后枪管干涉，结构可做到最紧凑；副作用是弹丸接触限位前弹链总长会微变，但单边最多1.5mm，可忽略不计。二级绝不能做减速：若二级转速提高而出射速度反而下降，说明一级给速过大或二级转速过小，实测表现是弹速波动比单一级还大、弹道比单一级还散。","s":"飞书知识库·机械·26赛季英雄技术传承文档","k":"auto","i":"K0294"},{"t":"摩擦轮压缩量四条实测规律与温度影响","c":"传动机构","b":"①同一压缩量下增大转速，出弹速度近似线性上升；能调出使方差<0.01 的最优转速，就说明该压缩量的稳速极限大于目标速度。②压缩量越大，最大稳速极限越高，转速下降一段仍能找到最优转速。③压缩量并非越大越好：过大会打滑、弹道乱飞且摩擦轮磨损严重；即便用白弹能打准，比赛胶弹表面更光滑，大压缩量的上场表现会大打折扣。④二级压缩量过大会「喧宾夺主」替一级做功，准度甚至不如单一级，违背「一级加速到90%、二级只轻微加速」的策略。温度：摩擦轮越热包胶越软、出速越大，温差大时同参数同转速速度差可达 0.6m/s（单极尤其明显）。另：包胶厚度较薄时，弹丸作用力会穿透包胶触及 CNC 内芯，支撑力线性上升后突然突增，两个摩擦轮突增时刻不同会造成水平散布激增。","s":"飞书知识库·机械·26赛季英雄技术传承文档","k":"auto","i":"K0295"},{"t":"限位压缩量的手感标定法（4-14-8 85A 包胶轴承实测）","c":"加工工艺","b":"不装一级摩擦轮，装不同粗测参数的限位，用手推拨盘让弹丸过限位感受力度：既要在最低俯角也能手推出，又不能滑过限位造成连发；再用驱动拨盘在各角度推出限位验证手感。对 4-14-8、硬度 85A 的包胶轴承：40.5 是既不连发也不卡弹的合适区，40.3 手推明显变难，40.7 过于轻松，最终定 40.4–40.5。同一区间内压缩量越大，消除弹丸个体差异（送弹速度方向、受力方向、被推瞬间旋转）的能力越强，接触摩擦轮时一致性越好。出限位到接触一级摩擦轮的距离：负值（弹丸未完全出限位就接触摩擦轮）弹道明显变差，1–2mm 最优（弹丸需飞行一小段稳定自身），0.2mm 步进细测在该区间内无显著差异，可视为不敏感参数。","s":"飞书知识库·机械·26赛季英雄技术传承文档","k":"auto","i":"K0296"},{"t":"气动发射器原理：临时密封气室+内外压差做功","c":"传动机构","b":"弹丸先进入后侧枪管，上下对射光电门检测到后，击锤把弹丸顶到前密封胶片，同时活塞与后密封胶片卡合，形成一个临时密封气室；随后从弹丸后上方注入高压气体，因外界大气压低于密封腔内压，弹丸被推出。优点：测试周期短、测试件结构简单且便宜，可短时间测多组参数；发射器拆装比摩擦轮快不少；分析弹道时可忽略拨盘供弹影响。缺点：发射器寿命比摩擦轮短得多；弹道影响因素分析更复杂；射频不如摩擦轮；维护麻烦（需频繁给气瓶打气、经常更换滤芯保证空气洁净）。","s":"飞书知识库·机械·24赛季气动发射器总结","k":"auto","i":"K0297"},{"t":"气动发射器三代迭代：桂电22→华农23→华农24","c":"案例开源","b":"桂电22版：自制快排阀，气室与快排阀做在一块。华农23版：不用自制快排阀，改用更便宜的标准件组装出带气室的快排阀，其余与桂电22基本一致；缺点是气体利用率低导致射频难提升，且弹丸未完全进入枪管就被光电检测到，入口易卡弹。华农24版：增加加速气室延长气体做功距离以提高初速；对射光电换成漫反射开关；所有定位销孔由全圆孔改为圆孔+槽口对称分布，消除过定位（前侧枪管同改）；定位方式改为「一面半槽半圆、另一面全圆孔」——因为其中一面要作为另一零件的定位基准，销必须与该面刚性连接才能保证定位效果。改进效果：气体利用率提高（射频可再提升）、消除过定位与入口卡弹隐患、加速更平缓使弹速更稳定。","s":"飞书知识库·机械·24赛季气动发射器总结","k":"auto","i":"K0298"},{"t":"密封胶片选型：软胶覆膜、硬度45–50、寿命衰减","c":"材料板材","b":"密封胶片采用软胶覆膜工艺，硬度一般 50 度左右，个人实际选 45–50 度之间。推荐在「未来工厂（wenext）」批量定制：有开模费用，一次定制 10 片性价比最高，约 50 元/片。寿命有限，用久后软胶出现裂缝使气密性下降，表现为弹速明显下降，需按射频与弹速衰减定期更换。参数影响：硬度过高或厚度过厚会增大弹丸与胶片摩擦阻力导致掉速；硬度过低/厚度过薄的影响因经费有限未做测试，暂无结论。","s":"飞书知识库·机械·24赛季气动发射器总结","k":"auto","i":"K0299"},{"t":"气动件材料取舍：未来8000黑色树脂用在哪些件上","c":"加工工艺","b":"前侧枪管、二级气室、后侧枪管用未来工厂黑色 8000 树脂：精度高、表面光滑，但脆、强度较低、容易变形，价格是普通光敏树脂的两倍。击锤因需承受较大冲击力，不用 8000，改用强度更高的光敏树脂。前侧枪管上的释放槽是胶片受压变形的缓冲空间，保证弹丸能顺利射出，其直径与长度会略微影响弹速，内径过小时影响很大。","s":"飞书知识库·机械·24赛季气动发射器总结","k":"auto","i":"K0300"},{"t":"气动弹速影响因素排序（实测）","c":"传动机构","b":"快排阀与气室：气室气压由比例阀控制、气体体积基本不变，气室气压与体积显著决定初速度（弹速随比例阀气压上升）。气缸与击锤：气缸压强必须足够大，否则发射瞬间击锤与胶片间漏气掉速；弹速与气缸气压正相关，但气压继续增大后趋于饱和（曲线收敛）。密封胶片：硬度、内径、厚度。前侧枪管：内径越小弹速略高，幅度不大。释放槽：直径与长度，内径过小影响显著。二级气室：通气孔大小为主，通气孔位置、气室内径与长度次要。加速气室：内径与长度影响较小。击锤内部形状影响较小。","s":"飞书知识库·机械·24赛季气动发射器总结","k":"auto","i":"K0301"},{"t":"一孔一槽定位与刚性双端：不能拿被定位件当基准","c":"图纸规范","b":"核心原则：定位时「中间的是定位基准，上下都是被定位件（包括枪管）」——定位基准上插多少销都没关系，但不能把被定位件再拿去当定位基准，否则误差链会串起来（即过定位）。用一孔一槽（圆孔+槽口）配合消除过定位：全部圆孔=过定位，全部槽口=失去定位。在被定位件上装塞打螺丝去装配另一个工件，可以省掉电机端凸台固定。刚性双端结构对电机要求高（需承受倾覆力矩）；轴承建议选高转速深沟球 P5 精度，具备承受倾覆力矩能力的约 180 元/个。轴孔配合可直接查 mecaculator 公差配合计算器。","s":"飞书知识库·机械·26赛季英雄技术传承文档","k":"auto","i":"K0302"},{"t":"拆下的轴承必须密封袋分类收纳，打印废料直接丢","c":"装配维护","b":"拆机拆下来的轴承要用密封袋分类装好、指定专人保管，需要时在群里喊（27机械组 10-26 实际操作：轴承拆完装密封袋放回原盒，盒子统一放到拆机器那张桌子上，由刘俊锋先收着，过两天装拨盘要用）。原则是「谁需要就谁收」，但要落到具体人，否则会出现没人认领的散件。3D 打印支撑件的废料无法再利用，直接丢弃，不要囤积占用工位。","s":"群聊·27机械组 2026-10-26","k":"auto","i":"K0303"},{"t":"实验室硬规矩：必须带电脑，工位流动","c":"队伍制度","b":"植正雄 2026-10-26 在 27机械组明确：今后绝大多数情况来实验室都要带电脑，没有电脑 95% 的事干不了；实验室设流动工位，把自己的电脑搬过来放在指定位置即可，不需要固定座位。切板在负二楼，需提前在群里约人带做，晚间 19:30 之后基本都有人，去之前确认对方在不在，切板要自带电脑。","s":"群聊·27机械组 2026-10-26","k":"auto","i":"K0304"},{"t":"27赛季预研方向清单（选课题先对齐这张表）","c":"队伍制度","b":"知识库《预研？预研！》列出的 27 赛季预研选题：重装——上台阶底盘；步兵——减速箱、拨盘、三摩擦、RL、超电；哨兵——过洞四舵；无人机、飞镖、雷达暂空。新人选题优先从这里对齐队内真实需求，避免自选方向与队伍脱节；做预研前先确认该项是否已有前人文档（如 26 赛季英雄技术传承已覆盖三摩擦与拨盘）。","s":"飞书知识库·机械·预研？预研！","k":"auto","i":"K0305"},{"t":"上海四校交流：超电与缓冲电容的现状与共同结论","c":"其他","b":"起源、交龙、同济超电均为平均电流模式控制（21.6V，半桥，G474，叠板/非叠板，大部分SMT、mos等少元件面手焊），电容端电流环+功率环+缓冲能量环共同控制，频率25KHz。缓冲电容普遍是母线直接并 4 个 2200uF 电解电容，配 8009/8009p 关节电机，均能正常起跳；起源与交龙电池与电机间不加理想二极管（认为反电动势不大、电池可承受）。同济把电容模组从「一大并两小」改为相同容值并联（大电容会炸，且避免不同容值并联问题、提高耐压），缓冲电容改成类超电结构并把电池与电容位置互换（电机与电池隔离，与港科「升压并联」拓扑相同）。共同结论：这一年各校都没上更新的技术，只是把原方案做稳，也都没做峰值电流；硬件组要负责整块 PCB 的全部嵌入式（含代码），电控只调车。存疑：起源与交龙都说没改电机（用8009），复旦同济是8009p 且都带缓冲电容，8009 与 8009p 的差距是否真这么大，尚无定论。","s":"飞书知识库·Hardware·上海四校交流硬件篇","k":"auto","i":"K0306"},{"t":"官方 RMUC2027 装配体（STEP + SolidWorks）到手","c":"赛事场地","b":"27机械组 史金凯 2026-10-26 22:39 发来 RMUC2027_V1.0.0装配体版本.zip（371MB），解压后为 RMUC2027_V1.0.0.stp 与 RMUC2027_V1.0.0装配体版本.SLDASM 两个文件。相比库中已有的 653MB 官方场地 STP（01_官方规则与规范/官方场地模型_RMUC2027.stp），这一份附带 SolidWorks 装配体，可直接在 SW 里打开做干涉检查、测量与布置基准，是大符/能量机关与底盘布置建模的首选入口。已归档到 04_往年图纸与代码/官方场地模型RMUC2027_STEP与SW装配体_V1.0.0.zip。","s":"群聊·27机械组 史金凯 2026-10-26","k":"auto","i":"K0307"},{"t":"比赛物流选型：两辆4米2优于一辆9米6","c":"队伍制度","b":"9米6 全是缺点：大、市区限行（一线城市晚10点后才准进市区）、难装（分区赛装车极慢）、限高（立交桥下备场曾被迫绕三遍）。推荐两辆 4米2 同时装：一辆主装场地道具、一辆主装机器人，装车远快于 9米6；4米2 无市区通行时间限制，可与大巴同时进行。装车时车舱内只留 3 位熟手，其余人在车下递件，禁止所有人都挤进车舱，否则容易乱。RM2026 分区赛因货拉拉堵车，沈阳理工输过一场——物流直接决定胜负。","s":"飞书知识库·机械·木牛流马技术文档","k":"auto","i":"K0308"},{"t":"货车进校与备场往返的时间安排（华农实例）","c":"队伍制度","b":"华农货车进校必须提前预约（当天可约，预约小程序「来访华农」），仅西门、南门、东北门可进，东北门限高 4.1 米。去赛场：不要按「提前2小时」叫车——多数人是提前2小时才开始收拾，建议提前收拾或直接提前4小时叫车，到场检修完还能睡一会。回备场：在比赛开始时再叫车比较合适（比赛30分钟+出内场10分钟+检修20分钟），叫太早司机会长时间等并可能加钱。车辆分级：中面/大面（微信货拉拉）适合场地道具训练运输，4米2（物流公司）能装下所有兵种，适合正式比赛。国赛春茧注意：不要按场馆定位叫车，定位到保安厅，否则司机容易开进深圳湾体育馆找不到人；货拉拉通行证随身带可大幅加快卸车。","s":"飞书知识库·机械·木牛流马技术文档","k":"auto","i":"K0309"},{"t":"货拉拉发票报销三条红线","c":"队伍制度","b":"①抬头与税号按项管通知确定（华农实例：抬头华南农业大学+对应税号，首次需认证企业，约2-3天）。②开票内容绝不允许出现「物品」「参赛物资」「机器人」等字眼（最重要的一条，出现即报不了）。③单张发票金额不允许超过 1000 元，超出需拆单。另外：加时费、停车费等额外费用让对方平台直接发账单，便于报销。长期合作可用物流公司（如阡陌物流）建沟通群，最小车型4米2，还有比赛倒短接龙群。","s":"飞书知识库·机械·木牛流马技术文档","k":"auto","i":"K0310"},{"t":"气弹簧腿部力矩计算器（离线版，队内工具）与常用计算链接","c":"传动机构","b":"从知识库《机械》根节点下载的离线 HTML 工具，用于计算气弹簧（腿部悬挂）在各姿态下的力矩，免去 Excel 手算，浏览器直接打开即用、无需联网。已存 机械百科_数据/设计资料/气弹簧腿部力矩计算器_离线版.html。同页常用工具：机械工程师设计手册（dev.inkcad.com）、铨州制造（gy2025.com）、嘉立创机械设计手册（jlc-jdgf.com/mcbook）、轴承公差配合计算（mecaculator.tw）、达妙电机参数查询与图纸下载。","s":"飞书知识库·机械·根节点","k":"auto","i":"K0311"},{"t":"华农摩擦轮调试指南（PDF，6.2MB）已归档","c":"加工工艺","b":"26 赛季英雄发射测试全程遵循并改进了《华农摩擦轮调试指南》：先找最优转速、随便预热摩擦轮、打三组弹道（每组约50发），按方差判定。本季新增做法：一级需在 15.8m/s 工况下有符合要求的方差（<0.01），否则简化测试；每个压缩量的最优转速都要单独找，因为并非所有压缩量都在目标速度附近有最优转速（有的在14-15m/s才稳）。已存 机械百科_数据/设计资料/华农摩擦轮调试指南_2026版.pdf，配套《最少限位数得到最多值1的被动法实例.docx》。","s":"飞书知识库·机械·26赛季英雄技术传承文档","k":"auto","i":"K0312"},{"t":"RM 机械开源地图（总览）","c":"案例开源","b":"系统梳理了 RM 各队的机械开源：哪些在 Git 仓库、哪些在网盘、每个队伍值得抄什么。\n\n核心判断：机械图纸的主战场是 BBS 帖子 + 百度网盘，GitHub 上九成是视觉与嵌入式。\n\n本地文档：E:/workbuddy/robomaster/机械百科_数据/外部资料/2026-10/RM开源地图.md","s":"整理·2026-10-27","k":"auto","i":"K0313"},{"t":"盐城工学院 SaltWave：机械图纸 Git 仓库（Gitee）","c":"案例开源","b":"目前找到的唯一一个纯机械图纸的 Git 仓库，直接 clone 就能拿到全部图纸。含：三摩擦全向轮英雄(27赛季)、半舵双 YAW 哨兵、平衡步兵(26/27赛季)、狗腿履带气动英雄(26赛季)。用 submodule 组织，每个车型一个子仓库。\n\n链接：https://gitee.com/ysl050811/rm2026-saltwave-blueprint","s":"Gitee·ysl050811/rm2026-saltwave-blueprint","k":"auto","i":"K0314"},{"t":"META 战队：RM 机械图纸收集仓库","c":"案例开源","b":"自家 2022 步兵全套（云台/发射装置，STEP + SolidWorks f3z 分包），同时收集了各队 CAD 的跳转索引：2023 上交平衡步兵中供弹、2024 武汉工程上供弹、2022 广东工业蛇颈+中心供弹 PDF、2023 深大双头哨兵、2023 南理工轮子。\n\n价值在于「它链到哪」——是个小型导航站。\n\n链接：https://github.com/MATH-286-Pro/META_RoboMaster_Mechanical","s":"GitHub·MATH-286-Pro/META_RoboMaster_Mechanical","k":"auto","i":"K0315"},{"t":"山东华宇 HYNova：16DOF 轮足全链路开源","c":"案例开源","b":"新队但开源极完整：机械 SolidWorks 源文件 + 整机 STEP + 二维工程图 + BOM + 装配说明，另有硬件、软件、强化学习 train-sim-real 全链路。\n构型要点：铝方管骨架 + 5mm 碳纤维身子板兼作髋关节电机座；大腿到小腿用齿轮 + 5M 同步带；腿杆为两片 3mm CNC 铝板夹 3D 打印件的工字梁截面。\n\n链接：https://github.com/zeitvex/RC_WheelLeg","s":"GitHub·zeitvex/RC_WheelLeg","k":"auto","i":"K0316"},{"t":"华南理工 华南虎：RM2026 元胤哨兵机械开源","c":"案例开源","b":"哨兵整车机械结构，含三维图纸、2.09MB 机械结构设计报告 PDF、演示视频。双头 + 蛇颈供弹构型，对「两套同轴旋转机构怎么排布」有直接参考价值。\n\n网盘：pan.baidu.com/s/1foJJgZgpfvutYbCTb8D4Uw 提取码 SCUT","s":"BBS·文章 1969791","k":"auto","i":"K0317"},{"t":"深圳大学 RobotPilots：RM2024 工程机器人机械开源","c":"案例开源","b":"龙门架结构 + 两个额外取矿机构，麦轮底盘。开源分四文件夹：二维图纸、技术文档（含设计需求/方案选择/功能参数）、三维图纸（SW2024 + STEP）、效果展示视频。\n\n网盘：pan.baidu.com/s/1iL5usMDtkh7bjVoxbbMFPQ 提取码 rp24","s":"BBS·文章 54099","k":"auto","i":"K0318"},{"t":"大连理工 凌BUG：RM2022 英雄机器人机械开源","c":"案例开源","b":"下供弹 + 并联自适应悬挂，含 11 米吊射前哨站小装甲、下台阶的实测视频。最有价值的是「英雄机器人设计树.pdf」——完整记录了从需求到结构的推导过程，比只看成品有用。另有加工件精度要求标注的二维图纸。\n\n网盘：pan.baidu.com/s/1bmy8MuDIjERfgxLWtUJi8A 提取码 0bug","s":"BBS·文章 9146","k":"auto","i":"K0319"},{"t":"中科大 RoboWalker：RM2025 空中机器人机械开源","c":"案例开源","b":"技术文档 + STEP 总装 + 二维图纸。云台末端一体 CNC 件给了 DWG 加工图，其余 CNC 件直接走铨洲智造下单。适合参考「哪些件值得出图、哪些直接外协」。\n\n网盘：pan.baidu.com/s/1GRk1SYSSKJwhiYXRx0WlmA 提取码 USTC","s":"BBS·文章 803750","k":"auto","i":"K0320"},{"t":"浙江大学 Hello World：RM2026 步兵云台（鹅颈）机械开源","c":"案例开源","b":"Yaw 轴以上完全通用，一套云台适配全向轮腿与串联腿平衡两种底盘。含 10.17MB 技术报告（性能参数表、设计方案详解、发射机构系统阐述），SW 原档保留设计树与配合关系，另提供整机 STEP。\n\n对大符最有参考价值的是它的轴系布置与同心度处理。\n\n网盘：pan.baidu.com/s/179kREq1RnruPjDAqZla9Ng 提取码 HW26","s":"BBS·文章 1937989","k":"auto","i":"K0321"},{"t":"上海交通大学 交龙：技术博客（机械培训教程）","c":"案例开源","b":"上交 GitHub 组织 25 个仓库全是视觉/嵌入式/仿真，没有机械图纸仓库。但对机械新人真正有用的是他们的技术博客：机械部专业课培训教程（工程材料、材料力学、机械原理三门课的学习路径）、SolidWorks 2020 培训教程。\n\n这是打底子的东西，比抄一个具体结构值钱。\n\n链接：https://sjtu-robomaster-team.github.io/","s":"sjtu-robomaster-team.github.io","k":"auto","i":"K0322"},{"t":"结论：RM 机械开源在 BBS，不在 GitHub","c":"经验避坑","b":"翻完 GitHub topic:robomaster 下 20+ 个仓库，按类型分布：视觉/自瞄约一半，导航/仿真约四分之一，嵌入式框架少数，机械图纸个位数。\n\n原因很实际：STEP/SolidWorks 文件动辄几百 MB，Git 管不动；队伍更习惯丢网盘、在 BBS 发帖留档。\n\n所以找机械资料，先去 bbs.robomaster.com/article 搜，再去网盘。","s":"整理·GitHub topic 实测","k":"auto","i":"K0323"},{"t":"铝方管：加外边长比加壁厚划算得多（40×40×2→50×50×2，重量+26%、惯性矩+101%）","c":"材料板材","b":"同重量下改截面比改壁厚有效。以 40×40×2 铝方管为基准：壁厚 2→3mm，重量 +46%，惯性矩 I 仅 +39%；改成 50×50×2，重量只 +26%，I 却 +101%。\n结论：做梁、做框架这类以受弯为主的构件，优先换更大外边长的方管，壁厚保持够用即可；只有当管壁薄到有压扁风险，或构件以受扭/受剪为主时，才考虑加厚壁。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0324"},{"t":"铝方管的两个边界：宽厚比 B/t 引发局部屈曲，抗扭刚度只认壁厚","c":"材料板材","b":"1）壁不能无限薄。加大截面却不加壁厚，B/t 变大，受压一侧管壁会先发生局部屈曲；工程上要么小幅增加壁厚，要么把宽厚比控制在合理范围，受压构件比受弯构件控制更严。\n2）受扭、受剪时壁厚才是主角。薄壁管扭转时剪流全靠壁厚承担，闭口截面抗扭刚度 ≈ 4A²t / 周长（A 为截面围成面积，t 壁厚，周长取中线周长）——面积项是平方，壁厚只是一次方，所以抗扭靠「围得大 + 壁够厚」。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0325"},{"t":"细牙螺纹自锁性其实更好：升角小才是自锁的来源","c":"标准件紧固","b":"螺纹自锁本质是斜面摩擦问题，螺母旋紧相当于重物沿斜面往上推，升角越小越容易自锁。细牙螺距小、升角小，理论自锁性优于粗牙。\n以 M35 为例：粗牙升角约 0.81°，细牙约 0.54°。所以「细牙容易松」的说法站不住脚——细牙真正的代价是牙深浅、抗污损与抗过载能力差、容易滑牙，不是自锁差。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0326"},{"t":"剪切面内必须避让螺纹：塞打螺丝 > 半牙螺丝 > 全牙螺丝","c":"标准件紧固","b":"螺栓受剪时，若螺纹段正好落在剪切平面上，螺纹处的净截面积减小，剪切应力升高，会在更低载荷下失效（经典提示语：avoid threads in shear plane）。\n所以抗剪连接优先用塞打螺丝（光杆段配合孔，本身还兼定位），其次半牙螺丝（光杆落在剪切面），全牙螺丝只适合受拉或纯紧固。这也是摆轮底盘连杆轴系「塞打螺丝贯穿」的原因。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0327"},{"t":"螺纹深度选型表（钢/青铜、铸铁、铝 三类材料的拧入深度经验值）","c":"标准件紧固","b":"机械组常识文档收录了表 6-1-53（单位 mm）：按公称直径 d 给出三类材料的通孔拧入深度 h、盲孔拧入螺纹深度 H₂、盲孔钻孔深度 H₁，数值随 d 增大递增。\n用法：铝件（我们的主力材料）强度最低，拧入深度要取三类里最长的一档；钢/青铜最短。盲孔必须多钻一段 H₁，否则丝锥到底、螺纹有效长度不够。画图时按表查，不要凭感觉写 1d 或 1.5d。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0328"},{"t":"铨洲螺纹孔画法规则：按底孔直径画孔，系统才认得出螺纹","c":"加工工艺","b":"铨洲智造按 3D 模型里孔的直径反推螺纹规格：M2 底孔 1.6、M2.5 底孔 2.05、M3 底孔 2.5……画出对应底孔直径，系统才会识别为螺纹并在确认后加工。\n注意：必须按系统 DFM 处理螺纹孔；3D 尺寸不符合攻牙标准会直接判不合格；不要画实体重孔。M4 牙的底孔加工深度也有明确要求，画浅了攻不到底。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0329"},{"t":"通孔直径 = 标准尺寸 + 0.1mm；写成 +0.2 会被当成大一号螺纹","c":"加工工艺","b":"任何可以加工螺纹的材料，开通孔时建议取「标准孔径 + 0.1mm」，例如 M4 通孔画 4.1mm。\n写成 4.2mm 时，加工厂会默认你要的是 M5 螺纹孔，直接出错。这条是发加工前最容易踩的隐形坑，属于「图纸没错、语义错了」。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0330"},{"t":"达克罗不是垫圈，是涂层工艺：五大作用与优先级","c":"标准件紧固","b":"达克罗（Dacromet）是一类表面涂层工艺，垫圈、螺栓、螺母、衬套、钣金件都能做；垫圈只是常见载体之一，且垫圈本身还分平垫、弹垫、自锁垫。\n五大作用（按重要性）：1）超强防锈防腐；2）杜绝氢脆，保护高强件（电镀酸洗会引入氢，高强螺栓忌电镀）；3）适配铝件，减少铝-钢电化学腐蚀；4）耐高温、工况适应性强；5）涂层薄，不影响装配精度。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0331"},{"t":"同步带 5M 与 S5M 不能混用：齿形、齿高、带厚、标准全不同","c":"传动机构","b":"两者节距都是 5mm，但齿形不同：5M 是圆弧齿（HTD），齿顶圆弧、齿槽平滑过渡；S5M 是平顶圆弧齿（STD，HTD 改良版），齿顶平。\n参数：5M 齿高约 2.06mm、带厚约 3.8mm；S5M 齿高约 1.91mm、带厚约 3.4mm，比 5M 略矮。标准：5M 走 GB/T、ISO；S5M 多源自 JIS。\n性能取舍：5M 齿部厚实适合重载；S5M 齿顶平，侧重平稳低噪音，适合高速、高精度定位。齿形参数不同，强行混用会噪音、振动甚至损坏。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0332"},{"t":"滚子链两个必背公式：节距 p = 链号×25.4/16，链轮分度圆 d = p / sin(π/Z)","c":"传动机构","b":"节距换算：p = 链号 ×（25.4/16）。例：08B → 8 × 1.5875 = 12.7mm；04B → 6.35mm。\n链轮分度圆：与齿轮分度圆概念近似，主要参数只有节距 p 和齿数 Z，d = p / sin(π/Z)。这个式子用来算等效中心距、链条节数、以及干涉范围。\n配套认知：链条画法不能「避而不谈」——不画链条算不了重量与干涉范围，画个拉伸圈又做不了干涉检查。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0333"},{"t":"链轮包角：工程上只看小链轮包角","c":"传动机构","b":"包角 = 链条紧贴、啮合在链轮轮齿上的那段圆弧对应的圆心角，分小链轮包角 α₁ 与大链轮包角 α₂。\n工程上重点关注 α₁：包角越小，同时参与啮合的齿数越少，单齿载荷越大、越容易跳齿与磨损。中心距过小或传动比过大都会压小包角，这是链传动布置的第一约束。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0334"},{"t":"等寿命摩擦（摩擦副等寿命设计）：让链条和链轮同时报废","c":"传动机构","b":"标准叫法是「摩擦副等寿命设计 / 配对摩擦副同步磨损设计」。核心：通过材料匹配、几何参数优化、载荷分配，让一对摩擦件的磨损速率接近，大致同时到达寿命极限。\n反面例子：小链轮很快磨秃而链条完好，或链条被拉长报废而链轮几乎无损——一个先失效，整套传动被迫提前更换，另一个的剩余寿命全浪费。\n正向目标：链条达到允许伸长量的同时，链轮齿磨损也同步到报废标准。选材与齿数配比时要把这一条摆进去。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0335"},{"t":"NW 型行星减速箱四大校核：减速比、同心、均布装配、邻接","c":"传动机构","b":"以太阳轮 Z1、一级行星轮 Z2（同轴双联）、二级行星轮 Z3、内齿圈 Z4 为记号（两级模数 m1/m2）：\n1）减速比：齿圈固定、行星架输出 i = 1 + (Z2·Z4)/(Z1·Z3)；齿圈输出、行星架固定 i = -(Z2·Z4)/(Z1·Z3)。\n2）同心条件（中心距相等）：m1(Z1+Z2) = m2(Z4−Z3)，由 r4 = r1+r2+r3 与 d = mz 联立得到。\n3）均布装配条件：(Z1·Z3 + Z4·Z2)/np = 整数 C，保证多个行星轮能均匀装入。\n4）邻接条件（防干涉）：2a·sin(π/np) > d，a 为行星轮中心到行星架中心距，d 为行星轮分度圆直径。\n四条全过才算配齿成立，任一不过就得重配齿数。","s":"飞书知识库·机械·行星减速箱研发日志","k":"auto","i":"K0336"},{"t":"两级模数比必须 4:3：0.48 与 0.64 是非标值，只能线切割","c":"传动机构","b":"双联行星轮（一级 49 齿、二级 15 或 12 齿固定在同一轴上）到中心轴的距离必须相等，于是同心条件把两级模数锁成固定比例。\n上交 25 开源：15/49 外啮合与 15/63 内啮合 → a1 = 32m1、a2 = 24m2，相等得 m1:m2 = 3:4。\n队内复刻版：0.48 与 0.64，比值同样 4/3；0.48×64 = 0.64×48 = 30.72，a = 15.36mm。\n关键提醒：0.48 不在 GB/T 1357 标准模数系列里（标准值 0.5），是为凑这个比例造出来的非标值，滚齿做不了，整套配齿只有线切割这种按轮廓加工的工艺才成立。","s":"飞书知识库·机械·行星减速箱研发日志","k":"auto","i":"K0337"},{"t":"12 齿行星轮必须正变位：x_min = 0.298，实取 +0.32","c":"传动机构","b":"20° 压力角标准直齿轮不根切的最小齿数是 17 齿。12 齿一定根切，必须正变位。\n精确公式：x_min = 1 − Z·sin²α/2 = 1 − 12×0.116978/2 = 0.2981（常见近似 (17−Z)/17 = 0.2941 偏低约 0.004，按 0.30 取其实还在根切边缘）。\n实取 +0.32：余量 0.022 个 x ≈ 0.014mm，大约相当于一个中走丝加工精度。再往上取没有收益——可用窗口 [0.298, ~0.42] 内无极值点，x 每 +0.01，基圆齿厚 +0.4%、重合度 −0.07，交换比恒定。\n配套：内齿圈必须跟着取同值 x4 = +0.32，否则顶隙变负（c = −0.0448mm），行星轮齿顶直接切进齿圈齿根 0.045mm。x4 是被中心距公式逼出来的，不是独立选择。","s":"飞书知识库·机械·行星减速箱研发日志","k":"auto","i":"K0338"},{"t":"行星减速箱 18 项校核清单：队内文档里还有 12 项是空的","c":"传动机构","b":"已闭合：传动比 17.33、同心 15.36、均布 1040、邻接 26.60 > 24.48。\n算过但没进文档：重合度 1.586/1.632、齿顶厚 0.28/0.27。\n完全空白：齿根弯曲强度（只有一句「要校核」无算式）、齿面接触强度、滑动率、行星轮轴承、销轴强度（但断过）、齿宽合理性（取 20mm 被判定是错的）、侧隙公差链（做过梯度试验但没算）、效率与温升（记录过发烫但没分析）、疲劳寿命。\n最缺的前提是载荷谱：没有「输入扭矩、转速、占空比」这三个数，上述强度项一项都做不了，因为应力与扭矩严格成正比。","s":"飞书知识库·机械·行星减速箱研发日志","k":"auto","i":"K0339"},{"t":"根切视角对比两套配齿：12 齿模数大但齿根弱，14 齿不需变位更长寿","c":"传动机构","b":"方案A（上交复刻）：二级 Z3=12、m2=0.64，属严重根切，必须正变位，否则线切割出来齿根极弱、重载易断齿；优势是模数比 0.5 厚 28%，做足正变位后绝对强度高，适合极限大扭矩。\n方案B（连炜生版）：Z1=15、Z2=46、Z3=14、Z4=75，统一 m=0.5，i≈17.43，一级二级中心距均 15.25。齿数 14 仍小于 17 会根切但轻微得多，不变位也能平稳跑，齿根应力分布更合理，适合高速长寿命运转。\n啮合平稳度：14 对 75 接触更平滑、噪音更小；12 对 60 齿数差大，单对齿啮合时间长、冲击略大。","s":"飞书知识库·机械·行星减速箱研发日志","k":"auto","i":"K0340"},{"t":"把轴承从齿轮齿上挪到行星架上，模数才能做小","c":"传动机构","b":"早期做法是在行星轮齿上开孔装小轴承，缺点是直接影响模数——d = mz，齿数 z 被减速比锁死不能动，要容纳轴承就得把 d 做大，模数 m 只能跟着变大，整个箱体随之变大。\n改进：把轴承装到行星架和端盖上（上交 26 版结构），同样的 z 之下 d 可以缩小，模数 m 得以下降到 0.48/0.5 级。这是「同减速比下把减速箱做小」的关键结构动作。","s":"飞书知识库·机械·行星减速箱研发日志","k":"auto","i":"K0341"},{"t":"侧隙梯度试验：只改一级行星轮和内齿圈，0.04 侧隙装出「乐高感」","c":"传动机构","b":"策略：太阳轮不好更换、二级行星轮与一级行星轮有配合关系不能改外形，所以梯队测试只做一级行星轮和内齿圈，一次发三种侧隙。\n基础参数（复刻第一版）：一级 m=0.48，太阳轮变位 0.15、侧隙 0；一级行星轮变位 0.15、侧隙 0.03；二级 m=0.64，二级行星轮变位 0.32、侧隙 0.012；内齿圈变位 0.32、侧隙 0.03。\n实测（20261026 晚修四号卡响减速箱）：换上新发的 0.04 侧隙内齿圈与一级行星轮，装配丝滑无卡顿，犹如拼乐高；原行星架依旧坚挺、轴销无晃动，继续沿用。怀疑原故障源是轴承滚道或滚珠老化。","s":"飞书知识库·机械·行星减速箱研发日志","k":"auto","i":"K0342"},{"t":"牙嵌式小腿传动：低成本牙嵌 8 齿通常比 12 齿更稳","c":"传动机构","b":"齿数不是越多越好，普通牙嵌最怕只有少数齿接触。评估顺序：\n1）先定义「最优」——齿根强度、齿面接触、扭转刚度/空程、重量、成本加权；2）理论估算先淘汰明显不行的候选（6/8/10/12/16 齿的齿根弯曲与齿面接触）；3）参数化有限元只改齿数，外径、齿高、预紧、材料不动，做接触分析，重点看均载系数、最大齿根应力、接触压力、扭转角；4）公差蒙特卡洛加进分度误差、齿厚偏差、端面跳动、预紧偏差，看均载是否稳定——这步最关键；5）选 8 齿与 12 齿各做样件，研配、加载、测背隙、疲劳试验。\n结论：低成本牙嵌 8 齿更稳（齿厚大、对误差不敏感），12 齿只有在公差下均载系数仍高、齿根应力够时才选。仿真给趋势，样件定最终。","s":"飞书知识库·机械·2027赛季串联腿开发日志","k":"auto","i":"K0343"},{"t":"包胶轮为什么定 110mm：不是无脑抄上交，是自己改小的","c":"传动机构","b":"此前一直以为 110mm 包胶轮是照搬上交开源，实际是 25 年区域赛后队内自己定的：从 120mm 改小到 110mm，考虑的是扭矩够、上坡力够，同时想让速度快一点；120mm 太大，110mm 又没有反推（爬坡/脱困）能力，最后折中定 110。\n复盘价值：选轮径要同时看「扭矩够不够、上坡力够不够、速度要不要、有没有反推能力」四件事，不要把它当成一个可以抄的参数。","s":"飞书知识库·机械·2027赛季串联腿开发日志","k":"auto","i":"K0344"},{"t":"围箍效应：闭合空心截面的四周壁互相约束，抗屈曲能力远高于开口截面","c":"结构设计","b":"围箍效应（环箍约束效应）指完整闭合的空心截面（圆管、方管、矩形管、箱型截面）四周管壁互相牵制，像箍一样限制相邻板件向外/向内自由变形、鼓曲、凹陷，从而大幅提升板件抗屈曲能力、整体刚度与极限承载力。\n这解释了为什么「口字型闭合箱型框架」抗扭刚度比开口门型架高一个数量级：不只是多了一根梁，而是闭合动作把四块板变成了互相约束的整体。做车架主框、云台外框时，把开口补成闭合，性价比远高于换更厚的材料。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0345"},{"t":"车辆通过性三个角（我方车型实测 39.8°/23.5°/37.1°）","c":"结构设计","b":"接近角 39.8°、纵向通过角 23.5°、离去角 37.1°（机械组常识文档配图实测值）。\n定义：接近角是前端最低点与轮胎接地点连线与地面的夹角；离去角是后端同理；纵向通过角是车底最低点与前后轮接地点切线的夹角。三个角共同决定能上多陡的坡、会不会托底、能不能过坎。\n用法：设计底盘离地间隙与护板时，先把这三个角画出来，再决定前后缘收多少、护板能不能压这么低。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0346"},{"t":"硬件板端口预留空间：60 口 32–37mm，30 口 15–20mm","c":"结构设计","b":"画结构件给电控/视觉留口时按这个间隙留：60 口（60×60 风扇/大接口规格）需要 32–37mm；30 口需要 15–20mm。\n这是插头根部 + 线缆弯曲半径的净空，不只是插头本身尺寸。留不够的后果是线插不进去或长期被压、断芯。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0347"},{"t":"加强筋设计参数（塑料件）：底宽≤3.4d、高≤3.4d、筋间距≥2.4d","c":"结构设计","b":"机械工程网设计手册给的是塑料件规范：筋底宽 ≤ 3.4d、筋高 ≤ 3.4d、两筋之间中心面 ≥ 2.4d（d 为壁厚）。\n用来对照 3D 打印件：打印件本质也是「塑料件 + 各向异性」，筋太高会翘、筋太密会粘连、筋根太厚会缩水鼓包。文档特别标注「但这是塑料零件……」，提醒不能直接套到铝件 CNC 上。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0348"},{"t":"机械组测试的目的清单（测试前先对一遍）","c":"装配维护","b":"文档列出的测试目的：模拟赛场真实情况、测车轮在赛场上的真实表现、预见一些可能发生的问题、确定测试条件与背景、迭代到整车设计中不断修改、量化一切可量化的。\n最终目标：提高整车稳定性与性能。\n反向用法：一次测试如果这几条一条都不占，那就是白测——先想清楚这次要验证哪一条、用什么数据证明。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0349"},{"t":"覆盖质量清单（URDF 与整车质量核算直接可用）","c":"结构设计","b":"8009P 电机 921g、6030 滑环 125g、C610 电调 37g、6020 电机 468g、4310 306g、4005 154g、步兵摩擦轮 40g、主控 80g、电管 120g、图传 125g、新图传 121g、大测速 383g、小测速 146g、灯条 350g、大装甲 549g、小装甲 359g、RFID 138g、电池 680g。\n用途：导出 URDF 前给这些「官方无实体质量」的模型做覆盖质量；以及估整车重心时直接查表，不用每次称。","s":"飞书知识库·机械·2027赛季串联腿开发日志","k":"auto","i":"K0350"},{"t":"工程图螺纹标注逐段解读：M20×2LH-5g6g-S 与 Tr40×14(P7)-7H-L","c":"图纸规范","b":"例1 M20×2LH-5g6g-S：普通螺纹，大径 d=20，螺距 P=2（细牙），LH 左旋（不标默认右旋），S 短旋合长度；顶径公差带 5g、中径公差带 6g（外螺纹小写、内螺纹大写）。\n例2 Tr40×14(P7)-7H-L：梯形螺纹，大径 D=40，导程 14、螺距 P=7 → 线数 2，右旋；L 长旋合长度；中径与顶径公差带同为 7H。\n易错：导程不等于螺距。多线螺纹必须写成「导程(P螺距)」，只写导程会让加工方按单线做。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0351"},{"t":"SW 同时维护三套几何：屏幕是三角面片，判干涉永远以干涉检查的体积为准","c":"图纸规范","b":"三套几何：B-rep（NURBS 精确曲面）用于干涉检查、质量属性、CAM、工程图尺寸；三角面片（tessellation）用于屏幕显示与旋转缩放，由「图像品质」决定，默认很粗；草图曲线/块用于导出 DXF 与 2D 投影，是精确的。\n现象一：屏幕上「明显干涉」。面片是内接逼近，弦永远在弧内侧，两个相切齿面各自内偏半个弦高就看起来穿模。SW 默认弦高偏差约包围盒的 0.1%~0.5%，齿圈外径 46mm 时偏差 0.05~0.2mm，而齿侧隙只有 0.02mm——显示误差是侧隙的 5~10 倍。\n现象二：干涉检查说「无干涉」。它用 B-rep 算相交体积，相切时体积为 0，且默认不勾「视重合为干涉」，所以报无干涉是对的。\n现象三：导出成块就没干涉。块是精确曲线，没有面片化这一步。\n一句话：同一模型精确表示没问题、面片表示有问题，问题就在面片。","s":"飞书知识库·机械·行星减速箱研发日志","k":"auto","i":"K0352"},{"t":"URDF 导出质量错误：用「覆盖质量」的模型，插件识别不了","c":"图纸规范","b":"机械模型若使用「覆盖质量」（电机、裁判系统、电池这类官方只给重量的模型），SolidWorks 的 URDF 导出插件无法识别该质量，导出的质量和惯量都会错。\n两个解法：1）改用「材料 + 密度」逼近目标质量，导出结果更贴近真实模型；2）「Export as URDF」插件最后一步可以手动设置质量。\n配套坑：整车质量突然只剩 17.5kg，就是这一步出错导致的（部分电机模型质量丢失）。","s":"飞书知识库·机械·2027赛季串联腿开发日志","k":"auto","i":"K0353"},{"t":"不要为了导 URDF 去解散装配体：会丢质量、丢零部件打开功能","c":"图纸规范","b":"解散装配体后，一些电机装配体模型会丢失「打开这个零部件」的功能；同时部分质量凭空消失，整车质量从正常值掉到 17.5kg 左右。\n正确做法：保留装配体结构，用插件/覆盖质量去处理质量，不要靠解散来简化。真要简化就另存一份副本再动。","s":"飞书知识库·机械·2027赛季串联腿开发日志","k":"auto","i":"K0354"},{"t":"sw2urdf 的 Joint Type 五个选项：RM 不推荐用自动检测","c":"图纸规范","b":"Joint 是两个 link 之间的约束，决定仿真里能不能动、怎么动。\n1）Automatically Detect：插件读 SW 配合自动判断（旋转配合→revolute/continuous、平移配合→prismatic、无相对运动→fixed），是插件功能不是 URDF 原生类型。坑：SW 配合一复杂就识别错，RM 机甲不推荐依赖它，手动选更稳。\n2）continuous：单轴旋转、无上下限、可无限转，导出不生成 limit 标签。轮子、摩擦轮、无限位电机轴用它。\n3）revolute：单轴旋转带角度上下限（rad），导出写入 limit 上下限/effort/velocity，超限位仿真报错或锁死。舵机关节、摆臂、大转臂用它。\n4）prismatic：沿轴平移带位置限位（m）。伸缩推杆、滑台、升降机构用它。\n5）fixed：0 自由度刚性固结，不需要 axis/limit，仿真把两个 link 当一个刚体算质量惯量。基座碳板、摄像头、电池、电控板用它。\n记忆口诀：revolute 有机械限位不能 360° 一直转；continuous 无限位可以一直转。","s":"飞书知识库·机械·2027赛季串联腿开发日志","k":"auto","i":"K0355"},{"t":"文档里写数量用阿拉伯数字或中文数字，别用特殊字体或花体","c":"图纸规范","b":"植正雄在场地道具群提出的小 tips：写文档时数字用阿拉伯数字或者中文数字，不要用那种花体/艺术字数字。\n原因很实际：特殊字形在跨端渲染、复制、检索、AI 识别里都可能失效或变成乱码——我们这套检索系统就是靠文本匹配吃饭的。刘俊锋的总结是「学习 DJI 顺序命名」。","s":"群聊·场地道具开发维护大队","k":"auto","i":"K0356"},{"t":"CNC 原材料厚度按 5mm 一档选（10–30mm 每 5mm 一档）","c":"加工工艺","b":"下单 CNC 前先看设计厚度能不能落到标准板材档位上：常用原材料厚度从 10 到 30mm，每 5mm 一档（10/15/20/25/30），再往上同样按 5mm 递增。\n设计的板厚如果写成 12mm，加工方要么按 15mm 下料再铣到 12（多花工时、多花材料），要么直接报「不支持本次活动，点击查看 DFM」。把厚度往 5 的整数倍上靠，是最省钱的免费优化。","s":"飞书知识库·机械·机械组常识文档","k":"auto","i":"K0357"},{"t":"27 赛季场地改造分工表：大国工匠 3 项 + 战队工匠 7 项","c":"赛事场地","b":"《27 赛季 Taurus 场地改造指南》把活分成两半：\n大国工匠部分（郭工制造）：a 全场改建为次新 27 场地；b 三级台阶制造；c 大飞坡块移除、起伏路段处地板保留，后建新隧道地形填平飞坡空缺。\n战队工匠部分（Taurus 制造，7 项）：a 靶车、b 前哨站、c 飞镖基地靶、d 科技核心、e 能量机关、f 工作台、g 机库平台。\n商讨中：便携式二级台阶（需求待定）。\n用法：这 7 项就是本赛季场地道具的完整交付清单，也对应场地道具开发维护文档里那些还空着的章节（靶车、大符、前哨）。","s":"飞书知识库·机械·27赛季Taurus场地改造指南","k":"auto","i":"K0358"},{"t":"吊射靶改进方向：加一块发光装甲板 + 做成快拆","c":"赛事场地","b":"场地道具开发维护文档第 9 节：吊射靶原来那个差不多了，改进只加两点——\n1）安装一块发光的装甲板（便于视觉识别与命中判定）；2）结构做成能快拆的。\n这两条是本赛季吊射靶的明确需求边界：不要重做主体，只加识别装置和快拆接口。","s":"飞书知识库·机械·场地道具开发维护文档","k":"auto","i":"K0359"},{"t":"场地道具开发维护文档里「靶车」「大符」两节仍是空白，这是本赛季最大的缺口","c":"赛事场地","b":"文档结构完整，但第 7 节靶车、第 10 节大符、第 11 节场地都没有正文；第 1.1 优点、第 2.1/2.2/2.3 各兵种需求、第 3.2/3.3 电控与视觉技术要求、第 5 节维护规范都只写了零星几条。\n这意味着：本赛季场地道具里最能拉开差距的两件东西（靶车、能量机关），队内还没有成文需求。谁先把这两节写出来，谁就掌握了定义权。\n补写时可直接套用已有的 2.4 飞镖组需求写法：靶体与移动结构 → 整体框架 → 缓冲，三段式。","s":"飞书知识库·机械·场地道具开发维护文档","k":"auto","i":"K0360"},{"t":"靶车装甲板的血泪教训：插销会脱出，玻纤会失效","c":"经验避坑","b":"去年靶车转动时装甲板会被甩出来，根因有两个层面：\n1）机械：插销扛不住、会从孔里脱出来（不是从滑轨上倾出来）。\n2）材料：玻纤（FR4）在高频交变载荷下失效——板材本身不是为反复冲击设计的。\n视觉侧的要求：装甲板可以保留里外移动功能，但必须保证它旋转和移动时是完全固定住的。\n结论：靶车装甲板的锁紧要做成防脱，而不是靠摩擦或靠销子塞住；选材避开纯玻纤承力。","s":"群聊·场地道具开发维护大队","k":"auto","i":"K0361"},{"t":"场地道具抗撞击冗余不足的三个遗留问题（去年复盘）","c":"经验避坑","b":"1）抗撞击冗余不足：局部薄弱结构（挡板边角、限位凸起）耐冲击性差，大小弹丸击打后多次对抗即出现松动、掉漆、板材翘边、螺丝滑丝，需要频繁检修。\n2）维护体系不完善（文档此条未展开）。\n3）机械组技术要求因此定成两条硬指标：高稳定性/高冗余设计、耐磨抗造。\n通用维护规范第一条：定期全面检查，螺丝紧固与结构形变逐项排查。","s":"飞书知识库·机械·场地道具开发维护文档","k":"auto","i":"K0362"},{"t":"场地道具负责人是一整个赛季的责任，不是装好就完事","c":"队伍制度","b":"王奇英的原话（收录在场地道具开发维护文档第 4 节）：负责人不是把东西设计出来装好就完事，而是要一整个赛季维护；不要等要测了才匆匆检查，然后发现问题急急忙忙修、发现缺零件又急急忙忙发零件，所有人都要等你，拖累进度。\n要求：测试前提前检修，长时间测试连续检修，易坏零件提前发、提前备。\nGGBoom 的补充：备赛过程中超过半数的问题，本质是沟通协调不到位造成的信息差——电控、视觉调车出问题必须及时反馈给机械。","s":"飞书知识库·机械·场地道具开发维护文档","k":"auto","i":"K0363"},{"t":"分零件整理的实操规则：按材质分堆，电机绝不放在桌沿","c":"装配维护","b":"刘俊锋在 27 机械组给的拆件规则：电机拆下后放到入门那张桌子；板材分一堆、铝类分一堆、轴承分一堆、微型轴承单独分一盒、打印件可以直接扔。\n植正雄补的安全条款：东西要放桌子里面点，不要在悬崖边上——掉下来电机大概率就报废了。\n配套：整理结果已并入「分零件须知」云文档，以后看云文档而不是爬楼。","s":"群聊·27机械组","k":"auto","i":"K0364"},{"t":"土槽打印机（HP Laser 300）用法：只支持 2.4G 局域网，设备在负二-1","c":"其他","b":"打印机只支持 2.4GHz 网络，靠局域网连，必须确保自己设备连的是「负二-1」这个网。\n手机：装 WPS Office、HP app、HP 打印服务插件，然后在自己手机上添加设备即可（网络已配好）。\n电脑：设置 → 蓝牙和其他设备 → 打印机和扫描仪 → 添加设备，设备名 HPF8EDFC1CE768 (HP Laser 300)；用 WPS 打开文件点打印。\n注意事项：用完拔电（雷雨天风险）、别浪费纸、别随意搬动、打印慢要等、那里不是监控死角。","s":"群聊·2027大群","k":"auto","i":"K0365"},{"t":"2027 赛季能量机关：官方只卖「靶子」，立柱与臂架必须自研","c":"赛事场地","b":"大符群 10-28 明确：本赛季能买到的官方组件只有靶子（即五块圆形靶板），「剩下的整体框架要你们设计」，要求「尽量贴近场上的模样」。也就是说能量机关从『买成品』变成了『买靶板 + 自研结构』，自研范围至少覆盖立柱、臂架、旋转核心与升降支撑。\n\n由此带来三个连锁问题：\n1) 没有组件图纸就无法定接口——组员反馈「关于能量机关的文件只找到装配体和零件，好像没看到图纸」，即目前手上只有 3D、没有 2D 工程图与接口尺寸表；\n2) 靶板到货前臂架无法定长度与端部安装孔位；\n3) 自研件要自己承担强度、刚度、动平衡，而往年是照官方件抄。\n\n行动建议：先向场地道具组索取「组件清单 + 靶板 3D/2D + 接口尺寸」，把靶板安装孔位、重心位置、法兰规格落成一页接口表，再开臂架。切勿在接口未定的情况下先画框架，返工成本极高。","s":"群聊·27炒鸡大符（王奇英、钟自豪、植正雄、高荣信，2026-10-28）","k":"auto","i":"K0366"},{"t":"大符升降机构的真实痛点：现在靠手动松螺丝升降","c":"结构设计","b":"王奇英原话：「可以想一个方便的旋转靶升降机构，我们现在的大符升降是靠手动松螺丝升降的，非常不方便」「碰到要低一点才能进去的地方很难受」。这是往年机型在实际使用中暴露的设计缺陷，属于「设计时省事、比赛时遭罪」的典型。\n\n痛点的本质：升降调节被做成了『装配工序』而不是『操作功能』。手动松螺丝意味着每次调节都要 2 人以上、要工具、要重新找水平、要重新锁紧，进出门洞、装车、过检录都要调一次，直接吃掉调试与转场时间。\n\n改进方向（群内已给出的三条）：\n1) 丝杆/梯形螺纹升降 + 导向柱：单人在侧面摇动手轮即可升降，自锁靠梯形螺纹升角小于当量摩擦角，不需额外锁紧；\n2) 可快速拆卸：把立柱做成两段插接 + 快拆销/凸轮锁，过门洞时整段拆下而非降低；\n3) 可拆扇叶：臂架与靶板做成快拆，运输时拆散、场地内组装，绕开『整体高度』这个约束。\n\n设计校核要点：升降行程要覆盖场地最低通过高度到工作高度；导向柱长径比不足会晃动，建议 ≥2.5:1；升降到最高位时整机重心必须落在支撑多边形内，否则加配重或做外扩支腿。","s":"群聊·27炒鸡大符（王奇英、植正雄，2026-10-28）","k":"auto","i":"K0367"},{"t":"大符整体垫高到 2600mm 量级：升降便利性与重心稳定是一对矛盾","c":"结构设计","b":"群内提出「这赛季能不能搞个东西把符垫高」，理由是观感与打击角度；讨论中出现 2600mm 这个数字（「要垫到 2600mm？」），并立刻引出「会不会重心不稳」。\n\n这是一个典型的『高度—稳定性—运输性』三角约束：\n· 垫高 → 重心抬高，倾覆力矩随高度线性增长，抗倾覆需要更大的支撑跨距或配重；\n· 配重 / 跨距加大 → 整机重量与占地增加，货拉拉运输与场地摆放受限（「外出比赛看看有什么东西能垫一下，还方便货拉拉运的」）；\n· 若采用可升降方案，则升降到高位时的刚度与锁止可靠性又成为新风险点。\n\n工程判断（供参考，非队内结论）：与其做整体垫高，不如做「可升降 + 大跨距底座」——底座用铝型材做十字外扩支腿，跨距取到高度的 0.5 倍以上可显著提高抗倾覆；或用可注水/可加沙袋的配重箱，运输时空箱、到场后配重，兼顾运输与稳定。\n\n待核实：2600mm 是否为规则/场地要求的高度值，需查官方规则与场地手册确认后再定方案，本条仅记录讨论。","s":"群聊·27炒鸡大符（伍津乐、林创武、林长耿，2026-10-28）","k":"auto","i":"K0368"},{"t":"能量机关四大模块分解：立柱·减速箱·核心·灯臂（官方培训口径）","c":"结构设计","b":"官方培训 PPT 对一个「单侧能量机关」给出的模块划分，可直接当作自研大符的功能分解与分工依据：\n\n1) 立柱——载体，支撑整个能量机关道具部分。承担全部倾覆力矩，是刚度链的根，接口要同时对接地面与旋转核心。\n2) 减速箱——主动力源，为能量机关提供旋转动力以及信号、供电传输。注意它同时是「动力+信号+供电」三合一路径，选型时要留滑环/线缆走线空间。\n3) 核心——单侧供电与信号，是单侧能量机关的圆周中心。即核心是电气枢纽，机械上要保证同心度与轴向定位。\n4) 灯臂——检测模块，实现 mark 灯以及小弹丸击打的检测与反馈。灯臂是易损件，装甲板/灯板要按可更换设计。\n\n这张分解图的价值在于把「一个会转的架子」翻译成四个可独立设计、独立验收的子模块，每块都能单独定接口与公差，避免整机一次性堆叠。归档图：05_整理成果_大符专题/能量机关整体方案分解_官方培训_20261028.jpg","s":"群聊·27炒鸡大符（官方培训 PPT 截图，2026-10-28）","k":"auto","i":"K0369"},{"t":"往年大符总装实测：臂端中心距 1619mm，垂直落差 1544.9mm","c":"案例开源","b":"从 2024 版能量机关总装模型（林涵，文件标注 202404-202405）实测得到的两个关键尺寸：\n· 旋转中心 → 臂端靶板中心的距离：1619.09mm（Delta X 484.50，Delta Y 1544.90，Delta Z 0，即同一水平面内）；\n· 对应投影面积 4947.03 mm²（软件测量面板值）。\n\n这两个数的用处：\n1) 1619mm 是臂长基准，可用于反推臂架的悬臂弯矩——假设端部总成（靶板+灯板+线束）重 3kg，则根部弯矩约 3×9.8×1.62 ≈ 48 N·m，臂架根部截面必须按此校核；\n2) 端点落在同一水平面（Delta Z=0）说明该版采用「平面五星」布局而非带倾角的布局，动平衡只需配平质量不需配平力矩；\n3) 可交叉验证：若本赛季靶板尺寸变化，臂长要按比例调整，但『端部质量 × 臂长』的乘积建议控制在往年量级内，否则立柱与减速箱扭矩会超。\n\n归档图：05_整理成果_大符专题/能量机关总装尺寸测量_中心距1619mm_20261028.jpg","s":"群聊·27炒鸡大符（林创武转发 SolidWorks 测量截图，2026-10-28）","k":"auto","i":"K0370"},{"t":"实物参考：大符的臂架用八边形镂空框 + 铝型材支撑架，靶板端部集成电控","c":"案例开源","b":"群内流出的实物照片（一台已装配完成的能量机关）暴露了几个只从 3D 看不出来的工程细节：\n\n1) 臂架不是实心板，而是「八边形外框 + 内部三角/梯形镂空肋」的组合，边缘密布铆钉/螺栓孔——说明用的是板材拼框（薄板激光切 + 折边或叠层），而不是整块铝铣削，成本和重量都更低；\n2) 靶板端部集中了电控（可见绿色 PCB、接线端子、电机/传感器模块），即灯臂是「机电一体件」，拆装必须留电气插拔空间，线束要走臂架内侧并用扎带固定，避免旋转时甩出；\n3) 整机立在一个铝型材框架（40 系列或 30 系列）做的门式支撑架上，下方还有独立底架——印证了立柱/支撑是独立子系统，可以先做支撑架再上旋转体；\n4) 臂架表面覆白色透光板（亚克力或 PC 乳白板），边缘用螺栓压条固定，这是灯效面的常见做法。\n\n对自研的直接启示：优先用「板拼框」而非整块铣削，降低加工成本与周期；把靶板端部当成一个可整体拆换的模块；线束路径在建模阶段就要画出来。\n\n归档图：05_整理成果_大符专题/能量机关实物参考_臂架与支撑架结构_20261028.jpg","s":"群聊·27炒鸡大符（实物照片，2026-10-28）","k":"auto","i":"K0371"},{"t":"大符项目对接失败的教训：没落成「清单 + 图纸」就等于没对接","c":"经验避坑","b":"10-28 大符群里的一段真实对话，几乎是项目管理的标准反面案例：\n\n组员：「所以是买官方组件是吗，组件包括什么内容？」→「我们不知道买了什么组件，也不知道我们要设计什么」→「有没有已经买了组件的清单」→ 负责人：「其实这个我也是不知道，只知道有组件可以买」。\n\n另一边，组长在催：「注意对接，不然他们不知道该干什么」「项目已经开始很多天了，不要拖」。\n\n问题拆解：\n1) 信息在「负责人」和「执行者」之间存在断点，采购清单没有下沉到设计者手里；\n2) 关键交付物（组件图纸）缺失，导致设计无法启动——这不是态度问题，是输入不足；\n3) 对接没有载体：口头问「进度如何」不产生任何可执行信息，必须有清单、有图纸、有截止时间。\n\n可复用的做法：跨组对接一律落三样东西——①采购/交付清单（型号、数量、到货时间）②接口图纸（安装孔位、法兰、外形包络）③责任人 + 日期。三者缺一，视为未对接。另：组员在群里公开问「我们该设计什么」，本身就是对接失效的信号，组长应当天响应而不是继续催进度。","s":"群聊·27炒鸡大符（钟自豪、植正雄、王奇英，2026-10-28）","k":"auto","i":"K0372"},{"t":"27 赛季机械组周会分享：文档责任制（版本号 + 修改日志 + 非作者不得直接改）","c":"队伍制度","b":"新建立的《27赛季机械组周会分享》文档（V1.0，2026.10.28 新建）规定的核心制度，值得所有技术文档照搬：\n\n1) 演讲者不只负责讲，还要对文档负责——实时维护、把新想法和新信息补进去、纠正错误知识点。\n2) 时间红线：本周分享的内容必须在**周五前**完成整体编写（分享会在周末），建议提前构思，不要压 ddl。\n3) 版本管理：文档开头必须写版本号并维护修改日志；每次更新都要升版本号 + 记录改了什么，然后**通知组长审核**，审核通过再在大群通知。\n4) 修改权限：其他人可以提问题、提想法，但**不许直接改**——必须告诉板块负责人和机械组组长，由负责人审核后再上传新内容或订正旧内容。\n\n这套规则解决的是社团技术文档最典型的三个病：只有作者看得懂、改着改着就乱了、错误知识长期没人纠。第 4 条尤其关键——它把「热心修改」和「破坏一致性」区分开了。","s":"知识库·机械/27赛季机械组周会分享（2026-10-28）","k":"auto","i":"K0373"},{"t":"周会分享计划：前两周讲兵种，之后由主力讲自己负责的结构","c":"队伍制度","b":"机械组通知群 10-28 公布的周会安排，本质是一套「技术壁垒破除」机制：\n\n· 前两周：兵种介绍。第一周为英雄、步兵、哨兵；第二周为工程、飞镖、飞机。\n· 之后几周：由主力队员介绍自己所在兵种某一结构的设计，作为技术分享。\n· 目的（原话）：「打破技术壁垒，使得各兵种组间能相互学习，新人也可以从中了解到各兵种的功能和技术等，加深对比赛的理解」。\n· 时间与形式：周会定在周日（具体时间另通知），每个兵种介绍控制在 **20min 内**。\n· 参加人员：全体新人 + 当周汇报的队员；大二及以上老队员可选听。\n· 配套动作：对应兵种组负责人及成员需补充完善本周《第一次周会文档》。\n\n对新人的实际用法：这是低成本摸清「别的兵种在干什么、我的结构在整车里处于哪一环」的唯一窗口，比看图纸快得多。分工上，兵种介绍可从「发展历程—兵种特色—定位与战场表现」三段展开（这是文档里给的提纲）。","s":"群聊·27机械组通知群（林创武，2026-10-28）","k":"auto","i":"K0374"},{"t":"26 赛季英雄分近战/远程两型：近战血高热量多但不能部署、弹速仅 12m/s","c":"赛事场地","b":"《第一次周会-英雄，步兵，哨兵机器人介绍》文档里已填写的唯一实质内容：\n\n26 赛季英雄机器人加入近战与远程的分类：\n· 近战英雄：血量更高、热量更多、热量冷却速率更快，但**无法进行部署**，弹速只有 12m/s。\n· 远程英雄：血量低（文档此处截断，未写完）。\n\n对机械设计的意义：\n1) 「不能部署」意味着近战英雄不需要设计可展开的驻锄/支腿机构，省掉一套机构与一个自由度；\n2) 弹速 12m/s 直接影响发射机构的摩擦轮线速度与弹道，进而影响云台俯仰范围与枪管长度；\n3) 热量更多 + 冷却更快 → 枪管附近热源更集中，但散热路径要求更高，弹仓/枪管的热变形要留余量；\n4) 血量差异会改变装甲板的布置策略（近战需要更强正面防护）。\n\n注意：该文档目前是**空骨架**，只有「兵种发展历程/兵种特色/兵种定位及战场表现」三级标题，英雄段只写了半句，步兵、哨兵段完全空白。这是本赛季周会文档的第一个欠账，负责人需在周五前补齐。\n\n文档 token：MQSDw0xWeivPFckqn6Mc6Agfnoz","s":"知识库·机械/第一次周会-英雄，步兵，哨兵机器人介绍（2026-10-28）","k":"auto","i":"K0375"},{"t":"队内有免费三轴 CNC 渠道：带螺纹的零件可直接发图纸","c":"加工工艺","b":"植正雄 10-28 在机械组提出：「有无 cnc 零件需要发的，三轴机床可以加工那种，可以有螺纹。我有免费渠道」。\n\n这条信息的实际价值：三轴加工能覆盖绝大多数 RM 板类件与回转体件（法兰、轴套、连接块、电机座），且能直接攻螺纹，正好补上「雕刻机只能切 2.5D 板、车件要外协」的缺口。\n\n使用要点（结合已知的铨洲规则推导，发图前自查）：\n1) 三轴 = 三个直线轴，**做不了**倒扣、侧向深腔、需要第四轴的圆周均布特征；模型必须能从 +Z 一次装夹加工到位，或翻转后二次装夹
