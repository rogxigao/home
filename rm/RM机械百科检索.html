；\n2) 有螺纹的孔按底孔画（M3→φ2.5、M4→φ3.3、M5→φ4.2），不要画实体再标注；\n3) 内直角必须给 R 角或避空，否则刀具清不到根；\n4) 深腔/薄壁要留加强筋或底面，否则振刀；\n5) 图纸用 step/stp，附材料、数量、表面处理、交期。\n\n流程建议：把模型 + 材料 + 数量整理好私发给植正雄，别在群里零散发问；免费渠道通常排期不自由，尽量一次凑齐一批再发。","s":"群聊·27机械组（植正雄，2026-10-28）","k":"auto","i":"K0376"},{"t":"雕刻机安全红线：新人前几次切板必须由在队队员指导","c":"加工工艺","b":"10-28 机械组内的明确要求，两条互相印证：\n· 梁雍淇：「xdx 刚开始切板子还是要叫老登看一下，不要自己一个人切，等熟练了再自己切哈」\n· 林创武：「新人前几次使用雕刻机，必须要在在队队员的指导下进行」\n· 植正雄补充：「是的，主要是安全问题。不要受伤了，受伤了谁都担不起责任」\n\n为什么这条必须写进制度：雕刻机是队内唯一「高速旋转刀具 + 人手近距离扶料 + 板材可能飞出」的设备，事故后果是断指级别。而新人最容易犯的三个错：不夹紧板材就开机、刀具没停就伸手、Z 轴零点设错直接啃台面。\n\n可执行的前三次流程（建议固化为 checklist）：\n1) 第 1 次：老队员全程操作，新人在旁看并复述每一步在干什么；\n2) 第 2 次：新人操作，老队员手放在急停上全程盯；\n3) 第 3 次：新人独立操作，老队员在 3 米内；\n4) 三次之后仍需在群里报备「今天切板」，且首次切新材料的参数必须先问。\n\n配套：开机前确认夹紧、对刀、刀具装夹长度、程序原点；切板时护目镜必戴，禁止戴手套靠近旋转刀具。","s":"群聊·27机械组（梁雍淇、林创武、植正雄，2026-10-28）","k":"auto","i":"K0377"},{"t":"耗材分区：负二楼那卷绿色 PLA 是芒果树专用，不许挪用","c":"材料板材","b":"10-28 机械组的一条耗材纪律：「负二的绿色 pla 有人知道放哪了吗」「是专门用来打芒果树的，不要随便乱用啊」。\n\n看起来是小事，实际是耗材管理的常见坑：\n1) 特定颜色/特定批次耗材被指定给某个项目（这里是芒果树道具），一旦被随手打零件用掉，项目就要重新采购并等货期；\n2) 颜色件往往有外观一致性要求，混批会导致同一道具出现色差；\n3) 特殊耗材（如特定颜色、玻纤/碳纤增强 PLA）参数不同，乱用还会堵喷嘴。\n\n建议做法：给指定用途的耗材卷贴标签（项目名 + 启用日期 + 负责人），在耗材架上分区摆放；打印机旁贴一张「本机允许使用的耗材」小卡。用完或需要借用，先在群里说一声。","s":"群聊·27机械组（梁雍淇，2026-10-28）","k":"auto","i":"K0378"},{"t":"英雄研发文档汇总：一条从气动发射器到技术传承的阅读线","c":"案例开源","b":"知识库新增了一个「英雄研发文档汇总」节点，作为英雄兵种的文档入口，其下已挂两篇：\n· 《24赛季气动发射器总结》——气动发射的整体方案与踩坑；\n· 《26赛季英雄技术传承文档》——上一代到这一代的交接。\n\n这个三层结构（汇总页 → 分赛季/分模块文档 → 具体结构设计）值得其他兵种照抄。它的价值不在于内容多，而在于给出了一条确定的阅读顺序：\n\n1) 先读「技术传承」——知道这一代继承了什么、放弃了什么、为什么；\n2) 再读「某一代的具体方案」（如 24 气动发射器）——看具体结构怎么落地；\n3) 最后看汇总页的缺口——哪些模块还没有文档，那就是本赛季要补的地方。\n\n当前状态：汇总页本身还是空壳（只有一个标题），说明这个体系刚建起来，正好是新人认领文档的机会。类似的汇总结构还有「平衡步兵研发文档汇总」（下挂 2026/2027 串联腿开发日志、行星减速箱研发日志）。\n\n建议：把「英雄研发文档汇总」和「平衡步兵研发文档汇总」当作两个模板，工程、飞镖、哨兵各建一个，避免文档散落在各人手里。","s":"知识库·机械/英雄研发文档汇总（2026-10-28）","k":"auto","i":"K0379"},{"t":"铨洲智造打样能力边界：最大 650×440×30，最小孔 φ1.2，精度 GB/T1804-M","c":"加工工艺","b":"《铨洲智造设计建议》V8.14（2026-08-14，12 页）给出的硬边界，是下单前必须对照的第一张表：\n\n· 精度：GB/T 1804-2000 **M 级**（中等精度，未注公差按此判）。\n· 材质：铝合金 6061、铝合金 7075、45# 钢；7075 与 45# 因材料特性只开放部分尺寸。\n· 尺寸范围：最小 **10×10×1**，最大 **650×440×30**（mm）。\n· 孔：直径 ≥ φ1.2mm；孔深 < 5 倍径；内腔宽度 ≥1.2mm。\n· 厚度：1–30mm。\n· 侧面：侧面高度 ≤200mm 支持非孔类特征；>200mm 只支持圆孔。\n· 图纸：仅收 step/stp，单文件 ≤7MB。\n\n两条容易被忽略的细则：\n1) 孔深超过 3 倍径就改用钻头加工，精度下降；3 倍径以内用铣刀，精度更高。\n2) 有精度要求的销钉孔/精孔，建模时孔径放大 **0.02–0.03mm**（要 φ3 的精孔就画 3.02–3.03）。\n\n对 RM 零件的影响：650×440 的上限意味着大板必须拆件或走激光切；30mm 厚度上限刚好卡住大部分电机座与法兰，超过就要改结构或换工艺。","s":"知识库·机械/机械组常识文档 内嵌附件《铨洲智造设计建议.pdf》（2026-08-14 版）","k":"auto","i":"K0380"},{"t":"螺纹孔画法全表：M2–M12 底孔尺寸 + 有效螺纹长度只有 5 倍径","c":"标准件紧固","b":"铨洲智造官方给的完整对照表（按底孔直径画孔，系统才认得出螺纹）：\n\n| 规格 | M2 | M2.5 | M3 | M4 | M5 | M6 | M8 | M10 | M12 |\n| 底孔 | φ1.6 | φ2.05 | φ2.5 | φ3.3 | φ4.2 | φ5 | φ6.8 | φ8.5 | φ10.2 |\n\n新增开放：UNC1/4-20 对应底孔 5.105，UNC3/8-16 对应 7.937。\n\n三条关键限制：\n1) **有效螺纹最长 5 倍径**：M3 最多攻到 15mm，M5 最多 25mm。设计时不要指望靠深螺纹提高连接强度，超过 5 倍径的部分是空的。\n2) **盲孔攻牙有 1 倍径左右的深度公差**（丝锥无法触底），所以实际有效牙深要往下打折。例：M3 模型孔深 7.5mm，实际有效螺纹只有 5–6mm，螺丝拧紧取 4–5mm。\n3) 最小牙深：M3 及以上 ≥ 公称直径 ×0.6；M3 以下 ≥ 公称直径 ×0.8（M3 底孔至少 1.8mm，M2 至少 1.6mm）。\n\n另外两条踩坑点：\n· 螺纹侧壁余量不足 1mm，攻牙后会破壁——薄壁件上的螺纹孔要么加厚局部、要么改用压铆螺母/拉铆螺母。\n· 外螺纹（车铣件）必须画退刀槽和 C 角，槽深与 C 角 ≥ 螺距 P，否则螺纹拧不到底。","s":"知识库·机械/机械组常识文档 内嵌附件《铨洲智造设计建议.pdf》（2026-08-14 版）","k":"auto","i":"K0381"},{"t":"CNC 打样必 NG 的五类结构：双面凸台、内凹外形、孔内倒角/环槽、薄壁悬空、非标厚度薄板","c":"图纸规范","b":"官方列出的「会被系统判 NG 或加工不完全」的结构清单，建模阶段就该规避：\n\n1) **双面凸台结构**——模型需要至少有一面最大外形落在零件 Z 轴最高值上；双面凸台的最大外形不在最高值上，上传即 NG。\n2) **外形有内凹区域**——系统判定刀具进不去，生成不了刀路；只能加大槽宽重传。\n3) **孔内倒角 / 孔底圆弧 / 环槽、T 槽**——暂不支持，会 NG 或加工不完全。\n4) **薄壁与内部悬空细长结构**——刚性不足会振刀，表现为振刀纹、倒角不均、过切漏切。不可避免时至少留 0.5mm 厚底面或加加强筋（筋越密越刚）。\n5) **非标准厚度的双面特征 / 薄板大件**——建议直接按材料标准厚度设计；10mm 以下薄板大件不能做非标准厚度，厚度 <4mm 不允许大范围切除平面。非标厚度下，反面只允许圆形沉头孔台阶。\n\n还有几条「反直觉」的：\n· **不要画倒角**：默认 C0.5 以下系统会自动按 C0.1–0.5 加工，双面都超 C0.5 可能 NG。\n· **R 角只支持单面**：双面都有 R 角会漏切或 NG。\n· **不建议底部倒角**：会残留多层台阶或 NG；底部 R 角需 > R2。\n· **沉头孔斜面不要画到底**：会仿真出错，且降低锁紧负载，底部要留底孔。\n· **曲面只支持单面**（球刀最小 D4），双面曲面不支持。\n· 侧面高度 >200mm 只支持圆孔；打侧孔必须有平面作支撑面，不能是曲面/斜面。\n\n另：CNC 打样不含去应力时效处理，大尺寸薄板/高去除率件会因残余应力释放而变形——设计阶段就要规避「整块大厚度去除」。","s":"知识库·机械/机械组常识文档 内嵌附件《铨洲智造设计建议.pdf》（2026-08-14 版）","k":"auto","i":"K0382"},{"t":"内尖角 R 角与避空规则：R = 深度/5，避空直径不能等于刀径","c":"图纸规范","b":"CNC 刀具是圆的，内尖角永远清不到根。平台的默认规则是「按深度 10mm 对应 R2」加工，即：\n\n**最小 R ≈ 加工深度 / 5**\n· 深度 20mm → 最小 R4（实际可能更小，取决于刀具）。\n\n设计建议：\n1) 需要 R 角就自己按需求建模，别指望加工方给；R 角越大，加工时间越短、成本越低（大 R 可以用大刀快速走）。\n2) 内直角有清根要求时，在 3D 里画出避空位；避空**不要做成正好半圆**，用约 1/3 圆弧；避空尺寸必须**大于**刀具半径，不能等于。例：深度 10mm 用 D4 刀，避空不能是 φ4（R2），建议 φ4.2（R2.1）。\n\n官方给的避空推荐序列：φ1.2（R0.6）、φ1.7（R0.85）、φ2.2（R1.1）、φ3.2（R1.6）、φ4.2（R2.1）。\n\n其他相关限制：\n· 加工最小刀具 D1，内槽 ≥1.25mm，槽深不超过刀具 5 倍径（2.5mm 宽槽用 D2 刀，深 ≤10mm）；刻字最小间隙 ≥1.25mm。\n· 腰孔：孔深不要超过腰孔宽度的 3 倍（排屑困难易断刀）；长宽比超 2:1 时可适当加深。\n· 盲孔：平底盲孔是螺旋铣，特殊尺寸会顶刀，底部可能留 <0.1mm 的中间凸起（仿真看不出来），设计时适当加深；盲孔攻牙时孔底壁厚不要薄于孔径/2，小孔不低于 1mm。","s":"知识库·机械/机械组常识文档 内嵌附件《铨洲智造设计建议.pdf》（2026-08-14 版）","k":"auto","i":"K0383"},{"t":"车铣打样与碳纤维加工：D18×L50 上限、碳板公差 ±0.2mm、严禁拼版","c":"加工工艺","b":"除铣削外，铨洲还有两条产线，选型时要分清：\n\n**车铣智能制造打样**\n· 精度：外圆 ±0.03（一般能控制到 ±0.01）。\n· 材质：303/304 不锈钢。\n· 尺寸：D18mm × L50mm 以下（用 φ17.9–18 的棒料，建议零件直径不超过 17.9）。\n· 只支持外圆加工，不支持端面、孔、车铣复合。\n· 最大长度 Lmax ≤ 3 倍径：φ10 的件最长 30mm。\n· 外螺纹按大径画外圆（M3 画 φ2.9、M5 画 φ4.9、M8 画 φ7.9），必须画退刀槽和 C 角，槽深/C 角 ≥ 螺距。\n\n**碳纤维加工**\n· 厚度按碳板标准厚度设计：1 / 2 / 3 / 5mm。\n· 碳板实际厚度公差 **±0.2mm**（3mm 板实际可能 2.8–3.2），有配合精度要求的地方必须提前确认。\n· 最大尺寸 300×300×5。\n· **严禁拼版**，拼版下单视为违规订单。\n· 不标准厚度会被飞面，飞面极易严重变形或崩边。\n\n**拼版（一般规则）**\n原则上不支持拼版。又细又高的零件禁止从底部连接拼板；异形或连接筋薄弱的禁止拼版；有侧孔的零件禁止拼版（侧孔工序会被拦截，发货时不加工并封禁模型）。用薄片/小凸台绕过系统限制属违规模型，会被封号。\n\n**表面处理**\n7075 不做处理后处理短期内会自然氧化（可用砂纸打磨，不影响性能）；45# 钢不处理会短期生锈——下单时建议勾选表面后处理。","s":"知识库·机械/机械组常识文档 内嵌附件《铨洲智造设计建议.pdf》（2026-08-14 版）","k":"auto","i":"K0384"},{"t":"3D打印耗材命名四段式：品牌前缀→基材→数字→后缀","c":"材料板材","b":"看到陌生型号先按四段切：①品牌前缀（e / Poly / Hyper / CR，各厂自家标记，可直接跳过）②基材代号（决定温度、烘干、腔体）③数字（分子结构/含量/硬度）④后缀（增强性能或外观填料）。例：eSUN ePLA-Matte、Polymaker PolyLite PETG、IPCON PPA-CF 都能拆。基材代号共 19 种：PLA、PETG、ABS、ASA、PA、PC、PP、PE、TPU、TPE、PVA、BVOH、HIPS、PMMA、PPS、PPA、PEEK、PEKK、PEI。拆完立刻能判断温度窗口、要不要硬化喷嘴、普通机能不能打。","s":"知识库·机械组常识文档 新增第3章「3D打印耗材的命名」","k":"auto","i":"K0385"},{"t":"19 种基材代号与打印窗口速查表","c":"材料板材","b":"PLA 200-215℃/床55-60/风扇100%（最易打、脆、耐热差）；PETG 230-245/床75-85/先烘干；ABS 240-260/床95-110/封闭+排味；ASA 同ABS但抗UV，户外件首选；PA 260-285/极吸湿必烘干；PC 270-300/全金属热端+封闭腔；PP、PE 难粘床需专用板或胶；TPU、TPE 220-235/必须直驱/15-30mm/s；PVA、BVOH 水溶性支撑料（单喷头只能手动换）；HIPS 柠檬烯可溶，可做支撑或做件；PMMA 亚克力透明偏脆可打磨抛光；PPS/PPA/PEEK/PEKK/PEI 工业高温料，需高温机+硬化喷嘴+退火。","s":"知识库·机械组常识文档 新增第3章「3D打印耗材的命名」","k":"auto","i":"K0386"},{"t":"耗材后缀三类：增强性能、外观填料、营销词","c":"材料板材","b":"性能类：-CF/-GF 碳纤玻纤增强→必换硬化钢喷嘴，建议0.6mm；-HT/-HDT 耐高温→配合退火更明显；-LW 轻量发泡→不能套普通PLA参数，要专门降流量；-FR/V0 阻燃UL94 V-0→等级以TDS为准；-ESD/Conductive 防静电导电→电子治具；Tough/Impact/Shield 增韧→卡扣与受冲击外壳。外观类：Silk/Matte 只是色母，按基材参数打；Marble/Stone/Concrete 石粉、Wood 木粉、Metal/Bronze/Copper/Steel 金属粉、Glow/GITD 夜光、Galaxy/Glitter/Sparkle 闪粉→全部要硬化喷嘴并降速；Trans/Clear 透明→少风扇、慢速、厚壁更透。营销类：+ / Pro / Plus / Max / Ultra / Meta / Hyper / X / HS / HF / Speed / Basic / Standard / Support，无统一配方，别当性能指标。","s":"知识库·机械组常识文档 新增第3章「3D打印耗材的命名」","k":"auto","i":"K0387"},{"t":"型号里数字段的三个含义：碳数、纤维含量、邵氏硬度","c":"材料板材","b":"PA6 单体6碳，刚性高但吸水最多；PA66 为己二胺6C+己二酸6C，熔点更高更耐热；PA12 单体12碳，吸水低尺寸稳但贵。CF15/GF25 是纤维质量百分比，越高越硬越脆越易堵。95A/98A/85A/64D 是邵氏硬度（跟在 TPU 后），数字越小越软越难打。2.0/Meta 只是厂商内部代次，性能不一定更强。","s":"知识库·机械组常识文档 新增第3章「3D打印耗材的命名」","k":"auto","i":"K0388"},{"t":"HDT 与 VST 别混用：一个是受力变形温度，一个是软化温度","c":"材料板材","b":"HDT（热变形温度/DTUL）：三点梁弯曲载荷下试样达到规定弯曲变形的温度，反映受力状态下的抗变形能力，适合比较结构件、承载件的耐热刚性，受模量/纤维增强/载荷条件影响大。VST（维卡软化温度）：探针局部压入达 1mm 深度的温度，反映塑料受热软化的起始特征，不能直接代表制品在实际结构受力下的使用温度。选材看承载变形用 HDT，看能否进烘箱/靠近热源用 VST。烘干温度必须满足：烘干温度 < 维卡软化温度 < 料盘耐温。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p4","k":"auto","i":"K0389"},{"t":"PLA 的真实定位：刚性高于 ABS，但冲击强度只有其 1/2~1/4","c":"材料板材","b":"队里长期以 PLA 为主，很多人误以为 ABS 才是强工程料。实测参数相反：PLA 的弯曲模量/强度（近似刚性、硬度）和拉伸强度都远高于 ABS；但越硬越脆，PLA 的冲击强度几乎只有 ABS 的一半甚至 1/4。PLA 可降解、耐久极差、耐湿中等偏上、不耐酸碱与有机溶剂、HDT 与维卡都很低。结论三条：不耐久且几乎没有化学素质；梆硬韧性差易碎；不耐高温。因此不适合长期使用且难更换的部件，不接触化学试剂，不靠近高温设备。价格 40-60 元，是 PETG 的 2-3 倍。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p2-p3","k":"auto","i":"K0390"},{"t":"缺口敏感性判断法：载荷向量与自由角角平分线夹角 <90° 就是危险缺口","c":"结构设计","b":"V 槽缺口会造成应力集中，硬而脆的材料（PLA 类）在缺口处抗冲击极差。简易判断：载荷向量与结构中相邻「自由角」的角平分线夹角是否小于 90°，小于 90° 即可疑缺口。自由角指一端或两端没有固定的角，每个固定点都会在一定程度上阻止载荷传递。因此用 PLA 设计时应尽量用倒角、圆角替代尖角过渡，避免出现 V 形过渡。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p3","k":"auto","i":"K0391"},{"t":"耗材选型速查：ABS/ASA 轻、PETG 便宜、TPU 吸水、PA 越纯应力越大","c":"材料板材","b":"ABS/ASA：非常轻、有抗冲击能力、耐温较高（赛事场景基本够）、机械强度在线，可做高温组件结构件，飞机类可试；PC 同属超轻。PETG：价格是 PLA 的一半，经费救赎之道；密度大，比 PLA/ABS 软但抗冲击好，石油基耐油良好；改性配方（如 PETG HF）会变硬变脆；更软的兄弟料 PCTG 耐化学性能在塑料里属顶级。TPU：常用邵氏硬度区分，层粘极好（加纤后大不如前）、耐磨，有 64D 做滚子替代的案例；极吸水——2025 珠海落地 2 天，80g 打印件增重 2g 以上。PA：强韧但纯 PA 巨难打，越纯内应力越恐怖，纯料需热处理且效果不佳，加纤或改性可优化应力。PPA CF/GF 属顶流；PET CF 是 PPA CF 的下位替代；POM 能打但巨难打。另：哑光 matte 类耗材一般会降低性能。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p4-p7","k":"auto","i":"K0392"},{"t":"打印前四步准备：保存、烘干、查缠料、处理料头","c":"加工工艺","b":"1 保存：密封袋+干燥剂，PLA 需避光；石灰与分子筛干燥剂都很好。2 烘干：必须满足 烘干温度 < 维卡软化温度 < 料盘耐温，时长多在 6h 以上，按商家推荐温度。3 打印前：查缠料——按住料卷一侧几根，另一只手把耗材扯出盘起，若整层没有出现被压住的耗材即无缠料，再复原；查是否进料；处理料头——拉丝形成的长圆锥状尾部一定剪掉，断料检测用微动开关，所以头部剪成斜口更容易塞入。4 进退料：白色特氟龙管两头一般有气动接头，按压顶部后方能解锁拔出；部分设备带卡簧片需先拔出再按；较软的 TPU 并非所有挤出机都适配，可拔管手动辅助，仍失败则调挤出机压力螺丝，再不行说明机器不合适。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p8","k":"auto","i":"K0393"},{"t":"耗材采购情报：艾普创顶流、天瑞性价比、Bing 混料、eSUN ABS 耐储存","c":"加工工艺","b":"原则：价格稍高的正常耗材带来的质量与成功率体验，远大于垃圾耗材省下的那几块钱。已知情报：艾普创 IPCON 顶流（参数最全，高性能工程料号称 A1 都能打）；天瑞中规中矩，ABSp 性价比到位但 PETG 较脆；Bing 混料大王/克苏鲁廉价，需要奇奇怪怪耗材时找它；FusFun、Kexcelled、Inslogic 有点奢侈但料盘/面板不错；魔创有肉色磨砂 PETG；易泰龙为廉价奇怪耗材；兰博有 K1C 都能打的 TPU；eSUN 的 ABS 相当耐储存，两年陈也很好用。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p8","k":"auto","i":"K0394"},{"t":"切片调参顺序与流量试件读数：c=a*(1+0.01b)","c":"加工工艺","b":"切片软件用开源原生 Orca（逆戟鲸）最好，各厂定制版会砍功能；用哪台打印机就用哪台的配置，避免兼容错误。调参顺序：流量校准→温度校准→流量校准→压力提前→流量校准，只有最前面这几步有明确先后，其余排后面（普通耗材没那么严格）。流量试件数字含义：粗/细调表示相对切片耗材设置的变化百分比——设耗材流量 a、试件数字 b，则试件实际流量 c=a*(1+0.01b)；YOLO 模式数字表示差值；经验主义直接打小方块估最快。判断试件质量：用刀片/指甲垂直于划线方向划过，声音最小的最好。压力提前用划线模式取粗细最一致的数；回抽选取不拉丝的最小值；误差测试用卡尺/螺旋测微器量标准长度模型，做数值补偿（绝对值）或百分比补偿（能适应整体缩放）。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p9-p12","k":"auto","i":"K0395"},{"t":"FDM 强度只抓两件事：连续性优先于接触面积","c":"加工工艺","b":"连续性＝打印机一次性从热端熔池挤出的一长条材料，连续代表最佳分子间粘合、最接近注塑（但缺高压条件）；xy 与 z 轴连续性差异是各向异性的主因，走线越丝滑连续性越好。接触面积＝线与线之间的所有接触，xy 平面首要受流量和 k 值决定（墙与墙、实心填充的间隙），其次层高——层高越高走线越圆、喷嘴下压压力越小，导致连续性与接触面积双输。但一味减小层高、减小喷嘴直径来增接触面积是错误选择，因为连续性优先级在其之上。0.4 喷嘴强度随层高变化的峰值约在 0.08-0.1mm，向两侧递减；同层高下 0.4 喷嘴在 0.2-0.8 流量区间较好水平。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p14-p15","k":"auto","i":"K0396"},{"t":"墙数经验值：外观件 3 层、上强度 4-6 层；全墙与 100% 线填充各有各向异性","c":"结构设计","b":"切片调强度主要靠壁厚和壁出现的位置，稀疏填充只服务于壁、为其提供抗压补充。经验值：一般外观件 3 层墙，稍上强度 4-6 层。更高强度两条路线：墙壁拉满，或 100% 线填充——两者力学表现和外观一致地各向异性：线与线在 xy 的粘合与 z 向并无区别，100% 同向线填充有明显各向异性，全墙则有放射状各向异性且容易留墙间空隙。类板形零件：若载荷高度贴合轮廓就选更多墙，否则适当墙+换向 100% 线。柔性零件的稀疏填充作用明显，起弹性作用。设计上要避免无效的大体积块/板：没什么强度但内部应力巨大，收缩甚至能掀起热床，所以 3D 打印同样需要镂空。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p16","k":"auto","i":"K0397"},{"t":"工程料调参：温度越准越好，冷却参数只能自己试","c":"加工工艺","b":"温度校准越准确越好，校准件别加支撑。冷却参数没有专门调试项，需自行不断改参数测试；商家给的是参考值，机器差异使其注定只是参考（例：infimech TX 所有风扇满速 13000rpm，几乎是市售冷却最暴力机型，常规冷却参数到它这要砍掉 1/3）。常规耗材（PLA、PETG HF）对打印温度和散热都不敏感，对温度塔打几组不同冷却参数、二分归中即可。高性能工程料（如艾普创 PPA CF）会挑战机器热性能极限，床温或仓内空气温度分布不均都会带来难以预料的小瑕疵。辅助风扇不只是强力冷却，低转速时还用于混合热床上部冷热空气。工程料易翘曲、应力大、难融合，不能无脑超强散热，但极高打印温度又要求好散热才能完成悬垂与搭桥。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p10","k":"auto","i":"K0398"},{"t":"振纹(VFA)的本质与皮带调节：靠声音记录好状态","c":"加工工艺","b":"振纹本质是驱动结构的物理震动：一部分来自步进电机步进特性、同步带带齿特性，一部分来自打印速度方向突变，最终呈现为 xy 向波纹与 z 向层纹。调节主要靠皮带松紧，各机型方式不同、都很难量化；试图量化或自动化的设备往往并不好用。常见检验法「按压后形变 3-4mm」其实是标准的同步带张紧检验方法，但不完全适合 3D 打印机（按压力度很难控制），仍需多次尝试。调好后建议以震动频率记录这个状态——可用乐理软件监测弹拨同步带发出的声音。VFA 测试本体的作用是寻找振纹最小的打印速度与角度。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p12-p13","k":"auto","i":"K0399"},{"t":"热床「自动电子调平」不等于平，物理调平才是真平","c":"加工工艺","b":"机器精度上限取决于基础结构与所有运动副（机架、热床、xyz 轴）。热床主要是平整度，「自动调平」并不算值得一提的宣传点——自测设备热床平整度 ±0.06mm（偏差主要在边缘），没有自动调平也完全可以正常打印。要区分两类：自动电子调平只是把探测到的平整度写进 Gcode，让工具头随热床起伏，能打印但零件实际是歪七扭八的；自动物理调平是热床有不止一个驱动电机，可按探测数据物理改变热床位置。市面上所有单 Z 机型（Z 轴只有一个驱动电机，把同步带联动 3 根丝杆宣传成 3Z 属于混淆视听）都做不了物理调平。手动物理调平也好：连接件处做可调高度，或对热床基面补平。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p16","k":"auto","i":"K0400"},{"t":"打印精度：Z 看层高与层纹位置，XY 看速度加速度，优先用 STEP","c":"加工工艺","b":"Z 向精度即层高，判断层高是否够细可看斜面/圆面上红色顶面与蓝色悬垂的占比，占比越大精细度越低；层纹是打印件上最不精细的部分，通过倾斜模型改变层纹位置可获得更好表现；该方向最大困扰是冷却纹（冷却应力导致已打印面不再平整）。XY 向主要受打印速度和加速度影响，通常越平滑越好，速度存在一个中低速不合适区间。商品页一般标 0.1mm 极限精度，实际调教完善后 0.02mm 也不成问题。新切片软件支持 STEP 格式，精度高于 STL，优先用 STEP。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p17","k":"auto","i":"K0401"},{"t":"3D 打印的不可能三角：精度、强度、速度","c":"基础理论","b":"精度、强度、速度三者是 3D 打印的核心指标，永远存在权衡关系，不可能同时最大化。设备性能或耗材性能的突破只是移动这个三角的边界。做方案时先明确该零件最看重哪一维，再决定层高、墙数、填充与速度的取舍：要强度就牺牲时间与表面，要表面就要加时间。这条应作为零件方案评审时的第一句判断。","s":"机械百科·《3D打印食谱V4.3》（教程文档，2026-10-30 归档） p13","k":"auto","i":"K0402"},{"t":"铝方管惯性矩实测对比：换大规格比加壁厚划算得多","c":"材料板材","b":"三组实测（惯性矩 I / 截面积）：40×40×2 → I=73365mm⁴、A=304mm²（基准 1.00 / 1.00）；40×40×3 → I=101972mm⁴、A=444mm²（I×1.39、重量×1.46）；50×50×2 → I=147712mm⁴、A=384mm²（I×2.01、重量×1.26）。结论：壁厚 2→3，重量涨 46% 只换来 I 涨 39%；换到 50×50×2，重量只涨 26% 却换来 I 涨 101%。以受弯为主的梁、框架，优先换更大外边长而不是加壁厚。","s":"知识库·机械组常识文档 内嵌附件 table_20260914.csv（已归档为 机械组零部件质量与螺纹孔参数表.csv）","k":"auto","i":"K0403"},{"t":"牙嵌式离合器齿形角度实践：35°/37° 间隙过大，改 36.2°/35.8°","c":"传动机构","b":"牙嵌式离合器我们只用它的「牙」来传动，不用离合功能（离合用于汽车换挡）。华工开源用第一种牙型，用于小腿链轮与小腿连杆之间的传动。按机械设计手册第一种尺寸画时发现：牙的角度 35° 与旁边空出的角度 37° 相差太大、间隙太大，实际工况可能发生撞击，且加工误差可能导致五个齿只有一两个真正面接触。把这两个角度改为 36.2° 与 35.8° 后，观感与间隙都明显改善（原间隙约 0.3）。注意华工开源里两个角度都是 60°，完全没有间隙，属于障眼法、不可能装得上。结论：不必执着于奇数齿，重点是把齿侧间隙留到既装得上又不撞击。","s":"知识库·DRAWING REVIEW MEETING 内嵌《机械学习笔记》（2026.9.1-9.5） 2026.9.2","k":"auto","i":"K0404"},{"t":"链轮链条选型步骤与端面画法（老式 vs 新式）","c":"图纸规范","b":"链轮链条选型要掌握：链号及链条各尺寸的意义、链条参数示意图；链轮端面画法有老式与新式两套（新式为现在最常用）、另有轴面画法。值得反思：上交开源既没用这些标准画法也没用标准链条，原因值得追究（成本、货期还是拆装便利）。链轮加强筋的设计方法与碳板受力方向强相关——设计前必须先确认受力方向。","s":"知识库·DRAWING REVIEW MEETING 内嵌《机械学习笔记》（2026.9.1-9.5） 2026.9.1","k":"auto","i":"K0405"},{"t":"花键：矩形 vs 渐开线，圆弧相切型资料稀缺","c":"传动机构","b":"花键主要有矩形花键与渐开线花键两类，具体区别见 2027 赛季串联腿开发日志。圆弧相切型花键公开资料极少，只找到一篇收费专利，暂未弄通，等正式需要画时再补。螺纹连接优先选第一系列直径，具体查机械设计手册。当前处于「有钱时代」可大范围用 CNC 加工件；山穷水尽时可考虑东莞理工开源，或买自行车配件成品件替代。","s":"知识库·DRAWING REVIEW MEETING 内嵌《机械学习笔记》（2026.9.1-9.5） 2026.9.3-9.5","k":"auto","i":"K0406"},{"t":"英雄发射机构流派与准度梯队（2021-2025 各校方案盘点）","c":"案例开源","b":"2021 上交下供弹英雄标志英雄进入下供弹时代，切供拨盘、中供拨盘相继出现，云台走轻量化机动化，但远程吊射准度始终没有质变。2023 首次突破，按原理分三类：摩擦（2/3/4 摩擦轮，2+3 与六摩擦当时无人做）、气动（桂电、华农为代表）、弹射（上交复合弓、深大皮筋）。准度梯队：第一梯队上交与深大弹射（深大能泉水精准吊射但炮车泛用性差、机动差；上交弹射成熟但云台过大过重、可靠性与射频较低）；第二梯队华农气动、北科山科四摩擦（弹速波动小）、南科五邑三摩擦（左右散布小）——气动精度高于摩擦但无质的差距；第三梯队哈工程与东大四摩擦（左右散布过大拖累弹速波动）、大交大号平面摩擦、华工弧形摩擦，弹道基本靠蒙但两摩擦轻量、云台惯量小利于近战。华农 23 气动由梁柏林在桂电 2022 方案上迭代：换整套气路、优化枪管、独立设计沿用至 2025 的六齿拨盘，国赛全国前三准度。2024 出现六摩擦：西交双排三摩擦（瞄准后散布不超过大装甲）、西电三排双摩擦（超高命中率泉水吊射）。2025 规则放开吊射距离（己方半场大部分区域可开部署，难度由 23m 变为 15-25m 均可吊射），双极摩擦轮成熟，深大/广工/西交/五邑六摩擦英雄涌现，广工单局大弹丸命中率 80%+；南航正交四摩擦可上 43° 坡、太工双极四摩擦；我方五摩擦吊射方案（林涵、谷源忠）为联盟前五英雄。","s":"知识库·第一次周会-英雄、步兵、哨兵机器人介绍（2026-10-28 新建文档）","k":"auto","i":"K0407"},{"t":"哨兵四代演进：随机攻击装置→基地机器人→轨道哨兵→全自动","c":"案例开源","b":"①自动随机攻击装置：固定不可移动、自动锁定路过的敌方机器人攻击，相当于「减速带」。②基地机器人：基地血条绑定在这台机器人血条上，画地为牢、身上背着基地。③轨道哨兵：从基地剥离，专门做类似桥洞悬空的轨道，哨兵在轨道上移动并攻击附近敌方单元。④全自动哨兵：以自动步兵身份出现，脱离轨道束缚，底盘选择随之多样——麦轮、轮腿、全向轮、舵轮哨兵层出不穷。23、24 赛季规则要求装两个测速模块，因此出现双头哨兵、双管哨兵；25 赛季改回单测速模块，真正意义上的「双倍火力」时代结束。","s":"知识库·第一次周会-英雄、步兵、哨兵机器人介绍（2026-10-28 新建文档）","k":"auto","i":"K0408"},{"t":"兵种组轮值技术分享会：每兵种至少一次、报名周次先到先得","c":"队伍制度","b":"两周后的技术分享会以兵种组为单位，每个兵种自行安排人做至少一次周会汇报，内容为介绍本兵种某一结构的设计方法和思路，目的是打破技术壁垒、让各兵种组互相学习、让新人理解各兵种功能与技术。周次由各组报名、先到先得，内容自定可后续补充（报名表在知识库 wiki）。每周与会人员会根据分享内容提出不同要求，务必看每周周会通知里的人员要求。第七次机械组组会：11 月 1 日（周日）上午 10 点，土槽楼实验室，要点为英雄/步兵/哨兵兵种介绍、场地道具任务介绍与答疑、周报与考勤与值日卫生与物资申报制度强调、土槽实验室物资管理及新到光固化设备安置。","s":"群聊·27机械组通知群 林创武 2026-10-29 22:14","k":"auto","i":"K0409"},{"t":"顽固油污清洗：洗洁精洗不掉的用它，一次牙膏量即可","c":"经验避坑","b":"一般洗洁精洗不掉的油污，可用群内照片那款清洁剂处理，效果很好；但一次只用一点点，牙膏那么大的量就够。此类浓缩清洁膏对油脂皂化能力强，用量过大会残留且伤手，宁少涂多擦。适合处理导轨、丝杆、铝型材沟槽里积的老油泥。","s":"群聊·27机械组 植正雄 2026-10-29 13:41","k":"auto","i":"K0410"},{"t":"墨现科技 RM 柔性压力传感器 + PCBA：能量机关传感模组采购线索","c":"其他","b":"27炒鸡大符群分享的采购线索：墨现科技出 RM 柔性压力传感器 + PCBA 套装，即 RoboMaster 大能量机关用的激光传感器模组形态，可用于能量机关（大符）的击打/触发检测。群里同时在催图纸（「图纸我还在问」），说明该模组的具体安装尺寸与接口定义尚未拿到——采购前必须先向厂家索取图纸与通信协议，不能凭商品页下单。","s":"群聊·27炒鸡大符 郭卓鑫 2026-10-29 08:32","k":"auto","i":"K0411"},{"t":"场地道具新人任务六条硬要求（第一次考核口径）","c":"队伍制度","b":"王奇英在「27炒鸡大符」群发布的场地道具新人规则，共六条，直接决定新人去留：①每人必须出一份对应场地道具的图纸和方案文档；②每周把图纸发到对应场地道具飞书群审核，第一周没图纸也要发文档充当进度，不能空着；③画图或选型中遇到的问题要发群里一起解决，鼓励暴露问题而不是自己憋；④不能以画场地道具为由长期不来实验室，实践技能培养同样计入；⑤每周都要有进度，严禁摆烂几周最后一-周赶；⑥考勤要求加实践任务作为新人第一次考核，纳入考量，不合预期会严肃规劝退队。要点：考核不是只看最后那张图，而是看每周的持续产出与出勤。","s":"群聊·27炒鸡大符 / 云文档《RM2027能量机关第一次周会进度》","k":"auto","i":"K0412"},{"t":"场地道具周会进度文档：四段式固定结构，每周新建一份不换标题","c":"队伍制度","b":"大符组的进度文档有固定写法，每人一节，四个小标题一个都不能少：整体设计思路 / 本周进度 / 本周遇到的问题 / 预计下周安排。负责人的要求是每周新建一个文档、标题只把「第一次」顺延成「第二次」，正文结构不动，这样翻历史就能看出一个人每周的推进曲线。文档建在飞书云文档的场地道具目录下（不是知识库空间）。提交节奏是周会前一天发群里，因为「明天要讲的」。即使当周没出图，也要写设计思路把文档填出来，不允许空白交差。","s":"群聊·27炒鸡大符（王奇英、植正雄）","k":"auto","i":"K0413"},{"t":"机械组新人必读四件套 PDF：结构件设计流程 / 设计思维逻辑 / 轻量化指南 / 传动机构简述","c":"基础理论","b":"林创武 2026-10-30 在「27机械组」发的四份新人入门 PDF，原话是「新人可以先看这些」，顺序也有讲究：先《结构件设计流程经验总结》建立从需求到出图的流程骨架，再《结构设计的思维逻辑》学怎么想（约束怎么排优先级），然后《轻量化设计指南》学怎么减重而不减刚度，最后《传动机构简述》补传动选型。四份文件均已归档在本库 机械百科_数据\\设计资料\\ 下（同名）。建议读法：流程篇通读一遍即可，思维逻辑与轻量化要边画边回看，传动篇等确定方案后再精读。","s":"群聊·27机械组（林创武，2026-10-30）","k":"auto","i":"K0414"},{"t":"三本核心教材与 Mini-Cheetah 资料包已离线存档（此前只存在于飞书内嵌附件）","c":"基础理论","b":"《海纳百川学无止境-资料汇总》文档里挂了二十余份内嵌附件，此前只有 9 份设计类 PDF 被下载，教材与开源包一直没落盘。本轮落盘三份：①《机械设计》第十版（濮良贵、陈国定、吴立言，77MB）——螺栓组受力、轴承寿命、轴强度校核的标准算法，队内「18 项校核清单」基本都能在这里找到出处；②《机器人学导论》原书第 4 版（49MB）——DH 参数、雅可比、动力学，轮腿与平衡步兵建模用；③MIT Mini-Cheetah 资料包（33MB，含论文与开源文件）。另《机械原理》第九版（孙桓、葛文杰）——机构自由度、连杆凸轮与轮系，画滑槽与连杆机构时的判据来源——三次下载均报 stream error，暂只能在飞书原文在线看。存放于 机械百科_数据\\设计资料\\。","s":"飞书知识库·机械·海纳百川学无止境-资料汇总","k":"auto","i":"K0415"},{"t":"飞书内嵌开源 rar 包普遍下载失败：stream error，只能在飞书内在线看","c":"经验避坑","b":"《海纳百川资料汇总》里七套队伍开源包（上交 2025 串联腿、上交 2023 平衡步兵、华工华南虎 2025 轮足、西工大 WMJ 2026 工程、上交云汉交龙 2024 与 2025 工程、中石油华东 RPS 串联腿）用 drive +preview --type source_file 下载，全部返回 cannot create file: stream error: stream ID 3; INTERNAL_ERROR，与本机路径和文件名中英文无关（换 ASCII 名同样失败），判断是该批附件在服务端存储异常。同批的《机械设计》77MB、《机器人学导论》49MB、Mini-Cheetah 32MB 都能正常下，说明不是体积或网络问题。结论：这批开源包要看去飞书原文档在线预览，别指望落盘；下次巡检别在这上面反复重试。","s":"本轮巡检实测（2026-11-01）","k":"auto","i":"K0416"},{"t":"队内打印与切板的安全与设备口径：大件走 H2D 或 H2S，切板必须有人陪","c":"加工工艺","b":"两条来自 27机械组派活时的口径：①体积大的打印件指定用 Bambu Lab H2D 或 H2S（负二层机型），普通 A1/P1 系列幅面与热床撑不住大件，翘边和分层风险高；②切板（雕刻机或锯切）新人上手时，王奇英要求「切板子的时候确保有学长学姐在身边注意安全」，属硬性安全规定而非建议。另外负二层机位紧张时会排队，接打印任务前先问有没有空机，比跑到现场再等省时间。","s":"群聊·27机械组（林填、王奇英、徐奕昊，2026-10-31）","k":"auto","i":"K0417"},{"t":"官方 RMUC2027 场地图纸与可移动道具 STEP 全套开源（依据规则手册 V1.0.0）","c":"赛事场地","b":"高校赛务发布，含四份 STEP：RMUC2027 全场 653MB、RMUL 3V3 1.99MB、RMUL 1V1 1.11MB、能量单元 3.07MB，按 RMUC&RMUL 2027 规则手册 V1.0.0 建模，覆盖高地、中央控制区、隧道、工作台、围挡等结构。可借鉴：用官方几何做道具干涉校核、越障行程与抬升高度估算，能量单元模型可直接用于夹爪包络与抓取姿态验证。官方注明若与手册标注或现场有出入，以手册与现场为准，关键尺寸仍须回查手册条款。已下载存档至 机械百科_数据/外部资料/2026-11/（RMUC）与 2026-10/（RMUL 三份）。","s":"官方·BBS 1970956（RoboMaster 高校赛务）","k":"auto","i":"K0418"},{"t":"RMUC2027 完整形态考核细则：机械类必做项清单（模块安装区、接线拓扑图）","c":"图纸规范","b":"技术评审细则分「机器人制作规范展示」与「机器人功能展示」两部分，制作规范必做项有缺失则该兵种功能展示全部不得分。机械相关必做：各兵种测速/定位/灯条/荧光充能模块及其安装支架的安装区域须按《RMU 2027 机器人制作规范手册》正确安装；须提交电源管理模块底盘接线拓扑图；重装机器人须提交模块化 42mm 发射机构电气隔离原理图；飞镖发射架与待发射飞镖的地面正投影不得超出放置平面接触部分最外沿。可借鉴：把这四项做成出图阶段的自检清单，避免评审现场才发现支架位置或走线不合规。","s":"官方·规则中心 RMUC 2027 完整形态考核细则（节点 1971755）","k":"auto","i":"K0419"},{"t":"RMUC2027 完整形态考核：五类地形增益的通过时间硬指标（3/5/20 秒）","c":"赛事场地","b":"重装、步兵、哨兵均需按规则手册自建地形：起伏路段 20 秒内通过；穿越隧道、跨越隧道、公路增益各 3 秒内触发；高地 5 秒内触发；步兵制高点增益 7 秒内触发；每项各重复 3 次。若已成功通过穿越隧道/跨越隧道/公路/高地四项中任意一项，起伏路段项免拍直接满分。重装机器人分两种负载计分：携带至少 1 个能量单元通过得 50%，装配 42mm 模块化发射机构后通过得另 50%，两者同时携带一次通过即满分。可借鉴：把 3/5/20 秒倒推为底盘越障速度与机构行程预算，直接写进方案评审指标。","s":"官方·规则中心 RMUC 2027 完整形态考核细则（节点 1971755）","k":"auto","i":"K0420"},{"t":"RMUL2027 完整形态考核：200mm 台阶与 250mm 隧道连续三次通过","c":"赛事场地","b":"RMUL 3V3 与步兵对抗的功能展示选做项：连续 3 次登上并跳下高度差 200mm 的台阶、连续 3 次穿过高度 250mm 的隧道，各 5 分；重型与步兵同口径，哨兵另有自动导航越障项。3V3 转向考核为六个点位横距 6m、纵距 1m 的绕障路线，命中率考核用 3m 处 >0.4 转/秒 旋转小装甲，步兵 15 发、重装 10 发、哨兵 50 发、步兵对抗 50 发。可借鉴：台阶 200mm 与隧道 250mm 就是底盘最小离地与云台最低高度的设计红线。","s":"官方·规则中心 RMUL 2027 完整形态考核细则（节点 1970940）","k":"auto","i":"K0421"},{"t":"RMUC2027 重装机器人：42mm 模块化发射机构自主拾取装配考核","c":"结构设计","b":"考核要求队伍自建工作台（长 75cm、宽 45cm、高 40cm，台面水平稳固，拾取安装中不得移动翻倒），把模块化 42mm 发射机构放在台面，机器人须自行完成拾取与安装，全程不得人工扶持或其它干预，装配过程必须一镜到底不可剪辑。后续接直角转弯/直线加减速/掉头三场景（各 5m/5m/2m）计时，以及 5m 打靶 10 发、5m 移动靶 10 发、20m 模拟击打基地 10 发。可借鉴：这套「公母头对接 + 自锁 + 到位检测」的机械接口是本赛季重装的核心难点，工作台 40cm 高度决定了抓取姿态与臂展下限。","s":"官方·规则中心 RMUC 2027 完整形态考核细则（节点 1971755）","k":"auto","i":"K0422"},{"t":"RMUC2027 能量单元抓取装配考核：资源站 2 米线、限时 5 分钟、核心位姿分档","c":"赛事场地","b":"重装机器人必做 50 分项：队伍自建资源站与科技核心（不得临时手持），两者相距 2 米；机器人初始置于资源站 2 米外、任何部位投影不得越线，自行移动抓取能量单元并按规则手册要求在科技核心处模拟装配。科技核心位姿须按《附表1 技术评审科技核心位姿点位表》的各难度等级调整，评分看成功装配数量、装配难度、单件耗时与道具装配规范性。附表 1 页面标注「后续更新」，届时需回查。可借鉴：2 米线与 5 分钟时限直接约束底盘定位精度、夹爪开合行程与容错倒角设计。","s":"官方·规则中心 RMUC 2027 完整形态考核细则（节点 1971755）","k":"auto","i":"K0423"},{"t":"步兵/哨兵模拟击打大小能量机关：10 分选做项、只计一次且默认按步兵计","c":"赛事场地","b":"RMUC 2027 技术评审中步兵与哨兵各有「模拟击打大、小能量机关，展示激活能量机关能力」的 10 分选做项。关键规则：该项目仅需完成一次，队伍可自选步兵或哨兵展示，不重复得分；若两台都提交，只按步兵计分、哨兵不计。可借鉴：把能量机关打击能力集中投在一台车上（通常是命中率更高的步兵），另一台不必为此配重或改云台；也说明官方仍把大符命中视为可量化考核项，值得单独做靶场复现。","s":"官方·规则中心 RMUC 2027 完整形态考核细则（节点 1971755）","k":"auto","i":"K0424"},{"t":"RMUC2027 射击精度靶场搭建参数：5m/20m 靶位、80×80cm 遮挡、装甲间距 60cm","c":"赛事场地","b":"细则给出可直接复刻的靶场几何：5 米外圆靶打 10 发，靶纸须完整平贴、背板坚硬到按压无明显凹陷；移动靶为 A/B 两条相距 5m 的平行线，小装甲目标沿 B 线往复（平均速度 >1m/s、自转 >0.4 转/秒），A、B 线间设 2 块 ≥80×80cm 不透明遮挡，距 B 线 40cm 且外沿与往复区间两端对齐；小装甲四块受击面的相对基准平面间距不得小于 60cm（步兵/哨兵为 50cm）；20m 外模拟基地顶部装甲。可借鉴：这套参数能当自建靶场的施工图，也解释了为什么近距遮挡下的命中率才是真实水平。","s":"官方·规则中心 RMUC 2027 完整形态考核细则（节点 1971755）","k":"auto","i":"K0425"},{"t":"翻倒自救考核：完全倒置 180° 后须自行恢复正常姿态","c":"结构设计","b":"RMUC 2027 技术评审中重装（5 分）、步兵（5 分）、哨兵（5 分）均设「机器人翻倒自救」选做项：把机器人倒置，即机体完全翻转、正常状态下的顶部结构朝向地面、约 180° 颠倒的极端异常状态，须自行恢复正常，重复 3 次。可借鉴：这是对重心高度、自救臂/翻板行程与电机堵转余量的直接检验；设计时应在 SolidWorks 里先做倒置姿态的质心投影与支点计算，再决定自救机构是翻板、摆臂还是靠云台反冲，别等装配完再试。","s":"官方·规则中心 RMUC 2027 完整形态考核细则（节点 1971755）","k":"auto","i":"K0426"},{"t":"沈阳理工 Ambition「环太平洋」自定义控制器：偏置 Roll 轴省力构型 STEP 开源","c":"结构设计","b":"26 赛季北部赛区方案，起因是经费只够两个 6020 加四个 3508 屁股、无力做完整配重。构型核心：把 Roll 轴电机偏置出来，让操作手的手能从结构里穿过去发力，后部 3508 的重量尽量交给 J3 的 6020 与小臂承担，而不是压在手和末端。代价是放弃一比一映射，只能做前五轴联动，末端 Pitch 靠手腕自由度、活动范围有限，且 Roll 联动的手感差。可借鉴：预算与电机不够时的省力折中思路，以及作者踩过的坑——画图前必须先算力矩，他们当时算完发现不够又补了机械配重。附件为总装 STEP（51MB），已存档。","s":"BBS 1970331（沈阳理工大学 Ambition 战队）","k":"auto","i":"K0427"},{"i":"K0428","t":"机加工安全：旋转设备一律不戴手套","c":"加工工艺","b":"林创武 2026-11-01 强调（附现场图）：使用任何旋转的铣床、车床、切割机、手持切割机，都不要戴手套，尤其是劳保手套。手被卷入时手套会成为牵引绳。\n\n另附一条血的教训视频，讲角磨机装木工锯片导致的伤害——角磨机转速远高于木工锯的设计转速，锯片会碎裂飞散。\n\n补充：不要用手持角磨机切木板。\n\n原文视频：https://b23.tv/4udIKpA","s":"群聊·27机械组 林创武 2026-11-01","k":"auto"},{"i":"K0429","t":"斜切锯（铡锯）安全使用方法","c":"加工工艺","b":"植正雄 2026-11-02 分享的木工教学视频，讲斜切锯/铡锯的安全操作：手的位置、压料方式、切割行程与护罩使用。队里做木工道具（靶车、箱体）时会用到。\n\n原文视频：https://www.bilibili.com/video/BV1uL4y187mf/","s":"群聊·27机械组 植正雄 2026-11-02","k":"auto"},{"i":"K0430","t":"保密规定：飞书内资料禁止外传（违者退队）","c":"队伍制度","b":"谭嘉豪 2026-11-01 @全体：飞书内的任何文件，如共享文件夹、知识库，禁止以任何形式外传。如有发现直接退队处理。\n\n含义：队内图纸、方案、BOM、评审记录都属于内部资料。做个人备份可以，但不要上传到公开仓库、不要在外部群或论坛转发。引用外部开源资料（别的战队）时注明出处，那是另一回事。","s":"群聊·2027赛季大群 谭嘉豪 2026-11-01","k":"auto"},{"i":"K0431","t":"深大大符图纸已失传，现用三年前版本","c":"赛事场地","b":"王奇英 2026-11-01 打听深圳大学的大符图纸，回复是「已经失传了」，他们现在用的是 3 年前师兄做的版本。\n\n两个含义：\n1. 大符这类场地道具的图纸在各队普遍没有沉淀，人员一换就断档——这正是队里《场地道具开发维护文档》第 10 节空着的原因。\n2. 你这次做完的图纸如果归档规范、有装配说明，价值比想象中大。","s":"群聊·27炒鸡大符 王奇英 2026-11-01","k":"auto"},{"i":"K0432","t":"靶车（新场地道具）：电控升降 25–30cm","c":"赛事场地","b":"王家祚 2026-11-01 在群里发的《靶车进度文档》，是今年新增的场地道具。\n\n需求：在去年基础上做两项改进——\n1. 主动电控升降，升降幅度 25–30cm\n2. 提升装甲板稳定性\n\n设计构思：参考学长小车的 X 型升降结构，放在滑环电机所在板下方的箱体中，顺带优化箱内空间；装甲板用等距限位 + 螺丝水平固定。难点在于高度抬升时限位板也要跟着装甲板一起动，作者提出两种方案（联动抬升板 / 等距孔+长螺丝卡位）。\n\n本地路径：E:/workbuddy/robomaster/03_群聊与任务记录/靶车进度文档_20261101.docx","s":"群文件·靶车进度文档 王家祚 2026-11-01","k":"auto"},{"i":"K0433","t":"周会文档制度：每周新建、标题不变、逐周顺延","c":"队伍制度","b":"王奇英 2026-11-01 定的规矩：每周新建一个文档，标题大体不改，第一周、第二周这样顺下去，保证每周有进度可查。\n\n配合命名规范一起用（《重生之我进入Taurus机械组》里的版本号规则），别出现「最终版」「真的最终版」。","s":"群聊·27炒鸡大符 王奇英 2026-11-01","k":"auto"},{"i":"K0434","t":"大符方案的第一原则：先问「最本质目标」，别把需求直接翻译成机构","c":"结构设计","b":"11-02 晚大符群的讨论是从「做个升降机构」开始的，直到植正雄连问三句才拐回来：「最本质目标是什么」→「是不是只是为了好带」→「如果是，那么有很多方案：快拆、升降都可以」。\n\n这个提问方式值得抄下来当模板。伍津乐的真实需求是「外出比赛找个东西垫高大符，又方便搬运」，林创武的约束是「中心离地 2m6」。需求一旦被翻译成「升降机构」，后面所有讨论（丝杆还是同步带、自锁怎么做、导向柱多长）都变成替手段服务，而手段本身没被检验过。\n\n植正雄的补充是经验判据：「我个人经验。升降机构太复杂，所以不好维护」。也就是说，在「好带」这个目标下，升降是成本最高的一条路——不是不能做，而是不该作为默认解。\n\n可复用动作：接到「做一个 X 机构」的需求时，先反问「要解决哪个具体动作/痛点」，把目标写在方案第一行，再列 2–3 条互斥路线做比较，而不是直接深化第一条想到的路。","s":"群聊·27炒鸡大符 2026-11-02（植正雄、林创武）","k":"auto"},{"i":"K0435","t":"大符运输的三条路线：缩小支架垫桌 / 自研升降 / 拆五片快拆","c":"结构设计","b":"同一目标（把 2600mm 的大符弄上车、过门洞）下的三条互斥路线，群里都摆到了桌面上：\n\n【A 缩小支架 + 标准折叠桌】林创武：「有一定升降就行了」「然后买一张比如 1m 高的标准尺寸的桌子，配合上能达到那个高度就行」，附加要求是轻便、能折叠、方便带去备场。植正雄进一步说「大幅支架部分搞小一些就好了，然后放在买的桌子上，这样高度就足够」「搬运的话也可以分开搬运」——支架与桌子分离运输，到场合体。这是目前倾向的路线，因为把「高度」这件难事外包给了一件几十块钱的成品。\n\n【B 整机升降】高荣信自评方案「挺简单」，答应做一版给群里看。反方意见是复杂、难维护。旁证：深大买了成品升降机，但那是采购不是自研。\n\n【C 拆五片叶片现场装】林创武：「能不能五个扇叶都分开，到那里再装」。高荣信原本想用合页做折叠，自评「强度应该很低」，转向拆片。\n\n取舍要点：A 牺牲外观一致性（桌腿露在外面）；B 牺牲维护性；C 牺牲现场装配工时与重复定位精度。选哪条取决于你要优化的是「首次装配时间」还是「每次转场时间」——比赛期间转场次数远多于首次装配，所以 A/C 的实际收益比 B 大。","s":"群聊·27炒鸡大符 2026-11-02（林创武、植正雄、高荣信）","k":"auto"},{"i":"K0436","t":"折叠方案的隐藏代价：纵向空间只是换成横向空间，铰链还是刚度短板","c":"结构设计","b":"林创武对大符「往前折叠」方案的两句判断，是这个方案被否掉的直接原因：\n\n1）「往前折叠的方案要考虑强度」——折叠必然引入铰链，铰链是有间隙的单自由度连接，在悬臂末端（扇叶外缘）会放大成可观的位移，还带来定位重复性问题；\n2）「空间也没减少多少，纵向空间改为横向空间罢了」——折叠并没有减少体积，只是把占地方向换了。车宽/车高受限时，换方向等于没解决问题。\n\n推而广之：折叠适用于「细长杆件」（三脚架、灯架），因为折叠能把长度减半；不适用于「面状/环形大件」，因为折叠后的包络仍是原来的面积。判断要不要做折叠，先算折叠后包络的长宽高三个数，再和运输工具内腔比，别凭感觉。\n\n高荣信的原话佐证了这个判断过程：「我一开始还想用合页结构，但是强度应该很低」，说明他自己也意识到刚度问题，最终转向拆五片。","s":"群聊·27炒鸡大符 2026-11-02（林创武、高荣信）","k":"auto"},{"i":"K0437","t":"航空箱一物两用：既是运输容器，也是垫高基座","c":"赛事场地","b":"伍津乐说桌子「不方便上货拉拉」，谭嘉豪直接给了「航空箱」三个字，伍津乐确认：「去赛场要用航空箱，搬来搬去」。\n\n这条建议的价值在于它把两个需求合并了：大符本来就要装航空箱运输（防撞、防尘、可堆叠），而航空箱本身是一个规整的、有足够强度的立方体——把箱子留到赛场当垫高基座，等于把「运输容器」直接复用成「高度来源」，不需要额外带一张桌子。\n\n工程上要注意三点：①箱体承压能力（五块靶板 + 支架的重量集中在四个底脚，箱盖/箱壁需能承受，必要时加一块胶合板分散载荷）；②箱底防滑（光滑箱底在打靶振动时会爬行，需垫橡胶或加地脚）；③箱内衬棉会吃掉净空，选购时按「内腔尺寸」而不是「外尺寸」算能否装下支架。\n\n待办：高荣信问「有标准航空箱的尺寸吗」，群内未答，需自行查常规规格（常见 1200×800×H、1000×600×H 系列）。","s":"群聊·27炒鸡大符 2026-11-03（谭嘉豪、伍津乐、高荣信）","k":"auto"},{"i":"K0438","t":"深大符的两个做法：粗螺丝直连铝管，升降直接买成品","c":"案例开源","b":"王奇英转述的友校（深大）做法，两条都很务实：\n\n1）结构连接：「深大符叶是简单螺丝固定在骨架上面的」「用较粗的螺丝固定在铝管上」。即扇叶与骨架不做精巧过渡件、不做定位销+卡扣，用大直径螺丝直接锁在铝型材/铝管上。好处是零件少、装配快、失效模式单一（松了就紧）；代价是每次拆装都会在原孔位磨损，所以铝管上要么用通孔+螺母，要么加预埋件。\n\n2）高度方案：「深大买了升降机」——注意是买成品，不是自研。这与队内「升降太复杂不好维护」的判断互相印证：需要升降的话，采购成熟机构比自己设计更省事，自研升降的收益只在「必须集成到既有立柱里」时才成立。\n\n启发：本赛季官方只卖靶板，立柱臂架自研。在自研件里，凡是有成熟成品的功能（升降、脚轮、锁扣）优先外购，把自研精力留给接口和骨架这些没有成品可买的部分。","s":"群聊·27炒鸡大符 2026-11-02/03（王奇英、伍津乐）","k":"auto"},{"i":"K0439","t":"靶板叶片上有三类孔，画图时不能混：结构孔 / 扎带保险孔 / 电控板孔","c":"结构设计","b":"对着 2024 版总装（a机械组-能量机关总装2-林雨-20240524.SLD）的截图，王奇英把靶板叶片的孔分成三类，这是本轮最具体的一条结构知识：\n\n1）叶片中部那两颗孔——与骨架固定，「只有中间是用来跟铝管固定的」，配「较粗的螺丝」；\n2）叶片两侧的孔——「左右不是螺丝孔」，是扎带的过孔，用途是「防止灯板的魔术贴用太久脱落」。即魔术贴是主固定，扎带是保险，两者并用；\n3）其余孔位——固定开发板/灯板本体。\n\n为什么这个区分重要：如果按「所有孔都是螺丝孔」去画和加工，两侧的孔会被当成 M3/M4 螺纹孔处理（打螺纹、算有效深度），既浪费工序，又可能在装配时被误锁螺丝顶到灯板。正确做法是图纸上用不同图层/注释区分，或在 BOM 里标注「扎带孔 φ3 通孔，无螺纹」。\n\n另外，魔术贴长期使用会因温度与振动失去粘性，扎带做二次保险是这个方案能撑住一整个赛季的原因——这类「主固定 + 保险」的双重设计，值得用到所有靠胶粘/魔术贴固定的部件上。","s":"群聊·27炒鸡大符 2026-11-03（王奇英答高荣信）","k":"auto"},{"i":"K0440","t":"大符超重的根因是五块靶板本体，不是支架","c":"结构设计","b":"王奇英：「目前大符重的原因是 5 个靶部分太重了」，并反问植正雄「这会真重心不稳了吧」。\n\n这条纠正了一个容易走偏的优化方向。讨论前期大家都把重心问题归到「支架太高/底盘太小」，解法自然滑向「加大底座跨距」「加配重」——但那是在用一个更重的方案去救一个本来就超重的方案。真正的杠杆在靶板：五块靶板处于悬臂最远端，力臂最长，减 1kg 靶板的效果远大于在内侧减 1kg。\n\n可执行减重顺序：①靶板本体（材料/厚度/镂空，注意保留打击面刚度）→ ②灯板与线束（减板、走线槽化）→ ③叶片与骨架的连接件（零件合并、去掉过渡板）→ ④最后才是底座配重。\n\n减重边界：靶板是被弹丸持续打击的面，减重不能以牺牲抗凹坑能力和平面度为代价，否则打靶环数会掉——这是「性能件减重」与「结构件减重」的区别。","s":"群聊·27炒鸡大符 2026-11-02（王奇英）","k":"auto"},{"i":"K0441","t":"本赛季大符方案的第一道关口是王奇英，方案要先过他再上评审会","c":"队伍制度","b":"林创武 2026-11-02 22:25 在 27炒鸡大符 群里的任命：「@王奇英 光荣任命你为今年大符的方案负责人，负责审核新人方案和进度审核」。\n\n配套的两条工作方式要求（同日 27机械组群）：\n1）「新人可以拿电脑到土槽或者负二，把图纸或方案线下给师兄师姐审核，不要闭门造车，线下交流效率也更高」；\n2）「可以到对应场地道具群和师兄师姐约时间审图和方案」。\n\n也就是说，本赛季审图不是「提交文档等回复」的异步流程，而要求面对面过图。对新人的实际影响：方案文档写完后先约王奇英线下看，改完再进正式评审会；不要指望在群里发个链接就得到有效反馈。\n\n时间成本：一次线下审图通常 30 分钟以上，且要带可编辑源文件（不是截图）。提前把「我想解决什么问题 / 我考虑了哪几条路 / 我为什么选这条」三句话准备好，能显著提高过图效率。","s":"群聊·27炒鸡大符 + 27机械组 2026-11-02（林创武）","k":"auto"},{"i":"K0442","t":"SolidWorks 材质库里没有「45 钢」，对应的是 AISI 1045","c":"材料板材","b":"SolidWorks 自带材质库没有直接叫「45钢」的条目。国标 45 钢的美标等效牌号是 AISI 1045（或 SAE 1045），路径在 solidworks materials > 钢 下选「AISI 1045 钢, 冷拔」。\n\n为什么是它：45 钢名义含碳量 0.45%，AISI 1045 含碳量 0.42%–0.50%，区间覆盖；强度、硬度、切削性几乎等同，内置的密度、弹性模量、泊松比可直接用于常规静力学/热力学仿真。\n\n四种加工状态的实际差别（选错会影响仿真结果与工艺判断）：\n· 冷拔 Cold Drawn——常温拉过模具，加工硬化使屈服/抗拉更高，尺寸精度高、表面光洁，塑性下降且有残余应力。适合轴类、销钉、紧固件、活塞杆。\n· 热轧 Hot Rolled——高温轧制，塑性好、内应力小，但表面粗糙、公差大。适合后续要大量机加工的毛坯。\n· 冷轧 Cold Rolled——常温轧制，多用于板材，表面平整、厚度精确。\n· 退火 Annealed——加热保温缓冷，消除内应力、硬度降低，最好切削。适合复杂机加工件或后续要淬火的件。\n\n实操：只做仿真就选「冷拔」；若要出加工图并标热处理，必须写清是退火态还是冷拔态，两者在车间的切削参数和变形量完全不同。","s":"飞书知识库·机械组常识文档（2026-11-02 新增章节）","k":"auto"},{"i":"K0443","t":"45 钢淬透性低：想要表面硬度就得上表面淬火","c":"材料板材","b":"45 钢属中碳钢，淬透性较低（临界直径小）——整体淬火时心部往往淬不透，做大截面件会出现「表面硬、心部软」且硬度沿截面骤降的情况。\n\n所以实际设计中若需要表面高硬度（齿轮齿面、轴颈、导轨面），通常做法是表面淬火（感应/火焰淬火），而不是整体淬火：只让表层奥氏体化后急冷，得到马氏体硬层，心部保留韧性，既耐磨又不断裂。\n\n对 RM 设计的含义：\n· 用 45 钢做轴、齿轮时，图纸热处理标注应写「调质 + 表面淬火，硬度 HRC45–50，硬化层深 1–2mm」，而不是笼统写「淬火」；\n· 若零件截面大又要求整体高硬度，45 钢不是合适选择，应换 40Cr/42CrMo 等淬透性更好的合金钢；\n· 队内加工若走外协，表面淬火需单独工序与工期，排产要提前留时间，别等装配前才想起来。","s":"飞书知识库·机械组常识文档（2026-11-02 新增章节）","k":"auto"},{"i":"K0444","t":"热熔螺母开孔孔径与深度速查表（M2–M8）","c":"标准件紧固","b":"3D 打印件上做螺纹连接的标准做法是热熔螺母（热压铜螺母）。孔径给大了螺母会被顶出来、抓不住；给小了压不进或胀裂打印件。推荐值（孔在打印完后再用钻头扩一道，以排除打印收缩影响）：\n\nM2 外径3.5 孔3.3 深4；M2.5 外径3.6 孔3.4 深5；M3 外径4.5 孔4.3 深5；M4 外径6.0 孔5.8 深5（短款）/9（长款）；M5 外径7.0 孔6.8 深6（短款）/10（长款）；M6 外径8.0 孔7.8 深9（短款）/13（长款）；M8 外径10.0 孔9.8 深14。\n\n规律：孔径 ≈ 外径 − 0.2mm。原文还有个实测结论值得记：M3 螺母在 4.2mm 孔下强度仍有最高强度的 90%，但 4.2mm 更容易预装且几乎不出毛刺——因为 FDM 件常收缩，画图时孔径要再加 0.1mm。\n\n深度注意：孔深必须大于螺母长度（留 1mm 余量），否则螺母压不到底，螺丝会顶到孔底导致「拧不紧但转不动」的假锁死。薄壁件深度不够时，改用埋入式螺母或加凸台。","s":"飞书知识库·机械组常识文档「热熔螺母」（2026-11-02 新增）","k":"auto"},{"i":"K0445","t":"热熔螺母的烙铁温度按基材定：PLA 225 / PETG 245 / ABS 265","c":"装配维护","b":"压热熔螺母时电烙铁温度不是随手调的，规律是「约高于该材料打印温度 10–20 °C」：\n\nPLA 约 225 °C（高 10–20 °C）；PETG 约 245 °C；ABS/ASA 约 265 °C，M5/M6 还要再高一点。\n\n温度太低的后果：螺母压不到底，靠蛮力压会把周围材料顶起一个鼓包，件表面废掉；温度太高的后果：材料局部软化过度，螺母周围的壁被挤走，冷却后螺母松动甚至能拔出。\n\n操作要点：①先用烙铁在孔口轻压预热 2–3 秒再下压，不要一开始就用力；②保持螺母垂直（用平口烙铁头或加导向柱），歪了很难纠正；③压到位后保持压力 5–10 秒等材料回硬，别马上拧螺丝；④大批量时做个简易定位工装，比手压一致性好得多。\n\n判断压好了没有：螺母端面与件表面齐平或略低 0.2mm 以内，四周有一圈均匀翻边（材料被挤出的小圆环），没有明显鼓包或开裂。","s":"飞书知识库·机械组常识文档「热熔螺母」（2026-11-02 新增）","k":"auto"},{"i":"K0446","t":"打印件退火只对半结晶材料有效，ABS/PC 退了白退","c":"材料板材","b":"FDM 是「融化 → 几秒吹冷」的过程，分子链被冻在一个又乱又憋着劲的状态。退火就是重新加热让链松开、重新排队、把内应力卸掉，再慢慢冷下来定住。\n\n但能不能靠退火变强，取决于材料的结晶能力，分四类：\n\n半结晶（PLA、PA/PA-CF、PET/PET-CF、PP、PEEK/PEKK、PPS、POM）——能，且明显。有结晶区，加热后结晶区长大会变多，耐热、强度、耐化学性一起提升。\n\n非晶（ABS、ASA、PC、PMMA、HIPS）——基本不能。没有结晶区可长，加热只消除一点内应力，收益很小但变形风险不小（Prusa 实验结论：ASA/ABS 不适合退火）。\n\n弹性体（TPU/TPE）——不要做。一加热就变形、失弹、变脆。\n\n光固化树脂——不适用。热固性材料，加热不会重排，该做的是 UV 二次固化。\n\n对 RM 的含义：队里大量用 PLA 打结构件，退火是免费的强度提升手段（尤其受力的支架、卡扣）；如果是 ABS/ASA 打的件，别浪费时间退火，改用增加壁厚/加筋解决。退火前务必用同参数打一个废件先试，测收缩量再决定配合尺寸。","s":"飞书知识库·机械组常识文档「打印件的退火」（2026-11-02 新增）","k":"auto"},{"i":"K0447","t":"退火收缩率 1–3%，尼龙 2–5%——画图时就要预留","c":"材料板材","b":"退火在卸掉内应力、提高结晶度的同时会让件收缩：一般材料 1–3%，尼龙（PA）2–5%（尼龙吸水+结晶双重因素，是收缩最猛的常用料）。\n\n对设计的直接影响：任何需要退火后仍能装配的件，尺寸链上必须预留收缩量。\n· 孔：退火后会变小，画图时孔径按「目标孔径 + 收缩量」放大，或用钻头在退火后精修；\n· 轴/凸台：退火后会变小，若要求过盈配合，过盈量要算在收缩之后；\n· 平面：大平板退火易翘曲，尽量设计成有筋/有边框的结构，或退火时压在重物下冷却（约束退火）。\n\n顺序建议：先打样 → 量实际收缩 → 修模型 → 再批量。不要拿第一次的模型直接开批量，尤其是尼龙件。另外尼龙件退火前必须烘干，含水退火会产生气泡和尺寸失控。","s":"飞书知识库·机械组常识文档「打印件的退火」（2026-11-02 新增）","k":"auto"},{"i":"K0448","t":"各国标准缩写速查：GB / DIN / AISI / ISO / EN","c":"图纸规范","b":"看图纸、查材料、对标牌号时高频出现的五个体系：\n\nGB＝中国国家标准（Guóbiāo），中国；DIN＝德国标准化学会（Deutsches Institut für Normung），德国；AISI＝美国钢铁学会（American Iron and Steel Institute）牌号体系，常与 SAE 并列，美国；ISO＝国际标准化组织，国际；EN＝欧洲标准（European Norm），由 CEN/CENELEC/ETSI 发布，成员国须等同转化为本国标准，欧盟/欧洲。\n\n实用对照习惯：\n· 钢材：GB 45 ≈ AISI 1045；GB 40Cr ≈ AISI 5140；不锈钢 GB 304 ≈ AISI 304（SUS304 是日本 JIS 叫法）。\n· 紧固件：GB/T 70.1 内六角圆柱头螺钉 ≈ ISO 4762 ≈ DIN 912。\n· 公差：GB/T 1804 线性尺寸未注公差 ≈ ISO 2768，等级代号（f/m/c/v）一致，可互换引用。\n\n图纸上写标准号的意义在于「可追溯」：同一个「M5 沉头螺丝」，按 GB/T 819.1 和按 DIN 7991 的头部尺寸并不完全一致。给外协发图时标准号写全（含年份），避免加工方按自己习惯选标准。","s":"飞书知识库·机械组常识文档（2026-11-02 新增章节）","k":"auto"},{"i":"K0449","t":"光孔公差取 +0.1mm：给到 +0.2 会被厂里默认成 M5 螺纹孔","c":"图纸规范","b":"常识文档里这条 Tip 在 11-02 被改过措辞（从「开通孔」改成「开光孔」），值得单独拎出来：\n\n任何可以加工螺纹的材料，开光孔时建议取「标准尺寸 + 0.1mm」。例如 M4 螺丝的过孔画 4.1mm。如果给 +0.2（例如 4.2mm），加工厂商会默认这是 M5 的螺纹底孔，直接给你打成螺纹孔——到装配时螺丝穿不过去，或被强行拧进去把螺纹啃坏。\n\n背后原因：CNC 车间师傅看图时孔尺寸是「一眼定性」的——4.2、5.0、6.8 这些数字在师傅眼里对应某个规格的螺纹底孔，而不是「随便给的过孔」。所以过孔尺寸必须刻意避开螺纹底孔的标准值。\n\n实操清单：\n· M4 过孔 4.2 有风险（M5 底孔 4.2），改 4.3 或 4.1；\n· M5 过孔 5.2 接近 M6 底孔 5.0，建议给 5.5；\n· 最稳的做法：图纸上用文字注明「φ4.1 通孔，无螺纹」，或在模型里做成异形孔向导的「孔」而非「螺纹孔」，让特征本身带出信息。","s":"飞书知识库·机械组常识文档「铨洲螺纹孔规则说明」（2026-11-02 修订）","k":"auto"},{"i":"K0450","t":"铝型材入门：B 站考拉工作室的系统讲解（机械入门必学）","c":"基础理论","b":"常识文档「材料」章节 11-02 新增的推荐视频：【可能是B站最全的铝型材介绍视频｜机械入门必学【考拉工作室】】https://www.bilibili.com/video/BV1vh411N7ae/\n\n为什么值得看：铝型材（欧标/国标工业铝型材）是 RM 机器人骨架、场地道具支架、测试台的第一大材料，但它不是「一种材料」而是一整套型材+连接件+加工方式的体系。真正要掌握四件事：\n1）系列与槽宽：20/30/40/45 系列，槽宽 6/8/10mm，决定能配哪种螺母；\n2）型材代号读法：如 4040、4080、4040L、4040W——前两位是截面宽×高，字母表示壁厚/轻量化版本；\n3）连接方式：角件（外置/内置）、T 型螺母、弹性扣件、端面连接（攻丝+沉头螺丝），各自能承受的载荷方向完全不同；\n4）加工：切割端面必须垂直，攻丝要打中心孔，长型材要考虑直线度与下垂。\n\n配合常识文档已有的「振心铝方管型号大全」「铝方管强度」两节看，能把「型材（可拼装）」和「方管（焊接/打孔）」两条路线分清——前者改型快、后者刚度高，选型时先定这条。","s":"飞书知识库·机械组常识文档（2026-11-02 新增推荐）","k":"auto"},{"i":"K0451","t":"本阶段审图必须线下：带电脑到土槽或负二，别在群里发个链接等回复","c":"队伍制度","b":"林创武 2026-11-02 22:39 在 27机械组 @ 全体新人（含高荣信）：\n\n「新人可以拿电脑到土槽或者负二，把图纸或方案线下给师兄师姐审核，不要闭门造车，线下交流效率也更高」\n「可以到对应场地道具群和师兄师姐约时间审图和方案」\n\n这是工作方式的规定，不是建议。背景是新人普遍习惯「做完发群里/发文档等评论」，但评审人不会主动逐条回复，导致方案在错误方向上深化很久才被发现（本轮大符群「升降 vs 垫桌」的讨论就是典型：如果早点线下问，一晚上就能定方向）。\n\n线下过图的有效姿势：\n1）带可旋转的 3D 源文件，不是截图——评审人第一反应通常是「转过来看看背面」；\n2）开场先讲三句话：要解决什么问题、考虑过哪几条路、为什么选这条；\n3）准备好被否：带 2–3 个备选方案草图，比只带一个更容易拿到有效反馈；\n4）当场记，不要事后回忆——评审意见往往十几条并列，漏一条就要返工。\n\n时间成本：一次线下审图通常 30 分钟以上，且要提前约人（师兄师姐不一定在实验室）。建议把审图安排在方案阶段而非出完图之后，返工成本差一个数量级。","s":"群聊·27机械组 2026-11-02（林创武）","k":"auto"},{"i":"K0452","t":"玻纤备料策略：先囤大块板，教完再发加工","c":"材料板材","b":"11-02 晚 27机械组的一段对话，透露了队内玻纤（FR4 环氧玻璃纤维板）的备料逻辑：\n\n林创武：「@刘俊锋 买多点玻纤」「怕他们场地道具不够用」「一些简单的大块的板子」「后面统计一下」\n刘俊锋：「要多多」「大的顺便教完发加工」「待我补充重生文档」\n\n拆开看三层意思：\n1）备料要冗余——场地道具（靶车装甲板、挡板、飞镖靶）大量消耗玻纤，按「刚好够」备料会在赛季中反复断供，而玻纤采购周期往往一周以上；\n2）「大块板子」优先——大板可以裁小板，小板拼不出大板；简单的大块件（挡板、靶面）先备，复杂异形件按图下单；\n3）「教完发加工」——新人第一次发玻纤加工前必须先被教过（刀具、转速、崩边、粉尘防护），否则一批板子直接报废。这条与「雕刻机新人必须有人带」是同一条纪律。\n\n安全：玻纤粉尘危害大，切割/打磨必须戴口罩+吸尘，CNC 加工玻纤要用专用刀具并低速，崩边和毛刺会割手。","s":"群聊·27机械组 2026-11-02（林创武、刘俊锋）","k":"auto"},{"i":"K0453","t":"操作手选拔：11 月 4 日 20:00 截止，全体队员可报","c":"队伍制度","b":"RM2027通知群 2026-11-02 17:45（谭嘉豪）：11 月上旬展开操作手选拔，对象为全体队员。有意向者填写飞书表单并在提交后点链接进入「操作手选拔」群聊，ddl 为 11 月 4 日 20:00。\n\n选拔群 chat_id：oc_654f1affd13ad531022b6cb48576d9bf（「我能当操作手？」），群内 11-02 已有 13 条消息（含 5 条系统入群提示），说明报名已在进行。\n\n对机械组新人的意义：操作手与机械设计并不互斥，但时间投入是硬冲突——操作手要参加大量实车训练（每周固定时段练车），而机械组当前正处在方案设计+场地改造阶段。若同时报，需提前和组长说明排期，避免两头都不到位。\n\n从赛季收益看，懂机械结构的操作手在赛场上是稀缺资源（能判断故障是操作问题还是机构问题，能现场做应急改动），这条路径的长期价值不低。","s":"群聊·RM2027通知群 2026-11-02（谭嘉豪）","k":"auto"},{"i":"K0454","t":"北理工DreamChaser 仿人形七轴双臂机械臂开源：3R-R-3R 构型与五个关键几何参数","c":"结构设计","b":"单臂为球肩、肘、球腕组成的 3R-R-3R 冗余构型，每臂 J0-J6 七台达妙电机，左臂走 CAN1、右臂走 CAN2，左右臂复用同一套模板化结构。公开的关键几何参数：上臂 158.50mm、肘部定向偏置 60.00mm、前臂 249.38mm、末端偏置 92.57mm、双臂基座间距 220mm，左右臂基座分别位于世界系 Y=-110/+110mm。可借鉴三点：一是冗余自由度用来调肘部姿态、远离限位；二是左右臂用同一模板只改安装变换，省一半设计量；三是 36 页技术报告把构型、参数、IK 与重力补偿串成一条线，可直接当机械臂类项目的设计说明书范本。PDF 已存档（4.2MB）。","s":"BBS 1941628","k":"auto"},{"i":"K0455","t":"七轴机械臂重力补偿的建模取舍：三段等效质量 vs 逐组刚体（北理工追梦补充篇）","c":"基础理论","b":"把机械臂简化成上臂、前臂、末端三段等效质量能大幅缩小公式规模，但成立有前提：质心落在固定肩中心的质量势能不随关节角变化，可从公式里删掉；质心落在腕中心的质量对穿过该点的腕轴不产生力矩，可它仍要给肩、肘贡献重力矩。一旦关节模组、连接件或末端负载的质心偏离假设位置，就必须逐组保留质量与三维质心重算。计算上是先累加重力势能再对各关节角求导，递推时从基座向末端传重力方向、再从末端向基座累下游质量与一阶质量矩；腰部俯仰变化只需更新基座系中的重力方向。对机械设计的直接含义：结构分组时就按活动刚体记录质量和三维质心，后面套公式才不出错。","s":"BBS 1970715","k":"auto"},{"i":"K0456","t":"RMUC2027 完整形态考核文档评审细则：技术方案里机械部分要交到什么颗粒度","c":"图纸规范","b":"技术评审新增的文档评审要求，把技术方案拆成四块：概述（项目背景、功能定义与核心参数，可与其他学校机器人对比说明取舍）、设计方案（覆盖机械、硬件、软件、算法的实现思路）、研发迭代（各阶段版本做了什么、发现什么问题、怎么定位与改进）、成员贡献（谁负责什么、贡献度）。项目文档侧另有硬性要求：记录当前零件清单并做清晰模块划分、资源支出可追溯、按实战场景给出可靠性测试结果并列出未关闭风险。对机械组的用法：按这四段结构写设计说明，零件清单按模块切分，比事后补文档省力；细则本身声明以技术评审采用的最新模板为准。","s":"BBS 1973251","k":"auto"},{"i":"K0457","t":"2027 技术评审四份文档细则同时上线：规划/中期/完整/总结的统一骨架","c":"队伍制度","b":"规则中心技术评审栏一次性新增四个节点：赛季规划、中期进度、完整形态、赛季总结的《文档评审细则》，均为同一张表的四栏结构——项目文档（复盘分析、项目分析、资源与进度）+ 组织运营。规划阶段要求给出功能清单、优先级与验收标准、方案设计依据与核心硬件选用、风险与测试验证方案；中期要求问题闭环、计划与实际偏差及调整、风险清单按实战场景做可靠性测试。对队伍的价值：四份文档骨架一致，赛季初建好模板，后面三次只需增量更新，机械组的分工与零件清单也能顺着这张表往下挂。","s":"BBS 1973254","k":"auto"},{"i":"K0458","t":"S35 圆角硬指标：距地 0–400mm 内所有外露结构边缘 R≥10mm","c":"结构设计","b":"官方答疑确认该条为检录硬性要求，检录时用治具逐处检查外露结构，不存在「允许几处豁免」。约束范围要精确读：距地面 0~400mm 高度范围内、可能与其他机器人装甲模块检测面发生直接接触的结构边缘，圆角半径不小于 10mm。官方补充口径是「能接触到装甲模块的区域需进行处理」，不是整车所有尖角一刀切，所以先判断哪些面真的可能与对方装甲检测面直接接触，再决定倒哪里。板材与 CNC 件很难做到每处都 R10 是普遍现实问题，官方接受包覆方案替代（见相关条目）。","s":"群聊·27机械组 2026-11-03 14:44 钟炜熙转官方规则答疑截图","k":"auto"},{"i":"K0459","t":"过检录的圆角补救：泡棉包覆、圆角打印件包边、模块内缩","c":"经验避坑","b":"官方答疑给出的三条可行路径：①无法直接倒圆角的位置可以包裹缓冲材料；②除装甲模块相关要求外，出于备赛与比赛期间安全考虑，建议用圆角打印件或泡棉包覆边缘；③对包覆材料的硬度无要求，泡棉即可，不必找硬质件。另有一条关键规避思路：机载端模块（测速模块、lwb 模块等）本身做不到 R10，官方要求是「不应处于机器人外沿可能产生碰撞的位置，需自行做好保护设计」——也就是靠内缩布局合规，而不是硬改外形。对 400mm 高度内的机械臂、底盘抬升结构这类精密外露件，优先用打印件包边/外挂泡棉护角，别动本体。","s":"群聊·27机械组 2026-11-03 钟炜熙转官方规则答疑截图","k":"auto"},{"i":"K0460","t":"RM2027 新赛季须知：官方资料中心入口与完整形态考核细则位置","c":"队伍制度","b":"官方资料与规则/新赛季手册入口 bbs.robomaster.com/wiki/20204847/804039；参赛攻略 bbs.robomaster.com/wiki/6723。物资购买说明 announcement/1930，大疆赞助权益与申请 announcement/1931。完整形态考核细则已公布：RMUC 见 wiki/20204847/1969161，RMUL 见 wiki/20204847/1970940；赛季规划文档、中期进度文档、完整形态文档、赛季总结文档各有独立评审要求，需分别进入各环节子页面查看，拍摄细则以考核须知更新为准（会变，别照旧版做）。","s":"群聊·RM2027通知群 2026-11-03 18:54 谭嘉豪","k":"auto"},{"i":"K0461","t":"用 SolidWorks Motion 复刻足端轨迹反推连杆参数","c":"结构设计","b":"工程组周报里的实用方法：先用 SolidWorks Motion 复刻上一赛季腿部连杆的足端轨迹，再改连杆参数看轨迹曲线怎么变，以曲线形状判断参数优劣，比手算快得多，适合调四连杆/串联腿/工程臂。配套的力矩路径认知：末端载荷会逐层放大到上层关节，所以臂的自重优化和一个足够轻的末端收益最大；算轴系要分别算轴向力、径向力、动静态倾覆力矩，再据此选交叉滚子轴承并定轴系结构；计算时先给冗余量，最后按实际工况定安全系数。","s":"知识库·DRAWING REVIEW MEETING 内嵌附件《week1进度汇报.docx》","k":"auto"},{"i":"K0462","t":"滑轨滑块爆掉的根因：倾覆力矩超过滑块容许静力矩 Mp/My","c":"经验避坑","b":"往届工程底盘前摆轮连接机架的悬挂滑块频繁爆裂，复盘结论不是载荷不够，而是撞击台阶时对滑轨形成倾覆力矩，超过滑轨样本上的容许静力矩 Mp、My 导致滑块损坏。选型不能只看额定动载荷 C，必须校核 Mp/My 两个方向的容许力矩，力臂越长越致命（400mm 级悬挂、归中导杆是高危场景）。同类问题的解法参考机场组：把归中导杆力臂从 400mm 缩到 200mm、导向由抽屉导轨改为滑轨滑块+直线轴承配导向轴+卡簧，并用 CNC 固定导向轴两端保平行度。","s":"知识库·DRAWING REVIEW MEETING 内嵌附件《碎碎念.docx》","k":"auto"},{"i":"K0463","t":"方程式驱动画链轮：改参数即出图，代价是加工成本","c":"传动机构","b":"SolidWorks 里用方程式+Excel 导入做链轮模板：先定链号，从机械设计手册查对应参数（节距、滚子直径、齿数），链长必须是「母节+父节」的整数倍（否则接不上）。模板中填入系数即自动算出完整齿形，改参数快、复用性强；缺点是每换一次参数就是一张新图，加工成本偏高，适合定型后批量复用，不适合频繁试参数阶段。","s":"知识库·DRAWING REVIEW MEETING 内嵌附件《week1进度汇报.docx》","k":"auto"},{"i":"K0464","t":"上台阶路线对比：履带 / 四连杆 / 摆轮加腿","c":"结构设计","b":"针对二级与三级台阶（二级：一级高 200mm、宽超车身；三级：高 200、宽 300）的方案对比：履带能上台阶但移动速度低、体型大、功耗高；四连杆更像能上三级、上二级反而不顺；港大方案是履带加 4 个抬升麦轮，能上二级但偶发打滑。最终选摆轮+腿路线。实测三个具体问题：腿不够长、前麦轮没完全上台阶、后腿收起时没有支撑和向前推力。改法：摆轮换麦轮提供动力、腿加长、摆轮传动改链传动。","s":"知识库·DRAWING REVIEW MEETING 内嵌附件《碎碎念.docx》","k":"auto"},{"i":"K0465","t":"腿长与气弹簧的耦合：缩短腿长会同时压缩行程与压腿扭矩","c":"传动机构","b":"轮腿/平衡组想把压腿高度压到 250mm 以内以过狗洞，做法是大腿小腿各缩 50mm，再按比例反算另外两根连杆长度，几何上可行。但连带代价是：气弹簧行程变短，要靠更大力值的气弹簧补偿，而更大力值的气弹簧又会超出电机压腿扭矩，限位块也得重做。结论：不能只按几何比例缩腿，必须把气弹簧刚度—行程—电机扭矩—限位块当成一个耦合系统一起算；气弹簧在腿上的孔位定位要先定，再定腿长。","s":"知识库·DRAWING REVIEW MEETING 内嵌附件《开学第一周学习内容.docx》","k":"auto"},{"i":"K0466","t":"机场平台伸缩结构：推杆与齿轮两种驱动的取舍及平台避坑","c":"传动机构","b":"机场（无人机平台）伸缩结构电机选型两个候选：笔型推杆成本高但结构简单；齿轮方案成本低但电机空间难塞，需按实际空间与预算定。平台设计已踩过的坑与对策：①归中后飞机撞限位挡板——改低矮台阶 5mm 高、把归中位置拉远到 30mm+、限位由 2 动 2 定改 3 动 1 定；②平台开合后缝隙大导致飞机卡住或掉落——加可重叠补板做 0.2mm 左右高低差、加斜坡、用补板填平螺丝头高度保平面；③收纳高度要压在 200mm 内（实测 198mm）——上下平台部分重叠 25mm，螺丝用极薄头（M2 头厚 1.2、M3 1.0、M4 1.2、M5 1.3）；④推杆行程重排（150→75 两个、75→30 两个），力臂 400mm 缩到 200mm。","s":"知识库·DRAWING REVIEW MEETING 内嵌附件《第二周进度.docx》","k":"auto"},{"i":"K0467","t":"CNC 板材厚度只有这些规格：2/3/4/5/6/8 + 10 12 14 15 16 18 20 22 25 30 后","c":"加工工艺","b":"加工商（「猴妹的猴」CNC）口径：可做板材厚度只有 2、3、4、5、6、8、10、12、14、15、16、18、20、22、25、30mm，30 以上每 5mm 一档（35/40/45/50…）。设计时直接把零件厚度对齐这些数值，能省掉非标厚度的额外工时与加价。选非标厚度的代价（嘉立创/DFM 提示原文）：厚度不在标准档且双面都有特征时会报警，系统只给三条路——加厚到上一档、减薄到下一档、或去掉反面的台阶与外侧角；若坚持用非标厚度，反面就只能做圆形沉头孔台阶，异形台阶和外倒角一律做不了。所以双面都有特征的板件，务必先确认厚度落在标准档内，否则反面的台阶设计整体重做。","s":"知识库·机械组常识文档「零件CNC加工厚度设计细节」章节内嵌截图（2026-11-03 巡检下载识图）","k":"auto"},{"i":"K0468","t":"诺丁汉联队小哨兵「盖格计数器」碳板拼插结构开源（25/26 赛季高速过狗洞构型）","c":"结构设计","b":"全车碳板拼插＋胶水固定，图纸上刻意不放角码，靠板件互锁与胶层传力。设计目标是 25 赛季能高速钻狗洞的小哨兵，为此把弹舱、一体式车架、功能件重新排布，镂空极激进，作者自评「车会显得很酥脆」，并配套大量快拆件，装配手法要求高。作者明确说明只宜作交流参考、不建议新人照抄学习。可借鉴点：无角码纯拼插的板件榫卯式互锁与胶接做法、狗洞构型下弹舱与云台的取舍、快拆接口的分件逻辑；已下载 277MB STEP，可直接量取板厚、槽宽与配合余量。","s":"来源·BBS 1972665","k":"auto"},{"i":"K0469","t":"低成本无改减速箱内嵌 3508 全向轮 V1.2（哨兵用，基于华北科技风暴开源二次改）","c":"传动机构","b":"把 3508 连同原装减速箱整体塞进全向轮轮毂内部，省掉外置传动链与定制轴件，整组轮子的轴向长度直接受减速箱尺寸限制，换更短减速箱还能再缩。作者在复刻中发现若干零件必须定制、且用不上嘉立创/铨洲的优惠加工，成本反而飙升，于是二次改型把定制件换成标准件与可优惠加工的板件，V1.2 已随帖放出，含爆炸视图。可借鉴点：内嵌轮的三段式轮毂分件与轴承跨距布置、3508 输出端与轮毂的对接方式，以及「为可加工性反向改设计」的成本思路。","s":"来源·BBS 1972643","k":"auto"},{"i":"K0470","t":"吉林大学 TARS-GO 可调装甲靶车开源（导轨滑块三向调节＋四轮移动底盘）","c":"赛事场地","b":"供队内步兵/哨兵实弹打靶与视觉调试用的自制靶车。核心是装甲支架用直线导轨加 SGR 锁紧滑块，可手动调整装甲的 xyz 三个方向位置，用来模拟对手机器人不同站位与姿态；四轮移动底盘便于在训练场任意摆放；主体为铝合金（铨洲加工）＋玻纤板＋3D 打印件，优先选用市面易采标准件以降低复刻门槛，整体重心压低防倾倒。MIT 协议，含完整 SolidWorks 装配模型。可借鉴点：用现成导轨滑块做靶标位姿调节的廉价方案、靶车重心与轮距的稳定裕度、自制训练道具的模块化机架。","s":"来源·BBS 1971842","k":"auto"},{"i":"K0471","t":"双摩擦轮差频致 IMU「假姿态」的机理与四类解法（HW26 国赛 3 号步兵实测）","c":"经验避坑","b":"开双摩擦轮后云台持续小幅点头，IMU 的 Pitch 出现 0.28Hz 正弦波动，幅值 0.01rad，5m 处即 5cm 偏差；而编码器显示云台关节并未摆动，故属姿态估计假象，被闭环当真后又反向驱动云台。频谱显示两轮振动峰 100.69/101.01Hz，差频恰等于假姿态频率，根因是 Mahony 归一化时 ax·az 相乘产生混频，不是结构共振。四类解法实测：固定模长替代归一化降至 10.4%、20Hz 输入低通降至 13%（本队采用）、100.85Hz 陷波 14.7%、VQF（τ=3s）1.7%；降 Kp 只是整体钝化。可借鉴：振动型姿态异常先查差频，低通要加在算法输入端而非输出端。","s":"来源·BBS 1972619","k":"auto"},{"i":"K0472","t":"机械组入门教程 04：轴、键、花键与联轴器（诺丁汉联队队内培训大纲）","c":"基础理论","b":"按「谁承担什么」拆轴系：转轴/心轴/传动轴按承载而非「转不转」分类，心轴也可以转动；固定心轴把轴承放在轮毂里、转动心轴由机架支承。阶梯轴讲轴肩圆角与配合件倒角的干涉（图纸贴紧、实物留缝）与退刀槽的双重作用；强调「限制转动」与「限制轴向移动」是两件事，平键只传转矩、不天然定位。键按工作面分（平键侧压、楔键上下楔紧、切向键成组且一组只承一个方向），失效看侧面压溃、剪断、槽根疲劳与微动磨损。花键区分定心面与传力面。联轴器分「中间怎么传力」（刚性/梅花/螺旋切缝/十字滑块）与「两端怎么固定」（顶丝/抱紧/压片）两层，负载端必须独立支承。","s":"来源·BBS 1971847","k":"auto"},{"i":"K0473","t":"机械组入门教程 03 续：原动机识别与选型（电机/气动/液压对照，诺丁汉联队）","c":"基础理论","b":"把机构抽象成「原动机→传动→执行机构」链，再按供能、电机机理、传动形式、控制集成四个维度拆解常见叫法（无刷/直驱/伺服/减速电机/舵机），指出「伺服」必须追问闭环在哪一层、反馈从哪来。给出 RM 任务到候选方案的对照表：轮式底盘与连续输送、云台与轻型关节、摩擦轮高速转动、送料拨动、往复夹持挡块、升降进给，逐项列出该比什么（轮径牵引力、转动惯量与重心偏置、线速度与动平衡、卡滞负载、行程与掉电保持、屈曲与工作周期）。经验结论：只要伸出缩回到位就优先气动，要连续调速、复杂运动曲线与反馈就优先电动。适合新人建立选型框架。","s":"来源·BBS 1970259","k":"auto"},{"i":"K0474","t":"swDescribe：SolidWorks 一键导出闭链机构为 ROS2 包 / MuJoCo XML 的插件","c":"图纸规范","b":"用 LinkCard 互联替代 URDF 的 Link 树来表达闭链机构，一个 LinkCard 可含任意多零件，连接点自动生成对应 Joint（约束仍需手填），不必再理空 Link 层级。无需手画轴与坐标系，选特征即自动算出；带 Joint 角度预览可直接看运动过程；针对轻化零件做缓存，只还原必要零件以免大装配导出极慢；STL 支持面数上限与 QEM 简化、基础破面修复。实测 AI 生成：GPT-6.1 两轮约 25 分钟出基本可用 XML，DeepSeek 约 35 分钟且机构图可读性略差；模型理解高度依赖装配体与零件命名规范。可借鉴：设计模型直通仿真，命名规范即生产力。","s":"来源·BBS 1972650","k":"auto"},{"i":"K0475","t":"能量机关传感器模组：加硅胶软垫后抗 5000 发 17mm@30m/s，套装不含灯板","c":"赛事场地","b":"官方《2027 机甲大师高校系列赛场地道具出售方式》第四部分给出能量机关传感器模组的完整口径：495 元/套，含税不含运费（运费到付，可寄港澳台及海外），收到货款 3 个工作日内发出；一次性订 5 套及以上享 8 折。供应商墨现科技（东莞）有限公司，收款行招商银行东莞松山湖支行，账号 769910231610888，联系人刘露星 15820434522 / leixing.liu@mxkj.net.cn；对公转账或个人付款均可，汇款备注「RM+学校全称+联系人姓名」，付款人与收件人须一致。每套只含一个压感检测传感器 + 一块传感器控制板，不含安装框架、显示灯板、灯板控制板，即结构件与灯板仍要自研。最关键的性能边界：在传感器上增加保护措施（如硅胶软垫）的情况下，抗打击寿命为 5000 发、17mm 弹丸、法向速度 30m/s 的打击；不建议使用 42mm 弹丸打。无库存时发货延长 7–10 个工作日；安装方式与检测算法不同会使实际效果与真场存在差异，需自行调试适配。","s":"飞书·27炒鸡大符群 谭嘉豪转发官方文件截图 2026-11-04","k":"auto"},{"i":"K0476","t":"传感器直接双面胶贴灯板会打坏——深大队伍的踩坑反馈","c":"经验避坑","b":"谭嘉豪转述深大队伍反馈：他们的能量机关传感器很容易坏，原因是把传感器直接用双面胶贴在灯板上，中间没有任何缓冲层。结合官方「加硅胶软垫后抗 5000 发」的口径可知，正确做法是传感器底部做弹性过渡（硅胶垫或泡棉），不能硬贴在刚性灯板上。设计靶板时要把传感器安装位当成独立弹性层来设计，而不是灯板上的一个附件；采购前应直接向商家索要保护措施的推荐做法。","s":"飞书·27炒鸡大符群 2026-11-04 11:41","k":"auto"},{"i":"K0477","t":"行星减速箱单套加工实测报价：4 件 6061 共 212.20 元，增值服务费占一半","c":"加工工艺","b":"铨洲下单页实测（20261103）：端盖 6061 两件（53.38×53.80×15.00）基础价 6.8 + 增值服务 10 = 16.8；输出端 6061 两件（73.61×73.61×25.00）36.8 + 70 = 106.8；轴承压紧 6061 两件（61.20×61.20×8.00）6.8 + 5 = 11.8；行星架 lite 2.0（62.00×62.00×25.00）36.8 + 40 = 76.8。合计含税 13% 共 212.20 元，交期最快 48 小时（有后处理则延 2 个工作日）。读数：基础加工费只占约一半，螺纹表面处理这类增值服务按件另计且很贵（输出端一件的增值服务费 70 元约为基础价的两倍），攻丝孔越多越贵；工艺统一取「去毛刺=是、最小刀具精加工=否、公差 GB/T 1804-2000 M 级」。另：铝合金 6061/7075/5052 默认在每个模型上刻 3×3mm 追溯二维码，禁止打印需另付人工分拣费。","s":"飞书·行星减速箱研发日志「1103 成本」截图","k":"auto"},{"i":"K0478","t":"减速箱两条技术路线：双端复刻上交版 vs 单端成品齿轮加铝件全铨洲化","c":"传动机构","b":"2027 赛季减速箱的新思路：路线 A 双端采用复刻上交（2025 开源）版本，齿轮全自制，精度与侧隙可控，但齿形加工与公差链成本高、周期长；路线 B 单端采用成品齿轮、铝件全部铨洲化，省掉齿形加工，代价是齿轮参数受成品规格约束、侧隙不可调。判断依据是侧隙可控性与工期成本的权衡：要跑侧隙梯队试验只有路线 A 才有意义（可同批发三档侧隙），路线 B 只能靠选型匹配。","s":"飞书·行星减速箱研发日志「新想法」20261103","k":"auto"},{"i":"K0479","t":"大符图纸分阶段交：有进展就发，灯带只填色示意位置","c":"图纸规范","b":"王奇英在 27炒鸡大符群给出的审图口径：不必等整机装好才发图纸，有阶段性进展就先发过来审。两处具体画法：其一，灯带是贴在靶板下面的一条条 LED 灯带，不需要建模，只要在图上用填色或色块标出灯带的位置与走向即可，不要因为「没有灯带尺寸」卡住出图；其二，U 型槽这类标准件队内 SolidWorks 零件库里没有，最实际的办法是去淘宝找同规格件、按商家给的尺寸自建简化模型（外形与安装孔位即可，不必画螺纹牙型）。","s":"飞书·27炒鸡大符群 2026-11-03 21:35–23:25","k":"auto"},{"i":"K0480","t":"27 赛季周会兵种分享排期：第三周起一周一个兵种","c":"队伍制度","b":"机械组周会分享从第一周起按兵种逐个讲，节奏固定为每周一组：第一周 英雄/步兵/哨兵（兵种组介绍），第二周 工程/飞镖/飞机（兵种组介绍），第三周（11.9–11.15）步兵组，第四周（11.16–11.22）重装组，第五周（11.23–11.29）飞镖组，第六周（11.30–12.06）飞机组，第七周（12.07–12.13）哨兵组。各组须在当周前把内容写进对应周会文档（林创武 11-04 在 27机械组群 @ 六人催「记得写本周组会」），不报名则由他统一安排。","s":"飞书·27机械组群 林创武 2026-11-04 14:53–17:09","k":"auto"},{"i":"K0481","t":"雕刻机水冷主轴：切完必须关水泵，玻纤粉尘要及时清","c":"装配维护","b":"队内 JINSTAR 数控雕刻机为水冷主轴，加工时靠万向竹节管持续冲水冷却并降尘，群里反复提醒「切完记得关水」——水泵空转伤泵，工作台积水还会锈蚀。加工玻纤板、碳板后槽内会积大量黑色粉尘与浆料，必须及时清理，否则导轨与丝杆磨粒磨损、后续定位精度下降。用完关水、清台面是每次借用后必须做的收尾动作。","s":"飞书·27机械组群 刘悦 2026-11-04 13:26","k":"auto"},{"i":"K0482","t":"摩擦轮飞镖系统机械设计指南：4.1 万字从理论到实战（哈工程创梦之翼 RM2025）","c":"案例开源","b":"哈工程创梦之翼把飞镖机械从需求定义、摩擦轮选型与预紧、发射管配合、储能与击发时序到精度标定写成教学向长文，41000 余字、90 余张插图，附直翼镖体与电装开源图纸（其余镖体可自行替换）。可借鉴的是它「先算后画」的推导顺序：把落点散布拆成摩擦轮线速度差、夹持打滑、管口扰动三类误差分别定量，再倒推结构公差与装配要求。新队伍可当飞镖系统入门教材逐章自查。","s":"BBS 机械开源专栏 715236","k":"auto"},{"i":"K0483","t":"通用鹅颈弹链设计开源：首装即稳定、不做卡顿优化的方案（西交笃行 RM2025）","c":"结构设计","b":"西交笃行以「让所有队伍所有弹丸都能用上稳定鹅颈」为目标，报告按教学向写：先定义供弹卡顿的成因（弹丸姿态、软管曲率突变、拨弹同步），再给鹅颈主体与云台弹链构型、SW 草图构建步骤与关键尺寸。其 RM24 国赛英雄与 RM25 哨兵鹅颈首装即顺畅、从未做「卡顿优化」，报告该节因此留白。附英雄/哨兵两套 SW2024 图纸＋STEP、说明文档与连杆运动演示。","s":"BBS 机械开源专栏 767135","k":"auto"},{"i":"K0484","t":"机械装配技术规范全集：六类联接＋轴承导轨＋气动的可抄数值（BBS 老帖 2153）","c":"装配维护","b":"一份通用机械装配作业规范，覆盖作业前准备（图纸/BOM/场地/物料）、基本规范、螺栓销键铆接胀套紧定六类联接、滚动轴承与直线导轨、链轮链条、齿轮、同步带、电机减速器、气动元件，以及装配后「完整性/位置准确性/联接可靠性/运动灵活性」四性检查。可直接抄用的数值：螺栓露出螺母 1–2 个螺距、沉头螺钉头须埋入、开口销尾部掰开 60°–90°、钩头键接触面积≥70%、链轮偏移≤中心距 2‰、链条下垂 1%–2%、齿轮轴向错位≤1mm 或轮缘宽 5%、轴承温升≤35℃、齿轮箱满载噪声≤80dB。","s":"BBS 机械开源专栏 2153","k":"auto"},{"i":"K0485","t":"《面向制造及装配的产品设计》DFMA 全文：设计阶段就把返修成本掐掉","c":"基础理论","b":"经典 DFMA 教材 PDF 全文。DFM 管零件本身好不好做，DFA 管整机好不好装，DFMA 是三件事的工具：并行工程中简化结构降本、对标竞品量化制造装配难度、作为成本工具辅助议价。对 RM 的直接用法是画图阶段就用「零件数—装配方向—防错—紧固件数量」四项指标给方案打分，把返修成本前移到设计评审，避免画图一时爽、装配修车两行泪。","s":"BBS 机械开源专栏 9619","k":"auto"},{"i":"K0486","t":"结构设计的思维逻辑：先定义工况再定运动链（斯基小课堂 Part1）","c":"基础理论","b":"一篇只讲方法论的长文（附 9 页 PDF 截图与网盘全文）。核心观点：机械水平决定机器人性能上限，多数队伍缺的不是软件技巧而是设计逻辑；直接照搬开源会因风格与需求不匹配，性能反不如原版。文中给出从需求到构型的推导框架——先定义功能与工况，再定运动链与受力路径，最后才落零件与工艺。适合作为新队员第一份「该怎么想」的读物，配合具体开源案例食用。","s":"BBS 机械开源专栏 8580","k":"auto"},{"i":"K0487","t":"重力补偿机构开源：零刚度弹簧平衡的解析推导（广工 DynamicX RM2021）","c":"传动机构","b":"广工 DynamicX 的重力补偿机构开源，附《完美平衡重力补偿》推导文档与 Overleaf LaTeX 源码。用弹簧＋连杆构成零刚度平衡，使云台在任意俯仰角下重力矩被抵消，从而用小扭矩电机驱动大负载，降低失稳与发热。文档从势能函数出发求弹簧刚度与挂点位置的匹配条件，给出「完全平衡」的解析解。适合大俯仰负载云台、以及需要长时间静态保持的抬升机构参考。","s":"BBS 机械开源专栏 8561","k":"auto"},{"i":"K0488","t":"工程机器人整车机械开源：二维只发关键非标件、三维给总装＋STEP 双格式（南科大 ARTINX RM2023）","c":"案例开源","b":"南科大 ARTINX 工程机器人机械开源。资料组织方式值得直接照搬：2D 只放外发加工的非标件图纸，3D 同时给 STEP 与 SLDASM（SW2021，总装名「工程总装.sldasm」），技术报告的「设计方案-机械结构设计」章节讲机构，另有取矿-兑矿演示视频。这种「二维精简、三维双格式」的做法既控制外发范围，又让他队能在不同 CAD 环境下复现，减少版本打不开的沟通成本。","s":"BBS 机械开源专栏 9433","k":"auto"},{"i":"K0489","t":"供应商名录（哈工大）：可协作编辑的加工商避坑表","c":"加工工艺","b":"哈工大战队维护的在线供应商名录（腾讯文档，任何人可增补）。按加工、材料、标准件等分类收录实测靠谱的店铺，每条以「添加人-评价」格式写明性价比、交期、客服态度等踩坑点。价值不在名单本身而在协作机制：把采购经验沉淀成一张可编辑表格，新队员选商前先查表，避免在海量店铺里反复试错，把预算留在研发迭代上。","s":"BBS 机械开源专栏 7818","k":"auto"},{"i":"K0490","t":"M3508 输出齿轮接口参数：17 齿 m0.6 α20° x=-0.01，配齿必按此表","c":"传动机构","b":"官方《RoboMaster M3508 直流无刷电机使用说明》第 9 页给出输出齿（输入端小齿轮）全部参数，做 3508 行星减速箱配齿时这是不可改动的硬约束：齿数 17、模数 0.6、压力角 20°、分度圆直径 10.2mm、齿顶圆 11.38mm、齿根圆 8.68mm、变位系数 -0.01、跨齿数 2、公法线长度 2.79（上偏差 0.00／下偏差 -0.04）。工程含义有三：①变位系数 -0.01 近似零变位，说明官方输出齿就是标准齿形，所以第一级大齿轮若也用标准齿，中心距可直接按 (d1+10.2)/2 算，不需要为凑中心距改 x；②公法线 2.79 带 -0.04 下偏差，是检验 3508 输出齿磨损的现场量具基准，跨 2 齿量，量出来小于 2.75 说明齿厚已明显削薄，减速箱会开始出现回差与异响；③模数 0.6 属于小模数，齿根弯曲是主失效模式而不是接触疲劳，配 17 齿这种少齿数必须校核根切。来源为行星减速箱研发日志「昴宿Arbiter-01 诞生」章节内嵌附件，原文 PDF 已存 机械百科_数据\\设计资料\\RoboMaster_M3508无刷电机使用说明_中英_20261105.pdf。","s":"飞书·行星减速箱研发日志·昴宿Arbiter-01（2026-11-05）","k":"auto"},{"i":"K0491","t":"齿轮四种变位辨析：径向/切向/高度/角度，看中心距一眼分辨","c":"基础理论","b":"队内研发日志 11-05 把「变位」这个概念彻底拆清，此前讨论里反复混淆的正是这四类。1）径向变位（针对单个齿轮）：刀具沿半径方向进或退 xm，正变位齿变厚、齿顶与齿根一起外移，抗弯和抗根切同时增强；负变位相反。日常说的「变位」99% 指的是它。2）切向变位（针对单个齿轮）：刀具沿切向偏移一个角度，只改变齿厚，不改变齿顶圆和齿根圆，用于锥齿轮的齿厚分配，圆柱齿轮几乎不用——这一条最容易与其他三类搞混，因为它的名字里也有「变位」却不影响外径。3）高度变位（针对一对齿轮）：x1+x2=0，一正一负，中心距不变、啮合角不变、Δy=0，本质是把小齿轮的材料挪给大齿轮，适合中心距已被结构锁死、不允许改箱体的场合。4）角度变位（针对一对齿轮）：x1+x2≠0，中心距必须跟着改变（a′=a+y·m），啮合角也变，用来凑中心距或提高承载能力。一眼分辨的口诀：先看中心距变没变——变了是角度变位，没变是高度变位；再看对象是一个齿轮还是一对齿轮。这条对减速箱设计直接可用：本赛季箱体中心距若已按 3508 输出齿 10.2 分度圆锁死，就只能走高度变位或标准齿，不能随手写角度变位。","s":"飞书·行星减速箱研发日志·1105 四种变位（2026-11-05）","k":"auto"},{"i":"K0492","t":"27 赛季行星减速箱第一版成品实测：整箱 358g，单件 117.3g／118.9g","c":"案例开源","b":"11-04 首版成品落地并称重：单件零件实测 117.3g、118.9g（电子秤直读），拼装后单一整个减速箱重量 358g 左右。这个数字要跟 11-03 的成本表一起看——6061 铝件 4 件含税 212.20 元，其中增值服务费占一半，输出端螺纹表面处理单项 70 元接近基础价 2 倍。也就是说 358g 的背后是「铝合金为主 + 少量表面处理」，若要再减重，优先砍的不是壁厚而是表面处理与螺接件数量。358g 也是后续做整腿质量链的输入：四条腿就是 1.43kg 的纯减速箱质量，还没算电机与轮组。","s":"飞书·行星减速箱研发日志·1104 第一版成品（2026-11-04）","k":"auto"},{"i":"K0493","t":"减速箱双端方案定型：轮腿复刻上交，四轮车仿青岛大学","c":"案例开源","b":"研发日志「新想法」一节 11-05 更新，把 11-03 的两条路线收敛成按兵种分派：轮腿的双端采用复刻上交（2025 开源）版本；四轮车的双端改用模仿青岛大学的方案，出处为社区文章 https://bbs.robomaster.com/article/1936175 。11-03 的原始两选项是「双端复刻上交」与「单端成品齿轮 + 铝件全铨洲化」，现在的结论是两者并非二选一，而是按整车布局分化：轮腿端负载与冲击更大、要求可维护性，直接抄成熟的复刻版；四轮车追求成本与交付速度，走青岛大学那条更容易国产化落地的路。这条对后续选型很有用——同一个减速箱不必强行统一到一套图纸。","s":"飞书·行星减速箱研发日志·新想法（2026-11-05）","k":"auto"},{"i":"K0494","t":"官方能量机关检测模块九层叠层组成：盖板到外壳的完整顺序与各层材料厚度","c":"赛事场地","b":"官方培训材料「检测方案·模块组成」爆炸图给出能量机关靶板检测端的完整叠层，从迎弹面往内依次为：盖板 → 压感传感器 → 1mm 软胶 → 10mm PC 板 → 3mm 缓震泡棉 → 分光板 → LED 灯板 → 控制板 → 外壳。官方在图上用红圈特别圈出两处：一是 10mm PC 板，二是分光板，这两块是自建或维修时最容易被省掉、也最容易导致判分异常的零件。工程解读：1mm 软胶是压感传感器与 PC 板之间的界面层，作用是让打击力均匀传递、避免硬对硬把传感器压裂；10mm PC 板是主要承力与透光板，PC 而非亚克力是因为要抗 17mm 弹丸反复冲击不开裂；3mm 缓震泡棉贴在分光板一侧，吸收冲击余量、保护分光板与 LED 灯板；分光板位于 LED 灯板与控制板之间，负责把灯板光路与检测光路分开，缺了它会出现「灯亮但打不中判定」的怪现象。队内 11-05 在 27炒鸡大符群讨论该图时，负责人谭嘉豪的结论是「照着官方的来做吧」，即 27 赛季检测端不做结构改良，按官方叠层复刻。图已存 01_官方规则与规范\\官方_能量机关检测模块叠层组成_20261105.png。","s":"飞书·27炒鸡大符群 2026-11-05 20:28 谭嘉豪转发官方培训材料","k":"auto"},{"i":"K0495","t":"官方场地模型 V1.0.0 版本核对：群内再传的 STP 与 SLDPRT 与本地 371MB 存档同源","c":"赛事场地","b":"11-05 场地道具开发维护大队徐奕昊从官方论坛找到并上传 RMUC2027_V1.0.0 (1).stp，配文「这是我在官方论坛找到的场地模型，可能有用」；同日 27机械组李开弘另发 RMUC2027_V1.0.0.SLDPRT 单个零件文件。经核对，本地 04_往年图纸与代码\\官方场地模型RMUC2027_STEP与SW装配体_V1.0.0.zip（371MB，10-26 入库）已同时包含 STEP 与 SolidWorks 装配体，01_官方规则与规范\\官方场地模型_RMUC2027.stp 也已有独立 STP，故本轮不重复下载这两个大文件。提醒后来人：场地模型有 STP/SLDASM/SLDPRT 三种个头，STP 通用但无特征树、SLDASM 可编辑但版本敏感、SLDPRT 只是单体零件不能当总装用，下载前先看清名字。","s":"飞书·场地道具开发维护大队 2026-11-05 14:25、27机械组 18:20","k":"auto"},{"i":"K0496","t":"第八次机械组组会安排：11-08 周日 10:30 土槽楼，分享工程/飞镖/飞机","c":"队伍制度","b":"林创武 11-05 17:51 发布：第八次机械组组会暂定 11 月 8 日（本周日）上午 10:30，地点土槽楼实验室。三个要点：①本周分享会内容为工程、飞镖、飞机三个兵种的介绍（对应新建文档「第二次周会-工程，飞镖，空中机器人介绍」）；②新人场地道具任务进度汇报；③再次强调危险工具使用规范。与会范围有新变化：全体新人与本周汇报的队员必须到，大二及以上老队员可按兴趣选择性参加。请假须在开会前向机械组组长说明。对新人而言这是本周唯一的硬性时间节点，场地道具进度要在这之前拿出可汇报的东西。","s":"飞书·27 机械组通知群 2026-11-05 17:51","k":"auto"},{"i":"K0497","t":"危险工具二次重申：雕刻机/切割机/手电钻/台钻必须有学长陪同，严禁独自使用","c":"经验避坑","b":"植正雄 11-05 16:53 在机械组通知群 @全体成员 再次提醒：所有危险性工具——雕刻机、手持切割机、座式切割机、手电钻、台钻等——必须在具备操作能力的学长学姐陪同指导下，方可学习、操作，严禁独自使用。这条在 11-05 当天被重申两次（组会通知里也列了一条），说明近期确实出现了独自上机的情况。实操上要区分两类风险：切割类（手持/座式切割机）是瞬时伤害，断指断手不可逆；钻类（手电钻、台钻）是缠绕与飞出伤害，薄板钻孔时工件未夹紧会被钻头带着高速旋转。台钻尤其容易误判为「比手持电钻安全」，实际上台钻转速低扭矩大，缠住手套时更致命，必须夹紧工件、禁止戴手套。","s":"飞书·27 机械组通知群 2026-11-05 16:53 植正雄","k":"auto"},{"i":"K0498","t":"H2D 打 TPU 的实际约束：软料卷进不了 AMS，只能外挂到左喷嘴","c":"经验避坑","b":"11-05 现场问题：土槽楼最右侧那台 H2D 上有一卷 TPU，无法装进 AMS，只能外挂走左喷嘴；且该卷来的时候盖子已不在，说明 TPU 的防潮盒被拆过。结论有三：①AMS 的送料路径长、齿轮夹持力固定，软料（TPU 类）在其中会被拉伸变细甚至卡死，所以 TPU 一律走外挂料盘 + 左喷嘴直送，不要试图塞 AMS；②TPU 吸水性强，拆封后必须放回干燥盒，盖子丢失会直接导致打印时拉丝、气泡、层间剥离；③外挂打印时喷嘴温度与回抽都要单独设，按 PLA 参数直接打 TPU 必堵。这是耗材选型条目「ABS/ASA 轻、PETG 便宜、TPU 吸水」的设备侧补充。","s":"飞书·27 机械组 2026-11-05 13:21 王家祚/周昱翔","k":"auto"},{"i":"K0499","t":"第二次周会文档新建：空中机器人从投弹到 17mm 摩擦轮连发的演进","c":"其他","b":"林创武 11-05 16:07 在通知群发出新建文档「第二次周会-工程，飞镖，空中机器人介绍」，目前只有空中机器人一节有内容（工程与飞镖两节还是空标题，文档尚在填充）。已有的技术信息：无人机最早在 2015 年登场，以投弹方式打击；2018 年后迎来第一次大改，支持 17mm 摩擦轮连续发射，与步兵同款弹丸、共用测速模块，正式成为空中火力点，不再只是投弹机。机械侧的含义是空中机器人的发射机构可以复用步兵摩擦轮那套成熟方案（双摩擦轮 + 测速 + 拨弹），难点不在发射而在整机质量与重心控制——这也是今年无人机「改动非常巨大」的原因。该文档未挂在「27赛季机械组周会分享」节点下，是独立文档。","s":"飞书·27 机械组通知群 2026-11-05 16:07 林创武分享文档","k":"auto"},{"i":"K0500","t":"无人机机场归中结构：步进电机 + 齿轮 + 对置双齿条，高度被 64mm 机身卡死","c":"结构设计","b":"11-05 新人机场方案，驱动链为：皮带传送带动中间主轴转动 → 曲柄杆结构推动平台伸缩；归中则压缩在平台内部，用小型步进电机带动齿轮、驱动对置双齿条做双向同步归中。这个「一齿轮带两根反向齿条」的用法好处是天然同步、左右行程相等，省掉两套独立驱动和同步算法，代价是齿条啮合间隙会直接变成归中重复精度误差。真正的卡点是尺寸链：飞机本体高 64mm，归中平台预留 15mm，两项相加已超出机场高度限额十几毫米，根因是机场驱动电池尺寸过大。因此后续必须与电控一起重新选电池，而不是继续在结构上抠——这也是「先定电池再定结构」的典型场景。另附初步设想：发射台滑台对应的铝管可考虑做中空减重（承力不大），但要先算行程是否过长导致刚度不足。","s":"飞书·DRAWING REVIEW MEETING 内嵌附件 进度.docx（2026-11-05 补收）","k":"auto"},{"i":"K0501","t":"缓冲方案二选一：自缓冲替代皮筋缓冲，以及跷跷板替代撒放器","c":"结构设计","b":"11-05 补收的进度汇报里两条发射机构思路。其一，研读华东理工大学 2026 技术文档后，考虑用自缓冲（结构自身弹性变形吸能）替代队内现用的皮筋缓冲，理由是皮筋寿命与一致性差、每场比赛前都要重新标定；但自缓冲的疑问是寿命与疲劳后的刚度衰减，需要向华东理工当面问清，同时想设计更便于快换弹簧与绳子的结构。其二，倾覆力矩问题上，用跷跷板结构替代撒放器做释放，理由是跷跷板更轻、下部不会太长太冗余；配套待定项包括弹簧 K 值计算与选型、转向模块滑轮组配置、滑台设计、绳子选型。这两条与本库已有的倾覆力矩 Mp/My 条目互补：那条讲怎么算力矩，这条讲用什么结构去扛。","s":"飞书·DRAWING REVIEW MEETING 内嵌附件 进度汇报.docx（2026-11-05 补收）","k":"auto"},{"i":"K0502","t":"官方社区《你也想做能量机关吗？》：自建训练能量机关的官方指引（正文待补抓）","c":"赛事场地","b":"谭嘉豪 11-05 19:44 在 27炒鸡大符群转发官方社区文档《你也想做能量机关吗？》，属 RoboMaster 高校赛务 2024-10-15 发布，链接 https://bbs.robomaster.com/wiki/697214/55020 。从标题与栏目归属判断，这是官方给出的自建能量机关（训练用大符）指引，正是队内做练习道具最需要的材料。本轮未能取到正文：该页面为客户端渲染的单页应用，直接抓 HTML 只能得到栏目目录，正文需浏览器渲染后才可见，故此处只记录线索、不臆测内容。下一步可用浏览器打开该页取全文，再拆成结构尺寸与制作工艺条目。","s":"飞书·27炒鸡大符群 2026-11-05 19:44 谭嘉豪","k":"auto"},{"i":"K0503","t":"【气动发射吊射英雄】桂林电子科技大学 RM2022 整车与发射机构开源","c":"结构设计","b":"桂电2022赛季气动发射吊射英雄的模型与技术文档。核心论证：摩擦轮发射受轮面磨损、两轮转速差、加工精度与空气湿度多重影响，弹道上限被压住；气动发射把变量收敛到气压一项，只要入膛气压稳定，精度就更可控。文中给出气动回路的构成思路与整车布置。可借鉴其「把多变量收敛为单变量」的可靠性推导方式，以及吊射英雄发射机构选型时如何写论证。资料以百度网盘发放。","s":"来源·BBS 8978","k":"auto"},{"i":"K0504","t":"【上交云汉交龙】RM2021 英雄机器人机械结构开源（含STEP与二维图纸）","c":"案例开源","b":"上交2021英雄整车开源，按说明文档、效果展示、三维STEP、二维图纸四文件夹组织，模型按模块分装配体。说明文档十章，每章都走「需求分析→机构设计」：发射机构（含双发问题）、云台（本体/视觉相关/云台架）、供弹（拨盘、链路、发射末端、弹仓、卡弹检查）、车架（被救援机构、轻量化、防卡导轮）、自适应悬挂、轮组、保护壳，附录还给了检修表。最实用的用法是照抄它的章节骨架来写自己的技术报告，二维图纸可参考关键件出图深度。","s":"来源·BBS 8480","k":"auto"},{"i":"K0505","t":"【哈工大深圳南工骁鹰】RM2021 下供弹英雄：自适应悬挂与8m射程","c":"案例开源","b":"哈工深2021下供弹英雄，经两代迭代后的稳定版，三个卖点写得很直白：下供弹、自适应悬挂、8m可靠射程。附件为技术报告＋三段对比视频（开/关爬坡模式、平移效果、自适应悬挂对比独立悬挂），整车SLDASM与STEP含设计树。价值在于它用视频把「自适应悬挂到底强在哪」量化了，可直接当作悬挂方案选型的答辩素材；也能看下供弹链路与悬挂在底盘上的布局取舍。","s":"来源·BBS 8474","k":"auto"},{"i":"K0506","t":"【浙大Hello World】RM2023 六轴全R工程机器人机械结构开源","c":"案例开源","b":"浙大2023全R轴（六轴串联）工程机器人，STEP总装含完整设计树、部分零件二维图、取矿与兑换演示、机械结构说明报告。作者自己评价「全R轴在当前规则下并无明显优势」，且除机械臂外其余结构直接迁移成熟方案，是少见的一份承认不成功的开源。适合看六轴在RM尺寸与重量约束下的关节排布、走线与配重，以及人手不足时如何复用既有结构的工程取舍。附SW导入乱码的3DInterconnect关闭方法。","s":"来源·BBS 9477","k":"auto"},{"i":"K0507","t":"【哈工程创梦之翼】RM2022 双枪平衡步兵与双枪云台机械开源","c":"案例开源","b":"哈工程2022平衡步兵＋双枪云台开源，含技术方案PDF、底盘综合运动与枪管切换两段视频、SW2020以上总装SLDASM，以及可直接送加工的「单发限位+4mm.dxf」。两个可借鉴点：一是双枪转轮切换机构，作者明说是在上交2020步兵云台上加装；二是底盘布局继承哈理工荣成2021平衡步兵——文中把这条轮腿方案演化链点得很清楚，读它可以顺着找到更早的源头版本。","s":"来源·BBS 9090","k":"auto"},{"i":"K0508","t":"【上交云汉交龙】RM2023 平衡步兵：平衡底盘与下供弹云台","c":"案例开源","b":"上交2023平衡步兵，开源平衡底盘与下供弹云台的结构模型、说明文档与运动功能测试视频。作者特别声明「图纸和实物有所出入，制作请以当季机器人制作规范为准」——这条提醒对读任何老开源都适用。适合看平衡底盘腿部的关节与减速布置、腿部收放与底盘干涉的避让，以及下供弹云台在大俯仰角下的弹道与供弹软管干涉处理。","s":"来源·BBS 9470","k":"auto"},{"i":"K0509","t":"【东北大学T-DT】RM2023 全向轮步兵机械开源","c":"案例开源","b":"东北大学2023全向轮步兵，正文极简，只有网盘链接和三段声明，没有技术说明文档。能拿到的只有模型本体，价值主要在轮系与底盘布局的可视对照，需要自己读图。不建议作为方案参考首选，收录以备与该队后续版本做纵向对比。","s":"来源·BBS 9437","k":"auto"},{"i":"K0510","t":"【华南理工普渡华南虎】RM2021 舵轮步兵机器人开源","c":"案例开源","b":"华南虎2021舵轮步兵，含技术报告、救援与两次下台阶测试视频、SW2019总装与STEP，二维图纸给出长枪管、轮组转轴、连接轴等加工图。可借鉴：舵轮转向模块的支撑与传动布置，下台阶这类冲击工况下轴系与支架的强度处理，以及用「救援+下台阶」视频证明底盘可靠性的表达方式。模型按模块分文件夹，子装配体命名与文件夹对应，便于拆看。","s":"来源·BBS 8459","k":"auto"},{"i":"K0511","t":"【南京理工Alliance】RM2022 全向轮步兵开源图纸的Bug修复与补充说明","c":"经验避坑","b":"南理工对自家2022全向轮步兵开源图纸的公开勘误：作者一年后才发现若干设计Bug，专门写文档说明问题成因与解决思路，但刻意不提供可直接套用的图纸，要求读者自己判断。这是很少见的「开源后自我复盘」，最适合当成设计评审清单来读——看哪些错误会一路藏到装配或实战阶段才暴露，反推自己图纸里该重点查哪些位置。","s":"来源·BBS 9351","k":"auto"},{"i":"K0512","t":"【上交交龙】RM2020 轻量化步兵：以板材搭建为主的低成本路线","c":"案例开源","b":"上交2020步兵开源，主路线是「以板材搭建为主」的轻量化＋低成本，目标让年轻队伍用有限加工条件快速出车。说明文档按发射机构、云台架、车架、轮组系统、外观五部分写需求与设计，配套25Hz射频爆发、飞坡、陀螺、小陀螺发射、击打哨兵与远程吊射等性能视频，二维图纸为麦轮联轴器等零件。是最实用的入门级整车范例之一，可直接对照自己的板材选型与车架分块。","s":"来源·BBS 7501","k":"auto"},{"i":"K0513","t":"【深圳大学RobotPilots】RM2023 双云台哨兵机器人机械结构开源","c":"案例开源","b":"深大2023哨兵采用双云台＋全向轮底盘，能同时做击打前哨站与全图导航，双云台换来火力冗余与快速索敌。开源含板料加工二维图、技术文档（设计需求、方案选择、功能参数、机构设计）、SW2022总装与STEP、击打与导航自瞄演示视频。可借鉴双云台的武器分配与两云台互相避让的包络设计，以及哨兵板料件的二维图组织方式。","s":"来源·BBS 9462","k":"auto"},{"i":"K0514","t":"【东北大学T-DT】RM2023 哨兵机器人开源","c":"案例开源","b":"东北大学2023哨兵开源，正文只有网盘链接与三段声明，无说明文档。能看的主要是模型里哨兵底盘与云台的堆叠关系、高度分配，缺少设计意图说明，参考价值低于同队的空中机器人与英雄开源。收录备查。","s":"来源·BBS 9436","k":"auto"},{"i":"K0515","t":"【南航长空御风】RM2022 飞镖系统：拉簧弹射与制导镖气动解耦","c":"结构设计","b":"南航2022飞镖系统，发射架首次改用拉簧弹射，并兼容两种飞镖；制导镖采用兼顾稳定性又能实现偏航、滚转、俯仰解耦控制的气动外形，无控镖自称可达主流摩擦轮发射的精度水平。作者坦承控制精度一般、传感器与算法未完成，只搭好了基础机械结构。适合看拉簧弹射这条非摩擦轮路线的机构构成，以及制导镖气动布局为什么要做三轴解耦。","s":"来源·BBS 9124","k":"auto"},{"i":"K0516","t":"【华南理工华南虎】RM2023 飞镖系统开源（含摩擦轮胶圈加工图）","c":"案例开源","b":"华南虎2023飞镖系统，含开源报告、单发打基地、双发打前哨、双发打基地等四段发射架视角视频、SW2019模型压缩包与通用STEP，二维图纸给出摩擦轮胶圈加工图。可借鉴双发机构的发射节拍与换靶逻辑、发射架俯仰与偏航的调整余量设计，以及胶圈这类橡胶件的出图与公差标注方式。","s":"来源·BBS 9445","k":"auto"},{"i":"K0517","t":"【太原科技大学】RM2023 空中机器人开源（圆管机身＋开源文档）","c":"案例开源","b":"太原科大2023空中机器人，开源word文档内含详细讲解与大量图纸索引，另有圆管总装STEP。作者两处重要提示：百度云附件链接已于2025-10-21失效；文档因软件版本问题已于2025-10-24勘误，勘误说明放在文档末尾。价值在圆管机身的总装建模方式与文档化程度，下载后需先看末尾勘误再读正文。","s":"来源·BBS 9409","k":"auto"},{"i":"K0518","t":"【东北大学T-DT】RM2019-RM2020 空中机器人开源（附踩坑记录）","c":"案例开源","b":"东北大学2019与2020两代空中机器人开源，STEP图纸外加队员在制作该机器人时遇到的困难与心得体会，作者注明2020机型设计思路借鉴北理工珠海学院无人机。同批还开源了2019全国赛哨兵底盘、英雄与工程车。适合看早期RM空中机器人的机身框架、桨保与挂载布局，以及这种把踩坑过程写进文档的交付习惯。","s":"来源·BBS 7480","k":"auto"},{"i":"K0519","t":"【上交云汉交龙】RM2023 工程机器人开源：一队两车的结构分工","c":"案例开源","b":"上交2023工程开源，结构部分文档讲两台工程机器人的设计思路与整体结构，另附控制部分（工具库与自定义控制器方案）。结构侧的看点是一队两车如何分工定位——一台偏取矿效率、一台偏兑换与救援，两车的臂展、负载与底盘取舍因此不同。适合在规划自己工程车配置时，先按这个框架把「两车各干什么」定下来再谈机构。","s":"来源·BBS 9432","k":"auto"},{"i":"K0520","t":"【HEXROLL 2.0】内嵌3508全向轮第2版：1160g→1070g→950g减重迭代","c":"传动机构","b":"作者在接手十几个队伍的内嵌3508二次开发后，自己重做并实测优化的一套全向轮组，开放装配STEP。价值在它给出了清晰的减重账：3mm壁厚机加工版配内径50薄壁轴承＋内径25法兰薄壁轴承约1160g，优化后1070g，改用碳纤维板后950g。可借鉴内嵌电机的轴承配置选型、轮毂与轴承座的壁厚取舍，以及这种「每改一步记一次克数」的迭代记录方法。","s":"来源·BBS 8662","k":"auto"},{"i":"K0521","t":"【广东工业大学DynamicX】RM2022 下供弹步兵技术方案（完整形态评审版）","c":"结构设计","b":"广工提交官方的2022完整形态测评步兵技术方案PDF，作者说明它是23赛季青年工程师大会上「下供弹步兵机械分享」的详细补充。原文已迭代，仅供参考。适合看下供弹链路在完整形态评审语境下该怎么写：需求—方案—验证三段如何组织，拨弹、导弹、卡弹处理的结构细节如何呈现成评审能看懂的形式。","s":"来源·BBS 9449","k":"auto"},{"i":"K0522","t":"【射击精度】影响命中率的11个变量清单（老帖）","c":"基础理论","b":"2018年的征集帖，把可能影响射击精度的因素列成11项：云台抖动、炮管直径、炮管光滑度、摩擦轮转速、两轮转速差、摩擦轮硬度、材料、加工精度、直径、两轮间距、炮管长度，并附一篇南理工发射系统学位论文线索供深挖。价值不在结论（帖子本身没结论）而在变量清单——可直接改造成自己的打靶对照实验设计表，逐项做单因素对照。","s":"来源·BBS 4920","k":"auto"},{"i":"K0523","t":"【上交交龙】机械部入队作业链开源（任务链＋零件图示）","c":"队伍制度","b":"上交交龙22、23赛季机械部培训用的入队作业，两份PDF：作业任务链与作业链零件图示。设计目的是让新队员在做完任务的过程中熟悉SolidWorks基本操作、初步认识常见加工要素。适合新队直接借用其「任务链」结构设计招新考核题——一条链走完建模、出图、工艺标注，避免只考建模不考能不能加工。","s":"来源·BBS 9486","k":"auto"},{"i":"K0524","t":"【沈阳理工Ambition】RM2026 隧道工程机器人：21.53kg轻量化＋碳管大臂","c":"案例开源","b":"针对26赛季隧道高度降至250mm开发的隧道工程车，复活赛与国赛稳定，拿过两次MVP。作者点明四处值得看：整车轻量化（检录21.53kg）、CNC管夹配碳管的高刚度大臂、小型轻量化柔性夹爪、自伸缩存矿机构。说明文档2.49MB，另有437MB三维图纸zip与STEP总装。文中还写了区域赛「只能走起伏路段、被断粮战术压制」的反思与两周赶工的设计取舍，对27赛季重装工程车有直接参考价值。","s":"来源·BBS 1938625","k":"auto"},{"i":"K0525","t":"【复旦星云EGA】RM2026 轮腿英雄：舵雄保底→腿雄主车的四代迭代","c":"案例开源","b":"复旦2026英雄走「先做舵轮近战英雄保底、等轮腿控制成熟再做腿雄」的路线，历经舵雄V1（联盟赛）、V2（区域赛主车）、腿雄V1（备车）、V2（国赛主车）。作者自评性能一般、参考价值有限，但效果说明很具体：上台阶、飞坡、翻倒自救可用；车重偏大，电容不足时飞坡易超功率；三包胶轴承限位偏松，上下台阶会磕出弹丸。附432MB整包与331MB STEP。看点在四代并行迭代的组织方式。","s":"来源·BBS 1942003","k":"auto"},{"i":"K0526","t":"【华南理工华南虎】RM2025 英雄机器人：二代车与三代车对照开源","c":"案例开源","b":"华南虎2025英雄，二代车与三代车两套模型分别给STEP总装，配关键加工件二维图，设计报告PDF详述英雄机械技术特点与研发总结，网盘含说明文档与两代车演示视频。最有价值的是两代车同框——可以对着看同一机构在两代之间改了什么、为什么改，是少数把「上一代哪里不够」写进文档的队伍。","s":"来源·BBS 803686","k":"auto"},{"i":"K0527","t":"【华南理工华南虎】RM2025 应星工程机器人：夹爪车与吸盘车并行开源","c":"案例开源","b":"华南虎2025应星工程，同一赛季并行做夹爪车与吸盘车两条取矿路线，两套STEP总装分文件夹，设计报告PDF讲上层机械技术特点。二维图纸给得很细：夹爪车J2/J3/J4输出轴、L1铝轴、差速器非标轴承内压件，吸盘车二代与三代大yaw铝轴、吸盘固定铝件。可借鉴两种取矿方式的机构分工，以及轴系零件「车+关节+件名」的命名规范，方便多人协作时对图。","s":"来源·BBS 803707","k":"auto"},{"i":"K0528","t":"【中南大学FYT】RM2024 工程机器人：分区赛与国赛两套总装","c":"案例开源","b":"中南FYT 2024工程机器人开源，分区赛与国赛各一套总装（SW2023以上＋STEP）、关键件工程图、含自定义控制器的技术文档、取金银矿与兑换5级矿的演示视频。该车在分区赛拿到最高单局经济与局均经济，国赛保持高取兑效率。可借鉴取矿路径与存矿仓的布局，以及把经济数据写进开源说明、用数据而不是形容词证明机构好用的做法。","s":"来源·BBS 43539","k":"auto"},{"i":"K0529","t":"大符检测端选型：官方为什么弃红外而用压感","c":"结构设计","b":"官方技术视频里明确说过「考虑过红外传感器，最终选了压力传感器」，但没有给理由。队内复盘出的理由链条是：红外光电的定位精度天然低于压感，而能量机关靶面每环宽度只有约 15mm，精度不够就直接判错环。官方的取舍是把「判环准确率」放在「成本与寿命」之前——压感模组虽然贵（495 元/套）且会被弹丸直接击打，但坐标解算是接触式的，没有光路遮挡与斜射偏差问题。\n\n对应到自研：如果只是做训练靶、不追求判环精度，红外路线成本极低（单靶 100–120 元）且寿命长；但凡涉及正式判环，必须压感。11-06 组内结论是本赛季沿用官方压感方案，红外只作预研支线。","s":"群聊·27炒鸡大符 2026-11-05/06（谭嘉豪、张墉、植正雄）","k":"auto"},{"i":"K0530","t":"红外光电条自研靶的三个致命误差来源","c":"经验避坑","b":"张墉给出的实测级判断，三条都会直接毁掉判环：\n\n1）**装不下**：常见直插式红外对管直径约 6mm，靶面每环宽度约 15mm，**一环最多塞两个**，环内分辨率被物理尺寸锁死。\n2）**斜向击打坐标偏移**：弹丸斜着打进靶面时，光路被截获的位置不等于实际着弹点，入射角越大偏差越大。这是原理性误差，调不出来。\n3）**贴片式的焊接公差被放大**：换贴片式光电管可以提精度，但只要焊接稍微歪一点，对射光路就不交叉（漏检）；300mm 直径靶面上这点角度误差被放大成毫米级坐标误差。\n\n成本参考：单块靶子只算红外检测部分约 100–120 元。**最大优势是不被弹丸直接击打，所以不会经常坏**（对比压感模组被反复砸）。\n\n结论：红外路线适合做「打没打中」的二值检测，不适合做「打在第几环」的坐标检测。","s":"群聊·27炒鸡大符 2026-11-05 22:37 张墉","k":"auto"},{"i":"K0531","t":"用成品红外触摸框改大符靶面：258 元换 3mm 线性精度","c":"结构设计","b":"郭卓鑫提出的路线：**不自己做光路，直接买成品红外触摸框**（淘宝「电视改触摸屏」那种，贴在显示器上、USB 供电即可）。这是本轮最被低估的方案。\n\n之所以成立，是因为触摸框本身就是一圈红外对射阵列 + 高速扫描 + 坐标解算，等于把「光路设计、对管选型、标定」全部外包。张墉认可并补充：**买 17 寸正屏，尺寸和 300mm 靶面差不多**。\n\n价格：17/18.5/19 寸统一 **258 元包邮**（贴屏即用，插 USB 连电脑）。\n\n附带价值（张墉）：**淘一块二手屏幕改造，可以直接做弹道散射测试**——把靶面当坐标采集板，统计弹着点散布，这是队内目前没有的测试手段。\n\n参考：B 站《当 RoboMaster 机甲大师遇上弹道检测神器红外电子靶》BV1zm4y1A7UX。","s":"群聊·27炒鸡大符 2026-11-06 12:49 郭卓鑫 / 13:11 张墉","k":"auto"},{"i":"K0532","t":"红外触摸框硬指标与 17 寸正屏对 300mm 靶面的尺寸对位","c":"图纸规范","b":"成品红外触摸屏（15–24 寸系列）关键参数，可直接用于方案论证：\n\n- 插值分辨率 32767×32767；**线性误差 3mm**；响应 7–15ms；扫描 50 scans/s\n- **最小触摸体 ≥5mm**（17mm 弹丸远大于此，能稳定识别）\n- 触摸介质：手指、触摸笔等**不透明物体**都行——弹丸属不透明，适配\n- 透光率 >96%（无玻璃时 100%），可整块盖在靶面前而不挡视觉\n- 表面耐久：硬度等同玻璃（维氏 5.0–7.0 GN/m²）；63.5mm 钢球 1m 自由落体不破\n- 抗干扰：无静电干扰、无漂移；DC5V USB 供电，功耗 <1W\n- 安规：CE / ISO9001:2008 / RoHS；静电防护 EN61000-4-2 接触 8kV、空气 15kV\n\n**尺寸表关键行（17 寸正屏 4:3）**：边框 19.6，厚度 9.8，**触摸区域 340.8×272.8**，外框 380×312。与 300mm 直径靶面基本吻合，多出的 40mm 是边框与走线空间——这是「17 寸正屏」结论的量化依据，不是拍脑袋。\n\n注意：17 寸还有 16:10 版本（触摸区 372.8×231.8），**必须选 4:3 那个**，否则纵向压不住 300mm 靶面。","s":"群聊·27炒鸡大符 2026-11-06 张墉供图（红外触摸屏规格表）","k":"auto"},{"i":"K0533","t":"自动对接连接机构：把六自由度收敛到只留 z 轴","c":"结构设计","b":"2027 重装组「机械臂抓取发射机构自动连接」的设计方法论，写得比结论更值钱：\n\n**需求四条**：①便于连接（可做自动连接）②连接稳固，磕碰不掉头 ③连接间隙极小，不卡弹 ④小弹丸不能进弹链。\n\n**自由度账**：在连接机构两端以过弹丸通道轴线为 z 轴建系。配合完成时要求 x/y/z 三轴完全重合、且发射机构旋转角为理想姿态。关键设计是**让 x/y 轴先定位，最后只留 z 轴未定位**——此时发射机构只剩一个沿 z 的平移自由度，正好用来做硬件电气的插接（插头自然导入），不需要额外导向件。\n\n**能力边界**：底盘端只有 x/y 两个平移自由度，发射机构端有六自由度。对接环节**只能修正一定角度的 yaw**；roll 和 pitch 无法在对接时修正，**必须在抓取瞬间就完全固定**。这条决定了夹爪方案。\n\n**抓取方案三选**：①圆形把手（类能量单元）——圆形在某一方向无法确定姿态，不可用；②几何形状把手——需重设计夹爪；③特化机构——机械臂与发射机构专配，代价是末端冗余。","s":"知识库·机械/2027重装组研发文档（2026-11-06 新建）","k":"auto"},{"i":"K0534","t":"连接机构 v1.0 用六个弹簧销定位 z 轴为什么全盘失败","c":"经验避坑","b":"v1.0 的思路是用**六个弹簧销**在 z 向定位。作者原话「拉完了」，缺陷是三重叠加：\n\n1）**弹簧销承载能力弱**——弹簧销靠弹珠/弹片卡住，抗剪与抗拔都远不如实体销，而连接机构要承受整车撞击的倾覆力矩。\n2）**定位必须开侧孔**——弹簧销要从侧面进入，就得在结构上开侧孔，直接削弱主承力截面（正好踩在应力集中上）。\n3）**没有好的拆除方案**——装上去容易，维护时拆不下来，等于一次性件。\n\n教训：**定位件要同时满足「承载」和「可拆」两个属性**，弹簧销只满足「可装」。后来 v2.0 换成自动上扣（卡扣），本质是把「承载」交给中间过弹通道、把「定位」交给卡扣，两者解耦才成立。","s":"知识库·机械/2027重装组研发文档 v1.0 小节","k":"auto"},{"i":"K0535","t":"连接机构 v2.0：三个自动上扣做到 50° yaw 与 10mm 中心偏差容差","c":"结构设计","b":"v2.0 用**三个自动上扣（锁扣弹簧止回器）**替代弹簧销定位 z 轴，是目前最好的一版：\n\n**达成的指标**：可修正约 **50° 的 yaw 角度偏差**和 **10mm 的中心轴偏差**；基本上**完全没有框量**；**不需要开侧孔**（v1.0 的主要缺陷被消除）；优化后成本可能更低。\n\n**关键力学设计**：**倾覆力矩由中间过弹丸的通道承受，卡扣受力较小**。这是整份文档最值得抄的一句——把弯矩交给一根粗管（过弹通道天然是大直径圆管，抗弯截面模量高），让卡扣只承担轴向定位与轻载保持，于是面对大冲击时不会因为倾覆力矩把连接机构掰断（作者标注「还未测试」）。\n\n**遗留缺陷**：①按压的力比较大，三个卡扣**可能不同时卡住**；②z 向有虚位，来源是卡扣固定偏松。\n\n**优化方向**：卡扣齿改 CNC（画图时留的余量只有 **0.06mm**，打印件精度吃不住），或整体全 CNC。","s":"知识库·机械/2027重装组研发文档 v2.0 小节 + 演示视频","k":"auto"},{"i":"K0536","t":"卡扣压紧力与 z 向虚位是一对跷跷板：0.06mm 余量的代价","c":"经验避坑","b":"v2.0 暴露的是一个通用设计矛盾，不只属于这一个机构：\n\n**现象**：三个卡扣要同时卡住凸端，需要各自有微小的浮动余量；但余量一大，卡扣固定就松，z 向虚位随之出现。\n\n**当前参数**：画图只留 **0.06mm 余量**。这个量级已经逼近 FDM 打印的尺寸能力边界（打印机本身 ±0.1mm 起步），所以「三扣同时卡住」在打印件上很难稳定复现。\n\n**两条出路**：\n1）**提精度而非加余量**——卡扣齿改 CNC 加工，用加工精度换掉浮动余量，从而同时得到「好按」和「无虚位」。\n2）**改结构解耦**——让压紧力与定位精度分开承担（v2.0 已经用「过弹通道承弯、卡扣只定位」做了一半）。\n\n**方法论**：凡是「既要装配容差又要零间隙」的机构，不要把两个要求压在同一个零件上；先想清楚谁负责容差、谁负责刚性。","s":"知识库·机械/2027重装组研发文档 v2.0 缺陷分析","k":"auto"},{"i":"K0537","t":"锁扣弹簧止回器 ATLAN PFE01：S45C 无电解镀镍的自动上扣标准件","c":"标准件紧固","b":"重装组连接机构 v2.0 用的「自动上扣」实际是市售标准件——**锁扣弹簧止回器（自动上扣）**，文档附的规格表为 ATLAN **PFE01 / 45** 系列：\n\n- 材质 **S45C**（中碳钢），表面处理 **无电解镀镍**（耐蚀且镀层均匀，适合有配合精度的运动件）\n- 规格表给出 HI、T、W、W1、W2、W3、d、L、L1、D、D1、D2、A、B、P、P1、P2 等尺寸参数\n- **锁紧力矩**：M3、M3.5 两档\n\n**为什么选它**：弹簧止回结构自带「推入即锁、按压即脱」的双向功能，正好满足连接机构「免工具快拆 + 到位自锁」的需求，且是成熟商品件，比自己设计棘爪省一整套验证。\n\n**选型提醒**：M3/M3.5 的锁紧力矩要按结构实际受力反算，不要照抄样本值；S45C 无电解镀镍件在频繁拆装下镀层会磨掉露出基材，属易损件，应备件。","s":"知识库·机械/2027重装组研发文档 附图（ATLAN PFE01 规格表）","k":"auto"},{"i":"K0538","t":"623ZZ 与 MR104ZZ：轴承两套并行的命名逻辑","c":"标准件紧固","b":"同为公制微型深沟球轴承、尺寸近似，命名却完全不同源——这是采购和画图时最容易搞错的地方。\n\n**623ZZ = 标准公制 6 系列的「结构代码」**\n- `6` = 深沟球轴承类型；`2` = 直径系列（轻系列）；`3` = 内径代号（3mm 就写 3）；`ZZ` = 双面金属防尘盖\n- 读出：6 系列深沟球、2 系列直径、内径 3mm、双面铁盖 → 3×10×4\n\n**MR104ZZ = 特定尺寸公制的「尺寸密码」**\n- `MR` = Special Metric 微型深沟球；`104` 直接编码尺寸：**10 = 外径 10mm，4 = 内径 4mm**；`ZZ` 同上\n- 读出：内径 4、外径 10、宽 4\n\n**两者差异只在配合尺寸，不在命名逻辑**：623ZZ 是 3-10-4，MR104ZZ 是 4-10-4，外径宽度一致、内径差 1mm。\n\n**来源分野**：623ZZ 那一套由 ISO/DIN 等标准机构协商制定，全球互换；MR 系列是日本 NSK 等大厂为微型轴承起的品类名，因用量大被全行业跟风成事实惯例。\n\n**实务提醒**：MR 系列的 `104` 编码在不同厂商资料里解读略有差异（也有按内径+外径顺序写的），**下单前必须核对厂家图纸的三维尺寸**，不能只看型号。","s":"知识库·机械/机械组常识文档 新增章节「轴承命名方法」2026-11-06","k":"auto"},{"i":"K0539","t":"变位系数的本质：刀具位移 x·m，只截取渐开线的不同区段","c":"传动机构","b":"把变位讲清楚的两个视角：\n\n**制造视角（最直观）**：加工标准齿轮时滚刀（或插齿刀）中心线与分度圆相切。变位就是**强行把刀具往外（正变位 +）或往里（负变位 −）平移一段距离**，平移量 = **x × m**。\n\n举例（正是官方 M3508 输出齿轮）：变位系数 −0.01、模数 0.6 → 刀具向内移动 0.01×0.6 = **0.006mm**。极小，肉眼看不出，但对齿厚与根切有实际影响。\n\n**几何视角**：\n- 刀具外移（正变位）→ 齿槽变宽、轮齿变胖变厚、齿顶变尖、齿根变粗（强度高）\n- 刀具内移（负变位）→ 齿槽变窄、轮齿变瘦、齿根变细（强度低）\n\n**本质结论**：变位**不改变基圆，也不改变渐开线本身的形状**，它只是**截取了渐开线的不同区段**，从而改变分度圆上的齿厚与齿槽宽。所有变位带来的性能变化（强度、根切、中心距）都是这一个几何事实的推论。","s":"知识库·机械/行星减速箱研发日志 新增章节「变位系数能抵消？！」2026-11-06","k":"auto"},{"i":"K0540","t":"高度变位 x1+x2=0：中心距一点没变，却救活了小齿轮","c":"传动机构","b":"变位能「抵消」的两个层面，第二个是配齿时最常用的手法。\n\n**①对抗根切（对着 17 齿这个魔咒）**\n标准刀加工标准齿轮，齿数小于 17 时刀具会把齿根切掉一块（根切），齿轮变脆。解法是把刀具往外提（正变位），刀具远离齿根，根切被抵消。\n（注：官方 M3508 输出齿轮恰是 17 齿、取 −0.01 微负变位，说明设计者判定这点负变位引起的根切可接受，或为换取向别的性能。）\n\n**②配对齿轮的高度变位（互相抵消）**\n小齿轮齿数少（如 10 齿，易根切），给**正变位 +0.5** 让它变胖变强；大齿轮齿数多（如 50 齿），给**负变位 −0.5** 让它变瘦。\n只要 **x1 + x2 = 0**，这对齿轮的**中心距保持绝对不变**，分度圆依然相切，只是两者齿厚重新分配。这叫**高度变位（等变位）**。\n\n**一句话**：变位的本质是人为控制刀具位置来重新分配齿厚；能「抵消」是因为正负搭配可以**在不改变基础尺寸（中心距）的前提下挽救弱小齿轮**，或**在改变安装距离时保证正常啮合**（后者是角度变位）。","s":"知识库·机械/行星减速箱研发日志 新增章节 2026-11-06","k":"auto"},{"i":"K0541","t":"GTX 的内齿圈变位符号是反的：输负数齿顶圆反而变大","c":"传动机构","b":"行星减速箱日志里加的一条**工具坑**，不写下来必再踩：\n\n> 注意：GTX（齿轮生成插件）的内齿圈变位和约定俗成的不一样，内齿圈的变位符号是反的：**输入负系数时，它画出的齿顶/齿根圆反而是变大的**。\n\n**为什么会这样**：内齿圈的齿顶圆/齿根圆定义与外齿轮相反（内齿的「齿顶」朝向圆心），加上插件作者按自己的约定解释符号，就出现了与手册相反的映射。\n\n**实操后果**：按外齿轮习惯给 −0.32 想「减薄」，实际画出来齿顶圆变大，装配直接干涉；或者按内齿圈手册给正值，生成出来却是小的。\n\n**规矩**：凡首次用某个齿轮插件生成内齿圈，**先画一个变位为 0 的基准，再画 ±0.1 各一个，量齿顶圆直径确认符号方向**，验证过再进入正式配齿。别信插件的符号约定，信量出来的尺寸。","s":"知识库·机械/行星减速箱研发日志 2026-11-06 新增提示","k":"auto"},{"i":"K0542","t":"链轮齿数与链条节数互质：磨损均匀的几何本质","c":"传动机构","b":"串联腿开发日志里专门用一节讲这件事，配了互质/非互质两张示意图。\n\n**互质状态**：链轮齿数与链条（节数）无公约数 → **链节与轮齿等概率啮合**，每个齿、每个链节被磨的次数趋于平均，磨损均匀，系统运行平稳。\n\n**非互质状态**：两者有公约数 → **特定链节总是与特定轮齿啮合**（形成固定的「齿-节」配对），局部磨损急剧加剧，同时因为啮合刚度的周期性重复，**系统容易产生振动和噪音**。\n\n**为什么是几何本质而不是经验**：链条是闭合环路，每转一圈链节相对链轮错开的节数由齿数决定；若两者有公约数 k，则链轮每转 1/k 圈，同一个链节就回到同一个齿上。要让所有配对都出现过，必须 gcd(Z, 链节数) = 1。\n\n**设计动作**：选链轮齿数时，除了算传动比和包角，**还要把链条节数一起配**，凑成互质。这是「等寿命摩擦」思想的落地版。","s":"知识库·机械/2026赛季 串联腿开发日志「链轮齿数和链条互质的本质意义」","k":"auto"},{"i":"K0543","t":"螺栓孔离板边至少两个直径：圣维南原理的直接用法","c":"标准件紧固","b":"串联腿日志把这条归到「弹性力学材料力学——圣维南原理」，因为它解释的就是**为什么孔太靠边会撕裂**。\n\n**失效机理**：两块板用螺栓夹紧，受拉时孔周围的材料被**剪切**；孔越靠近板边，剩余承力截面越小，孔边应力集中系数越高，最终沿孔到板边的连线撕裂。\n\n**工程判据（可直接抄）**：**螺栓孔中心距板边至少 2 倍螺栓直径**（原话：为减少撕裂的风险，螺栓应位于离边缘至少两个直径的地方）。\n\n**与圣维南的关系**：圣维南原理说「合力等效的力系只在受力点附近产生相同应力分布」。反过来说，**孔边局部应力扰动的作用范围约为构件特征尺寸量级**；孔到边距离小于这个量级，扰动没衰减完就碰到边界，应力集中被放大。2d 就是「让扰动衰减完」的经验距离。\n\n**画图时的动作**：排版时先按 2d 画出禁布区，再往里放孔；板材窄边（如 20mm 宽铝方管上打 M5）几乎必然违规，此时应改夹持方式或加厚垫板。","s":"知识库·机械/2026赛季 串联腿开发日志「圣维南原理」","k":"auto"},{"i":"K0544","t":"左右腿镜像工况却都用右旋螺纹：注定有一边会松","c":"经验避坑","b":"串联腿日志 0203 的推理过程，是很典型的「从现象倒推设计缺陷」。\n\n**现象**：左腿调了 10 多天才松，右腿**一直松一直松**；维修后调一晚，第二天又是同样状态。左右铝合金加工件组出来的轴系间隙并不一样，但结构上「相差无几」。\n\n**推理**：左右腿都是前后移动，但**相对于轴系来说工况是镜像的**——一边承受较多顺时针的瞬间刹停/撞击，另一边承受逆时针的。而两侧轴系的紧固方式**都是大螺丝大螺母，且都是右旋螺纹**。\n\n**结论**：与冲击方向同向旋松的那一侧（右腿）会持续被冲击「拧松」，另一侧则被拧紧。\n\n**改进**：**把受力方向不利的那一侧的紧固螺纹改成左旋**，让冲击方向变成「拧紧」方向。\n\n**推广**：凡是对称布置、承受往复冲击的轴系紧固，都要检查**螺纹旋向与主冲击扭矩方向的关系**——汽车左右轮毂用反牙螺栓就是这个道理。画图时在明细表里单独标注「左旋」。","s":"知识库·机械/2026赛季 串联腿开发日志「0203 大腿框量原因」","k":"auto"},{"i":"K0545","t":"前簧板断裂的真因：前支撑板太短造成的应力集中","c":"经验避坑","b":"串联腿日志里这条的价值在于**它不是孤例，而是通病**。\n\n**现象**：前簧板断裂，断口在红色区域。\n**初判**：前支撑板太短，导致该区域成为薄弱截面。\n**反证**：机械结构上和别的队相差无几，那为什么别人不断？\n\n**外部印证**（作者在多个开源答疑群求证）：\n- 华农步兵机械答「上个赛季下板簧应该只换过 2–3 次」（说明确实易损但可控）\n- 华北理轮腿机械小鱼：「我们上赛季也这样」\n- 哈工大步兵机械：「这块板子我也断过」\n- 云汉交龙答疑群有人直接点出「看起来是应力集中导致的断裂，应集中优化」\n\n**结论**：这是**串联腿构型的共性问题**，不是本校装配失误。改进方向不是换更厚的板，而是**把支撑板加长/改过渡圆角**，把应力集中削掉。\n\n**方法论**：自己断件时先去开源群问「你们断过吗」——**多家都断说明是构型缺陷，改材料没用，必须改几何**；只有自己断，才查加工与装配。","s":"知识库·机械/2026赛季 串联腿开发日志「应力集中——前簧板断裂」","k":"auto"},{"i":"K0546","t":"缓震竖支撑板断裂：底簧板形变推挤 + 镂空处应力集中","c":"经验避坑","b":"串联腿日志 0126 的完整因果链，可直接当减重反例看。\n\n**载荷路径**：底簧板工作时会产生形变 → 向上挤压竖支撑板 → 竖支撑板产生**向左或向右的摆式偏移**（不是单纯受压，而是反复摆动）。\n\n**断裂点**：绿色线处（镂空边缘）产生应力集中 → 久而久之疲劳断裂。\n\n**作者结论**：**最右边的镂空不应该有**。\n\n**可提炼的两条**：\n1）**减重镂空不能开在「形变推挤区」**。镂空削弱截面模量，而这里恰好还要承受摆式偏移带来的交变弯矩，等于把最弱的地方放在最费的地方。\n2）**先判断载荷是「压」还是「摆」**。同一条筋单纯受压时中间挖空影响不大；一旦变成反复摆动，边缘孔洞就是裂纹源。判断依据是**相邻构件是否会发生形变并把位移传过来**——底簧板会形变，所以竖板必然被推着摆。\n\n**改法**：去掉该镂空，或把镂空改成远离形变推挤方向的纵向长圆孔。","s":"知识库·机械/2026赛季 串联腿开发日志「0126 缓震机构竖支撑板断裂」","k":"auto"},{"i":"K0547","t":"跟腱空中断裂：电机瞬发力超过小腿的跟随能力","c":"经验避坑","b":"串联腿日志 0207，两段慢动作视频记录「跟腱在空中断裂」，断口在小腿与大腿连接处附近的打印件。\n\n**复盘结论**：空中那一瞬间的受力是**拉力**，成因是**电机瞬间给了超级大的力，小腿跟不上**——即控制指令的加速度远超人腿机构的动态响应能力，惯性力全部由最薄弱的连接件承担。\n\n**关键洞察**：断裂发生在**空中**（离地、无外部约束），说明载荷来自**自身驱动的惯性力**而非落地冲击。这类故障在台架测试里测不出来，只有真实跳跃动作才会暴露。\n\n**工程动作**：\n1）**限加速度**：在控制层对关节加速度/电流环斜率做限制，把「瞬发」改成「斜坡」，比加强结构便宜得多。\n2）**提高跟随性**：减小末端惯量（小腿轻量化）比加强小腿更有效——惯量降一半，同样的电机力矩下加速度翻倍，跟随误差自然变小。\n3）**结构上给柔性**：跟腱本身应设计成可微量伸长（弹性件）以吸收瞬时不匹配，而不是做成刚性连杆。","s":"知识库·机械/2026赛季 串联腿开发日志「0207 跟腱在空中断裂」","k":"auto"},{"i":"K0548","t":"贝贝康气弹簧力与气压换算：F = 25 × P（450N 对应 18MPa）","c":"标准件紧固","b":"串联腿日志 11-21 记录的一组**可复用的选型换算**，来自群内讨论与实测口径。\n\n**核心比例**：450N ÷ 18MPa，即 **力(N) = 25 × 气压(MPa)**；反算 **气压(MPa) = 0.04 × 力(N)**。\n\n**实例**：\n- 上交开源车用 **9MPa** → 初始力约 **225N**\n- 要 **250N** → 10MPa\n- 要 **300N** → 12MPa\n\n**行程选型（同日志）**：交大选**行程 75、总长 195、最短 120** 的贝贝康气弹簧是有原因的——在「中轴与轮间距最长 335mm（劈叉腿最大 780mm）」时，打孔位置已经比较极限，**100 行程装不下**。本队大概率同样选 75，也可能 80。\n\n**为什么不能只看力**：气弹簧的力随压缩量线性上升，同一根缸在不同腿长下输出的支撑力不同；所以选型顺序应是「先定安装点几何 → 得到行程需求 → 再按需要的初始力换算气压」。反过来先选力，必然撞干涉。","s":"知识库·机械/2026赛季 串联腿开发日志「11-21 新车气弹簧选型」","k":"auto"},{"i":"K0549","t":"轮腿内部元器件固定件：选材判据是冲击强度，不是刚度","c":"材料板材","b":"串联腿日志 0226「PLA 是垃圾」的核心不是骂材料，而是**指错了选材指标**。\n\n**原话**：轮腿的内脏固定（固定元器件的打印件），其材料选择**需重点根据「冲击强度」**。\n\n**五种材料强度对照（日志附表，PLA 数据）**：\n- 断裂强度 40–60 MPa\n- 屈服强度 30–50 MPa\n- 抗扭强度 30–40 MPa（估算）\n- 疲劳强度：**较差，低循环即脆断**\n- **冲击强度 2–5 kJ/m²**\n\n**为什么不能看刚度**：内部固定件不传递精度，它承受的是**整车跳跃/落地时元器件撞向支架的冲击**。PLA 弹性模量高（刚）、断裂强度也不低，但**冲击强度只有 2–5 kJ/m²**，且疲劳性能差，在反复小幅冲击下会低循环脆断——表现就是「没使劲怎么就裂了」。\n\n**选材动作**：内脏固定件优先 PETG / ABS / 增韧 PLA / TPU（局部），或在 PLA 件与元器件之间加泡棉、软胶垫做缓冲。**加强筋解决不了冲击问题，换材料才行。**","s":"知识库·机械/2026赛季 串联腿开发日志「0226 PLA是垃圾」","k":"auto"},{"i":"K0550","t":"PA12 尼龙限位块不如同密度 PLA，还挑打印层间方向","c":"材料板材","b":"串联腿日志 0123 的一次「祛魅」实验，结论反直觉但记录很实在。\n\n**试样**：尼龙限位块（**PA12，密度 95%，未做任何后处理**），两对。\n**寿命**：第一对**用了不到一天**，第二对**用了不到一个小时**。\n\n**结论**：效果**远不如同等密度的 PLA**——作者已加限定「虽然尼龙未退火处理」，即承认这个对比对尼龙不完全公平，但工程上就是这个结果。\n\n**两个补救方向（作者提出）**：\n1）**退火**：尼龙的后处理（退火/结晶度调整）对力学性能影响极大，未退火件不能代表尼龙的真实水平。\n2）**改层间打印方向**：限位块受的是冲击+压缩，而 FDM 件的层间结合强度远低于层内。把受力方向从「垂直层间」改成「层内承压」，寿命会有量级差别——这是所有打印承力件的通用手法。\n\n**给画图与切片的人**：限位块这类小件，**摆放方向比材料牌号更决定寿命**；换材料前先试着转 90° 打印。","s":"知识库·机械/2026赛季 串联腿开发日志「0123 爆！祛魅尼龙限位」","k":"auto"},{"i":"K0551","t":"前导轮法兰轴承边反复爆：塑料法兰边该换 CNC","c":"标准件紧固","b":"串联腿日志 0206，一句话但重复率极高：\n\n> 前导轮法兰轴承的**法兰边经常爆炸，第三次了**。后续考虑换 **CNC 的法兰边**。\n\n**机理**：法兰边的作用是轴向定位（挡住轴承不窜出），它承受的是**轴向冲击 + 边缘应力集中**。打印件的法兰边本质是一圈薄壁悬臂，根部层间结合最弱，而导轮在过坎/落地时正好给它一个横向冲击——所以断的永远是法兰边那一圈，不是轴承本身。\n\n**判据**：同一位置**坏到第三次**就不要再改打印参数了，说明是**结构形式选错**（薄壁悬臂 + 层间受拉），应改材料与工艺：\n- 法兰边改 **CNC 铝合金**一体件（作者的选择）\n- 或把轴向定位改由**卡簧/轴用挡圈**承担，让打印件只做径向支撑\n\n**推广**：凡是「打印件上的薄法兰/薄卡爪承担轴向力」，都是同一个失效模式，一律优先考虑改成标准挡圈或金属件。","s":"知识库·机械/2026赛季 串联腿开发日志「0206 前导轮法兰轴承边爆炸」","k":"auto"},{"i":"K0552","t":"达妙电机资料总入口与固件版本号四段制","c":"其他","b":"达妙科技（DM 电机）客户帮助中心，一个入口把全系产品文档、调试工具、固件、例程、FAQ 收齐，机械组选型查参数可直接用。\n\n**产品线导航（覆盖到具体型号）**：\n- 关节电机 16 款：DM-J3507 / J4310 / J4310P / J4340 / J4340P / J6006 / J6216P / J6216L / J6248P / J8006 / J8009 / J8009P / J8520P / J10010 / J10010L / J10422P（均 −2EC）\n- 中空电机：DM-G6220、DM-G8518\n- 轮毂电机：DM-H3510、DM-H6215、DM-H55、DM-H65\n- 分立减速系列：DM-S3519-1EC、DM-S2325-1EC\n- 谐波电机：DM-JH11/14/17-51_101-2EC；直驱：DM-D5730-1EC\n\n**配套资源**：kit-miao/damiao 资料库（gitee）、调试助手使用说明书 V1.4、DM 调试工具用户手册 2025.3.28 V1.0、电机固件库 motor-firmware、控制例程（STM32 / C++ / Python / Matlab / ROS1 五套 SDK）。\n\n**固件版本号四段制（易错，务必记）**：如 `APP_DM4310(V3)_V5017_04.bin` —— 前缀 `APP_DM4310(V3)` 是适用驱动型号；**`50` 表示 V3 硬件的 4310 电机**，`17` 是版本号，`_04` 是子版本。\n**升级铁律**：①先读当前版本；②**只能选版本号前两位一致的固件**（如当前 6.3.1.3 = 8006/V13，可升 6317），否则可能升级失败变砖；③`GM62_Sen_2005.bin` 是**传感器固件，绝不能刷进电机驱动**；④V2 与 V3 硬件固件不兼容，刷错按 FAQ「救砖」处理。","s":"群聊·27机械组 2026-11-06 17:16 植正雄（达妙客户帮助中心）","k":"auto"},{"i":"K0553","t":"港科大ENTERPRIZE RM2025串联腿步兵整机开源（狗腿底盘+鹅颈云台+中心供弹）","c":"案例开源","b":"整台串联式轮腿步兵的完整图纸与技术文档：底盘子装配含Yaw轴系、车架、腿部结构、弹舱、前后装甲与中心供弹模块，云台含Pitch轴系、NUC保护与弹链系统。可借鉴两点：一是把赛季目标量化成指标（飞坡成功率>80%、载弹>800发、任意姿态自救、小陀螺自瞄命中>60%）；二是零件命名体系可直接照抄——CFB_3mm表3mm碳板、STD_表标准件铝型材传动件、3DP_表打印件，默认材料PETG，特殊材料加前缀（如TPU_）。总装配需SW2024以上。","s":"BBS 764738","k":"auto"},{"i":"K0554","t":"沈理工Ambition RM2025全向轮中心供弹步兵机械开源（17.6kg/650发）","c":"案例开源","b":"面向经费紧张队伍的整机方案：全向轮板材用碳纤维，其余全部玻纤板，检录17.6kg；弹舱650发以上，无PC的备车云台加扩容套件可到800发；车高440mm、底盘保险杠圆直径530mm，尺寸刻意压在能进狗洞小陀螺的边界内以免卡洞。可借鉴：pitch用3508驱动以压缩云台转动惯量，手操手感与自瞄响应同时受益；作者唯一强调的硬教训是yaw不要用板材堆叠，必须做机加件轴承座，且螺纹长度达2倍径。","s":"BBS 715920","k":"auto"},{"i":"K0555","t":"青岛大学未来战队RM2026全向轮步兵机械结构开源（技术报告+全套模型）","c":"案例开源","b":"含三维图纸、演示视频、技术报告与说明文档四部分，说明文档详细写了全向轮步兵的方案选择与研发历程，技术报告2.45MB可直接读。价值在于同队同时公开了配套的3508减速箱与步兵底盘，能看出一条完整技术链：底盘、云台、减速箱三个模块分人负责（帖内直接给了三个模块的对接QQ）。作者声明图纸与实物有出入，适合当方案对照而非照抄下单。","s":"BBS 1935501","k":"auto"},{"i":"K0556","t":"南理工Alliance RM2026主动悬挂步兵开源（省赛/分区赛/国赛三版对比）","c":"案例开源","b":"53.5MB三合一文档（机械+算法+硬件），给出同一台狗洞步兵在省赛、分区赛、国赛三个版本上的取舍迭代，比单版开源更有参考价值。关键结论：轮组去掉机械悬挂可减重约500g，晃动变大但可用，代价是下双级台阶很费劲，带悬挂则顺滑；换回3508原装减速箱后可任意姿态上堡垒，极速高、加速度大；云台去掉图传升降并重构布局以降惯量；偏置装甲板家用有效、赛场干扰未知。该队当年大符平均环数与臂数全国第一。","s":"BBS 1890337","k":"auto"},{"i":"K0557","t":"港科大ENTERPRIZE RM2026工程机器人/飞镖/弹射英雄三项机械开源","c":"案例开源","b":"一份报告覆盖三个兵种，适合横向看同一队的机械方法论。工程车为主动悬挂加辅助动力轮的麦轮底盘，六轴机械臂配轻量化末端夹爪与模块化快拆；飞镖用拉簧储能、二级四倍动滑轮组、低拉伸率绳传动、双丝杆复位、集成拉力闭环与快速释放，另考虑制导镖大尾翼兼容与Yaw调整；弹射英雄用反向复合弓、自阻拦弹托、链条复位、滚珠丝杆连杆调俯仰、中心鹅颈弹链。图纸已按铨洲6.8打样流程适配，除少数五轴件外均可走常规CNC。","s":"BBS 1947243","k":"auto"},{"i":"K0558","t":"厦大嘉庚TCR RM2026压缩包式过洞步兵（麦轮主动悬挂+折叠云台）","c":"案例开源","b":"针对2026赛季250mm隧道做的整机方案：以麦轮主动悬挂底盘为核心提升地形跨越能力，云台做成可折叠以压低过洞高度，作者称折叠云台是在隧道尺寸公布时就画出来的。含三维STEP、效果展示与技术文档。可借鉴的是先定通过性硬约束（洞高250mm）再倒推整车折叠/升降自由度的设计顺序，以及第一年整车设计者常见的文件管理混乱（作者自述图纸混乱），提醒按模块分文件夹归档。","s":"BBS 1940451","k":"auto"},{"i":"K0559","t":"东北农大TCP全向轮悬挂与自制聚氨酯辊子（一套2元、单轮56元）","c":"材料板材","b":"把全向轮辊子成本打到极限的实测方案：黑色聚氨酯空心棒料（内6外18长18）单件1.2元，两侧各塞一颗364铜套，中间穿直径3×25圆柱销作轴，一套辊子约2元、四个轮子两百多元。经验点：钢套会从辊子里脱出并与碳板摩擦影响转动，换铜套后问题消失；聚氨酯比橡胶更耐脏（橡胶带静电吸灰后摩擦力骤降），但硬度偏高、圆柱面使轮子呈多边形抖动偏大，磨损一段时间后抖动反而减小。悬挂把两根溪地90避震直接接下臂、用上下臂外形做限位以缩短长度，轮距仅380mm。","s":"BBS 1935541","k":"auto"},{"i":"K0560","t":"青岛大学未来战队RM2026低成本3508减速箱（轻型<100元/重型约200元，P15.8）","c":"传动机构","b":"两套可直接加工的减速箱图纸与完整食用说明。轻型成本低于100元，9000转加油脂工况平均18W，能撑20kg全向轮步兵任意飞坡，区域赛两车20+场次仅出现沉头螺丝松动，代价是背隙较大；重型约200元、平均20W，轮腿步兵200+次飞坡与100+次跳跃仅一次电机螺丝松动，配角接触轴承（AC后缀25度）加碗组双轴承。工艺路径很实：齿圈线切割加45钢淬火，齿轮用3.5元成品双联齿（0.6m、10至40齿），CNC走铨洲。内齿圈变位系数建议轻型0.4至0.8、重型0.3至0.5，且铨洲公差会浮动，必须试装后再批量。","s":"BBS 1936175","k":"auto"},{"i":"K0561","t":"吉林大学TARS Go RM2026 DJI3508/DM3519通用经济减速箱开源（约14.88:1）","c":"传动机构","b":"速比(46×77)/(14×17)约14.88的通用减速箱，含电机总重约500g，一套图纸同时兼容3508与达妙3519。两个可复用的细节：齿圈沿用港科大方案用线切割，并在开口处留1.5mm圆槽，齿圈嵌入CNC件后拧M2顶丝可把齿圈撑开，避免双联齿转过开口位置时被挤压导致阻力增大；DM3519外露接口朝向受限，可下单时让客服反焊，接口转个方向才腾得出减速箱空间。","s":"BBS 1322102","k":"auto"},{"i":"K0562","t":"合工大苍穹RM2025 1:16.5 3508减速箱开源（内齿圈改钣金方案）","c":"传动机构","b":"速比1:16.5、需替换3508原装齿轮的方案，主体走铨洲CNC，齿轮尽量用淘宝标准件，思路是面向淘宝有什么现成的用什么。内齿圈两版迭代有参考价值：先做过盈配合内齿圈，结论是太吃加工精度，后改为更简单的方案并推荐用嘉立创钣金做内齿圈。另附拆3508原装齿轮的实操流程：先用纸胶带把电机整体包住防碎屑，再用角磨机在齿轮上对称切槽，最后用小号拉马、拉到一半垫螺丝（拉马螺杆偏粗）。已实物验证作为拨盘电机工作良好。","s":"BBS 382676","k":"auto"},{"i":"K0563","t":"华南师范大学PIONEER RM2021悬挂步兵底盘开源（含BOM与成本拆解）","c":"案例开源","b":"两个月赶出来的第二代悬挂步兵底盘，整底盘机械花销约3至4千元，开源包分说明文档（技术说明加BOM表，含加工花销）、效果展示（装云台前后下台阶、飞坡、打大能量机关的视频）、三维模型三部分。设计需求写得很朴素：省经费、轮组便于检修、够轻够快、下台阶不翻车。作者诚实记录了未达成项：飞坡在家能做、到官方场地就不行，原因未查明，这条比成功经验更值得新队注意（场地地胶与摩擦条件差异）。","s":"BBS 8486","k":"auto"},{"i":"K0564","t":"深圳大学RobotPilots RM2020工程机器人机械开源（气动抬升+拖车救援）","c":"案例开源","b":"气动方案工程车的完整参考资料：抬升、取弹、补弹全部由气缸驱动，另有一套拖车救援机构，气缸是整车主要动力元件。开源包含完整零件图与装配图（含STEP）及技术报告，可直接研究气路布置、气缸选型与受力支点。对当前赛季的用处不在方案本身，而在低压气动如何做举升与夹持这一套成熟结构库：重装机器人做42mm模块抓取与能量单元装配时仍可借用其肘节与导轨布置。","s":"BBS 7498","k":"auto"},{"i":"K0565","t":"华北理工Horizon RM2021工程机器人机械开源（双车/二级升降/矿石兑换）","c":"案例开源","b":"同时开源分区赛与国赛两台工程机器人的图纸、技术说明与BOM，演示视频覆盖二级升降、夹取地面矿石、障碍块翻转搬运、矿石兑换四类动作。价值在于一台车怎么把抬升、夹取、翻转、兑换四个动作塞进同一套机构，以及分级升降（二级）在有限行程里换取更高取放点的做法。技术报告与BOM齐备，适合做工程机器人机构选型的横向对照样本。","s":"BBS 8513","k":"auto"},{"i":"K0566","t":"退役机械佬谈机械细节：图号体系、工程图深度与直线导轨装配","c":"图纸规范","b":"一篇讲机械组工程习惯的旧帖，句句是坑。一是零件图号别用中文名，用xx-00-00-00分段模板（总装-底盘框架-动力模块-云台），否则多人协作必然重名且无法管理；二是工程图必须标公差、粗糙度与技术要求，认为反正激光切割不看是致命误解，轴承配合面Ra12.5完全不可接受；三是设计时要把螺丝、垫片、弹片真装进模型，否则3508/3510的L型安装座会出现底面螺丝与电机壁干涉；四是直线导轨装配按顺序走：清毛刺油污、主轨轻放、由中央向两侧微紧定位螺丝、扭力扳手按扭矩拧紧、装滑座、装平台螺丝后手动试运行，卡滞就回头查平行度与水平。","s":"BBS 4361","k":"auto"},{"i":"K0567","t":"轮腿关节轴系设计：用自行车碗组做膝关节（实测配合尺寸）","c":"结构设计","b":"用自行车碗组（头管、培林轴承、束子）替代自研关节轴系的完整做法，给出可直接抄的实测尺寸：轮腿大臂当车架，孔径44.05mm（含0.5mm加工余量）；小臂当前叉，孔径30mm；束子内径29mm，故圆柱与束子接触段取29.1mm最稳（29mm实测为间隙、29.15mm已偏过盈）；培林轴承内径30.15mm，对应圆柱该段取30.15mm；束子接触段高度7mm，过渡段与顶端加C0.5倒角。价值在于把关节要不要自己做轴承座这个选择题，变成一套成本低、可更换、背隙靠预紧调的标准件替代方案。","s":"BBS 54960","k":"auto"},{"i":"K0568","t":"RMUL黑龙江区域交流会01：经费管理与机械设计经验（材料与设备对照表）","c":"加工工艺","b":"把买什么设备干什么活讲成一张对照表：铝方、木方、角铝、光轴等型材走切割机、角磨机倒角、砂轮机、台钻；木板、玻纤板(FR4)、碳板走雕刻机（作者用6000元级广告雕刻机，最多能雕5mm铝板）；打印件走开放式I3架构打印机（约1200元、250×250×350幅面），切片参数直接决定打印件力学性能；氩弧焊明确不推荐新队（学习成本高、易断代）。另附手持与手工工具清单，以及一条深圳赛场教训：关键位置别用发黑螺丝，夏天到深圳会生锈，改304不锈钢或铝、钢铆钉。","s":"BBS 7628","k":"auto"},{"i":"K0569","t":"大佬说第一期：加工设备选型（雕铣机与线切割的适用边界）","c":"加工工艺","b":"技术交流群干货整理，讲清自购设备的边界。雕铣机（雕刻机）灵活、板材友好，木、铝、玻纤、碳纤通吃，但受刀具直径限制（齿轮这类小特征找不到足够细的刀），且长期维护难；实操痛点是下切步距大必然啃垫板，垫板可选碳板、铝板、雪弗板、木板，常见解法是加工前在板下贴一层膜；线切割把刀径这个限制大幅削弱，能切出可用的齿轮，原理是电极丝脉冲放电蚀除金属。结论：新队优先用雕铣机解决板材，齿轮类零件外包或走线切割。","s":"BBS 8059","k":"auto"},{"i":"K0570","t":"山东理工齐奇RM2024飞镖系统：弹簧弹射+四倍速滑轮组+滚珠丝杠Yaw","c":"结构设计","b":"拿过最佳创意设计奖的飞镖方案，机构写得比多数开源细。放弃摩擦轮改用弹簧弹射，理由是摩擦轮发射系统时变过大、初动能不稳定；注能由3508经同步带把滑台拉到闭锁位、弹性杠杆闭锁、舵机释放；储能是四根高强钢弹簧并联，一端接滑台、一端固定在可调滚珠丝杠上，转丝杆即可连续调预紧量；能量传递用编织钢索加V形轴承组成四倍速滑轮组，兼顾高强度、低形变与长加速行程。换弹用摩擦轮驱动圆环加推拉电磁铁限位，弹夹限位改用皮筋。Yaw轴用滚珠丝杠加同步带，减少虚位并承受发射冲击。","s":"BBS 60842","k":"auto"},{"i":"K0571","t":"哈工大威海HERO低质量能量机关V2（键轴触发、600元造一台调试用大符）","c":"赛事场地","b":"为视觉组自制的廉价大符，除铝架与驱动3508外成本极低（灯条250、控制板100、12V电源50）。三个可直接复用的做法：一是击打检测用机械键盘键轴加键帽，键轴不必压到底即可触发，单次击打可给出2至3ms低电平，单片机好抓，且可无缝换成振动传感器（需做震动隔离并改释抑时间）；二是灯效不用SK6812数控灯珠，用三色RGB灯带按扇叶分两个灯区指示熄灭、待激活、已激活，PWM约5kHz即无频闪；三是3508自身减速箱不够，需按风车重量再加同步带轮二次减速。长途大巴颠簸后仍可用，皮实。","s":"BBS 9100","k":"auto"},{"i":"K0572","t":"RoboMaster交流赛技术方案指南：战场与道具的自建参数","c":"赛事场地","b":"官方给的自建场地施工口径，比规则手册更具体：战场内部用9至18mm阻燃胶合板，表面2或3mm定制复合PVC地胶，木质部分需承载300kg每平方米；包角角铁角铝用自攻螺丝两面固定、间距30cm，螺丝尾不得超出角铝平面。围挡两方案：木质底座加金属围挡（钢方管0.8mm厚，金属网网眼12mm、铁丝1.2mm，网装外侧防划伤），或金属围挡加沙袋。道具侧给了前哨站与基地的裁判系统物料清单及机器人类型编号（R10/R11/B10/B11），增益点用喷绘布加场地交互模块做RFID地毯再覆地胶。","s":"BBS 1316686","k":"auto"},{"i":"K0573","t":"RM2019能量机关尺寸更新补充说明（历史版本尺寸链参考）","c":"赛事场地","b":"官方对能量机关外形尺寸的修订记录，价值在于看清哪些尺寸会随迭代变、哪些不变。变更项：上部宽度由230mm改为260mm，其余外形与装甲尺寸不变，装甲板中心仍分布在半径700mm的圆上；能量机关中心高度整体加200mm；因桥梁中部重量大，桥梁中心有0至50mm下坠，仿制或视觉标定时必须把这段下垂算进去。灯带侧：单臂周围细灯带宽度均16mm、误差5mm内，中部点阵7×60，灯珠为SK6812 mini（单颗7.2mm），上方用Plexiglas黑白板遮挡。","s":"BBS 5498","k":"auto"},{"i":"K0574","t":"GM6020减速器开发调研：3.4:1行星箱补pitch扭矩的可行性分析","c":"传动机构","b":"针对GM6020做pitch扭矩不足、需配平或加橡皮筋的通用痛点，评估在6020底部加3.4:1行星减速箱并改后出轴的方案。推算逻辑清楚：让电机工作在效率较高区间（0.3至0.5牛米、290至240rpm）；实测pitch转速一般不超过80rpm，减速后最高可达95rpm，转90度约0.3s，速度损失可接受；减速比3.4使电机端0至360度对应输出0至105度，只要设计行程不超过105度就能靠电机编码器直接得绝对位置。风险点写明：非直驱后背隙影响响应与手感，需慢走丝或磨齿才能压背隙，成本高。","s":"BBS 7805","k":"auto"},{"i":"K0575","t":"碳纤维板还是铝板：轻量化与加工成本的取舍逻辑","c":"材料板材","b":"一篇把为什么大家都用碳板问明白的讨论帖。结论不是碳板更强，而是铝板强度普遍盈余过多，碳板与玻纤板的意义主要是减重：同一兵种在相同功率上限与功率控制下，整车质量差别会明显放大机动性差异，所以步兵是能多轻做多轻。成本侧的现实是铝板便宜但外协加工费高，碳板贵但可以自己雕，因此预算紧的队伍常反向选铝板。判断顺序应是先看有没有自加工能力，再决定板材，而不是先比材料单价。","s":"BBS 8990","k":"auto"},{"i":"K0576","t"
